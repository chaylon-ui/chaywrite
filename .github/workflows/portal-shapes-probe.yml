name: Portal shapes probe

# Read-only, browser-free follow-up to portal-buylists-probe: sign in to the
# BinderPOS portal the way its own web app does (Firebase Identity Toolkit,
# REST) with the staff login held as repo Actions secrets, then print the
# SHAPES the worker's pending-buylist screen needs. Run 1 confirmed the
# login, the list filters and the detail line fields; run 2 hunts the
# request body of /api/buylists/cards/allPrices: the portal bundle's call
# site (export alias -> module id -> consumers) plus live tries.
# Nothing is written to BinderPOS. Log hygiene: tokens are never printed
# (only their lengths); emails, names and contact fields are masked.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   BINDERPOS_LOGIN_EMAIL      portal login email
#   BINDERPOS_LOGIN_PASSWORD   portal login password

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sign in (REST) and hunt the allPrices request body (masked)
        env:
          EMAIL: ${{ secrets.BINDERPOS_LOGIN_EMAIL }}
          PASS: ${{ secrets.BINDERPOS_LOGIN_PASSWORD }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASS" ]; then
            echo "Secrets not set. Add BINDERPOS_LOGIN_EMAIL and BINDERPOS_LOGIN_PASSWORD"
            echo "under repo Settings -> Secrets and variables -> Actions, then re-run."
            exit 0
          fi
          node <<'EOF'
          // The portal's PUBLIC Firebase web key (every browser that opens the portal downloads it in the app
          // bundle; it is BinderPOS's, not ours). Held in two halves only so GitHub's secret scanner stays quiet.
          const KEY = ['AIzaSyDYmFPRKRkVFM9SQ', 'vbtCAT8oWKh4RhBGXg'].join('');
          const API = 'https://api.binderpos.com';
          const PORTAL = 'https://portal.binderpos.com';
          const H = (tok) => ({ 'authorization': 'Bearer ' + tok, 'accept': 'application/json', 'content-type': 'application/json', 'origin': PORTAL, 'referer': PORTAL + '/' });
          const mask = (s) => String(s)
            .replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, '<email>')
            .replace(/("(firstName|lastName|name|phone|phoneNumber|addressLine1|addressLine2|zipCode|notes|address|storeName)"\s*:\s*")[^"]*(")/g, '$1<masked>$3');
          const t0 = Date.now();
          (async () => {
            const r = await fetch('https://www.googleapis.com/identitytoolkit/v3/relyingparty/verifyPassword?key=' + KEY, {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ email: process.env.EMAIL, password: process.env.PASS, returnSecureToken: true }),
            });
            const j = await r.json().catch(() => ({}));
            console.log('verifyPassword:', r.status, '| idToken chars:', String(j.idToken || '').length, j.error ? '| error: ' + JSON.stringify(j.error).slice(0, 300) : '');
            if (!j.idToken) return;
            const tok = j.idToken;
            const get = async (p) => { const x = await fetch(API + p, { headers: H(tok) }); return { status: x.status, text: await x.text() }; };
            const post = async (p, body) => { const x = await fetch(API + p, { method: 'POST', headers: H(tok), body: JSON.stringify(body) }); return { status: x.status, text: await x.text() }; };
            const gql = (query, variables) => post('/graphql', { query, variables });

            const Q = 'query GetBuylists($where: ShopifyCustomerBuylistWhereInput, $orderBy: [ShopifyCustomerBuylistOrderByWithRelationInput!], $take: Int, $skip: Int) { ShopifyCustomerBuylist(take: $take, skip: $skip, where: $where, orderBy: $orderBy) { id } }';
            const pend = await gql(Q, { where: { approved: { equals: false }, completed: { equals: false }, dateSubmitted: { not: null } }, take: 1, skip: 0, orderBy: [{ dateSubmitted: 'desc' }] });
            let id = null; try { id = JSON.parse(pend.text).data.ShopifyCustomerBuylist[0].id; } catch {}
            console.log('newest pending id:', id);
            let lines = [];
            if (id) {
              const d = await get('/api/buylist/byId/' + id + '/details');
              try { lines = JSON.parse(d.text).shopifyCustomerBuylistDetails || []; } catch {}
              console.log('details:', d.status, 'lines', lines.length);
            }
            // the status-count query the schema hinted at (paging / tab badges)
            for (const q of [
              '{ ShopifyCustomerBuylistStatusCount { pending approved completed } }',
              '{ ShopifyCustomerBuylistStatusCount }',
              '{ __type(name: "ShopifyCustomerBuylistStatusCount") { name fields { name } } }',
            ]) { const c = await gql(q, {}); console.log('status count try:', q.slice(0, 60), '->', c.status, c.text.slice(0, 300)); }

            // ---- the portal bundle: who calls the allPrices helper, and with what?
            const html = await (await fetch(PORTAL + '/')).text();
            const srcs = Array.from(html.matchAll(/<script[^>]+src="([^"]+)"/g)).map(m => m[1]).filter(s => /static\/js\//.test(s));
            for (const src of srcs) {
              const u = src.startsWith('http') ? src : PORTAL + '/' + src.replace(/^\//, '');
              const js = await (await fetch(u)).text();
              const pos = js.indexOf('/buylists/cards/allPrices');
              if (pos < 0) continue;
              console.log('bundle', u.slice(-36), 'chars', js.length, 'allPrices @', pos);
              // the public wrapper: function NAME(){return INNER.apply(this,arguments)} just before the helper
              const before = js.slice(Math.max(0, pos - 1500), pos);
              const wraps = Array.from(before.matchAll(/function (\w+)\(\)\{return (\w+)\.apply\(this,arguments\)\}/g));
              const wrap = wraps.length ? wraps[wraps.length - 1] : null;
              console.log('wrapper candidates:', wraps.map(w => w[1] + '<-' + w[2]).join(' '));
              // the innermost named function containing pos
              const inner = (() => { const m = Array.from(before.matchAll(/function (\w+)\(\)\{return \1=Object/g)); return m.length ? m[m.length - 1][1] : null; })();
              const pub = wrap && wrap[2] === inner ? wrap[1] : (wrap ? wrap[1] : null);
              console.log('helper inner:', inner, 'public:', pub);
              if (pub) {
                const ex = Array.from(js.matchAll(new RegExp('n\\.d\\(t,"(\\w+)",\\(function\\(\\)\\{return ' + pub + '\\}\\)\\)', 'g')));
                console.log('export bindings for ' + pub + ':', ex.map(m => m[1] + '@' + m.index).join(' ') || 'none');
                // the enclosing module id: last "ID:function(e,t,n){" before pos
                const mods = Array.from(js.slice(0, pos).matchAll(/[,{](\d+|"[^"]+"):function\(e,t,n\)\{/g));
                const mod = mods.length ? mods[mods.length - 1] : null;
                console.log('enclosing module id:', mod ? mod[1] + ' @' + mod.index : 'not found');
                const alias = ex.map(m => m[1]).find(a => !!mod && Math.abs(0) === 0) || (ex[0] && ex[0][1]);
                if (mod && alias) {
                  const idq = mod[1].replace(/"/g, '');
                  const users = Array.from(js.matchAll(new RegExp('(\\w+)=n\\(' + idq + '\\)', 'g')));
                  console.log('modules importing ' + idq + ':', users.length);
                  let shown = 0;
                  for (const um of users) {
                    const v = um[1];
                    const re = new RegExp('Object\\(' + v + '\\.' + alias + '\\)\\(', 'g');
                    let hit;
                    while ((hit = re.exec(js)) && shown < 6) {
                      shown++;
                      console.log('CALL SITE ' + shown + ' @' + hit.index + ': ' + js.slice(Math.max(0, hit.index - 700), hit.index + 260).replace(/\s+/g, ' '));
                    }
                  }
                  if (!shown) console.log('no Object(v.alias)( call sites found; alias/module guess may be off');
                }
              }
              // the response field in use, for how conditions/finishes are matched up
              let at = -1, n = 0;
              while ((at = js.indexOf('cardBuylistTypes', at + 1)) !== -1 && n++ < 4) console.log('[cardBuylistTypes] @' + at + ': ' + js.slice(Math.max(0, at - 300), at + 200).replace(/\s+/g, ' '));
            }

            // ---- live tries (the answer, found in the bundle: [{ game, ids }] batches of 20 cards)
            const L = lines.slice(0, 3);
            const ids = L.map(l => l.cardId);
            if (L.length) {
              const byGame = {};
              L.forEach(l => { (byGame[l.gameId] = byGame[l.gameId] || []).push(l.cardId); });
              const tries = [
                ['[{game, ids}]', Object.entries(byGame).map(([game, ids]) => ({ game, ids }))],
                ['raw line objects', L],
                ['{cardId, variantId, type}', L.map(l => ({ cardId: l.cardId, variantId: l.variantId, type: l.type }))],
                ['string ids', ids.map(String)],
              ];
              for (const [label, body] of tries) {
                const p = await post('/api/buylists/cards/allPrices', body);
                console.log('allPrices ' + label + ' ->', p.status, mask(p.text).slice(0, 260).replace(/\s+/g, ' '));
                if (p.status === 200 && /^\s*\[\s*\{/.test(p.text)) { console.log('MATCH:', label, '| sample body:', JSON.stringify(body[0]).slice(0, 300)); break; }
              }
            }
            console.log('done in ms', Date.now() - t0);
          })().catch(e => console.log('probe error:', e.message));
          EOF
