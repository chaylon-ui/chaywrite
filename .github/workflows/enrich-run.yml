name: enrich-run
# Kicks the catalogue enrichment sweep and watches it, instead of waiting for
# the 06:00 UTC alarm. Log-only: it starts a run and prints status snapshots.
#
# No inline python here on purpose: a `python3 -c '` heredoc written at
# column 0 inside a `run: |` block scalar ENDS the scalar, and GitHub then
# fails to parse the file - the workflow registers with its path as its name
# and workflow_dispatch never appears. Shell only.
on:
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: How long to keep printing status after the kick
        default: "6"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Kick /enrich/run and watch /enrich/status
        env:
          MINUTES: ${{ inputs.watch_minutes }}
        run: |
          set +e
          W="https://exor-binder.nevski.workers.dev"
          brief() { tr ',{}' '\n\n\n' | grep -E '"(running|tokenConfigured|phase|pages|seen|written|ok|ambiguous|notfound|skipped|pending|errors|ticks|error|nextAlarm|day)"' | tr -d '"' | tr '\n' ' '; echo; }
          echo "=== before ==="
          curl -sS --max-time 20 "$W/enrich/status" | python3 -m json.tool || true
          echo "=== POST /enrich/run ==="
          curl -sS --max-time 25 -X POST "$W/enrich/run" | python3 -m json.tool || true
          N=$(( ${MINUTES:-6} * 2 ))
          for i in $(seq 1 "$N"); do
            sleep 30
            printf '+%ss  ' "$(( i * 30 ))"
            curl -sS --max-time 20 "$W/enrich/status" | brief
          done
          echo "=== final ==="
          curl -sS --max-time 20 "$W/enrich/status" | python3 -m json.tool || true
