name: sports-menu-probe
# Read-only: the qikify Smart Menu draws the header from JSON in the page,
# so the Sports Cards flyout only exists in a browser. Open the preview
# theme, hover the top item, then the sub item inside the open dropdown
# (a TAB: its content is rendered in a sibling panel, not inside its li),
# print the visible panel that contains the given child label, the box and
# computed size of every element in it, and a reduced JPEG of the open
# menu as base64 (the sandbox cannot fetch artifacts), for CSS work.
on:
  workflow_dispatch:
    inputs:
      top:
        description: Top-level label
        required: false
        default: "Trading Cards"
      sub:
        description: Sub item label
        required: false
        default: "Sports Cards"
      child:
        description: A label that appears inside the sub item's panel
        required: false
        default: "Hockey Sealed Product"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOP: ${{ inputs.top }}
      SUB: ${{ inputs.sub }}
      CHILD: ${{ inputs.child }}
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 >/dev/null 2>&1
      - name: Hover and dump
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const T = '157462692013', H = 'https://exorgames.com';
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 1000 });
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            let ok = false;
            for (let i = 0; i < 4 && !ok; i++) {
              try { await page.goto(H + '/?preview_theme_id=' + T, { waitUntil: 'networkidle2', timeout: 90000 }); } catch (e) { console.log('NAV-ERR', String(e).slice(0, 140)); }
              ok = await page.evaluate(() => !!document.querySelector('.tmenu_item--root'));
              if (!ok) { console.log('NAV-RETRY', await page.evaluate(() => document.title)); await sleep(4000); }
            }
            if (!ok) { console.log('GAVE-UP'); await browser.close(); return; }
            const norm = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
            const roots = await page.$$('.tmenu_item--root');
            let top = null;
            for (const h of roots) { const t = await page.evaluate((e) => e.textContent, h); const b = await h.boundingBox(); if (norm(t).startsWith(norm(process.env.TOP)) && b) { top = { h, b }; break; } }
            console.log('TOP', process.env.TOP, top ? JSON.stringify(top.b) : 'NOT FOUND');
            if (!top) { await browser.close(); return; }
            await page.mouse.move(top.b.x + top.b.width / 2, top.b.y + top.b.height / 2); await sleep(1500);
            const subBox = await page.evaluate((label) => {
              const norm = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
              const vis = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== 'hidden' && cs.display !== 'none'; };
              const links = [...document.querySelectorAll('.tmenu_item--root a, .tmenu_item--root span')].filter(vis);
              const hit = links.find(a => norm(a.textContent) === norm(label)) || links.find(a => norm(a.textContent).startsWith(norm(label)));
              if (!hit) return null;
              const r = hit.getBoundingClientRect();
              return { box: [r.x, r.y, r.width, r.height], tag: hit.tagName, cls: hit.className };
            }, process.env.SUB);
            console.log('SUB', process.env.SUB, JSON.stringify(subBox));
            if (subBox && subBox.box) {
              await page.mouse.move(subBox.box[0] + subBox.box[2] / 2, subBox.box[1] + subBox.box[3] / 2, { steps: 12 }); await sleep(600);
              await page.evaluate((label) => {
                const norm = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
                const a = [...document.querySelectorAll('.tmenu_item--root a')].find(e => norm(e.textContent) === norm(label));
                const fire = (el, t) => el && el.dispatchEvent(new MouseEvent(t, { bubbles: true, cancelable: true }));
                if (a) { fire(a.closest('.tmenu_item--root'), 'mouseover'); fire(a.closest('.tmenu_item--root'), 'mouseenter'); fire(a.parentElement, 'mouseover'); fire(a.parentElement, 'mouseenter'); fire(a, 'mouseover'); fire(a, 'mouseenter'); }
              }, process.env.SUB);
              await sleep(1200);
            }
            const state = await page.evaluate(() => { const r = document.querySelector('.tmenu_item--root:hover'); const open = [...document.querySelectorAll('[class*="tmenu_submenu"]')].filter(e => { const b = e.getBoundingClientRect(); return b.width > 100 && b.height > 100; }); return { hoverRoot: r ? (r.textContent || '').trim().slice(0, 30) : null, openPanels: open.map(e => [e.className.trim().split(/\s+/).slice(0, 4).join('.'), Math.round(e.getBoundingClientRect().width), Math.round(e.getBoundingClientRect().height)]).slice(0, 8) }; });
            console.log('STATE', JSON.stringify(state));
            const clip0 = subBox && subBox.box ? { x: Math.max(0, subBox.box[0] - 20), y: Math.max(0, subBox.box[1] - 460), width: 1100, height: 900 } : { x: 0, y: 100, width: 1100, height: 850 };
            const jpg = await page.screenshot({ type: 'jpeg', quality: 55, clip: { x: clip0.x, y: clip0.y, width: Math.min(clip0.width, 1440 - clip0.x), height: Math.min(clip0.height, 1000 - clip0.y) } });
            console.log('JPEG-B64 ' + jpg.toString('base64'));
            // The panel's markup, shown or not: CSS targets its classes either way.
            const out = await page.evaluate((childLabel) => {
              const norm = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
              const own = (el) => [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('');
              const cn = (el) => el.tagName + (typeof el.className === 'string' && el.className ? '.' + el.className.trim().split(/\s+/).slice(0, 6).join('.') : '');
              const els = [...document.querySelectorAll('.tmenu_item--root *')].filter(e => norm(own(e)) === norm(childLabel) || norm(e.textContent) === norm(childLabel) && e.children.length <= 1);
              if (!els.length) return { found: false };
              // the tab's own content block (Sports Cards is a tab of the Trading Cards flyout)
              let panel = els[0].closest('.tmenu_submenu_tab_item') || els[0].closest('[class*="tmenu_submenu"]') || els[0].closest('ul') || els[0].parentElement;
              const chain = []; for (let a = panel.parentElement; a && chain.length < 7; a = a.parentElement) chain.push(cn(a));
              const html = panel.outerHTML.replace(/<svg[\s\S]*?<\/svg>/g, '<svg/>').replace(/<iframe[\s\S]*?<\/iframe>/g, '<iframe/>').replace(/\s+/g, ' ');
              const items = [...panel.querySelectorAll('li, img, a, span, div, h1, h2, h3, h4, h5, p')].slice(0, 200).map(e => { const cs = getComputedStyle(e); return { el: cn(e).slice(0, 120), text: e.tagName === 'IMG' ? (e.getAttribute('src') || '').split('/').pop().slice(0, 50) : (own(e).trim() || '').slice(0, 40), style: (e.getAttribute('style') || '').slice(0, 120), disp: cs.display, w: cs.width, fs: cs.fontSize, fw: cs.fontWeight }; });
              return { found: true, hitEl: cn(els[0]), chain: chain.join(' < '), panelCls: cn(panel), html: html.slice(0, 40000), htmlLen: html.length, items };
            }, process.env.CHILD);
            console.log('PANEL', out.found, out.hitEl, out.panelCls, 'chain:', out.chain, 'html length', out.htmlLen);
            console.log('HTML', out.html || '');
            for (const r of out.items || []) console.log('ROW', JSON.stringify(r));
            await browser.close();
          })().catch(e => { console.log('FATAL', String(e).slice(0, 300)); process.exit(0); });
          EOF
          node probe.js
