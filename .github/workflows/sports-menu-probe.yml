name: sports-menu-probe
# Read-only: the qikify Smart Menu draws the header from JSON in the page,
# so the Sports Cards flyout only exists in a browser. Open the preview
# theme, hover the top item then the sub item, save a screenshot as an
# artifact and print the open flyout's markup (svg/iframe collapsed) plus
# the box and computed size of every image and heading in it, for CSS work.
on:
  workflow_dispatch:
    inputs:
      top:
        description: Top-level label
        required: false
        default: "Trading Cards"
      sub:
        description: Sub item label
        required: false
        default: "Sports Cards"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TOP: ${{ inputs.top }}
      SUB: ${{ inputs.sub }}
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 >/dev/null 2>&1
      - name: Hover and dump
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const T = '157462692013', H = 'https://exorgames.com';
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 1000 });
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            let ok = false;
            for (let i = 0; i < 4 && !ok; i++) {
              try { await page.goto(H + '/?preview_theme_id=' + T, { waitUntil: 'networkidle2', timeout: 90000 }); } catch (e) { console.log('NAV-ERR', String(e).slice(0, 140)); }
              ok = await page.evaluate(() => !!document.querySelector('.tmenu_item--root'));
              if (!ok) { console.log('NAV-RETRY', await page.evaluate(() => document.title)); await sleep(4000); }
            }
            if (!ok) { console.log('GAVE-UP'); await browser.close(); return; }
            const norm = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
            const findIn = async (selector, label) => {
              const hs = await page.$$(selector);
              for (const h of hs) {
                const t = await page.evaluate((e) => (e.querySelector('a, span') || e).textContent, h);
                const box = await h.boundingBox();
                if (norm(t).startsWith(norm(label)) && box && box.width > 0) return { h, box };
              }
              return null;
            };
            const top = await findIn('.tmenu_item--root', process.env.TOP);
            console.log('TOP', process.env.TOP, top ? JSON.stringify(top.box) : 'NOT FOUND');
            if (!top) { await browser.close(); return; }
            await top.h.hover(); await sleep(1200);
            let sub = null;
            if (process.env.SUB) {
              sub = await findIn('.tmenu_item--root:hover .tmenu_item, .tmenu_item--root .tmenu_item', process.env.SUB);
              console.log('SUB', process.env.SUB, sub ? JSON.stringify(sub.box) : 'NOT FOUND');
              if (sub) { await sub.h.hover(); await sleep(1400); }
            }
            await page.screenshot({ path: 'menu.png' });
            const out = await page.evaluate((subLabel) => {
              const norm = (s) => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
              const vis = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== 'hidden' && cs.display !== 'none' && cs.opacity !== '0'; };
              const cn = (el) => el.tagName + (typeof el.className === 'string' && el.className ? '.' + el.className.trim().split(/\s+/).slice(0, 5).join('.') : '');
              // the sub item's own submenu: the li whose first link text is the label
              const items = [...document.querySelectorAll('.tmenu_item')];
              const li = items.find(e => { const a = e.querySelector(':scope > a, :scope > .tmenu_item_link, a'); return a && norm(a.textContent).startsWith(norm(subLabel)); });
              const panel = li ? [...li.querySelectorAll('[class*="tmenu_submenu"]')].filter(vis).sort((a, b) => { const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(); return rb.width * rb.height - ra.width * ra.height; })[0] : null;
              if (!panel) return { found: !!li, html: '', rows: [] };
              const r0 = panel.getBoundingClientRect();
              const chain = []; for (let a = panel.parentElement; a && chain.length < 5; a = a.parentElement) chain.push(cn(a));
              const html = panel.outerHTML.replace(/<svg[\s\S]*?<\/svg>/g, '<svg/>').replace(/<iframe[\s\S]*?<\/iframe>/g, '<iframe/>').replace(/\s+/g, ' ');
              const rows = [];
              for (const el of [...panel.querySelectorAll('img, a, li, h1, h2, h3, h4, h5, span, div')].filter(vis).slice(0, 260)) {
                const r = el.getBoundingClientRect(); const cs = getComputedStyle(el);
                rows.push({ el: cn(el).slice(0, 90), box: [Math.round(r.x - r0.x), Math.round(r.y - r0.y), Math.round(r.width), Math.round(r.height)], text: (el.tagName === 'IMG' ? (el.getAttribute('src') || '').split('/').pop().slice(0, 40) : (el.children.length ? '' : (el.textContent || '').trim().slice(0, 40))), fs: cs.fontSize, fw: cs.fontWeight, disp: cs.display, w: cs.width, mw: cs.maxWidth });
              }
              return { found: true, chain: chain.join(' < '), panelCls: cn(panel), rect: [Math.round(r0.x), Math.round(r0.y), Math.round(r0.width), Math.round(r0.height)], html: html.slice(0, 16000), htmlLen: html.length, rows };
            }, process.env.SUB || process.env.TOP);
            console.log('PANEL', out.panelCls, JSON.stringify(out.rect), 'chain:', out.chain, 'html length', out.htmlLen);
            console.log('HTML', out.html);
            for (const r of out.rows) console.log('ROW', JSON.stringify(r));
            await browser.close();
          })().catch(e => { console.log('FATAL', String(e).slice(0, 300)); process.exit(0); });
          EOF
          node probe.js
      - uses: actions/upload-artifact@v4
        with:
          name: menu-screenshot
          path: menu.png
          if-no-files-found: ignore
