name: deck-shot
# Read-only against the site apart from typing into the Deck Builder form:
# opens /pages/deck-builder on the preview theme, pastes a short decklist,
# presses "Find my deck", waits for the priced results, and commits a JPEG of
# the results area to probe-shots/ - a real picture of the tool working, for
# the Trading Cards > Deck Builder menu panel.
on:
  workflow_dispatch:
    inputs:
      game:
        description: Value of the game select
        required: false
        default: "mtg"
      list:
        description: Decklist, \n between lines
        required: false
        default: "4 Lightning Bolt\n2 Counterspell\n1 Sol Ring\n1 Wrath of God"
      dark:
        description: Shoot in dark mode
        required: false
        default: "false"
      width:
        description: Viewport width
        required: false
        default: "1100"
      clip:
        description: Max CSS px of the results to capture
        required: false
        default: "700"

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GAME: ${{ inputs.game }}
      LIST: ${{ inputs.list }}
      DARK: ${{ inputs.dark }}
      W: ${{ inputs.width }}
      CLIP: ${{ inputs.clip }}
      SHOT: probe-shots/deck-${{ github.run_id }}.jpg
    steps:
      - uses: actions/checkout@v4
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 >/dev/null 2>&1
      - name: Drive the Deck Builder and shoot the results
        run: |
          mkdir -p probe-shots
          cat > shot.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const T = '157462692013';
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            const w = parseInt(process.env.W || '1100', 10) || 1100;
            await page.setViewport({ width: w, height: 1000, deviceScaleFactor: 2 });
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCacheEnabled(false);
            await page.goto('https://exorgames.com/?preview_theme_id=' + T, { waitUntil: 'domcontentloaded', timeout: 90000 }).catch(() => null);
            const r = await page.goto('https://exorgames.com/pages/deck-builder?preview_theme_id=' + T, { waitUntil: 'networkidle2', timeout: 90000 }).catch(() => null);
            console.log('status', r ? r.status() : 'none', '| title', await page.title());
            await page.evaluate((d) => { document.documentElement.setAttribute('data-xg-theme', d === 'true' ? 'dark' : 'light'); try { localStorage.setItem('xgTheme', d === 'true' ? 'dark' : 'light'); } catch (e) {} }, process.env.DARK);
            await page.waitForSelector('#xg-deck-form', { timeout: 45000 }).catch(() => console.log('NO FORM'));
            await sleep(1500);

            const list = (process.env.LIST || '').replace(/\\n/g, '\n');
            console.log('LIST', JSON.stringify(list));
            await page.select('#xg-deck-game', process.env.GAME || 'mtg').catch(e => console.log('SELECT-ERR', String(e).slice(0, 100)));
            await page.evaluate((v) => {
              const t = document.querySelector('#xg-deck-input');
              if (!t) return;
              t.value = v;
              t.dispatchEvent(new Event('input', { bubbles: true }));
            }, list);
            await sleep(300);
            await page.click('#xg-deck-go').catch(e => console.log('CLICK-ERR', String(e).slice(0, 100)));

            // wait for real rows, not just a spinner
            let rows = 0;
            for (let i = 0; i < 40; i++) {
              await sleep(1500);
              rows = await page.evaluate(() => {
                const r = document.querySelector('#xg-deck-results');
                if (!r) return -1;
                return r.querySelectorAll('img').length;
              });
              const txt = await page.evaluate(() => (document.querySelector('#xg-deck-results')?.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 160));
              console.log('WAIT', i, 'imgs', rows, '|', txt);
              if (rows > 1) break;
            }
            await sleep(2500);

            // Kill anything floating over the page: the newsletter modal, the
            // sticky header, cookie bars. Element screenshots capture whatever
            // overlaps the element's box. A single pass is not enough - the
            // newsletter popup fires on a timer and came back between the hide
            // and the shot (run 35226875245) - so this keeps sweeping until
            // the screenshot is taken, and undims whatever the modal dimmed.
            await page.evaluate(() => {
              const sweep = () => {
                let n = 0;
                // The newsletter popup is an app IFRAME, invisible to a
                // querySelectorAll over the main document - which is why two
                // earlier sweeps left it sitting in the middle of the shot
                // (runs 35226875245, 35227066094). Drop every iframe that is
                // not part of the Deck Builder itself.
                for (const f of document.querySelectorAll('iframe')) {
                  if (f.closest('#xg-deck')) continue;
                  f.remove(); n++;
                }
                for (const el of document.querySelectorAll('body *')) {
                  if (el.closest('#xg-deck')) continue;
                  const cs = getComputedStyle(el);
                  if (cs.display === 'none') continue;
                  const r = el.getBoundingClientRect();
                  const z = parseInt(cs.zIndex, 10);
                  const floating = (cs.position === 'fixed' || cs.position === 'sticky') && r.width * r.height > 2000;
                  if (floating || (cs.position === 'fixed' && z > 100)) { el.style.setProperty('display', 'none', 'important'); n++; }
                }
                // popups dim the page with a filter/opacity on a wrapper
                for (const el of [document.body, document.documentElement, ...document.querySelectorAll('#MainContent, main, .xg-deck-section')]) {
                  if (!el) continue;
                  el.style.setProperty('filter', 'none', 'important');
                  el.style.setProperty('opacity', '1', 'important');
                  el.style.setProperty('overflow', 'visible', 'important');
                }
                window.__hid = (window.__hid || 0) + n;
              };
              sweep();
              window.__sweep = setInterval(sweep, 250);
            });
            await sleep(1200);
            console.log('HID', await page.evaluate(() => window.__hid));

            const el = await page.$('#xg-deck-results');
            if (!el) { console.log('NO RESULTS ELEMENT'); await browser.close(); return; }
            const box = await el.boundingBox();
            console.log('BOX', JSON.stringify(box));
            if (!box || box.height < 40) { console.log('RESULTS EMPTY'); await browser.close(); return; }
            // Element screenshot, not page+clip: boundingBox() is viewport
            // relative while page.screenshot({clip}) takes document
            // coordinates, and mixing the two photographed the top of the
            // page instead of the results (run 35226675747).
            await el.scrollIntoView().catch(() => {});
            await sleep(700);
            console.log('BOX2', JSON.stringify(await el.boundingBox()));
            const jpg = await el.screenshot({ type: 'jpeg', quality: 80 });
            fs.writeFileSync(process.env.SHOT, jpg);
            console.log('SHOT saved', process.env.SHOT, jpg.length, 'bytes');
            await browser.close();
          })().catch(e => { console.log('FATAL', String(e).slice(0, 300)); process.exit(0); });
          EOF
          node shot.js
      - name: Commit the shot
        run: |
          if [ ! -f "$SHOT" ]; then echo "no shot"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SHOT"
          git commit -m "deck builder shot ${{ github.run_id }}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
