name: SortSwift probe

# Round 2: store-config answered to ?storeId=61dfa8766c5f9fa6 (no auth).
# Map the rest of the buylist API — the goal is per-card cash/credit buy
# prices for every game. Read-only, manual-only.

on:
  workflow_dispatch:
    inputs:
      store:
        description: "SortSwift storeId"
        required: true
        default: "61dfa8766c5f9fa6"
      card:
        description: "card name to price"
        required: true
        default: "Charizard"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      S: ${{ inputs.store }}
      CARD: ${{ inputs.card }}
      SS: https://buylist-api.sortswift-services.com/api/buylist
    steps:
      - name: Full store-config (games list, settings)
        run: |
          curl -sS --max-time 20 -A 'Mozilla/5.0' -H 'accept: application/json' \
            -H 'origin: https://buylist.sortswift.com' -H "referer: https://buylist.sortswift.com/?s=$S" \
            "$SS/store-config?storeId=$S" -o /tmp/cfg.json || true
          echo "bytes: $(wc -c < /tmp/cfg.json 2>/dev/null || echo 0)"
          echo "== top-level + config keys =="
          jq -r '.data.config | keys | join(", ")' /tmp/cfg.json 2>/dev/null | head -4 || true
          echo "== games / catalogs mentioned =="
          jq -r '.data.config | to_entries[] | select(.key|test("game|catalog|tcg";"i")) | "\(.key)=\(.value)"' /tmp/cfg.json 2>/dev/null | head -20 || true
          echo "== raw head =="
          head -c 2500 /tmp/cfg.json; printf '\n'

      - name: Price-read battery (GET)
        run: |
          t() { # $1 url
            code=$(curl -sS --max-time 20 -o /tmp/r.json -w '%{http_code}' -A 'Mozilla/5.0' -H 'accept: application/json' \
              -H 'origin: https://buylist.sortswift.com' -H "referer: https://buylist.sortswift.com/?s=$S" "$1") || code=000
            echo "[$code/$(wc -c < /tmp/r.json 2>/dev/null || echo 0)b] $1"
            b=$(wc -c < /tmp/r.json 2>/dev/null || echo 0)
            if [ "$code" = "200" ] && [ "$b" -gt 2 ]; then echo "  BODY: $(head -c 800 /tmp/r.json)"; fi
            if [ "$code" != "200" ] && [ "$b" -gt 2 ]; then echo "  ERR:  $(head -c 250 /tmp/r.json)"; fi
          }
          N=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['CARD']))")
          t "$SS/search?storeId=$S&query=$N"
          t "$SS/search?storeId=$S&q=$N"
          t "$SS/search?storeId=$S&name=$N"
          t "$SS/search?storeId=$S&query=$N&game=pokemon"
          t "$SS/lookup-by-name?storeId=$S&name=$N"
          t "$SS/lookup-by-name?storeId=$S&cardName=$N"
          t "$SS/get-price?storeId=$S&name=$N"
          t "$SS/get-price?storeId=$S&cardId=1"
          t "$SS/hotlist?storeId=$S"
          t "$SS/sets?storeId=$S"
          t "$SS/sets?storeId=$S&game=pokemon"
          t "$SS/filter-values?storeId=$S"

      - name: Price-read battery (POST)
        run: |
          p() { # $1 url, $2 body
            code=$(curl -sS --max-time 20 -o /tmp/r.json -w '%{http_code}' -X POST -A 'Mozilla/5.0' \
              -H 'content-type: application/json' -H 'accept: application/json' \
              -H 'origin: https://buylist.sortswift.com' -H "referer: https://buylist.sortswift.com/?s=$S" \
              "$1" --data "$2") || code=000
            echo "[$code/$(wc -c < /tmp/r.json 2>/dev/null || echo 0)b] POST $1  body=$2"
            b=$(wc -c < /tmp/r.json 2>/dev/null || echo 0)
            if [ "$b" -gt 2 ]; then echo "  BODY: $(head -c 800 /tmp/r.json)"; fi
          }
          p "$SS/search" "$(jq -nc --arg s "$S" --arg n "$CARD" '{storeId:$s, query:$n}')"
          p "$SS/lookup-by-name" "$(jq -nc --arg s "$S" --arg n "$CARD" '{storeId:$s, name:$n}')"
          p "$SS/get-price" "$(jq -nc --arg s "$S" --arg n "$CARD" '{storeId:$s, name:$n}')"
          p "$SS/get-price/bulk" "$(jq -nc --arg s "$S" --arg n "$CARD" '{storeId:$s, names:[$n]}')"
