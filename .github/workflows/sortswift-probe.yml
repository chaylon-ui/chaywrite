name: SortSwift probe

# Round 3: close the price chain. lookup-by-name gives productId; get-price
# wants productId. Also pin down search's real filter params. Read-only.

on:
  workflow_dispatch:
    inputs:
      store:
        description: "SortSwift storeId"
        required: true
        default: "61dfa8766c5f9fa6"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      S: ${{ inputs.store }}
      SS: https://buylist-api.sortswift-services.com/api/buylist
    steps:
      - name: get-price with a real productId (Charizard M24 614370)
        run: |
          t() { # $1 url
            code=$(curl -sS --max-time 20 -o /tmp/r.json -w '%{http_code}' -A 'Mozilla/5.0' -H 'accept: application/json' \
              -H 'origin: https://buylist.sortswift.com' -H "referer: https://buylist.sortswift.com/?s=$S" "$1") || code=000
            echo "[$code/$(wc -c < /tmp/r.json 2>/dev/null || echo 0)b] $1"
            [ "$(wc -c < /tmp/r.json 2>/dev/null || echo 0)" -gt 2 ] && echo "  BODY: $(head -c 1200 /tmp/r.json)"
            true
          }
          t "$SS/get-price?storeId=$S&productId=614370"
          t "$SS/get-price?storeId=$S&productId=614370&skuId=8525496"
          t "$SS/get-price?storeId=$S&productId=614370&condition=NM&printing=Normal"
          t "$SS/get-price/bulk?storeId=$S&productIds=614370,684202"
          t "$SS/available-printings/bulk?storeId=$S&productIds=614370"

      - name: search param pin-down
        run: |
          t() { code=$(curl -sS --max-time 20 -o /tmp/r.json -w '%{http_code}' -A 'Mozilla/5.0' -H 'accept: application/json' -H 'origin: https://buylist.sortswift.com' "$1") || code=000; echo "[$code/$(wc -c < /tmp/r.json 2>/dev/null || echo 0)b] $1"; [ "$(wc -c < /tmp/r.json 2>/dev/null || echo 0)" -gt 2 ] && echo "  BODY: $(head -c 500 /tmp/r.json)"; true; }
          t "$SS/search?storeId=$S&query=Charizard"
          t "$SS/search?storeId=$S&search=Charizard"
          t "$SS/search?storeId=$S&term=Charizard"
          t "$SS/search?storeId=$S&keyword=Charizard"
          t "$SS/search?storeId=$S&q=Charizard&categoryId=3"
          t "$SS/search?storeId=$S&q=Charizard&game=pokemon"
          t "$SS/search?storeId=$S&cleanName=Charizard"
          echo "== does plain search page through the whole buylist catalog? =="
          t "$SS/search?storeId=$S&page=2"
          t "$SS/search?storeId=$S&limit=3"

      - name: lookup-by-name across games (is it exact-name, any game?)
        run: |
          t() { code=$(curl -sS --max-time 20 -o /tmp/r.json -w '%{http_code}' -A 'Mozilla/5.0' -H 'accept: application/json' -H 'origin: https://buylist.sortswift.com' "$1") || code=000; echo "[$code/$(wc -c < /tmp/r.json 2>/dev/null || echo 0)b] $1"; [ "$(wc -c < /tmp/r.json 2>/dev/null || echo 0)" -gt 2 ] && echo "  BODY: $(head -c 400 /tmp/r.json)"; true; }
          t "$SS/lookup-by-name?storeId=$S&name=Sol%20Ring"
          t "$SS/lookup-by-name?storeId=$S&name=Sol%20Ring&categoryId=1"
          t "$SS/lookup-by-name?storeId=$S&name=Mimikyu"
          t "$SS/lookup-by-name?storeId=$S&name=Blue-Eyes%20White%20Dragon"
