name: Deploy exor-binder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/shopify-site-improvements-ztgdt8
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build version (drives the TV's auto-update)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" public/tv.html
          printf '{"v":"%s"}' "${GITHUB_SHA::7}" > public/version.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Optional: if the repo has a SHOPIFY_ADMIN_TOKEN Actions secret, sync it
      # to the worker as an encrypted secret on every deploy. The value never
      # appears in the repo or logs — GitHub masks it end to end. Owner setup:
      # repo Settings → Secrets and variables → Actions → New repository secret.
      - name: Sync SHOPIFY_ADMIN_TOKEN worker secret (when configured)
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$SHOPIFY_ADMIN_TOKEN" ]; then
            printf '%s' "$SHOPIFY_ADMIN_TOKEN" | npx wrangler@4 secret put SHOPIFY_ADMIN_TOKEN
          else
            echo "No SHOPIFY_ADMIN_TOKEN repo secret set - skipping (add one to enable full search, stock caps and numbered draft orders)"
          fi

      # Same pattern for the BinderPOS store API key: powers the card-page
      # "what we pay" buylist reveal (/buyprice.json). Paste the key as a repo
      # Actions secret named BINDERPOS_API_KEY; it syncs on the next deploy and
      # never appears in the repo or logs.
      - name: Sync BINDERPOS_API_KEY worker secret (when configured)
        env:
          BINDERPOS_API_KEY: ${{ secrets.BINDERPOS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$BINDERPOS_API_KEY" ]; then
            printf '%s' "$BINDERPOS_API_KEY" | npx wrangler@4 secret put BINDERPOS_API_KEY
          else
            echo "No BINDERPOS_API_KEY repo secret set - skipping (add one to enable the what-we-pay buylist reveal)"
          fi

      # The BinderPOS PORTAL staff login (a portal user made for this, not
      # the API key): powers the read-only buylists screen at
      # /portal/buylists (src/portal.js). Same pattern: the repo Actions
      # secrets BINDERPOS_LOGIN_EMAIL / BINDERPOS_LOGIN_PASSWORD sync to the
      # worker on every deploy and never appear in the repo or logs.
      - name: Sync BINDERPOS_LOGIN_EMAIL / BINDERPOS_LOGIN_PASSWORD worker secrets (when configured)
        env:
          BINDERPOS_LOGIN_EMAIL: ${{ secrets.BINDERPOS_LOGIN_EMAIL }}
          BINDERPOS_LOGIN_PASSWORD: ${{ secrets.BINDERPOS_LOGIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$BINDERPOS_LOGIN_EMAIL" ] && [ -n "$BINDERPOS_LOGIN_PASSWORD" ]; then
            printf '%s' "$BINDERPOS_LOGIN_EMAIL" | npx wrangler@4 secret put BINDERPOS_LOGIN_EMAIL
            printf '%s' "$BINDERPOS_LOGIN_PASSWORD" | npx wrangler@4 secret put BINDERPOS_LOGIN_PASSWORD
          else
            echo "No BINDERPOS_LOGIN_EMAIL / BINDERPOS_LOGIN_PASSWORD repo secrets set - skipping (add both to enable the buylists screen)"
          fi

      # Login for the sealed auto-pricing page (/autoprice): username and
      # password as repo Actions secrets, synced to the worker. Until both
      # exist the page accepts the showcase admin PIN as the password.
      - name: Sync AUTOPRICE_USER / AUTOPRICE_PASSWORD worker secrets (when configured)
        env:
          AUTOPRICE_USER: ${{ secrets.AUTOPRICE_USER }}
          AUTOPRICE_PASSWORD: ${{ secrets.AUTOPRICE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$AUTOPRICE_USER" ] && [ -n "$AUTOPRICE_PASSWORD" ]; then
            printf '%s' "$AUTOPRICE_USER" | npx wrangler@4 secret put AUTOPRICE_USER
            printf '%s' "$AUTOPRICE_PASSWORD" | npx wrangler@4 secret put AUTOPRICE_PASSWORD
          else
            echo "No AUTOPRICE_USER / AUTOPRICE_PASSWORD repo secrets set - skipping (the /autoprice login falls back to the admin PIN)"
          fi

      # PriceCharting subscription token (optional): the sealed auto-pricer
      # (src/autoprice.js) adds PriceCharting's eBay-derived "new" price to
      # TCGplayer's market price when it is set. Same pattern.
      - name: Sync PRICECHARTING_TOKEN worker secret (when configured)
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$PRICECHARTING_TOKEN" ]; then
            printf '%s' "$PRICECHARTING_TOKEN" | npx wrangler@4 secret put PRICECHARTING_TOKEN
          else
            echo "No PRICECHARTING_TOKEN repo secret set - skipping (the sealed auto-pricer runs on TCGplayer alone)"
          fi

      # Log-only probe of the freshly deployed similar-cards endpoints. The
      # sandbox this worker is developed from has no outbound internet, so
      # this step is where the real upstream shapes and live responses become
      # visible (in the Action log). Failures here never fail the deploy.
      - name: Smoke-test similar endpoints (log-only)
        run: |
          sleep 8   # let the new Worker version propagate before probing
          echo "=== EDHREC raw, first 900 chars ==="
          curl -sS --max-time 20 "https://json.edhrec.com/pages/cards/pyretic-ritual.json" | head -c 900 || true
          printf '\n'
          echo "=== EDHREC top-level keys + similar[] names ==="
          curl -sS --max-time 20 "https://json.edhrec.com/pages/cards/pyretic-ritual.json" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("not json:", e); raise SystemExit
          print("keys:", sorted(d.keys()))
          s = d.get("similar")
          print("similar:", type(s).__name__, len(s) if isinstance(s, list) else "")
          if isinstance(s, list):
              print([c.get("name") for c in s[:12] if isinstance(c, dict)])
          ' || true
          echo "=== /similar.json?name=Pyretic Ritual ==="
          curl -sS --max-time 20 "https://exor-binder.nevski.workers.dev/similar.json?name=Pyretic%20Ritual" || true
          printf '\n'
          echo "=== /instock.json max=8 over hand-picked ritual names ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/instock.json?names=Desperate%20Ritual|Seething%20Song|Rite%20of%20Flame|Mana%20Geyser|Battle%20Hymn|Inner%20Fire|Irencrag%20Feat|Pyretic%20Ritual&max=8" | head -c 1500 || true
          printf '\n'
          echo "=== /deck.json without proof-of-work (expect 403 verification required) ==="
          curl -sS -o /dev/null -w 'no-pow deck.json: HTTP %{http_code}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deck.json?game=mtg&names=Sol%20Ring" || true
          echo "=== /deck.json probes (gate-solved: staples, pokemon, YGO title fix, sister fallback) ==="
          node <<'EOF'
          const crypto = require('crypto');
          const W = 'https://exor-binder.nevski.workers.dev';
          function lead(b, bits) { const f = bits >> 3, r = bits & 7; for (let i = 0; i < f; i++) if (b[i] !== 0) return false; return r === 0 || (b[f] >> (8 - r)) === 0; }
          async function deck(game, names) {
            const g = await (await fetch(W + '/deck-gate')).json();
            const prefix = g.seed + ':' + names.toLowerCase() + ':';
            let n = 0;
            for (;;) { const h = crypto.createHash('sha256').update(prefix + n).digest(); if (lead(h, g.bits)) break; n++; }
            const r = await fetch(W + '/deck.json?game=' + game + '&names=' + encodeURIComponent(names) + '&pb=' + g.bucket + '&pn=' + n + '&notrack=1');
            console.log('--- ' + game + ' :: ' + names.slice(0, 70) + ' -> HTTP ' + r.status + ' (nonce ' + n + ')');
            console.log((await r.text()).slice(0, 2400));
          }
          (async () => {
            await deck('mtg', 'Sol Ring|Counterspell|Lightning Bolt|Command Tower|Arcane Signet|Cultivate');
            await deck('pokemon', 'Charizard|Snorlax|Gengar');
            await deck('yugioh', 'Stardust Dragon|Ash Blossom & Joyous Spring|Blue-Eyes White Dragon');
            await deck('onepiece', 'OP16-015|ST03-011|OP16-003');
            await deck('mtg', 'Humility|Timetwister');
            await deck('mtg', 'Solitude');   // offers[] must carry per-condition qty (owner owns 2)
          })().catch(e => console.log('deck probe error:', e.message));
          EOF
          echo "=== deck-builder assets (theme shell loads these; expect 200 + js/css content-type) ==="
          curl -sS -o /dev/null -w 'deck-builder.js : %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deck-builder.js" || true
          echo "owner intro copy served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'Charlottetown location' || true)"
          echo "list layout served (js hrow + Qty header, css id-anchored): $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck__hrow' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.css' | grep -c '#xg-deck .xg-deck__row' || true)"
          curl -sS -o /dev/null -w 'title logo asset (store CDN): %{http_code} %{content_type}\n' --max-time 20 "https://cdn.shopify.com/s/files/1/0467/3083/8169/files/WE_BUY_CARDS_951e0f40-efac-4b8a-97b3-8ee6330881bd.png?v=1706987808" || true
          echo "next-cheapest toggle served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck-nextcheap' || true)"
          echo "ticks + version picker served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck-checkall' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck__ver' || true)"
          echo "thumb zoom served (js/css): $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck-zoom' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.css' | grep -c 'xg-deck-zoom' || true)"
          echo "copy-missing button served (js/css): $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck-copymiss' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.css' | grep -c 'xg-deck__copymiss' || true)"
          echo "=== Deck Builder admin (PIN-gated; smoke has no PIN so reads must 403, page serves its login) ==="
          curl -sS -o /dev/null -w '/deckstats admin page: %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deckstats" || true
          echo "admin page login served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deckstats' | grep -c 'Deck Builder Admin' || true)"
          curl -sS -o /dev/null -w '/deckstats.json no key : HTTP %{http_code} (expect 403)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deckstats.json" || true
          curl -sS -o /dev/null -w '/deckstats.json bad key: HTTP %{http_code} (expect 403)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deckstats.json?k=smoke-wrong" || true
          curl -sS -o /dev/null -w '/deck-admin no key POST: HTTP %{http_code} (expect 403)\n' --max-time 20 -X POST "https://exor-binder.nevski.workers.dev/deck-admin?op=ban&ip=203.0.113.9" || true
          curl -sS -o /dev/null -w 'deck-track route (public surface ignores ev=search): HTTP %{http_code}\n' --max-time 20 -X POST "https://exor-binder.nevski.workers.dev/deck-track?ev=search&game=probe" || true
          echo "=== 9Pocket by Exor: staged buylists (src/stage.js) ==="
          curl -sS -o /dev/null -w '/9pocket signed out: HTTP %{http_code} -> %{redirect_url} (expect 303 to /login, or to /setup while no account exists)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/9pocket" || true
          curl -sS -o /dev/null -w '/9pocket/login: HTTP %{http_code} (expect 200 once an account exists; 403 = the setup page asking for the staff key)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/9pocket/login" || true
          echo "sign-in page is branded: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/9pocket/login' | grep -c '9Pocket by Exor' || true)"
          curl -sS -o /dev/null -w '/9pocket/login wrong password: HTTP %{http_code} (expect 403)\n' --max-time 20 -X POST --data-urlencode 'email=smoke@example.test' --data-urlencode 'password=not-it' "https://exor-binder.nevski.workers.dev/9pocket/login" || true
          curl -sS -o /dev/null -w '/9pocket/setup no key: HTTP %{http_code} (expect 403, or 303 to /login once an account exists)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/9pocket/setup" || true
          curl -sS -o /dev/null -w '/9pocket.json bad key, no session: HTTP %{http_code} (expect 403)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/9pocket.json?k=smoke-wrong" || true
          curl -sS -o /dev/null -w '/9pocket/b/x no session: HTTP %{http_code} (expect 303 to /login)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/9pocket/b/01700000000000-abcd" || true
          curl -sS -o /dev/null -w '/9pocket/admin no session: HTTP %{http_code} (expect 303 to /login)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/9pocket/admin" || true
          curl -sS -o /dev/null -w '/9pocket/control no session: HTTP %{http_code} (expect 403)\n' --max-time 20 -X POST -H 'content-type: application/json' -d '{"id":"x","action":"approve"}' "https://exor-binder.nevski.workers.dev/9pocket/control" || true
          curl -sS -o /dev/null -w '/buylist/staged (old address): HTTP %{http_code} -> %{redirect_url} (expect 308 to /9pocket)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/buylist/staged" || true
          echo "health (counts, accounts, staging, lookup + email config, name probe): $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/9pocket/health?probe=1' || true)"
          # Hold on arrival, stage 2 (src/hold-live.js): the switch lives in the
          # hold DO, never in code, so a deploy cannot turn it on. Printed so the
          # log shows its state; /9pocket/held itself needs a sign-in.
          echo "hold on arrival live switch: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/hold/health' | grep -o '"live":{[^}]*}' || echo 'no live field')"
          curl -sS -o /dev/null -w '/9pocket/held no session: HTTP %{http_code} (expect 303 to /login)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/9pocket/held" || true
          curl -sS -o /dev/null -w '/9pocket/held/control no session: HTTP %{http_code} (expect 303 to /login)\n' --max-time 20 -X POST --data 'action=on' "https://exor-binder.nevski.workers.dev/9pocket/held/control" || true
          # DRY RUN of the BinderPOS price carry-over (src/stage-sync.js): the
          # newest approved 9Pocket buylist's plan - what /api/buylist/save
          # would receive - printed, nothing sent. Customer fields are redacted
          # by the worker; names of cards are fine.
          node <<'EOF2'
          const fs = require('fs');
          const m = fs.readFileSync('src/config.js', 'utf8').match(/DEFAULT_PIN\s*=\s*["']?([\w-]+)/);
          const K = m ? m[1] : '';
          const W = 'https://exor-binder.nevski.workers.dev';
          (async () => {
            if (!K) { console.log('bp-plan: no DEFAULT_PIN; skipped'); return; }
            const li = await fetch(W + '/9pocket.json?k=' + K + '&status=approved&days=90').then((r) => r.json()).catch((e) => ({ error: String(e) }));
            const recs = (li.records || []).filter((r) => r.bp && r.bp.number).sort((a, b) => b.ts - a.ts);
            console.log('bp-plan: approved with a BinderPOS number:', recs.length, li.error ? '| error ' + li.error : '');
            if (!recs.length) return;
            const r = recs[0];
            const j = await fetch(W + '/9pocket/b/' + encodeURIComponent(r.id) + '/bp-plan.json?k=' + K).then((x) => x.json()).catch((e) => ({ error: String(e) }));
            if (!j.ok) { console.log('bp-plan', r.number, 'failed:', j.error); return; }
            console.log('bp-plan', j.number, '-> BinderPOS', j.bpId, '| paid', j.paymentType, '| their lines', j.theirLines, 'final', j.finalLines, 'approved', j.approved, 'completed', j.completed, '| matched', j.matched, 'changes', j.changes, '| detail keys:', j.detailKeys.join(','));
            for (const l of j.lines) console.log('  line', l.id, l.name, '[' + l.set + ']', l.condition, l.finish || '', '| BP qty', l.bpQty, 'cash', l.bpCash, 'credit', l.bpCredit, '| ours qty', l.ourQty, 'cash', l.ourCash, 'credit', l.ourCredit, l.staffPriced ? '(staff price)' : '', l.change ? '<- WOULD CHANGE' : 'same');
            for (const l of j.unmatchedOurs) console.log('  unmatched on our side:', JSON.stringify(l));
            for (const l of j.unmatchedTheirs) console.log('  unmatched on their side:', JSON.stringify(l));
            console.log('  payload (redacted):', JSON.stringify(j.payload).slice(0, 3000));
          })().catch((e) => console.log('bp-plan error:', e.message));
          EOF2
          echo "cards we need most (movers -> BinderPOS hits; count, first names, missed, error): $(curl -sS --max-time 60 'https://exor-binder.nevski.workers.dev/buylist/api/wanted' | python3 -c 'import sys,json;j=json.load(sys.stdin);print(j.get("count"), [h.get("cardName")+" ["+str(h.get("setName"))+"]" for h in j.get("hits",[])][:4], "missed", j.get("missed"), "error", j.get("error"), "asOf", j.get("asOf"))' 2>&1 || true)"
          echo "pokemon cards we need most (count, first names, building, sources, last try): $(curl -sS --max-time 60 'https://exor-binder.nevski.workers.dev/buylist/api/wanted?game=pokemon' | python3 -c 'import sys,json;j=json.load(sys.stdin);pr=j.get("progress") or {};print(j.get("count"), [h.get("cardName")+" ["+str(h.get("setName"))+"]" for h in j.get("hits",[])][:6], "building", j.get("building"), "sources", pr.get("sources"), "lastTry", j.get("lastTry"), "asOf", j.get("asOf"))' 2>&1 || true)"
          echo "mine for a made-up customer (expect count 0): $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/buylist/api/mine?customer=1234567' | head -c 200 || true)"
          echo "sell page js/css carry the status block: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/buylist.js' | grep -c 'bl-mine' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/buylist.css' | grep -c 'bl__mine' || true)"
          echo "cart tag + beacon + sid served in deck-builder.js: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'cart/update.js' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'function beacon' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'var SID' || true)"
          curl -sS -o /dev/null -w 'new-today.js : %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/new-today.js" || true
          echo "cards.json nt=1 CORS + count: $(curl -sS --max-time 120 'https://exor-binder.nevski.workers.dev/cards.json?collection=new-arrivals&nt=1' -D /tmp/nt-h -o /tmp/nt-b && grep -ci 'access-control-allow-origin' /tmp/nt-h || true) / $(python3 -c 'import json;print(json.load(open("/tmp/nt-b")).get("count"))' 2>/dev/null || echo parse-fail)"
          curl -sS -o /dev/null -w 'deck-builder.css: %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deck-builder.css" || true
          echo "=== /buyprice.json (BinderPOS only; available:false until BINDERPOS_API_KEY — storefront then uses daily buy-rules estimates) ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/buyprice.json?name=Sol%20Ring&type=MTG%20Single" | head -c 600 || true
          printf '\n'
          echo "=== /reviews.json (Google reviews; ok:false + empty until GOOGLE_PLACES_KEY is set in the dashboard) ==="
          curl -sS -D /tmp/rev-h --max-time 30 "https://exor-binder.nevski.workers.dev/reviews.json" | head -c 400 || true
          printf '\n'
          echo "reviews CORS header: $(grep -ci 'access-control-allow-origin' /tmp/rev-h || true)"
          echo "reviews cache-control: $(grep -i '^cache-control' /tmp/rev-h | tr -d '\r' || true)"
          echo "=== /stores.json (Google Places opening hours per store; ok:false + empty until GOOGLE_PLACES_KEY is set) ==="
          curl -sS -D /tmp/stores-h --max-time 30 "https://exor-binder.nevski.workers.dev/stores.json" | head -c 600 || true
          printf '\n'
          echo "stores CORS header: $(grep -ci 'access-control-allow-origin' /tmp/stores-h || true)"
          echo "stores cache-control: $(grep -i '^cache-control' /tmp/stores-h | tr -d '\r' || true)"
          echo "=== stores resolved: name | city | source | address per store (exor = the Exor Games listing; hours-partner = the Most Wanted Pawn shop the Exor counter sits in, same hours) ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/stores.json" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("not json:", e); raise SystemExit
          print("ok", d.get("ok"), "count", d.get("count"))
          tally = {}
          for s in d.get("stores", []):
              h = s.get("hours") or {}
              tally[s.get("source")] = tally.get(s.get("source"), 0) + 1
              print(" -", s.get("name"), "|", s.get("city"), s.get("province"), "|", s.get("source"), "|", s.get("address"), "|", s.get("id"), "|", s.get("phone"), "| utc", s.get("utcOffsetMin"), "| periods", len(h.get("periods", [])), "| text", len(h.get("weekdayText", [])))
          print("by source:", tally)
          cities = ["Charlottetown", "Summerside", "Bridgewater", "Dartmouth", "New Glasgow", "Truro"]
          have = [str(s.get("city") or "") for s in d.get("stores", [])]
          print("cities without a record:", [c for c in cities if c not in have] or "none")
          ' || true
          # No ?debug=1 probes here on purpose: each one bills Google for every
          # Text Search and details call it reports, on every deploy. Open them
          # by hand when the feeds need diagnosing.
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/buyprice.json?name=Mimikyu&type=Pokemon%20Single" | head -c 600 || true
          printf '\n'
          curl -sS -o /dev/null -w 'buyprice-reveal.js: %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/buyprice-reveal.js" || true
          echo "buylist page: grouped list rows served (js/css) + sticky panel scroll: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/buylist.js' | grep -c 'bl__group-head' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/buylist.css' | grep -c 'bl__group-head' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/buylist.css' | grep -c 'xg-fixed-bottom' || true)"
          echo "=== /buy-rules.json (estimate rules; enabled flag gates the storefront) ==="
          curl -sS --max-time 20 "https://exor-binder.nevski.workers.dev/buy-rules.json" | jq -c '{enabled, updated, games: (.games|length)}' || true
          echo "=== /sisterstock.json (partial-line follow-up; sister qty is opportunistic - null when their product JSON hides counts) ==="
          curl -sS --max-time 40 "https://exor-binder.nevski.workers.dev/sisterstock.json?game=mtg&names=Solitude%7CHumility" | head -c 900 || true
          printf '\n'
          echo "=== /sisternew.json (store pages: what landed at each sister store; source = which path answered, dates = the span it covers) ==="
          for s in summerside bridgewater dartmouth new-glasgow truro; do
            curl -sS --max-time 45 "https://exor-binder.nevski.workers.dev/sisternew.json?store=$s" | jq -c '{store, source, count, recent7, newest, oldest, first: (.products[0] // null | if . then {title, price, updated, created, type} else null end)}' || true
          done
          echo "=== /events.json?store= (store pages: the sister store's events, asked of BinderPOS as that store; deploy 264 raw test: Truro 6, New Glasgow 9, the other three none) ==="
          for s in truro new-glasgow dartmouth; do
            curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/events.json?store=$s" | jq -c '{store, ok, count, error, first: (.events[0] // null | if . then {title, date, time, game, city, url} else null end)}' || true
          done
          echo "=== /reviews.json carries a place id per review (store pages match on it) ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/reviews.json" | jq -c '{count, places: ([.reviews[].place]|unique), locations: ([.reviews[].location]|unique)}' || true
          echo "=== /sisters.json?q=humility (expect cheapest IN-STOCK prices; New Glasgow Humility = 79.10 not 40.50; 5-min edge cache may lag one run) ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/sisters.json?q=humility" | head -c 1500 || true
          printf '\n'

      # Log-only probe of the cached BinderPOS search proxy. The first POST
      # is a miss (BinderPOS cold: up to ~30s) unless the 5-min cron already
      # warmed the body ("warm"); the second must come back "hit" instantly.
      - name: Smoke-test /binder/search (log-only)
        run: |
          W=https://exor-binder.nevski.workers.dev
          B='{"storeUrl":"most-wanted-ca.myshopify.com","game":"pokemon","strict":null,"sortTypes":[{"type":"price","asc":false,"order":1}],"variants":null,"title":"","priceGreaterThan":0,"priceLessThan":null,"instockOnly":true,"limit":18,"offset":0,"setNames":[],"rarities":[],"types":[]}'
          echo "=== supportedGames raw (the cron's game-list source), first 900 chars ==="
          curl -sS --max-time 20 -H 'Accept: application/json' "https://api.binderpos.com/external/shopify/supportedGames?storeUrl=most-wanted-ca.myshopify.com" | head -c 900 || true
          printf '\n'
          echo "=== POST /binder/search pokemon default body, twice (expect miss or warm, then hit) ==="
          for i in 1 2; do
            curl -sS --max-time 70 -D /tmp/bs-h -o /tmp/bs-b -w "binder/search #$i: HTTP %{http_code} time_total %{time_total}s size %{size_download}B\n" -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data "$B" "$W/binder/search" || true
            echo "  x-xg-cache: $(grep -i '^x-xg-cache' /tmp/bs-h | tr -d '\r' | cut -d' ' -f2-) | x-xg-age: $(grep -i '^x-xg-age' /tmp/bs-h | tr -d '\r' | cut -d' ' -f2-) | content-type: $(grep -i '^content-type' /tmp/bs-h | tr -d '\r' | cut -d' ' -f2-) | cors: $(grep -ci '^access-control-allow-origin' /tmp/bs-h || true) | count: $(python3 -c 'import json;d=json.load(open("/tmp/bs-b"));print(d.get("count"), "products", len(d.get("products") or []))' 2>/dev/null || echo parse-fail)"
          done
          echo "=== GET /binder/search (expect 405), OPTIONS preflight (expect 204 + CORS), wrong storeUrl (expect 400) ==="
          curl -sS -o /dev/null -w 'GET /binder/search: HTTP %{http_code}\n' --max-time 20 "$W/binder/search" || true
          curl -sS -o /dev/null -D /tmp/bs-o -w 'OPTIONS /binder/search: HTTP %{http_code}\n' --max-time 20 -X OPTIONS -H 'Origin: https://exorgames.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$W/binder/search" || true
          grep -i '^access-control' /tmp/bs-o | tr -d '\r' | sed 's/^/  /' || true
          curl -sS -w '\nwrong storeUrl: HTTP %{http_code}\n' --max-time 20 -H 'Content-Type: application/json' -X POST --data '{"storeUrl":"other.myshopify.com","game":"pokemon","limit":18}' "$W/binder/search" || true
          echo "=== /binder/search/status (last cron run per game + landing-entry ages; cron:null means the 5-min pre-warm has never completed) ==="
          curl -sS --max-time 20 "$W/binder/search/status" | head -c 2500 || true
          printf '\n'

      # Log-only probe of GET /ics (round 27 add-to-calendar). A July sample
      # is ADT (-03:00): 18:30 local must come back DTSTART:20260710T213000Z
      # with the 3-hour default end DTEND:20260711T003000Z as a text/calendar
      # attachment; format=google must 302 to calendar.google.com carrying
      # the same UTC dates; a bad date, a missing title and a 301-char title
      # must each 400.
      - name: Smoke-test /ics add-to-calendar (log-only)
        run: |
          W=https://exor-binder.nevski.workers.dev
          Q='t=Friday%20Night%20Magic%20%C2%B7%20Magic&s=2026-07-10T18%3A30&loc=Exor%20Games%20Charlottetown&d=Magic%3A%20The%20Gathering%20%C2%B7%20Ticket%20%2410&u=https%3A%2F%2Fexorgames.com%2Fpages%2Fevents'
          echo "=== GET /ics sample (expect 200 text/calendar attachment; DTSTART:20260710T213000Z DTEND:20260711T003000Z) ==="
          curl -sS -D /tmp/ics-h -o /tmp/ics-b --max-time 20 "$W/ics?$Q" || true
          grep -i '^HTTP/\|^content-type\|^content-disposition\|^cache-control' /tmp/ics-h | tr -d '\r' | sed 's/^/  /' || true
          head -n 12 /tmp/ics-b | tr -d '\r' || true
          echo "=== /ics format=google (expect 302 -> calendar.google.com/calendar/render?action=TEMPLATE ... dates=20260710T213000Z/20260711T003000Z) ==="
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 20 "$W/ics?$Q&format=google" || true
          echo "=== /ics guards (expect 400 400 400) ==="
          curl -sS -o /dev/null -w 'bad date      : HTTP %{http_code}\n' --max-time 20 "$W/ics?t=x&s=2026-13-45T99%3A99" || true
          curl -sS -o /dev/null -w 'no title      : HTTP %{http_code}\n' --max-time 20 "$W/ics?s=2026-07-10T18%3A30" || true
          curl -sS -o /dev/null -w '301-char title: HTTP %{http_code}\n' --max-time 20 "$W/ics?t=$(printf 'a%.0s' $(seq 1 301))&s=2026-07-10T18%3A30" || true

      # Log-only probe of the price-history feed (src/price-history.js). Kicks
      # today's snapshot run (idempotent per UTC day: a second kick answers
      # "already ran today"), polls the status page every 10s for up to 150s
      # while the DO alarm pages through the singles catalogue, then reads the
      # series of one real single found through /search.json (by handle and
      # by numeric id) plus the first product the run touched. A full run
      # takes longer than this window (~60k products under Shopify's query
      # cost limits), so the first deploy of a day shows a run in progress
      # and a later one shows it finished. Never fails the deploy.
      - name: Smoke-test /price-history (log-only)
        run: |
          set +e
          W=https://exor-binder.nevski.workers.dev
          echo "=== POST /price-history/run (kick today's snapshot; a no-op when it already ran) ==="
          curl -sS --max-time 20 -X POST "$W/price-history/run" | head -c 900 || true
          printf '\n'
          echo "=== GET /price-history/status every 10s, up to 150s ==="
          for i in $(seq 1 15); do
            sleep 10
            S=$(curl -sS --max-time 20 "$W/price-history/status")
            echo "status #$i: $(printf '%s' "$S" | head -c 2200)"
            if printf '%s' "$S" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          raise SystemExit(0 if d.get("ok") and not d.get("run") else 1)
          ' 2>/dev/null; then echo "no run in progress (today is complete, or the last run is the answer above)"; break; fi
          done
          echo "=== a real single through /search.json?q=charizard (handle from the first card's url) ==="
          H=$(curl -sS --max-time 40 "$W/search.json?q=charizard" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          c = (d.get("cards") or [{}])[0]
          print((c.get("url") or "").rstrip("/").rsplit("/", 1)[-1])
          ' 2>/dev/null)
          echo "handle: $H"
          echo "=== GET /price-history.json?handle=$H ==="
          curl -sS -D /tmp/ph-h --max-time 30 "$W/price-history.json?handle=$H" | head -c 1600 || true
          printf '\n'
          echo "price-history CORS: $(grep -ci '^access-control-allow-origin' /tmp/ph-h || true) | cache-control: $(grep -i '^cache-control' /tmp/ph-h | tr -d '\r' || true) | x-xg-cache: $(grep -i '^x-xg-cache' /tmp/ph-h | tr -d '\r' | cut -d' ' -f2- || true)"
          PID=$(curl -sS --max-time 30 "$W/price-history.json?handle=$H" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id") or "")' 2>/dev/null)
          echo "=== GET /price-history.json?id=$PID (the same product by numeric id) ==="
          curl -sS --max-time 30 "$W/price-history.json?id=$PID" | head -c 1600 || true
          printf '\n'
          FID=$(curl -sS --max-time 20 "$W/price-history/status" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          r = d.get("run") or d.get("last") or {}
          print(r.get("firstId") or "")
          ' 2>/dev/null)
          echo "=== GET /price-history.json?id=$FID (the first product this run touched: carries today's point even mid-run) ==="
          curl -sS --max-time 30 "$W/price-history.json?id=$FID" | head -c 1600 || true
          printf '\n'
          echo "=== unknown id -> ok:true with empty points, HTTP 200; a second POST -> no-op that says so ==="
          curl -sS -w ' [HTTP %{http_code}]' --max-time 20 "$W/price-history.json?id=1" || true
          printf '\n'
          curl -sS --max-time 20 -X POST "$W/price-history/run" | head -c 700 || true
          printf '\n'

      - name: Enrichment unit tests + /enrich smoke (log-only)
        run: |
          set +e
          echo "=== parsers and the tick state machine (pure, no network) ==="
          node test/enrich-parse.test.mjs 2>&1 | grep -vE 'MODULE_TYPELESS|Reparsing|trace-warnings' || true
          node test/enrich-tick.test.mjs  2>&1 | grep -vE 'MODULE_TYPELESS|Reparsing|trace-warnings' || true
          echo "=== 9Pocket: pure helpers (src/stage.js), the DO (in-memory storage), accounts (src/stage-auth.js) ==="
          for t in test/stage.test.mjs test/stage-do.test.mjs test/stage-auth.test.mjs test/stage-sync.test.mjs test/autoprice.test.mjs test/autoprice-access.test.mjs test/hold.test.mjs test/hold-live.test.mjs test/page-edit.test.mjs test/wanted.test.mjs test/deck-sales.test.mjs test/gunpla.test.mjs; do echo "-- $t"; node $t 2>&1 | grep -E '^# (pass|fail)|^not ok' || true; done
          W="https://exor-binder.nevski.workers.dev"
          echo "=== GET /enrich/status (tokenConfigured, next alarm, last run) ==="
          curl -sS --max-time 20 "$W/enrich/status" | python3 -m json.tool || true
          echo "=== BoardGameGeek XML API2 still answers the two calls the sweep makes ==="
          curl -sS -o /tmp/bgg-s -w 'bgg search: HTTP %{http_code} %{size_download}B\n' --max-time 25 \
            "https://boardgamegeek.com/xmlapi2/search?type=boardgame&query=Wingspan" || true
          head -c 300 /tmp/bgg-s; printf '\n'
          curl -sS -o /tmp/bgg-t -w 'bgg thing:  HTTP %{http_code} %{size_download}B\n' --max-time 25 \
            "https://boardgamegeek.com/xmlapi2/thing?stats=1&id=266192" || true
          echo "minplayers/maxplayers/averageweight present: $(grep -coE '<(minplayers|maxplayers|averageweight)' /tmp/bgg-t || true)"

      # Log-only probe of the staff buylists screen (src/portal.js,
      # public/buylists.html). The gate must answer 403 without a key. The
      # gated reads use the staff PIN read from src/config.js in this
      # checkout — never printed — and log only statuses, shapes and counts,
      # with customer names and emails masked. If the owner has changed the
      # PIN in /admin the gated part just reports 403 and stops.
      - name: Smoke-test /portal buylists (log-only)
        run: |
          set +e
          W=https://exor-binder.nevski.workers.dev
          curl -sS -o /dev/null -w '/portal/buylists page: HTTP %{http_code} %{content_type}\n' --max-time 20 "$W/portal/buylists" || true
          echo "page shell served (title + login card): $(curl -sS --max-time 20 "$W/portal/buylists" | grep -c 'Buylists' || true)"
          curl -sS -o /dev/null -w '/portal/buylists.json no key : HTTP %{http_code} (expect 403)\n' --max-time 20 "$W/portal/buylists.json" || true
          curl -sS -o /dev/null -w '/portal/buylist.json no key  : HTTP %{http_code} (expect 403)\n' --max-time 20 "$W/portal/buylist.json?id=1" || true
          node <<'EOF'
          const fs = require('fs');
          const m = fs.readFileSync('src/config.js', 'utf8').match(/DEFAULT_PIN\s*=\s*["']?([\w-]+)/);
          const K = m ? m[1] : '';
          const W = 'https://exor-binder.nevski.workers.dev';
          const mask = (s) => String(s).replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, '<email>').replace(/("(name|email|phone|notes)"\s*:\s*")[^"]*(")/g, '$1<masked>$3');
          (async () => {
            if (!K) { console.log('no DEFAULT_PIN found in src/config.js; gated probes skipped'); return; }
            const j = async (p) => { const r = await fetch(W + p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(K)); return { status: r.status, body: await r.json().catch(() => null) }; };
            const st = await j('/portal/status.json');
            console.log('status.json:', st.status, JSON.stringify(st.body));
            if (st.status === 403) { console.log('the staff PIN in src/config.js is not the live one (changed in /admin?) - gated probes skipped'); return; }
            const li = await j('/portal/buylists.json?status=pending&take=3&days=90');
            console.log('buylists.json pending take=3 days=90:', li.status, 'rows', li.body && li.body.rows ? li.body.rows.length : '-', 'more', li.body && li.body.more, li.body && li.body.error ? '| error ' + li.body.error : '');
            const first = li.body && li.body.rows && li.body.rows[0];
            if (first) console.log('row[0]:', mask(JSON.stringify(first)));
            if (first) {
              const d = await j('/portal/buylist.json?id=' + first.id);
              const b = d.body || {};
              console.log('buylist.json:', d.status, 'stage', b.stage, 'payment', b.paymentType, 'lines', b.lines ? b.lines.length : '-', 'final', b.finalLines ? b.finalLines.length : '-', '| totals', JSON.stringify(b.totals), '| priceError', b.priceError || 'none', b.error ? '| error ' + b.error : '');
              if (b.customer) console.log('customer keys:', Object.keys(b.customer).join(','), '| storeCredit', b.customer.storeCredit);
              if (b.lines && b.lines[0]) console.log('line[0]:', JSON.stringify(b.lines[0]).slice(0, 800));
              console.log('lines with a live price:', (b.lines || []).filter(l => l.live).length, '/', (b.lines || []).length);
            }
            for (const s of ['approved', 'completed']) {
              const r = await j('/portal/buylists.json?status=' + s + '&take=2&days=60');
              console.log(s + ' take=2 days=60:', r.status, 'rows', r.body && r.body.rows ? r.body.rows.length : '-', r.body && r.body.error ? '| error ' + r.body.error : '');
            }
            // in-store buy carts, the last 24 h only (BinderPOS's cart list is its slowest call):
            // the first read of a day is the slow one (portal fetch), the second is the cache
            for (const pass of [1, 2]) {
              const t0 = Date.now();
              const ca = await j('/portal/carts.json?days=1&take=3');
              const cb = ca.body || {};
              console.log('carts.json days=1 take=3 pass ' + pass + ':', ca.status, 'ms', Date.now() - t0, '| total', cb.total, 'rows', cb.rows ? cb.rows.length : '-', 'more', cb.more, '| totals', JSON.stringify(cb.totals), cb.error ? '| error ' + cb.error : '');
              if (pass === 2 && cb.rows && cb.rows[0]) {
                const c0 = cb.rows[0];
                console.log('cart row[0]:', mask(JSON.stringify(c0)).slice(0, 700));
                const cd = await j('/portal/cart.json?id=' + c0.id + '&day=' + c0.day);
                const b = cd.body || {};
                console.log('cart.json:', cd.status, 'type', b.type, 'lines', b.lines ? b.lines.length : '-', '| bought', JSON.stringify(b.bought), '| payout', JSON.stringify(b.payout), '| sold', JSON.stringify(b.sold), b.error ? '| error ' + b.error : '');
                const buy = (b.lines || []).find(l => l.buying);
                if (buy) console.log('cart buy line:', JSON.stringify(buy).slice(0, 500));
              }
            }
          })().catch(e => console.log('portal smoke error:', e.message));
          EOF
      - name: Smoke-test buylist submit re-pricing (dry run, log-only)
        run: |
          # Nothing reaches BinderPOS's submit: ?dry=1 stops after the re-pricing
          # and returns what would have gone out. The customer id is a placeholder.
          node - <<'EOF'
          const W = 'https://exor-binder.nevski.workers.dev';
          const j = async (p, init) => { const r = await fetch(W + p, init); let b = null; try { b = await r.json(); } catch {} return { status: r.status, body: b }; };
          const post = (p, body) => j(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
          (async () => {
            const s = await j('/buylist/api/search?q=' + encodeURIComponent('Sol Ring') + '&game=mtg');
            const hits = (s.body && s.body.hits) || [];
            console.log('search:', s.status, 'hits', hits.length, hits[0] ? '| hit keys ' + Object.keys(hits[0]).join(',') : '');
            let card = null, expectMax = 0;
            for (const h of hits) for (const v of h.variants || []) for (const p of v.cardBuylistTypes || []) {
              if (!card && Number(p.maxPurchaseQuantity) > 0 && Number(p.buyPrice) > 0.02) {
                expectMax = Number(p.maxPurchaseQuantity);
                card = { cardId: h.id, cardName: h.cardName, setName: h.setName, game: h.game, type: p.type, imageUrl: h.imageUrl, quantity: '999', cashBuyPrice: 0.01, storeCreditBuyPrice: 0.01, condition: v.id, conditionName: v.variantName, shopifyVariantId: p.productVariantId };
                console.log('picked:', h.cardName, '[' + h.setName + ']', v.variantName, p.type, '| game field', JSON.stringify(h.game), '| live', p.buyPrice, '/', p.creditBuyPrice, 'max', expectMax);
              }
            }
            if (!card) { console.log('no buyable offer in the search result; dry run skipped'); return; }
            const d = await post('/buylist/api/submit?customer=123456&dry=1', { paymentType: 'Cash', cards: [card] });
            console.log('submit dry=1:', d.status, JSON.stringify(d.body).slice(0, 900));
            const c0 = d.body && d.body.cards && d.body.cards[0];
            const ok = d.status === 200 && d.body.dry === true && c0 && Number(c0.cash) > 0.01 && Number(c0.quantity) === expectMax;
            console.log('re-pricing check:', ok ? 'PASS (browser price replaced, quantity capped at ' + expectMax + ')' : 'FAIL');
            const u = await post('/buylist/api/submit?customer=123456&dry=1', { paymentType: 'Cash', cards: [{ ...card, cardId: 999999999 }] });
            console.log('unknown card dry=1:', u.status, '(expect 409)', JSON.stringify(u.body).slice(0, 300));
          })().catch(e => console.log('re-pricing smoke error:', e.message));
          EOF
      - name: Smoke-test buylist page assets (log-only)
        run: |
          W=https://exor-binder.nevski.workers.dev
          CSS=$(curl -sS --max-time 20 "$W/buylist.css" || true)
          JS=$(curl -sS --max-time 20 "$W/buylist.js" || true)
          echo "buylist.css: row-grid fix $(printf '%s' "$CSS" | grep -c 'bl__line.bl__line--in' || true) | sheet bar $(printf '%s' "$CSS" | grep -c 'bl__sheetbar' || true) | sheet open rule $(printf '%s' "$CSS" | grep -c 'bl__cart--open' || true) | grouped rows $(printf '%s' "$CSS" | grep -c 'bl__group-head' || true)"
          echo "buylist.js: sheet bar markup $(printf '%s' "$JS" | grep -c 'bl-sheetbar' || true) | bar View + Submit buttons $(printf '%s' "$JS" | grep -c 'bl-sheetview' || true) / $(printf '%s' "$JS" | grep -c 'bl-sheetsubmit' || true) | toggle $(printf '%s' "$JS" | grep -c 'toggleSheet' || true) | re-pricing notes $(printf '%s' "$JS" | grep -c 'j.repriced' || true)"
      # Shelf drops to Discord (src/discord.js): a channel webhook URL pasted
      # as the repo Actions secret DISCORD_WEBHOOK_URL (optional per-game
      # DISCORD_WEBHOOK_MTG / POKEMON / YUGIOH / LORCANA / ONEPIECE / FAB /
      # SWU / RIFTBOUND / SPORTS / SEALED) syncs on the next deploy and never
      # appears in the repo or logs.
      # BoardGameGeek XML API token (src/enrich.js, approved 2026-09-11): the
      # repo Actions secret BGG_TOKEN syncs the same way.
      - name: Sync optional worker secrets (each one that is configured)
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_MTG: ${{ secrets.DISCORD_WEBHOOK_MTG }}
          DISCORD_WEBHOOK_POKEMON: ${{ secrets.DISCORD_WEBHOOK_POKEMON }}
          DISCORD_WEBHOOK_YUGIOH: ${{ secrets.DISCORD_WEBHOOK_YUGIOH }}
          DISCORD_WEBHOOK_LORCANA: ${{ secrets.DISCORD_WEBHOOK_LORCANA }}
          DISCORD_WEBHOOK_ONEPIECE: ${{ secrets.DISCORD_WEBHOOK_ONEPIECE }}
          DISCORD_WEBHOOK_FAB: ${{ secrets.DISCORD_WEBHOOK_FAB }}
          DISCORD_WEBHOOK_SWU: ${{ secrets.DISCORD_WEBHOOK_SWU }}
          DISCORD_WEBHOOK_RIFTBOUND: ${{ secrets.DISCORD_WEBHOOK_RIFTBOUND }}
          DISCORD_WEBHOOK_SPORTS: ${{ secrets.DISCORD_WEBHOOK_SPORTS }}
          DISCORD_WEBHOOK_SEALED: ${{ secrets.DISCORD_WEBHOOK_SEALED }}
          DISCORD_MIN_PRICE: ${{ secrets.DISCORD_MIN_PRICE }}
          # ntfy push for the sealed auto-pricer's daily digest (src/autoprice.js):
          # AUTOPRICE_NTFY = topic name on ntfy.sh or a full https://server/topic
          # URL; AUTOPRICE_NTFY_TOKEN = optional access token for that server.
          AUTOPRICE_NTFY: ${{ secrets.AUTOPRICE_NTFY }}
          AUTOPRICE_NTFY_TOKEN: ${{ secrets.AUTOPRICE_NTFY_TOKEN }}
          # 9Pocket's customer email (src/stage-email.js): RESEND_API_KEY from a
          # resend.com account whose verified domain carries EMAIL_FROM
          # (default "9Pocket by Exor <9pocket@exorgames.com>"). The same key
          # emails the auto-pricing digest (src/autoprice.js); AUTOPRICE_EMAIL_TO
          # is who gets that one (comma-separated; default: the store's admin).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AUTOPRICE_EMAIL_TO: ${{ secrets.AUTOPRICE_EMAIL_TO }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Actions cannot look secrets up by name at run time, so every name the
          # worker understands (src/discord.js, src/enrich.js, src/autoprice.js) is listed
          # above; each one that is set becomes the worker secret of the same name, the rest are skipped.
          n=0
          for name in BGG_TOKEN DISCORD_WEBHOOK_URL DISCORD_WEBHOOK_MTG DISCORD_WEBHOOK_POKEMON DISCORD_WEBHOOK_YUGIOH DISCORD_WEBHOOK_LORCANA DISCORD_WEBHOOK_ONEPIECE DISCORD_WEBHOOK_FAB DISCORD_WEBHOOK_SWU DISCORD_WEBHOOK_RIFTBOUND DISCORD_WEBHOOK_SPORTS DISCORD_WEBHOOK_SEALED DISCORD_MIN_PRICE AUTOPRICE_NTFY AUTOPRICE_NTFY_TOKEN RESEND_API_KEY EMAIL_FROM AUTOPRICE_EMAIL_TO; do
            val="${!name}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler@4 secret put "$name" && n=$((n+1))
            fi
          done
          if [ "$n" = 0 ]; then
            echo "No optional repo secrets set - skipping (DISCORD_WEBHOOK_URL posts new arrivals to Discord; AUTOPRICE_NTFY sends the auto-pricing digest)"
          else
            echo "Synced $n optional secret(s) to the worker"
          fi
      - name: Smoke-test the auto-pricing digest's delivery (log-only)
        env:
          # Same bearer the ntfy relay uses; the digest record says how the
          # last run's digest went out (email, ntfy, or still pending). Only
          # the delivery fields are printed - never the digest body, which
          # lists products and prices.
          RELAY_TOKEN: ${{ secrets.AUTOPRICE_NTFY_TOKEN }}
        run: |
          if [ -z "$RELAY_TOKEN" ]; then echo "No AUTOPRICE_NTFY_TOKEN - skipping (the digest record needs that bearer)"; exit 0; fi
          curl -sS --max-time 20 -H "authorization: Bearer $RELAY_TOKEN" \
            "https://exor-binder.nevski.workers.dev/autoprice/digest.json" \
          | node -e '
            let t = ""; process.stdin.on("data", (d) => (t += d)).on("end", () => {
              let j = null; try { j = JSON.parse(t); } catch { return console.log("digest.json: no JSON (" + t.slice(0, 120) + ")"); }
              const d = j && j.digest;
              if (!d) return console.log("digest.json: no digest stored yet (" + JSON.stringify(j).slice(0, 160) + ")");
              const e = d.email;
              console.log("last digest: kind=" + (d.kind || "?") + " sent=" + !!d.sent + " by=" + (d.sentBy || "-") + " ntfyError=" + (d.lastError || "none"));
              console.log("email channel now: " + (j.emailTo ? "on, " + j.emailTo + " recipient(s)" : "off (no RESEND_API_KEY, or no usable AUTOPRICE_EMAIL_TO)"));
              console.log("that digest by email: " + (e ? e.status + " to " + (e.to || []).length + " address(es)" + (e.error ? " - " + e.error : "") : "not attempted (digest stored before the email channel, or the channel was off)"));
            });
          ' || true
      - name: Smoke-test learn-to-play outbound links (log-only)
        run: |
          # The learn hub's "official rules" links (templates/page.learn.json on the
          # theme mirror). A non-200 here means the template default needs a new URL.
          for u in \
            https://www.pokemon.com/us/pokemon-tcg/rules \
            https://magic.wizards.com/en/how-to-play \
            https://www.disneylorcana.com/en-US/how-to-play \
            https://en.onepiece-cardgame.com/rules/ \
            https://www.yugioh-card.com/en/howto/ \
            https://starwarsunlimited.com/how-to-play \
            https://riftbound.leagueoflegends.com/en-us/how-to-play/ \
            https://fabtcg.com/en/how-to-play/ \
            https://fabtcg.com/learn-to-play/ \
            https://www.disneylorcana.com/en-US/how-to-play/ \
            https://www.pokemon.com/us/pokemon-tcg/how-to-play; do
            printf '%s -> ' "$u"
            curl -sS -o /dev/null -L --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127.0 Safari/537.36' -w '%{http_code} %{url_effective}\n' "$u" || echo 'error'
          done

      - name: Smoke-test /discord shelf drops (log-only)
        run: |
          set +e
          W=https://exor-binder.nevski.workers.dev
          curl -sS -o /dev/null -w '/discord/preview.json no key: HTTP %{http_code} (expect 403)\n' --max-time 20 "$W/discord/preview.json" || true
          echo "buylist condition guide served (js/css): $(curl -sS --max-time 20 "$W/buylist.js" | grep -c 'bl__condbtn' || true) / $(curl -sS --max-time 20 "$W/buylist.css" | grep -c 'bl__guide' || true)"
          node <<'EOF'
          const fs = require('fs');
          const m = fs.readFileSync('src/config.js', 'utf8').match(/DEFAULT_PIN\s*=\s*["']?([\w-]+)/);
          const K = m ? m[1] : '';
          const W = 'https://exor-binder.nevski.workers.dev';
          (async () => {
            if (!K) { console.log('no DEFAULT_PIN found; discord preview skipped'); return; }
            const r = await fetch(W + '/discord/preview.json?k=' + encodeURIComponent(K));
            const b = await r.json().catch(() => null);
            if (!b) { console.log('discord preview: HTTP ' + r.status + ', no JSON'); return; }
            console.log('discord preview:', r.status, '| configured', b.configured, '| channels', JSON.stringify(b.channels), '| min $' + b.minPrice, '| now', JSON.stringify(b.now), '| state', JSON.stringify(b.state), '| today arrivals', b.todayArrivals, '| pending', b.pending ? b.pending.length : '-', '| skipped now', b.skippedNow ? b.skippedNow.length : '-', '| deferred', b.deferred ? b.deferred.length : '-', b.deferredError ? '| deferred error: ' + b.deferredError : '', b.error ? '| error ' + b.error : '');
            if (b.pending && b.pending[0]) console.log('first pending:', JSON.stringify(b.pending[0]).slice(0, 300));
          })().catch(e => console.log('discord smoke error:', e.message));
          EOF
