name: Deploy exor-binder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/shopify-site-improvements-ztgdt8
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build version (drives the TV's auto-update)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" public/tv.html
          printf '{"v":"%s"}' "${GITHUB_SHA::7}" > public/version.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Optional: if the repo has a SHOPIFY_ADMIN_TOKEN Actions secret, sync it
      # to the worker as an encrypted secret on every deploy. The value never
      # appears in the repo or logs — GitHub masks it end to end. Owner setup:
      # repo Settings → Secrets and variables → Actions → New repository secret.
      - name: Sync SHOPIFY_ADMIN_TOKEN worker secret (when configured)
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$SHOPIFY_ADMIN_TOKEN" ]; then
            printf '%s' "$SHOPIFY_ADMIN_TOKEN" | npx wrangler@4 secret put SHOPIFY_ADMIN_TOKEN
          else
            echo "No SHOPIFY_ADMIN_TOKEN repo secret set - skipping (add one to enable full search, stock caps and numbered draft orders)"
          fi
