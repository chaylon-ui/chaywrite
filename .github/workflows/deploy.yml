name: Deploy exor-binder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/shopify-site-improvements-ztgdt8
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build version (drives the TV's auto-update)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" public/tv.html
          printf '{"v":"%s"}' "${GITHUB_SHA::7}" > public/version.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
