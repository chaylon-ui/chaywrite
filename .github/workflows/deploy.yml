name: Deploy exor-binder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/shopify-site-improvements-ztgdt8
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build version (drives the TV's auto-update)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" public/tv.html
          printf '{"v":"%s"}' "${GITHUB_SHA::7}" > public/version.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Optional: if the repo has a SHOPIFY_ADMIN_TOKEN Actions secret, sync it
      # to the worker as an encrypted secret on every deploy. The value never
      # appears in the repo or logs — GitHub masks it end to end. Owner setup:
      # repo Settings → Secrets and variables → Actions → New repository secret.
      - name: Sync SHOPIFY_ADMIN_TOKEN worker secret (when configured)
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$SHOPIFY_ADMIN_TOKEN" ]; then
            printf '%s' "$SHOPIFY_ADMIN_TOKEN" | npx wrangler@4 secret put SHOPIFY_ADMIN_TOKEN
          else
            echo "No SHOPIFY_ADMIN_TOKEN repo secret set - skipping (add one to enable full search, stock caps and numbered draft orders)"
          fi

      # Same pattern for the BinderPOS store API key: powers the card-page
      # "what we pay" buylist reveal (/buyprice.json). Paste the key as a repo
      # Actions secret named BINDERPOS_API_KEY; it syncs on the next deploy and
      # never appears in the repo or logs.
      - name: Sync BINDERPOS_API_KEY worker secret (when configured)
        env:
          BINDERPOS_API_KEY: ${{ secrets.BINDERPOS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$BINDERPOS_API_KEY" ]; then
            printf '%s' "$BINDERPOS_API_KEY" | npx wrangler@4 secret put BINDERPOS_API_KEY
          else
            echo "No BINDERPOS_API_KEY repo secret set - skipping (add one to enable the what-we-pay buylist reveal)"
          fi

      # Log-only probe of the freshly deployed similar-cards endpoints. The
      # sandbox this worker is developed from has no outbound internet, so
      # this step is where the real upstream shapes and live responses become
      # visible (in the Action log). Failures here never fail the deploy.
      - name: Smoke-test similar endpoints (log-only)
        run: |
          sleep 8   # let the new Worker version propagate before probing
          echo "=== EDHREC raw, first 900 chars ==="
          curl -sS --max-time 20 "https://json.edhrec.com/pages/cards/pyretic-ritual.json" | head -c 900 || true
          printf '\n'
          echo "=== EDHREC top-level keys + similar[] names ==="
          curl -sS --max-time 20 "https://json.edhrec.com/pages/cards/pyretic-ritual.json" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("not json:", e); raise SystemExit
          print("keys:", sorted(d.keys()))
          s = d.get("similar")
          print("similar:", type(s).__name__, len(s) if isinstance(s, list) else "")
          if isinstance(s, list):
              print([c.get("name") for c in s[:12] if isinstance(c, dict)])
          ' || true
          echo "=== /similar.json?name=Pyretic Ritual ==="
          curl -sS --max-time 20 "https://exor-binder.nevski.workers.dev/similar.json?name=Pyretic%20Ritual" || true
          printf '\n'
          echo "=== /instock.json max=8 over hand-picked ritual names ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/instock.json?names=Desperate%20Ritual|Seething%20Song|Rite%20of%20Flame|Mana%20Geyser|Battle%20Hymn|Inner%20Fire|Irencrag%20Feat|Pyretic%20Ritual&max=8" | head -c 1500 || true
          printf '\n'
          echo "=== /deck.json without proof-of-work (expect 403 verification required) ==="
          curl -sS -o /dev/null -w 'no-pow deck.json: HTTP %{http_code}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deck.json?game=mtg&names=Sol%20Ring" || true
          echo "=== /deck.json probes (gate-solved: staples, pokemon, YGO title fix, sister fallback) ==="
          node <<'EOF'
          const crypto = require('crypto');
          const W = 'https://exor-binder.nevski.workers.dev';
          function lead(b, bits) { const f = bits >> 3, r = bits & 7; for (let i = 0; i < f; i++) if (b[i] !== 0) return false; return r === 0 || (b[f] >> (8 - r)) === 0; }
          async function deck(game, names) {
            const g = await (await fetch(W + '/deck-gate')).json();
            const prefix = g.seed + ':' + names.toLowerCase() + ':';
            let n = 0;
            for (;;) { const h = crypto.createHash('sha256').update(prefix + n).digest(); if (lead(h, g.bits)) break; n++; }
            const r = await fetch(W + '/deck.json?game=' + game + '&names=' + encodeURIComponent(names) + '&pb=' + g.bucket + '&pn=' + n + '&notrack=1');
            console.log('--- ' + game + ' :: ' + names.slice(0, 70) + ' -> HTTP ' + r.status + ' (nonce ' + n + ')');
            console.log((await r.text()).slice(0, 2400));
          }
          (async () => {
            await deck('mtg', 'Sol Ring|Counterspell|Lightning Bolt|Command Tower|Arcane Signet|Cultivate');
            await deck('pokemon', 'Charizard|Snorlax|Gengar');
            await deck('yugioh', 'Stardust Dragon|Ash Blossom & Joyous Spring|Blue-Eyes White Dragon');
            await deck('onepiece', 'OP16-015|ST03-011|OP16-003');
            await deck('mtg', 'Humility|Timetwister');
            await deck('mtg', 'Solitude');   // offers[] must carry per-condition qty (owner owns 2)
          })().catch(e => console.log('deck probe error:', e.message));
          EOF
          echo "=== deck-builder assets (theme shell loads these; expect 200 + js/css content-type) ==="
          curl -sS -o /dev/null -w 'deck-builder.js : %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deck-builder.js" || true
          echo "owner intro copy served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'Charlottetown location' || true)"
          echo "list layout served (js hrow + Qty header, css id-anchored): $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck__hrow' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.css' | grep -c '#xg-deck .xg-deck__row' || true)"
          curl -sS -o /dev/null -w 'title logo asset (store CDN): %{http_code} %{content_type}\n' --max-time 20 "https://cdn.shopify.com/s/files/1/0467/3083/8169/files/WE_BUY_CARDS_951e0f40-efac-4b8a-97b3-8ee6330881bd.png?v=1706987808" || true
          echo "next-cheapest toggle served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck-nextcheap' || true)"
          echo "ticks + version picker served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck-checkall' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck__ver' || true)"
          echo "thumb zoom served (js/css): $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'xg-deck-zoom' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.css' | grep -c 'xg-deck-zoom' || true)"
          echo "=== Deck Builder admin (PIN-gated; smoke has no PIN so reads must 403, page serves its login) ==="
          curl -sS -o /dev/null -w '/deckstats admin page: %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deckstats" || true
          echo "admin page login served: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deckstats' | grep -c 'Deck Builder Admin' || true)"
          curl -sS -o /dev/null -w '/deckstats.json no key : HTTP %{http_code} (expect 403)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deckstats.json" || true
          curl -sS -o /dev/null -w '/deckstats.json bad key: HTTP %{http_code} (expect 403)\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deckstats.json?k=smoke-wrong" || true
          curl -sS -o /dev/null -w '/deck-admin no key POST: HTTP %{http_code} (expect 403)\n' --max-time 20 -X POST "https://exor-binder.nevski.workers.dev/deck-admin?op=ban&ip=203.0.113.9" || true
          curl -sS -o /dev/null -w 'deck-track route (public surface ignores ev=search): HTTP %{http_code}\n' --max-time 20 -X POST "https://exor-binder.nevski.workers.dev/deck-track?ev=search&game=probe" || true
          echo "cart tag + beacon + sid served in deck-builder.js: $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'cart/update.js' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'function beacon' || true) / $(curl -sS --max-time 20 'https://exor-binder.nevski.workers.dev/deck-builder.js' | grep -c 'var SID' || true)"
          curl -sS -o /dev/null -w 'new-today.js : %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/new-today.js" || true
          echo "cards.json nt=1 CORS + count: $(curl -sS --max-time 120 'https://exor-binder.nevski.workers.dev/cards.json?collection=new-arrivals&nt=1' -D /tmp/nt-h -o /tmp/nt-b && grep -ci 'access-control-allow-origin' /tmp/nt-h || true) / $(python3 -c 'import json;print(json.load(open("/tmp/nt-b")).get("count"))' 2>/dev/null || echo parse-fail)"
          curl -sS -o /dev/null -w 'deck-builder.css: %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/deck-builder.css" || true
          echo "=== /buyprice.json (BinderPOS only; available:false until BINDERPOS_API_KEY — storefront then uses daily buy-rules estimates) ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/buyprice.json?name=Sol%20Ring&type=MTG%20Single" | head -c 600 || true
          printf '\n'
          echo "=== /reviews.json (Google reviews; ok:false + empty until GOOGLE_PLACES_KEY is set in the dashboard) ==="
          curl -sS -D /tmp/rev-h --max-time 30 "https://exor-binder.nevski.workers.dev/reviews.json" | head -c 400 || true
          printf '\n'
          echo "reviews CORS header: $(grep -ci 'access-control-allow-origin' /tmp/rev-h || true)"
          echo "reviews cache-control: $(grep -i '^cache-control' /tmp/rev-h | tr -d '\r' || true)"
          echo "=== /stores.json (Google Places opening hours per store; ok:false + empty until GOOGLE_PLACES_KEY is set) ==="
          curl -sS -D /tmp/stores-h --max-time 30 "https://exor-binder.nevski.workers.dev/stores.json" | head -c 600 || true
          printf '\n'
          echo "stores CORS header: $(grep -ci 'access-control-allow-origin' /tmp/stores-h || true)"
          echo "stores cache-control: $(grep -i '^cache-control' /tmp/stores-h | tr -d '\r' || true)"
          echo "=== stores resolved: name | city | source | address per store (exor = the Exor Games listing; hours-partner = the Most Wanted Pawn shop the Exor counter sits in, same hours) ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/stores.json" | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print("not json:", e); raise SystemExit
          print("ok", d.get("ok"), "count", d.get("count"))
          tally = {}
          for s in d.get("stores", []):
              h = s.get("hours") or {}
              tally[s.get("source")] = tally.get(s.get("source"), 0) + 1
              print(" -", s.get("name"), "|", s.get("city"), s.get("province"), "|", s.get("source"), "|", s.get("address"), "|", s.get("id"), "|", s.get("phone"), "| utc", s.get("utcOffsetMin"), "| periods", len(h.get("periods", [])), "| text", len(h.get("weekdayText", [])))
          print("by source:", tally)
          cities = ["Charlottetown", "Summerside", "Bridgewater", "Dartmouth", "New Glasgow", "Truro"]
          have = [str(s.get("city") or "") for s in d.get("stores", [])]
          print("cities without a record:", [c for c in cities if c not in have] or "none")
          ' || true
          # No ?debug=1 probes here on purpose: each one bills Google for every
          # Text Search and details call it reports, on every deploy. Open them
          # by hand when the feeds need diagnosing.
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/buyprice.json?name=Mimikyu&type=Pokemon%20Single" | head -c 600 || true
          printf '\n'
          curl -sS -o /dev/null -w 'buyprice-reveal.js: %{http_code} %{content_type}\n' --max-time 20 "https://exor-binder.nevski.workers.dev/buyprice-reveal.js" || true
          echo "=== /buy-rules.json (estimate rules; enabled flag gates the storefront) ==="
          curl -sS --max-time 20 "https://exor-binder.nevski.workers.dev/buy-rules.json" | jq -c '{enabled, updated, games: (.games|length)}' || true
          echo "=== /sisterstock.json (partial-line follow-up; sister qty is opportunistic - null when their product JSON hides counts) ==="
          curl -sS --max-time 40 "https://exor-binder.nevski.workers.dev/sisterstock.json?game=mtg&names=Solitude%7CHumility" | head -c 900 || true
          printf '\n'
          echo "=== /sisters.json?q=humility (expect cheapest IN-STOCK prices; New Glasgow Humility = 79.10 not 40.50; 5-min edge cache may lag one run) ==="
          curl -sS --max-time 30 "https://exor-binder.nevski.workers.dev/sisters.json?q=humility" | head -c 1500 || true
          printf '\n'

      # Log-only probe of the cached BinderPOS search proxy. The first POST
      # is a miss (BinderPOS cold: up to ~30s) unless the 5-min cron already
      # warmed the body ("warm"); the second must come back "hit" instantly.
      - name: Smoke-test /binder/search (log-only)
        run: |
          W=https://exor-binder.nevski.workers.dev
          B='{"storeUrl":"most-wanted-ca.myshopify.com","game":"pokemon","strict":null,"sortTypes":[{"type":"price","asc":false,"order":1}],"variants":null,"title":"","priceGreaterThan":0,"priceLessThan":null,"instockOnly":true,"limit":18,"offset":0,"setNames":[],"rarities":[],"types":[]}'
          echo "=== supportedGames raw (the cron's game-list source), first 900 chars ==="
          curl -sS --max-time 20 -H 'Accept: application/json' "https://api.binderpos.com/external/shopify/supportedGames?storeUrl=most-wanted-ca.myshopify.com" | head -c 900 || true
          printf '\n'
          echo "=== POST /binder/search pokemon default body, twice (expect miss or warm, then hit) ==="
          for i in 1 2; do
            curl -sS --max-time 70 -D /tmp/bs-h -o /tmp/bs-b -w "binder/search #$i: HTTP %{http_code} time_total %{time_total}s size %{size_download}B\n" -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST --data "$B" "$W/binder/search" || true
            echo "  x-xg-cache: $(grep -i '^x-xg-cache' /tmp/bs-h | tr -d '\r' | cut -d' ' -f2-) | x-xg-age: $(grep -i '^x-xg-age' /tmp/bs-h | tr -d '\r' | cut -d' ' -f2-) | content-type: $(grep -i '^content-type' /tmp/bs-h | tr -d '\r' | cut -d' ' -f2-) | cors: $(grep -ci '^access-control-allow-origin' /tmp/bs-h || true) | count: $(python3 -c 'import json;d=json.load(open("/tmp/bs-b"));print(d.get("count"), "products", len(d.get("products") or []))' 2>/dev/null || echo parse-fail)"
          done
          echo "=== GET /binder/search (expect 405), OPTIONS preflight (expect 204 + CORS), wrong storeUrl (expect 400) ==="
          curl -sS -o /dev/null -w 'GET /binder/search: HTTP %{http_code}\n' --max-time 20 "$W/binder/search" || true
          curl -sS -o /dev/null -D /tmp/bs-o -w 'OPTIONS /binder/search: HTTP %{http_code}\n' --max-time 20 -X OPTIONS -H 'Origin: https://exorgames.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$W/binder/search" || true
          grep -i '^access-control' /tmp/bs-o | tr -d '\r' | sed 's/^/  /' || true
          curl -sS -w '\nwrong storeUrl: HTTP %{http_code}\n' --max-time 20 -H 'Content-Type: application/json' -X POST --data '{"storeUrl":"other.myshopify.com","game":"pokemon","limit":18}' "$W/binder/search" || true
          echo "=== /binder/search/status (last cron run per game + landing-entry ages; cron:null means the 5-min pre-warm has never completed) ==="
          curl -sS --max-time 20 "$W/binder/search/status" | head -c 2500 || true
          printf '\n'

      # Log-only probe of GET /ics (round 27 add-to-calendar). A July sample
      # is ADT (-03:00): 18:30 local must come back DTSTART:20260710T213000Z
      # with the 3-hour default end DTEND:20260711T003000Z as a text/calendar
      # attachment; format=google must 302 to calendar.google.com carrying
      # the same UTC dates; a bad date, a missing title and a 301-char title
      # must each 400.
      - name: Smoke-test /ics add-to-calendar (log-only)
        run: |
          W=https://exor-binder.nevski.workers.dev
          Q='t=Friday%20Night%20Magic%20%C2%B7%20Magic&s=2026-07-10T18%3A30&loc=Exor%20Games%20Charlottetown&d=Magic%3A%20The%20Gathering%20%C2%B7%20Ticket%20%2410&u=https%3A%2F%2Fexorgames.com%2Fpages%2Fevents'
          echo "=== GET /ics sample (expect 200 text/calendar attachment; DTSTART:20260710T213000Z DTEND:20260711T003000Z) ==="
          curl -sS -D /tmp/ics-h -o /tmp/ics-b --max-time 20 "$W/ics?$Q" || true
          grep -i '^HTTP/\|^content-type\|^content-disposition\|^cache-control' /tmp/ics-h | tr -d '\r' | sed 's/^/  /' || true
          head -n 12 /tmp/ics-b | tr -d '\r' || true
          echo "=== /ics format=google (expect 302 -> calendar.google.com/calendar/render?action=TEMPLATE ... dates=20260710T213000Z/20260711T003000Z) ==="
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 20 "$W/ics?$Q&format=google" || true
          echo "=== /ics guards (expect 400 400 400) ==="
          curl -sS -o /dev/null -w 'bad date      : HTTP %{http_code}\n' --max-time 20 "$W/ics?t=x&s=2026-13-45T99%3A99" || true
          curl -sS -o /dev/null -w 'no title      : HTTP %{http_code}\n' --max-time 20 "$W/ics?s=2026-07-10T18%3A30" || true
          curl -sS -o /dev/null -w '301-char title: HTTP %{http_code}\n' --max-time 20 "$W/ics?t=$(printf 'a%.0s' $(seq 1 301))&s=2026-07-10T18%3A30" || true

      # Log-only probe of the price-history feed (src/price-history.js). Kicks
      # today's snapshot run (idempotent per UTC day: a second kick answers
      # "already ran today"), polls the status page every 10s for up to 150s
      # while the DO alarm pages through the singles catalogue, then reads the
      # series of one real single found through /search.json (by handle and
      # by numeric id) plus the first product the run touched. A full run
      # takes longer than this window (~60k products under Shopify's query
      # cost limits), so the first deploy of a day shows a run in progress
      # and a later one shows it finished. Never fails the deploy.
      - name: Smoke-test /price-history (log-only)
        run: |
          set +e
          W=https://exor-binder.nevski.workers.dev
          echo "=== POST /price-history/run (kick today's snapshot; a no-op when it already ran) ==="
          curl -sS --max-time 20 -X POST "$W/price-history/run" | head -c 900 || true
          printf '\n'
          echo "=== GET /price-history/status every 10s, up to 150s ==="
          for i in $(seq 1 15); do
            sleep 10
            S=$(curl -sS --max-time 20 "$W/price-history/status")
            echo "status #$i: $(printf '%s' "$S" | head -c 2200)"
            if printf '%s' "$S" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          raise SystemExit(0 if d.get("ok") and not d.get("run") else 1)
          ' 2>/dev/null; then echo "no run in progress (today is complete, or the last run is the answer above)"; break; fi
          done
          echo "=== a real single through /search.json?q=charizard (handle from the first card's url) ==="
          H=$(curl -sS --max-time 40 "$W/search.json?q=charizard" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          c = (d.get("cards") or [{}])[0]
          print((c.get("url") or "").rstrip("/").rsplit("/", 1)[-1])
          ' 2>/dev/null)
          echo "handle: $H"
          echo "=== GET /price-history.json?handle=$H ==="
          curl -sS -D /tmp/ph-h --max-time 30 "$W/price-history.json?handle=$H" | head -c 1600 || true
          printf '\n'
          echo "price-history CORS: $(grep -ci '^access-control-allow-origin' /tmp/ph-h || true) | cache-control: $(grep -i '^cache-control' /tmp/ph-h | tr -d '\r' || true) | x-xg-cache: $(grep -i '^x-xg-cache' /tmp/ph-h | tr -d '\r' | cut -d' ' -f2- || true)"
          PID=$(curl -sS --max-time 20 -H 'Accept: application/json' "https://most-wanted-ca.myshopify.com/products/$H.js" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null)
          echo "=== GET /price-history.json?id=$PID (the same product by numeric id) ==="
          curl -sS --max-time 30 "$W/price-history.json?id=$PID" | head -c 1600 || true
          printf '\n'
          FID=$(curl -sS --max-time 20 "$W/price-history/status" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          r = d.get("run") or d.get("last") or {}
          print(r.get("firstId") or "")
          ' 2>/dev/null)
          echo "=== GET /price-history.json?id=$FID (the first product this run touched: carries today's point even mid-run) ==="
          curl -sS --max-time 30 "$W/price-history.json?id=$FID" | head -c 1600 || true
          printf '\n'
          echo "=== unknown id -> ok:true with empty points, HTTP 200; a second POST -> no-op that says so ==="
          curl -sS -w ' [HTTP %{http_code}]' --max-time 20 "$W/price-history.json?id=1" || true
          printf '\n'
          curl -sS --max-time 20 -X POST "$W/price-history/run" | head -c 700 || true
          printf '\n'
