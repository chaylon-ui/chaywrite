name: buylist-e2e
on:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright-core (drives the runner's own Chrome)
        run: npm install --no-save --no-audit --no-fund playwright-core@1.47.2
      - name: Worker routes, the test page in a browser, the sell page on the preview theme (never submits)
        run: node tools/buylist-e2e.mjs
