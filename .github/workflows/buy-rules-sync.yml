name: Buy-rules daily sync

# Reads the store's buylist percentages out of BinderPOS EVERY DAY and
# rewrites public/buy-rules.json — nothing hardcoded. Mechanism: BinderPOS
# applies ("syncs") the portal's Buylist Rules onto card variants as
# cashBuyPercent / creditBuyPercent stamps in its public product feed; this
# job samples those stamps per game each morning and derives percentages on
# the portal's own rule band edges ($8.01 / $15.01 / $20.01 / $50.01 /
# $100.01 / $250.01, per the owner's rules list). The stamps step by the
# variant's CONDITION (observed live: NM/LP 50/70 on cheap modern cards;
# MP 45/55, HP 35/45, DM 25/35 on the same vintage product), so the
# derivation is per-condition first with all-condition medians as
# fallback — and rates are never extrapolated past the evidence: not to
# price bands a condition has no samples in, and not above the highest
# stamped sell observed (maxSell — the storefront hides estimates there).
#
# The feed rate-limits: ~50 rapid requests in, it starts returning empty
# bodies in ~65ms. Hence a short, highest-yield-first probe list with 0.7s
# spacing, and a carry-forward guardrail: a game whose sample comes back
# thin while yesterday's entry was itself feed-derived keeps yesterday's
# rules (with an alert) instead of dropping off the storefront for a day.
#
# Guardrails applied, result committed to the worker branch, worker
# deployed right here (GITHUB_TOKEN pushes cannot trigger deploy.yml).
# Games that have never synced any stamps are OMITTED so the storefront
# reveal never guesses one game from another's numbers. Exclusion stamps
# (cash 0% / credit ≤1% = "not buying this variant") are filtered out.

on:
  schedule:
    - cron: "23 9 * * *"   # daily 09:23 UTC ≈ 6:23am Atlantic
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = derive + log only, no commit/deploy"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      STORE: most-wanted-ca.myshopify.com
      B: https://portal.binderpos.com/external/shopify
      BRANCH: claude/shopify-site-improvements-ztgdt8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-site-improvements-ztgdt8

      - name: Sample BinderPOS percent stamps per game (titled probes — fast path)
        timeout-minutes: 12
        run: |
          : > /tmp/samples.ndjson
          pull() { # $1 game, $2 title probe
            BODY=$(jq -nc --arg s "$STORE" --arg g "$1" --arg t "$2" \
              '{storeUrl:$s, game:$g, title:$t, limit:100, offset:0, instockOnly:false}')
            t0=$(date +%s%N)
            curl -sS --max-time 20 -H 'content-type: application/json' -A 'Mozilla/5.0' \
              -H 'origin: https://exorgames.com' -X POST "$B/products/forStore" --data "$BODY" -o /tmp/pull.json 2>/dev/null || true
            jq -c --arg g "$1" '.products[]? as $p | $p.variants[]?
                | select((.cashBuyPercent!=null and .cashBuyPercent>0) or (.creditBuyPercent!=null and .creditBuyPercent>0))
                | {g:$g, pid:$p.id, sell:(.price//0), cashPct:(.cashBuyPercent//0), creditPct:(.creditBuyPercent//0), cond:(.title//"")}' /tmp/pull.json >> /tmp/samples.ndjson 2>/dev/null || true
            genuine=$(jq -c '.products[]?.variants[]? | select((.cashBuyPercent//0) >= 5 or (.creditBuyPercent//0) >= 5) | 1' /tmp/pull.json 2>/dev/null | wc -l)
            echo "  [$1] '$2' -> $genuine genuine rule stamps ($(( ($(date +%s%N)-t0)/1000000 ))ms)"
            sleep 0.7
          }
          # Highest-information probes FIRST — if the feed rate-limits
          # mid-run, the rows that anchor the derivation are already in.
          # arven/iono carry the flat 50/70 cheap-card stamps; the Fossil
          # birds carry the vintage condition ladder.
          for t in "arven" "iono" "moltres" "zapdos" "articuno" "charizard" "mewtwo" "gengar" "pikachu" "dragonite" "snorlax" "switch" "professor" "promo" "mimikyu" "ex" "vmax"; do pull pokemon "$t"; done
          # MTG/YGO sentinels: the portal HAS rules for these games ($20+ /
          # $100+ bands) but BinderPOS has not synced them into the feed yet.
          # The day the owner's re-sync lands, these light up.
          for t in "ring" "tutor" "cradle" "mox" "lotus" "dual" "bolt" "elf"; do pull mtg "$t"; done
          for t in "dragon" "magician" "ash" "maxx" "accesscode" "baronne"; do pull yugioh "$t"; done
          for t in "vader" "trooper" "jedi"; do pull starwars "$t"; done
          for t in "luffy" "zoro" "nami"; do pull onepiece "$t"; done
          for t in "jinx" "vi" "rift"; do pull riftbound "$t"; done
          echo "sampled rows (any stamp): $(wc -l < /tmp/samples.ndjson)"
          echo "per game:"; jq -r .g /tmp/samples.ndjson | sort | uniq -c || true

      - name: Derive per-game, per-condition tiered percentages + guardrails
        run: |
          python3 - <<'PY'
          import json, re, statistics, collections, datetime
          rows = []
          with open('/tmp/samples.ndjson') as f:
              for line in f:
                  line = line.strip()
                  if line:
                      try: rows.append(json.loads(line))
                      except Exception: pass
          def cond_of(t):
              t = (t or "").lower()
              if "near mint" in t or re.search(r'\bnm\b', t): return "NM"
              if "light" in t: return "LP"
              if "moderate" in t: return "MP"
              if "heav" in t: return "HP"
              if "damag" in t or re.search(r'\bdmg\b', t): return "DM"
              return ""
          for r in rows:
              r['c'] = cond_of(r.get('cond'))
          seen, uniq = set(), []
          for r in rows:
              k = (r['g'], r.get('pid'), r['sell'], r['cashPct'], r['creditPct'], r['c'])
              if k not in seen:
                  seen.add(k); uniq.append(r)
          rows = uniq
          # Exclusion stamps (cash 0 / credit <=1) mean "not buying this
          # variant" — they are not rule percentages. Only genuine rule
          # stamps (>=5% on either side) feed the derivation.
          rows = [r for r in rows if (r['cashPct'] or 0) >= 5 or (r['creditPct'] or 0) >= 5]
          MATCH = {"mtg":"mtg","pokemon":"pokemon","yugioh":"yugioh",
                   "starwars":"star wars","onepiece":"one piece","riftbound":"riftbound"}
          # Band edges are the portal's own Buylist Rules boundaries — rules
          # like "$8.01 - $15.00" have inclusive tops, so edges sit at .01 and
          # each emitted tier's upTo is the inclusive top (8.00, 15.00, ...).
          BANDS = [8.01, 15.01, 20.01, 50.01, 100.01, 250.01, None]
          def clamp(x): return max(0.0, min(0.90, x))
          def derive(rs, need):
              tiers, lo = [], 0
              for hi in BANDS:
                  band = [r for r in rs if r['sell'] >= lo and (hi is None or r['sell'] < hi)]
                  if len(band) >= need:
                      cash = clamp(statistics.median(r['cashPct'] for r in band) / 100.0)
                      credit = clamp(statistics.median(r['creditPct'] for r in band) / 100.0)
                      tiers.append({"upTo": (round(hi - 0.01, 2) if hi is not None else None),
                                    "cash": round(cash, 3), "credit": round(credit, 3)})
                  if hi is not None:
                      lo = hi
              merged = []
              for t in tiers:
                  if merged and merged[-1]["cash"] == t["cash"] and merged[-1]["credit"] == t["credit"]:
                      merged[-1]["upTo"] = t["upTo"]
                  else:
                      merged.append(dict(t))
              return merged
          by_game = collections.defaultdict(list)
          for r in rows:
              if r['sell'] and 0 < r['sell'] < 99999:
                  by_game[r['g']].append(r)
          prev = {}
          try:
              with open('public/buy-rules.json') as f:
                  for g in (json.load(f).get('games') or []):
                      prev[g.get('key')] = g
          except Exception: pass
          alerts, games = [], []
          def carry(g, why):
              # Feed cold or sample thin: a game that once derived real rules
              # keeps them (stale beats flapping off the storefront); a game
              # that never derived anything stays omitted.
              p = prev.get(g)
              if p and p.get('_source') == 'binderpos-feed':
                  alerts.append(f"{g}: {why} - carried previous rules forward")
                  games.append(p)
              else:
                  alerts.append(f"{g}: {why} - skipped")
          for g in sorted(set(by_game) | {k for k, v in prev.items() if v.get('_source') == 'binderpos-feed'}):
              rs = by_game.get(g, [])
              if len(rs) < 12:
                  carry(g, f"only {len(rs)} genuine rule stamps sampled (feed cold or rules unsynced)")
                  continue
              merged = derive(rs, 5)
              if not merged:
                  carry(g, "no band had enough samples")
                  continue
              base = merged[-1]
              finite = [t for t in merged if t["upTo"] is not None]
              # The stamps step by condition (best listed condition highest),
              # so derive each condition's own ladder; the flat medians stay
              # as the fallback for unrecognized variant titles. A condition's
              # own base applies only when its top (open-ended) band had
              # samples — prices above a condition's observed tiers fall back
              # to the all-condition banded medians instead of extrapolating
              # (e.g. NM 50/70 measured on sub-$8 cards must not promise 50%
              # cash on a $200 card).
              conds = {}
              for c in ("NM", "LP", "MP", "HP", "DM"):
                  crs = [r for r in rs if r['c'] == c]
                  m = derive(crs, 4)
                  if m:
                      cbase = m[-1] if m[-1]["upTo"] is None else base
                      conds[c] = {"cash": cbase["cash"], "credit": cbase["credit"],
                                  "tiers": [t for t in m if t["upTo"] is not None],
                                  "_n": len(crs)}
              # Evidence bounds: the LOWEST and HIGHEST sell prices we have
              # positive rule evidence for. The storefront only estimates
              # inside [minSell, maxSell] — above the ceiling an estimate
              # would be pure extrapolation (a $2,600 card priced from
              # sub-$300 samples ran ~25% over the owner's real buylist).
              min_sell = round(min(r['sell'] for r in rs), 2)
              max_sell = round(max(r['sell'] for r in rs), 2)
              if min_sell > 5:
                  alerts.append(f"{g}: lowest stamped sell is {min_sell} - floor may reflect sampling bias, broaden probes")
              if max_sell < 500:
                  alerts.append(f"{g}: highest stamped sell is {max_sell} - estimates capped there until pricier stamps appear")
              entry = {
                  "key": g, "match": MATCH.get(g, g),
                  "cash": base["cash"], "credit": base["credit"],
                  "minSell": min_sell, "maxSell": max_sell, "buyFoils": True,
                  "tiers": finite,
                  "_source": "binderpos-feed", "_samples": len(rs),
              }
              if conds:
                  entry["conds"] = conds
              # Day-over-day guardrail — only against a previously DERIVED
              # value; never resurrect hand-seeded placeholders.
              p = prev.get(g)
              if p and p.get('_source') == 'binderpos-feed' and isinstance(p.get('cash'), (int, float)) and abs(p['cash'] - entry['cash']) > 0.15:
                  alerts.append(f"{g}: derived cash {entry['cash']} vs prev {p['cash']} moved >15pts - kept previous")
                  entry = p
              games.append(entry)
          out = {
              "_what": "AUTO-GENERATED daily by buy-rules-sync.yml - do not hand-edit numbers; they are re-derived from BinderPOS every morning. Genuine per-variant cashBuyPercent/creditBuyPercent rule stamps (>=5%) in the public product feed are sampled per game and reduced to per-condition medians on the portal's own price bands; exclusion stamps are ignored, and estimates apply only between the lowest and highest stamped sells observed.",
              "enabled": bool(games),
              "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "disclaimer": "Estimate only, based on our current buylist rates and today's sell price. Final offer is confirmed when we check your cards - condition and demand can change it. Rates and prices update daily.",
              "defaults": None,
              "games": games,
              "_alerts": alerts,
          }
          with open('public/buy-rules.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')
          print(json.dumps({"enabled": out["enabled"],
                            "games": [{ "key": g['key'], "cash": g.get('cash'), "credit": g.get('credit'),
                                        "minSell": g.get('minSell'), "maxSell": g.get('maxSell'), "samples": g.get('_samples'),
                                        "conds": {c: (v['cash'], v['credit'], v['_n']) for c, v in (g.get('conds') or {}).items()} }
                                      for g in games],
                            "alerts": alerts}, indent=1))
          PY

      - name: Commit when changed
        id: commit
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          if git diff --quiet public/buy-rules.json; then
            echo "buy-rules.json unchanged - nothing to commit"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "buy-rules-sync"
          git config user.email "actions@github.com"
          git add public/buy-rules.json
          git commit -m "buy-rules: daily sync $(date -u +%F)"
          git push origin "$BRANCH"
          echo "changed=1" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes never trigger other workflows, so deploy.yml will
      # NOT fire on the commit above — deploy the worker right here instead,
      # replicating deploy.yml's build stamp so the TV auto-update stays sane.
      - name: Stamp build version
        if: ${{ steps.commit.outputs.changed == '1' }}
        run: |
          sed -i "s/__BUILD__/$(git rev-parse --short HEAD)/" public/tv.html
          printf '{"v":"%s"}' "$(git rev-parse --short HEAD)" > public/version.json

      - name: Deploy worker with fresh rules
        if: ${{ steps.commit.outputs.changed == '1' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify served rules
        if: ${{ steps.commit.outputs.changed == '1' }}
        run: |
          sleep 30   # let the new worker version propagate before probing
          V="$(git rev-parse --short HEAD)"
          echo "== live /buy-rules.json summary (cache-busted with ?v=$V) =="
          curl -sS --max-time 20 "https://exor-binder.nevski.workers.dev/buy-rules.json?v=$V" | jq '{enabled, updated, games: [.games[]? | {key, cash, credit, minSell, maxSell, tiers: (.tiers|length), conds: ((.conds//{})|keys), samples: ._samples}], alerts: ._alerts}' || true
          echo "== plain URL (may lag a few minutes behind on the edge cache) =="
          curl -sS --max-time 20 "https://exor-binder.nevski.workers.dev/buy-rules.json" | jq -c '{updated, samples: [.games[]?._samples]}' || true
