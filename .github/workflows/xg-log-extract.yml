name: Extract JPEG from a job log

# Temporary helper. The dev sandbox has no egress to the Actions log blob
# host, so the base64 screenshot a "shot" job prints can only be moved out of
# a log by a runner. This decodes it and commits the bytes under theme-stage/
# (a path deploy.yml ignores), where raw.githubusercontent.com can serve them.
#
# Driven by .github/xg-extract-request.txt: line 1 = job id, line 2 = out name.

on:
  push:
    branches:
      - claude/shopify-site-improvements-ztgdt8
    paths:
      - ".github/xg-extract-request.txt"

permissions:
  contents: write
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the job log and decode the JPEG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          JOB_ID=$(sed -n '1p' .github/xg-extract-request.txt | tr -d ' \r')
          OUT=$(sed -n '2p' .github/xg-extract-request.txt | tr -d ' \r')
          echo "job $JOB_ID -> theme-stage/$OUT"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o job.log
          echo "log bytes: $(wc -c < job.log)"
          # -a: Actions logs carry ANSI escapes, so grep otherwise calls it binary
          grep -ao 'JPEG-B64 [A-Za-z0-9+/=]*' job.log | head -1 | cut -d' ' -f2- | tr -d ' \r\n' > shot.b64
          echo "base64 chars: $(wc -c < shot.b64)"
          test -s shot.b64
          mkdir -p theme-stage
          base64 -d shot.b64 > "theme-stage/${OUT}"
          ls -l "theme-stage/${OUT}"
          file "theme-stage/${OUT}"
          md5sum "theme-stage/${OUT}"
          sha256sum "theme-stage/${OUT}"

      - name: Commit the decoded file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add theme-stage/
          git commit -m "theme-stage: decoded screenshot from the requested job" || echo "nothing to commit"
          git push
