name: Portal buylists probe

# Read-only look at the BinderPOS PORTAL's pending-buylist pages, for the
# "our own pending buylist screen" idea: log in with the staff login held as
# repo Actions secrets, learn HOW the login works (a plain request the worker
# could repeat, or a browser-only flow), find the Pending Buylists route,
# open it and the first buylist in it, and inventory the JSON the portal app
# loads for them. Nothing is written to BinderPOS.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   BINDERPOS_LOGIN_EMAIL      portal login email
#   BINDERPOS_LOGIN_PASSWORD   portal login password
#
# Log hygiene: auth-ish URLs are listed by method and status only; request
# headers are never printed, and request bodies only for GraphQL (query text
# and variables); storage and cookie NAMES print with value lengths only;
# buylist JSON prints truncated with emails and contact fields masked. The
# schema questions (introspection and one buylist read) reuse the token the
# page itself obtained, held in memory only.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Login + map the pending buylist endpoints (read-only)
        env:
          EMAIL: ${{ secrets.BINDERPOS_LOGIN_EMAIL }}
          PASS: ${{ secrets.BINDERPOS_LOGIN_PASSWORD }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASS" ]; then
            echo "Secrets not set. Add BINDERPOS_LOGIN_EMAIL and BINDERPOS_LOGIN_PASSWORD"
            echo "under repo Settings -> Secrets and variables -> Actions, then re-run."
            exit 0
          fi
          npm i --no-audit --no-fund puppeteer-core@22 >/dev/null 2>&1
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const SENSITIVE = /login|auth|token|session|password|signin|oauth|firebase|identitytoolkit|securetoken/i;
          const mask = (s) => String(s)
            .replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, '<email>')
            .replace(/("[^"]*(phone|mobile|address|postal|zip)[^"]*"\s*:\s*")[^"]*(")/gi, '$1<masked>$3')
            .replace(/AIza[\w-]+/g, 'AIza...');
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          const head = async (page, n) => mask((await page.evaluate((n) => document.body.innerText.slice(0, n), n)).replace(/\s+/g, ' '));
          const abs = (h) => h.startsWith('http') ? h : 'https://portal.binderpos.com/' + h.replace(/^\//, '');
          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            const seen = [];
            const authCalls = [];
            const gql = [];
            let bearer = null;
            let tokenHeader = null;   // the page's own API token, kept in memory for the read-only schema questions below; never printed
            page.on('request', (req) => {
              try {
                const url = req.url();
                if (!/binderpos|firebase|googleapis/i.test(url)) return;
                const h = req.headers();
                const a = h['authorization'] || h['Authorization'];
                if (a && !bearer) bearer = a.split(' ')[0] + ' (' + a.length + ' chars)';
                if (a && /api\.binderpos\.com/i.test(url)) tokenHeader = a;
                if (SENSITIVE.test(url)) authCalls.push({ method: req.method(), url, post: req.postData() ? req.postData().length : 0 });
                // GraphQL request bodies are query text and variables, not credentials (the token rides in a header, never printed)
                else if (/binderpos\.com\/graphql/i.test(url) && req.method() === 'POST') gql.push({ url, body: mask(String(req.postData() || '').slice(0, 1800)) });
              } catch {}
            });
            page.on('response', async (res) => {
              try {
                const url = res.url();
                if (!/binderpos|firebase|googleapis/i.test(url)) return;
                const ct = String(res.headers()['content-type'] || '');
                if (!/json/i.test(ct)) return;
                const entry = { method: res.request().method(), url, status: res.status(), body: null };
                if (!SENSITIVE.test(url)) {
                  const text = await res.text().catch(() => '');
                  entry.body = mask(text.slice(0, /graphql/i.test(url) ? 3200 : 1600));
                  entry.size = text.length;
                }
                seen.push(entry);
              } catch {}
            });

            console.log('-> opening portal');
            await page.goto('https://portal.binderpos.com/', { waitUntil: 'networkidle2', timeout: 60000 });
            console.log('landed on:', page.url(), '| title:', await page.title());
            const challenged = await page.evaluate(() => document.body.innerText.slice(0, 200));
            if (/just a moment|verify you are human|cloudflare/i.test(challenged)) {
              console.log('CLOUDFLARE CHALLENGE on portal login page - headless login blocked at the edge.');
              await browser.close(); return;
            }
            const emailSel = await page.waitForSelector('input[type="email"], input[name*="email" i], input[placeholder*="email" i]', { timeout: 20000 }).catch(() => null);
            const passSel = await page.$('input[type="password"]');
            if (!emailSel || !passSel) {
              console.log('LOGIN FORM NOT FOUND. Page text head:', await head(page, 300));
              await browser.close(); return;
            }
            await emailSel.type(process.env.EMAIL, { delay: 25 });
            await passSel.type(process.env.PASS, { delay: 25 });
            await Promise.all([
              page.keyboard.press('Enter'),
              page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 45000 }).catch(() => null),
            ]);
            await sleep(7000);
            const afterText = await head(page, 300);
            console.log('after login attempt:', page.url());
            console.log('page text head:', afterText);
            if (/verify|verification|code|two.?factor|2fa/i.test(afterText)) {
              console.log('VERIFICATION STEP DETECTED - the portal wants a code. Owner action needed on first login.');
            }

            console.log('');
            console.log('=== login mechanism (auth-ish calls, bodies and headers never printed) ===');
            for (const c of authCalls) console.log(c.method, c.url, '| request body bytes:', c.post);
            const store = await page.evaluate(() => ({
              ls: Object.keys(localStorage).map(k => k + ' (' + String(localStorage.getItem(k) || '').length + ' chars)'),
              ss: Object.keys(sessionStorage).map(k => k + ' (' + String(sessionStorage.getItem(k) || '').length + ' chars)'),
              ck: document.cookie.split(';').map(s => s.trim().split('=')[0]).filter(Boolean)
            }));
            console.log('localStorage keys:', mask(store.ls.join(' | ')) || 'none');
            console.log('sessionStorage keys:', mask(store.ss.join(' | ')) || 'none');
            console.log('cookie names:', store.ck.join(' | ') || 'none');
            console.log('authorization header on API calls:', bearer || 'none seen');

            const links = await page.evaluate(() => Array.from(new Set(Array.from(document.querySelectorAll('a[href]')).map(a => a.getAttribute('href')).filter(h => /buylist/i.test(h)))));
            console.log('');
            console.log('=== links mentioning buylist ===');
            console.log(links.slice(0, 40).join('\n') || 'none');

            const pendingLinks = links.filter(h => /pending/i.test(h));
            const routes = pendingLinks.length ? pendingLinks : ['#/buylists/pending', '#/buylists'];
            for (const route of routes.slice(0, 2)) {
              console.log('');
              console.log('-> visiting', abs(route));
              await page.goto(abs(route), { waitUntil: 'networkidle2', timeout: 60000 }).catch(() => null);
              await sleep(9000);
              console.log('   page text head:', await head(page, 500));
            }

            // the list JSON names the first pending buylist; find it on the page and open it
            const listEntry = seen.find(e => e.body && /ShopifyCustomerBuylist/.test(e.body));
            const m = listEntry && listEntry.body.match(/"id":"(\d+)"[^}]*?"firstName":"([^"]*)","lastName":"([^"]*)"/);
            const firstId = m ? m[1] : null, firstName = m ? (m[2] + ' ' + m[3]).trim() : null;
            console.log('');
            console.log('-> first pending buylist in the list JSON:', firstId, firstName ? '(' + firstName.split(' ')[0] + ')' : '');
            const before = seen.length;
            const hasDetail = () => seen.slice(before).some(e => e.body && /\/graphql/.test(e.url) && /card|quantity/i.test(e.body));
            if (firstName) {
              // the row that shows the name: list its controls (names and classes only), then click one only if it is clearly "view"
              const info = await page.evaluate((name) => {
                const leaf = Array.from(document.querySelectorAll('td, div, span, p, li, tr')).find(el => el.children.length === 0 && el.textContent.trim().indexOf(name) === 0);
                if (!leaf) return { found: false };
                let row = leaf;
                for (let i = 0; i < 6 && row.parentElement && row.querySelectorAll('button, a, [role="button"]').length === 0; i++) row = row.parentElement;
                const cls = (c) => String(c.className && c.className.baseVal !== undefined ? c.className.baseVal : (c.className || '')).slice(0, 80);
                const nameOf = (c) => ((c.textContent || '').trim() + ' ' + (c.getAttribute('aria-label') || '') + ' ' + (c.getAttribute('title') || '') + ' ' + cls(c)).trim();
                const all = Array.from(row.querySelectorAll('button, a, [role="button"]'));
                const controls = all.map(c => ({ tag: c.tagName.toLowerCase(), name: nameOf(c).slice(0, 90), href: c.getAttribute('href') || '' }));
                const safe = /view|open|detail|see|show|eye|inspect/i, unsafe = /approve|complete|delete|remove|pay|submit|cancel|reject|sync|push|save|edit/i;
                const pick = all.find(c => safe.test(nameOf(c)) && !unsafe.test(nameOf(c)));
                if (pick) pick.click();
                return { found: true, row: row.tagName.toLowerCase(), controls, clicked: pick ? nameOf(pick).slice(0, 60) : null };
              }, firstName.split(' ')[0]);
              console.log('   row controls:', mask(JSON.stringify(info)).slice(0, 1500));
              await sleep(7000);
              console.log('   now at', page.url(), '| detail JSON seen:', hasDetail());
            }
            console.log('   page text head:', await head(page, 700));

            console.log('');
            console.log('=== schema questions to api.binderpos.com/graphql (read-only, with the token the page itself uses; never printed) ===');
            const gqlFetch = async (query) => {
              if (!tokenHeader) return { status: 0, text: 'no token captured' };
              const r = await fetch('https://api.binderpos.com/graphql', { method: 'POST', headers: { 'content-type': 'application/json', 'authorization': tokenHeader, 'origin': 'https://portal.binderpos.com', 'referer': 'https://portal.binderpos.com/' }, body: JSON.stringify({ query, variables: {} }) });
              return { status: r.status, text: await r.text() };
            };
            const show = (label, r, n) => console.log(label, r.status, mask(String(r.text).slice(0, n)));
            show('root query and mutation NAMES:', await gqlFetch('{ __schema { queryType { fields { name } } mutationType { fields { name } } } }'), 6000);
            const typeQ = (name) => '{ __type(name: "' + name + '") { name fields { name type { kind name ofType { kind name ofType { kind name ofType { kind name } } } } } } }';
            const named = (t) => { while (t && !t.name) t = t.ofType; return t; };
            const isScalar = (f) => { const t = named(f.type); return t && (t.kind === 'SCALAR' || t.kind === 'ENUM'); };
            const fieldsOf = async (name) => { const r = await gqlFetch(typeQ(name)); show(name + ' fields:', r, 3000); try { return JSON.parse(r.text).data.__type.fields; } catch (e) { return null; } };
            const blFields = await fieldsOf('ShopifyCustomerBuylist');
            let sel = 'id dateSubmitted paymentType approved completed ShopifyCustomer { firstName lastName }';
            if (blFields) {
              const rels = blFields.filter(f => { const t = named(f.type); return t && t.kind === 'OBJECT'; }).slice(0, 5);
              console.log('relations:', rels.map(f => f.name + ' -> ' + named(f.type).name).join(', ') || 'none');
              sel = blFields.filter(isScalar).map(f => f.name).join(' ');
              for (const f of rels) {
                const rf = await fieldsOf(named(f.type).name);
                if (rf) sel += ' ' + f.name + ' { ' + rf.filter(isScalar).map(x => x.name).join(' ') + ' }';
              }
            } else console.log('introspection unavailable; using a guessed selection');
            if (firstId) {
              for (const idv of ['"' + firstId + '"', firstId]) {
                const d = await gqlFetch('{ ShopifyCustomerBuylist(take: 1, where: { id: { equals: ' + idv + ' } }) { ' + sel + ' } }');
                show('buylist ' + firstId + ' with its relations (id sent as ' + (idv[0] === '"' ? 'string' : 'number') + '):', d, 3500);
                if (!/"errors"/.test(d.text)) break;
              }
            }

            console.log('');
            console.log('=== GraphQL requests (query text and variables) ===');
            for (const g of gql) { console.log('---', g.url); console.log(g.body); }

            console.log('');
            console.log('=== JSON endpoints observed (auth-ish bodies withheld; emails and contact fields masked) ===');
            for (const e of seen) {
              console.log('---', e.method, e.status, e.url, e.size != null ? '(' + e.size + ' bytes)' : '(body withheld)');
              if (e.body) console.log(e.body);
            }
            await browser.close();
          })().catch(e => console.log('probe error:', e.message));
          EOF
