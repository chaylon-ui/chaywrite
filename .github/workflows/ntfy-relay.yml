name: ntfy-relay
# The sealed auto-pricer (src/autoprice.js) writes a ntfy digest after
# every run and tries to publish it itself. ntfy.sh rate-limits free
# accounts by source IP even with a token, and the worker's Cloudflare
# egress IP is shared with other tenants, so the direct push is often
# refused (HTTP 429). This workflow fetches the pending digest from the
# worker (bearer = AUTOPRICE_NTFY_TOKEN, the same secret the worker holds),
# publishes it from this runner's IP with the account token, and acks it.
# Nightly at 22:50 UTC, after the 22:30 UTC pricing run; run it by hand to
# push a queued test digest right away. Secrets are never printed.
on:
  schedule:
    - cron: "50 22 * * *"
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTOPRICE_NTFY: ${{ secrets.AUTOPRICE_NTFY }}
      AUTOPRICE_NTFY_TOKEN: ${{ secrets.AUTOPRICE_NTFY_TOKEN }}
      WORKER: https://exor-binder.nevski.workers.dev
    steps:
      - name: relay the pending digest
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.error, urllib.parse
          topic = os.environ.get("AUTOPRICE_NTFY", "").strip()
          token = os.environ.get("AUTOPRICE_NTFY_TOKEN", "").strip()
          worker = os.environ["WORKER"]
          if not topic or not token:
              print("AUTOPRICE_NTFY / AUTOPRICE_NTFY_TOKEN not set - nothing to relay"); raise SystemExit(0)
          if topic.startswith("http"):
              u = urllib.parse.urlparse(topic); server = u.scheme + "://" + u.netloc; name = u.path.rstrip("/").split("/")[-1]
          else:
              server = "https://ntfy.sh"; name = topic.lstrip("/")
          def call(method, url, data=None, bearer=None):
              req = urllib.request.Request(url, data=data, method=method)
              if bearer: req.add_header("Authorization", "Bearer " + bearer)
              if data is not None: req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:400]
          st, body = call("GET", worker + "/autoprice/digest.json", bearer=token)
          print("GET digest ->", st)
          if st != 200:
              print(" body:", body); raise SystemExit(1)
          d = (json.loads(body) or {}).get("digest")
          if not d:
              print("no digest yet"); raise SystemExit(0)
          print(" kind:", d.get("kind"), "| title:", d.get("title"), "| sent:", d.get("sent"), "| by:", d.get("sentBy"), "| lastError:", d.get("lastError"))
          if d.get("sent"):
              print("already sent - nothing to do"); raise SystemExit(0)
          payload = {"topic": name, "title": d.get("title") or "Auto-pricing", "message": d.get("body") or "", "priority": d.get("priority") or 3, "tags": d.get("tags") or [], "click": d.get("click") or worker + "/autoprice"}
          st, body = call("POST", server + "/", json.dumps(payload).encode(), bearer=token)
          print("POST ntfy ->", st, body[:200] if st != 200 else "ok")
          if st != 200: raise SystemExit(1)
          st, body = call("POST", worker + "/autoprice/digest.json", json.dumps({"op": "sent", "by": "relay"}).encode(), bearer=token)
          print("ack ->", st)
          EOF
