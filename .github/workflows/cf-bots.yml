name: CF bot filter

# Drives the Cloudflare API for the exorgames.com zone from a runner with
# real egress (the dev sandbox has none). Modes, all manual-only:
#   probe  — read-only: DNS location, token/zone access, certs, WAF state.
#   apply  — WAF challenge + /search rate limit, SSL Full(strict) + Rocket
#            Loader off, flip the two Shopify records to Proxied, live
#            smoke test with AUTO ROLLBACK of the proxy flip on failure.
#   events — read-only: what the firewall has challenged/blocked since the
#            filter went live (GraphQL analytics), with a Free-plan
#            traffic/threats fallback when the firewall dataset is gated.
# Prefers a dedicated CLOUDFLARE_ZONE_TOKEN repo secret when present;
# falls back to the worker-deploy CLOUDFLARE_API_TOKEN.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, apply, or events"
        required: true
        default: "probe"

permissions: {}

jobs:
  cf:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN != '' && secrets.CLOUDFLARE_ZONE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      MODE: ${{ inputs.mode }}
      ZONE: exorgames.com
    steps:
      - name: DNS reality check (DoH, token-free)
        run: |
          doh() { curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$1&type=$2"; }
          echo "== nameservers =="
          doh "$ZONE" NS | jq -r '.Answer[]?.data // "no NS answer"'
          echo "== apex A =="
          doh "$ZONE" A | jq -r '.Answer[]? | "\(.name) \(.type) \(.data)"'
          echo "== www =="
          doh "www.$ZONE" A | jq -r '.Answer[]? | "\(.name) \(.type) \(.data)"'
          echo "== subdomain sweep — what resolves TODAY (recreate any of these in Cloudflare before switching NS) =="
          for s in esl kiosk tv pos showcase shop store app api mail ftp cpanel autodiscover; do
            cn=$(doh "$s.$ZONE" CNAME | jq -r '.Answer[]? | select(.type==5) | "CNAME -> \(.data)"' | paste -sd" ; " -)
            a=$(doh "$s.$ZONE" A | jq -r '.Answer[]? | select(.type==1) | "A -> \(.data)"' | paste -sd" ; " -)
            if [ -n "$cn$a" ]; then echo "$s.$ZONE  ::  $cn $a"; else echo "$s.$ZONE  ::  (nothing)"; fi
          done

      - name: Token and zone probe
        id: probe
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' "$@"; }
          B=https://api.cloudflare.com/client/v4
          echo "== token verify =="
          api "$B/user/tokens/verify" | jq '{success, status: .result.status, errors}'
          echo "== zones this token can see =="
          api "$B/zones?per_page=50" | jq -r 'if .success then (.result[] | "\(.name) id=\(.id) status=\(.status) ns=\(.name_servers|join(","))") else "LIST FAILED: \(.errors)" end'
          ZID=$(api "$B/zones?name=$ZONE" | jq -r '.result[0].id // empty')
          echo "ZID=${ZID:-none}"
          echo "zid=$ZID" >> "$GITHUB_OUTPUT"
          if [ -z "$ZID" ]; then echo "zone not visible to this token — stopping here"; exit 0; fi
          echo "== zone status + plan =="
          api "$B/zones/$ZID" | jq '{name: .result.name, status: .result.status, plan: .result.plan.name, ns: .result.name_servers, original_ns: .result.original_name_servers}'
          echo "== dns records (A/CNAME only) =="
          api "$B/zones/$ZID/dns_records?per_page=100" | jq -r '.result[]? | select(.type=="A" or .type=="CNAME") | "\(.type) \(.name) -> \(.content) proxied=\(.proxied) id=\(.id)"'
          echo "== ssl mode =="
          api "$B/zones/$ZID/settings/ssl" | jq '{success, value: .result.value, errors}'
          echo "== edge certificate packs =="
          api "$B/zones/$ZID/ssl/certificate_packs?status=all" | jq -r '.result[]? | "\(.type) status=\(.status) hosts=\(.hosts|join(","))"'
          echo "== waf custom-rules entrypoint (read) =="
          api "$B/zones/$ZID/rulesets/phases/http_request_firewall_custom/entrypoint" | jq '{success, errors, rules: ((.result.rules // []) | length)}'
          echo "== dns WRITE permission (no-op patch of apex A) =="
          REC=$(api "$B/zones/$ZID/dns_records?type=A&name=$ZONE")
          RID=$(echo "$REC" | jq -r '.result[0].id // empty')
          PROX=$(echo "$REC" | jq -r '.result[0].proxied')
          if [ -n "$RID" ]; then
            api -X PATCH "$B/zones/$ZID/dns_records/$RID" --data "{\"proxied\": $PROX}" | jq '{success, errors}'
          else
            echo "no apex A record found"
          fi

      - name: Firewall events
        if: ${{ inputs.mode == 'events' }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' "$@"; }
          B=https://api.cloudflare.com/client/v4
          GQL=https://api.cloudflare.com/client/v4/graphql
          ZID="${{ steps.probe.outputs.zid }}"
          if [ -z "$ZID" ]; then echo "no zone"; exit 0; fi

          echo "== zone plan =="
          api "$B/zones/$ZID" | jq -r '.result.plan | "name=\(.name)  legacy_id=\(.legacy_id)  price=\(.price)"'

          SINCE="2026-08-19T19:30:00Z"   # a few min before the filter went live
          SINCED="2026-08-19"

          echo "== [1] firewall events (Pro+/Enterprise dataset) =="
          Q='query($zid:String!,$since:Time!){viewer{zones(filter:{zoneTag:$zid}){summary:firewallEventsAdaptiveGroups(filter:{datetime_geq:$since},limit:60,orderBy:[count_DESC]){count dimensions{action clientCountryName}} recent:firewallEventsAdaptive(filter:{datetime_geq:$since},limit:20,orderBy:[datetime_DESC]){datetime action clientCountryName clientIP clientRequestHTTPHost clientRequestPath ruleId}}}}'
          BODY=$(jq -nc --arg q "$Q" --arg zid "$ZID" --arg since "$SINCE" '{query:$q, variables:{zid:$zid, since:$since}}')
          RESP=$(api -X POST "$GQL" --data "$BODY")
          ERR=$(echo "$RESP" | jq -c '.errors // empty')
          if echo "$ERR" | grep -qi 'does not have access to the path'; then
            echo ">> Firewall Events GraphQL is NOT exposed on this plan (Free)."
            echo ">> The full challenge/block log is still in the dashboard: Security -> Events."
          elif [ -n "$ERR" ] && [ "$ERR" != "null" ]; then
            echo "graphql errors: $ERR"
          else
            echo "-- total firewall events since go-live --"
            echo "$RESP" | jq -r '[.data.viewer.zones[0].summary[]?.count] | add // 0'
            echo "-- counts by action + country (desc) --"
            echo "$RESP" | jq -r '.data.viewer.zones[0].summary[]? | "\(.count)\t\(.dimensions.action)\t\(.dimensions.clientCountryName)"' | sort -rn
            echo "-- 20 most recent events --"
            echo "$RESP" | jq -r '.data.viewer.zones[0].recent[]? | "\(.datetime) \(.action) \(.clientCountryName) \(.clientRequestHTTPHost)\(.clientRequestPath) rule=\(.ruleId)"'
          fi

          echo "== [2] traffic + threats + top countries (Free-plan dataset) =="
          Q2='query($zid:String!,$since:Date!){viewer{zones(filter:{zoneTag:$zid}){httpRequests1dGroups(filter:{date_geq:$since},limit:14,orderBy:[date_ASC]){dimensions{date} sum{requests threats countryMap{clientCountryName requests threats}}}}}}'
          BODY2=$(jq -nc --arg q "$Q2" --arg zid "$ZID" --arg since "$SINCED" '{query:$q, variables:{zid:$zid, since:$since}}')
          RESP2=$(api -X POST "$GQL" --data "$BODY2")
          ERR2=$(echo "$RESP2" | jq -c '.errors // empty')
          if [ -n "$ERR2" ] && [ "$ERR2" != "null" ]; then
            echo "graphql errors: $ERR2"
          fi
          echo "-- per-day requests / threats --"
          echo "$RESP2" | jq -r '.data.viewer.zones[0].httpRequests1dGroups[]? | "\(.dimensions.date)  requests=\(.sum.requests)  threats=\(.sum.threats)"'
          echo "-- threats by country (since go-live, top 15) --"
          echo "$RESP2" | jq -r '[.data.viewer.zones[0].httpRequests1dGroups[]?.sum.countryMap[]?] | group_by(.clientCountryName) | map({c:.[0].clientCountryName, threats:(map(.threats)|add), requests:(map(.requests)|add)}) | sort_by(-.threats)[] | select(.threats>0) | "\(.threats)\tthreats\t\(.c)\t(\(.requests) reqs)"' | head -15

      - name: Apply
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -u
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' "$@"; }
          B=https://api.cloudflare.com/client/v4
          ZID="${{ steps.probe.outputs.zid }}"
          if [ -z "$ZID" ]; then echo "ABORT: zone not accessible"; exit 1; fi

          STATUS=$(api "$B/zones/$ZID" | jq -r '.result.status')
          if [ "$STATUS" != "active" ]; then echo "ABORT: zone status=$STATUS (nameservers not pointed at Cloudflare — registrar change needed first)"; exit 1; fi

          CERTOK=$(api "$B/zones/$ZID/ssl/certificate_packs?status=all" | jq -r '[.result[]? | select(.status=="active")] | length')
          if [ "$CERTOK" -lt 1 ]; then echo "ABORT: no active edge certificate yet — flipping the proxy now would break HTTPS"; exit 1; fi

          echo "== settings: ssl strict, rocket loader off (non-fatal) =="
          api -X PATCH "$B/zones/$ZID/settings/ssl" --data '{"value":"strict"}' | jq -c '{ssl: .success, errors}'
          api -X PATCH "$B/zones/$ZID/settings/rocket_loader" --data '{"value":"off"}' | jq -c '{rocket_loader: .success, errors}'

          echo "== WAF: managed challenge for SG/CN/HK (append, idempotent) =="
          EP=$(api "$B/zones/$ZID/rulesets/phases/http_request_firewall_custom/entrypoint")
          RSID=$(echo "$EP" | jq -r '.result.id // empty')
          EXPR='(ip.src.country in {"SG" "CN" "HK"}) and not cf.client.bot'
          DESC='xg: challenge datacentre countries'
          RULE=$(jq -nc --arg e "$EXPR" --arg d "$DESC" '{action:"managed_challenge", expression:$e, description:$d, enabled:true}')
          if [ -z "$RSID" ]; then
            api -X PUT "$B/zones/$ZID/rulesets/phases/http_request_firewall_custom/entrypoint" \
              --data "$(jq -nc --argjson r "$RULE" '{rules:[$r]}')" | jq -c '{waf_create: .success, errors}'
          elif [ "$(echo "$EP" | jq -r --arg d "$DESC" '[.result.rules[]? | select(.description==$d)] | length')" = "0" ]; then
            api -X POST "$B/zones/$ZID/rulesets/$RSID/rules" --data "$RULE" | jq -c '{waf_append: .success, errors}'
          else
            echo "waf rule already present"
          fi

          echo "== rate limit on /search paths (non-fatal if plan refuses) =="
          EPR=$(api "$B/zones/$ZID/rulesets/phases/http_ratelimit/entrypoint")
          RRID=$(echo "$EPR" | jq -r '.result.id // empty')
          RLDESC='xg: search rate limit'
          RL=$(jq -nc --arg d "$RLDESC" '{action:"block", description:$d, enabled:true, expression:"(http.request.uri.path contains \"/search\")", ratelimit:{characteristics:["cf.colo.id","ip.src"], period:10, requests_per_period:10, mitigation_timeout:10}}')
          if [ -z "$RRID" ]; then
            api -X PUT "$B/zones/$ZID/rulesets/phases/http_ratelimit/entrypoint" \
              --data "$(jq -nc --argjson r "$RL" '{rules:[$r]}')" | jq -c '{rl_create: .success, errors}'
          elif [ "$(echo "$EPR" | jq -r --arg d "$RLDESC" '[.result.rules[]? | select(.description==$d)] | length')" = "0" ]; then
            api -X POST "$B/zones/$ZID/rulesets/$RRID/rules" --data "$RL" | jq -c '{rl_append: .success, errors}'
          else
            echo "rate limit rule already present"
          fi

          echo "== flip the two Shopify records to Proxied =="
          RECS=$(api "$B/zones/$ZID/dns_records?per_page=100")
          AID=$(echo "$RECS" | jq -r --arg z "$ZONE" '.result[] | select(.type=="A" and .name==$z and (.content|startswith("23.227.38."))) | .id')
          WID=$(echo "$RECS" | jq -r --arg z "www.$ZONE" '.result[] | select(.type=="CNAME" and .name==$z and (.content|endswith("myshopify.com"))) | .id')
          echo "apex id=$AID www id=$WID"
          if [ -z "$AID" ] || [ -z "$WID" ]; then echo "ABORT: expected Shopify records not found — nothing flipped"; exit 1; fi
          api -X PATCH "$B/zones/$ZID/dns_records/$AID" --data '{"proxied":true}' | jq -c '{apex_proxied: .success, errors}'
          api -X PATCH "$B/zones/$ZID/dns_records/$WID" --data '{"proxied":true}' | jq -c '{www_proxied: .success, errors}'

          echo "== smoke test (up to 2 min) =="
          ok=0
          for i in $(seq 1 12); do
            sleep 10
            H=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "https://$ZONE/" || echo 000)
            W=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://www.$ZONE/" || echo 000)
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$ZONE/cart" || echo 000)
            RAY=$(curl -sI --max-time 20 "https://$ZONE/" | grep -ci '^cf-ray' || true)
            BODYOK=$(grep -ci 'exor' /tmp/body || true)
            echo "try $i: apex=$H www=$W cart=$C cf-ray=$RAY body-exor=$BODYOK"
            if [ "$H" = 200 ] && { [ "$W" = 200 ] || [ "$W" = 301 ] || [ "$W" = 302 ]; } && [ "$C" = 200 ] && [ "$RAY" -ge 1 ] && [ "$BODYOK" -ge 1 ]; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo "SMOKE FAILED — ROLLING BACK proxy flips"
            api -X PATCH "$B/zones/$ZID/dns_records/$AID" --data '{"proxied":false}' | jq -c '{apex_reverted: .success, errors}'
            api -X PATCH "$B/zones/$ZID/dns_records/$WID" --data '{"proxied":false}' | jq -c '{www_reverted: .success, errors}'
            exit 1
          fi
          echo "APPLY COMPLETE: proxy live, WAF challenge active, site serving through Cloudflare."
