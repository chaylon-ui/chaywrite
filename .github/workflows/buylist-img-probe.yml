name: buylist-img-probe
# Read-only, no browser. Asks the worker's buylist search API for a card,
# then fetches each card image and reports its real pixel dimensions and
# transfer size. That is what decides whether a hover/click zoom on the
# buylist costs new bytes or just re-uses pixels the page already has.
# (Two earlier browser versions failed: the buylist app never mounted inside
# the runner, so there was nothing to measure. HTTP needs no mount.)
on:
  workflow_dispatch:
    inputs:
      q:
        description: Card name to search
        required: false
        default: "Command Tower"
      game:
        description: Game slug
        required: false
        default: "mtg"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      Q: ${{ inputs.q }}
      GAME: ${{ inputs.game }}
    steps:
      - name: Search, then measure every card image
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, struct, io
          Q = os.environ.get("Q", "Command Tower")
          GAME = os.environ.get("GAME", "mtg")
          BASE = "https://exor-binder.nevski.workers.dev/buylist/api/search"
          url = BASE + "?" + urllib.parse.urlencode({"q": Q, "game": GAME})
          req = urllib.request.Request(url, headers={"user-agent": "ExorImgProbe/1.0", "accept": "application/json"})
          with urllib.request.urlopen(req, timeout=60) as r:
              d = json.load(r)
          print("SEARCH upstream", d.get("upstream"), "count", d.get("count"))
          hits = d.get("hits") or []
          if not hits:
              print("NO HITS - raw:", json.dumps(d)[:400]); raise SystemExit(0)

          def dims(b):
              # PNG
              if b[:8] == b"\x89PNG\r\n\x1a\n":
                  w, h = struct.unpack(">II", b[16:24]); return w, h, "png"
              # GIF
              if b[:6] in (b"GIF87a", b"GIF89a"):
                  w, h = struct.unpack("<HH", b[6:10]); return w, h, "gif"
              # JPEG: walk the segments to SOFn
              if b[:2] == b"\xff\xd8":
                  i = 2
                  while i < len(b) - 9:
                      if b[i] != 0xFF: i += 1; continue
                      m = b[i+1]
                      if m in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):
                          h, w = struct.unpack(">HH", b[i+5:i+9]); return w, h, "jpeg"
                      if m in (0xD8,0xD9) or 0xD0 <= m <= 0xD7: i += 2; continue
                      seg = struct.unpack(">H", b[i+2:i+4])[0]; i += 2 + seg
              # WEBP
              if b[:4] == b"RIFF" and b[8:12] == b"WEBP":
                  if b[12:16] == b"VP8X":
                      w = int.from_bytes(b[24:27], "little") + 1; h = int.from_bytes(b[27:30], "little") + 1
                      return w, h, "webp"
                  return None, None, "webp"
              return None, None, "?"

          seen, total, n = set(), 0, 0
          for h in hits[:10]:
              u = h.get("imageUrl")
              name = (h.get("cardName") or "?")[:26]
              st = (h.get("setName") or "?")[:26]
              if not u:
                  print("IMG", name, "|", st, "| NO imageUrl"); continue
              if u in seen:
                  print("IMG", name, "|", st, "| (same url as an earlier hit)"); continue
              seen.add(u)
              try:
                  ir = urllib.request.Request(u, headers={"user-agent": "ExorImgProbe/1.0"})
                  with urllib.request.urlopen(ir, timeout=45) as rr:
                      raw = rr.read(200000)
                      ct = rr.headers.get("content-type", "?")
                      cl = rr.headers.get("content-length")
                  w, hh, kind = dims(raw)
                  total += int(cl or len(raw)); n += 1
                  print("IMG", name, "|", st, "|", f"{w}x{hh}", kind, "|", (cl or str(len(raw))+"+"), "bytes |", ct, "|", u[:95])
              except Exception as e:
                  print("IMG", name, "| FETCH FAILED:", str(e)[:90], "|", u[:95])
          print("MEASURED", n, "images | total", total, "bytes | avg", (total // n) if n else 0)
          print("DISPLAYED AT 104px wide (desktop), 72px (tablet), 60px (phone); aspect 5/7")
          PY
