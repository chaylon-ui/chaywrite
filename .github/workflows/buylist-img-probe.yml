name: buylist-img-probe
# Read-only. Searches the buylist page and reports, for every card thumbnail:
# the intrinsic (natural) pixel size the browser actually downloaded versus the
# size it is displayed at, plus the transferred bytes per image. That is what
# decides whether a hover/click zoom costs any new network traffic or is free
# from pixels already in memory.
on:
  workflow_dispatch:
    inputs:
      q:
        description: What to search for
        required: false
        default: "Command Tower"
      width:
        description: Viewport width
        required: false
        default: "1200"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      Q: ${{ inputs.q }}
      W: ${{ inputs.width }}
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 >/dev/null 2>&1
      - name: Measure the card thumbnails
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            await page.setViewport({ width: parseInt(process.env.W, 10) || 1200, height: 1000 });
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCacheEnabled(false);

            // record transfer size for every image response
            const bytes = new Map();
            page.on('response', async (r) => {
              try {
                const ct = r.headers()['content-type'] || '';
                if (!/^image\//.test(ct)) return;
                const len = +(r.headers()['content-length'] || 0);
                bytes.set(r.url(), { len, ct, status: r.status() });
              } catch (e) {}
            });

            const r = await page.goto('https://exorgames.com/pages/selling-to-exor-games-buylist', { waitUntil: 'networkidle2', timeout: 90000 }).catch(() => null);
            console.log('status', r ? r.status() : 'none', '| title', await page.title());
            // Wait for the BUYLIST app's own field, by id. A loose
            // 'input[type=search]' matched the theme's header search box on
            // the first paint, so the probe typed into the wrong box and the
            // app had not even mounted yet (run 35248942284: 0 hits).
            await page.waitForSelector('#bl-q', { timeout: 60000 }).catch(() => console.log('NO #bl-q - buylist app never mounted'));
            await sleep(1500);

            await page.evaluate(() => {
              const g = document.querySelector('#bl-game');
              if (g && g.options.length) console.log(g.options.length);
            });
            await page.type('#bl-q', process.env.Q, { delay: 40 }).catch(e => console.log('TYPE-ERR', String(e).slice(0, 80)));
            console.log('SEARCHBOX', await page.evaluate(() => { const b = document.querySelector('#bl-q'); return b ? b.id + ' = ' + JSON.stringify(b.value) : 'missing'; }));
            await page.evaluate(() => {
              const f = document.querySelector('#bl-form');
              if (f) f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
            });
            await page.click('#bl-form button[type=submit]').catch(() => {});

            let hits = 0;
            for (let i = 0; i < 25; i++) {
              await sleep(1200);
              hits = await page.evaluate(() => document.querySelectorAll('.bl__hit').length);
              if (hits > 0) break;
              if (i % 5 === 4) console.log('  waiting... status:', await page.evaluate(() => (document.querySelector('#bl-status') || {}).textContent || ''));
            }
            console.log('HITS', hits);
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
            await sleep(3000);
            await page.evaluate(() => window.scrollTo(0, 0));
            await sleep(1500);

            const imgs = await page.evaluate(() => [...document.querySelectorAll('img.bl__card')].map((i) => {
              const r = i.getBoundingClientRect();
              return { src: i.currentSrc || i.src, natW: i.naturalWidth, natH: i.naturalHeight,
                       shownW: Math.round(r.width), shownH: Math.round(r.height), loading: i.loading, complete: i.complete };
            }));
            console.log('CARD IMAGES', imgs.length);
            let totalBytes = 0, counted = 0;
            for (const im of imgs.slice(0, 12)) {
              const b = bytes.get(im.src);
              if (b && b.len) { totalBytes += b.len; counted++; }
              console.log('IMG', JSON.stringify({ ...im, src: im.src.slice(0, 110), bytes: b ? b.len : null, type: b ? b.ct : null }));
            }
            console.log('BYTES counted', counted, 'total', totalBytes, 'avg', counted ? Math.round(totalBytes / counted) : 0);
            const hosts = {};
            for (const im of imgs) { try { const h = new URL(im.src).host; hosts[h] = (hosts[h] || 0) + 1; } catch (e) {} }
            console.log('HOSTS', JSON.stringify(hosts));
            await browser.close();
          })().catch(e => { console.log('FATAL', String(e).slice(0, 300)); process.exit(0); });
          EOF
          node probe.js
