name: shot-probe
# Read-only against the site: open a page at a given viewport, wait for it
# to settle, and report (a) the computed style of every selector given plus
# the stylesheet rules that match, and (b) a JPEG of one element - committed
# to probe-shots/ (the sandbox can git pull that; it cannot download Action
# artifacts) and also printed as base64 when save is false. With `text` it
# also prints an element's visible text, and with `net` every network
# response whose URL contains the given text (status, type, and the head of
# a JSON body) - for finding where a page gets a number from.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to open
        required: true
        default: "https://exorgames.com/pages/sell-to-exor-games-bulk-or-create-a-list"
      selector:
        description: Element to photograph
        required: true
        default: "#video-games"
      width:
        description: Viewport width
        required: false
        default: "390"
      styles:
        description: Comma-separated selectors to report computed style for
        required: false
        default: ""
      rules:
        description: One selector whose matching stylesheet rules are listed
        required: false
        default: ""
      dark:
        description: Force a theme before the shot - "dark" (or "true"), "light", or "false" to leave the site's own default alone
        required: false
        default: "false"
      save:
        description: Commit the JPEG to probe-shots/ instead of printing base64
        required: false
        default: "true"
      hover:
        description: Selector to hover (and hold) before measuring and shooting - opens app menus that are not in the DOM until hovered
        required: false
        default: ""
      scroll:
        description: Scroll the window down by this many px before measuring and shooting (the sticky header only exists after a scroll); the element is then NOT scrolled into view
        required: false
        default: ""
      text:
        description: Selector whose visible text is printed (first 4000 chars)
        required: false
        default: ""
      net:
        description: Print every network response whose URL contains this text (status, content-type, head of a JSON body)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      URL: ${{ inputs.url }}
      SEL: ${{ inputs.selector }}
      W: ${{ inputs.width }}
      STYLES: ${{ inputs.styles }}
      RULES: ${{ inputs.rules }}
      DARK: ${{ inputs.dark }}
      SAVE: ${{ inputs.save }}
      HOVER: ${{ inputs.hover }}
      SCROLL: ${{ inputs.scroll }}
      TEXT: ${{ inputs.text }}
      NET: ${{ inputs.net }}
      SHOT: probe-shots/shot-${{ github.run_id }}.jpg
    steps:
      - uses: actions/checkout@v4
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 >/dev/null 2>&1
      - name: Shoot
        run: |
          mkdir -p probe-shots
          cat > shot.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            const w = parseInt(process.env.W || '390', 10) || 390;
            await page.setViewport({ width: w, height: 900, deviceScaleFactor: 2, isMobile: w < 700, hasTouch: w < 700 });
            await page.setUserAgent(w < 700
              ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
              : 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCacheEnabled(false);
            await page.setExtraHTTPHeaders({ 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' });
            if (process.env.NET) {
              const needle = process.env.NET;
              page.on('response', async (res) => {
                try {
                  const u = res.url();
                  if (!u.includes(needle)) return;
                  const ct = String(res.headers()['content-type'] || '');
                  let head = '';
                  if (/json|javascript|text/i.test(ct) && res.status() < 300 && res.request().resourceType() !== 'script' && res.request().resourceType() !== 'stylesheet') {
                    try { head = (await res.text()).replace(/\s+/g, ' ').slice(0, 700); } catch (e) { head = '(body unavailable)'; }
                  }
                  console.log('NET', res.status(), res.request().resourceType(), ct.split(';')[0], u.slice(0, 200), head ? '| ' + head : '');
                } catch (e) {}
              });
            }
            const target = new URL(process.env.URL);
            const pt = target.searchParams.get('preview_theme_id');
            if (pt) { await page.goto(target.origin + '/?preview_theme_id=' + pt, { waitUntil: 'domcontentloaded', timeout: 90000 }).catch(() => null); }
            const r = await page.goto(process.env.URL, { waitUntil: 'networkidle2', timeout: 90000 }).catch(() => null);
            console.log('status', r ? r.status() : 'none', '| title', await page.title(), '| theme', await page.evaluate(() => JSON.stringify(window.Shopify && window.Shopify.theme)).catch(() => '?'));
            if (process.env.DARK === 'true' || process.env.DARK === 'dark') { await page.evaluate(() => document.documentElement.setAttribute('data-xg-theme', 'dark')); }
            else if (process.env.DARK === 'light') { await page.evaluate(() => document.documentElement.setAttribute('data-xg-theme', 'light')); }
            console.log('theme attr', await page.evaluate(() => document.documentElement.getAttribute('data-xg-theme')));
            await sleep(4000);
            if (process.env.HOVER) {
              try { await page.hover(process.env.HOVER); await sleep(1500); console.log('hovered', process.env.HOVER); }
              catch (e) { console.log('HOVER-ERR', String(e).slice(0, 160)); }
            }
            const scrollY = parseInt(process.env.SCROLL || '', 10);
            if (scrollY > 0) {
              // Real wheel-like scrolling in steps, so scroll listeners that
              // compare successive positions (sticky headers) see it happen.
              await page.evaluate(async (y) => { const step = 80; for (let at = 0; at < y; at += step) { window.scrollTo(0, Math.min(y, at + step)); await new Promise(r => setTimeout(r, 40)); } }, scrollY);
              await sleep(1500);
              console.log('scrolled to', await page.evaluate(() => window.scrollY), '| header classes', await page.evaluate(() => {
                const pick = (sel) => { const el = document.querySelector(sel); return el ? sel + ' [' + el.className + '] style=' + (el.getAttribute('style') || '') : sel + ' NOT FOUND'; };
                return ['#header', '#header .site-header', '#header .header-top', '#header .nav-menu', '#header .site-header-mobile'].map(pick).join(' || ');
              }));
            }
            if (process.env.TEXT) {
              const t = await page.evaluate((sel) => { const el = document.querySelector(sel); return el ? el.innerText.replace(/\n{3,}/g, '\n\n').slice(0, 4000) : 'NOT FOUND'; }, process.env.TEXT).catch((e) => 'TEXT-ERR ' + String(e).slice(0, 160));
              console.log('TEXT-BEGIN ' + process.env.TEXT); console.log(t); console.log('TEXT-END');
            }
            const rows = await page.evaluate((list) => {
              const out = [];
              for (const sel of list) {
                const el = document.querySelector(sel);
                if (!el) { out.push([sel, 'NOT FOUND']); continue; }
                const cs = getComputedStyle(el), b = el.getBoundingClientRect();
                out.push([sel, {
                  color: cs.color,
                  background: cs.backgroundImage !== 'none' ? cs.backgroundImage.slice(0, 120) : cs.backgroundColor,
                  display: cs.display, visibility: cs.visibility, opacity: cs.opacity, position: cs.position, overflow: cs.overflow, padding: cs.padding, fontWeight: cs.fontWeight,
                  border: cs.borderWidth + ' ' + cs.borderStyle + ' ' + cs.borderColor,
                  shadow: cs.boxShadow.slice(0, 80), deco: (cs.textDecorationLine + ' ' + cs.textDecorationColor).slice(0, 60),
                  x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height), lines: el.getClientRects().length,
                }]);
              }
              return out;
            }, (process.env.STYLES || '').split(',').map(s => s.trim()).filter(Boolean));
            for (const [sel, v] of rows) console.log('STYLE', sel, JSON.stringify(v));
            if (process.env.RULES) {
              const hits = await page.evaluate((sel) => {
                const el = document.querySelector(sel);
                if (!el) return ['NOT FOUND'];
                const out = [];
                for (const sheet of document.styleSheets) {
                  let rules; try { rules = sheet.cssRules; } catch (e) { continue; }
                  const walk = (list) => { for (const rule of list) {
                    if (rule.cssRules && !rule.selectorText) { walk(rule.cssRules); continue; }
                    if (!rule.selectorText) continue;
                    let m = false; try { m = el.matches(rule.selectorText); } catch (e) {}
                    if (m) out.push(((sheet.href || 'inline').split('/').pop().split('?')[0] + ' | ' + rule.cssText).slice(0, 320));
                  } };
                  walk(rules);
                }
                return out.slice(0, 40);
              }, process.env.RULES);
              for (const h of hits) console.log('RULE', h);
            }
            const el = await page.$(process.env.SEL);
            if (!el) { console.log('SELECTOR NOT FOUND', process.env.SEL); await browser.close(); return; }
            const box = await el.boundingBox();
            console.log('BOX', JSON.stringify(box));
            if (!process.env.HOVER && !(scrollY > 0)) await el.scrollIntoView().catch(() => {});
            await sleep(500);
            const jpg = await el.screenshot({ type: 'jpeg', quality: 60 });
            if (process.env.SAVE === 'true') { fs.writeFileSync(process.env.SHOT, jpg); console.log('SHOT saved', process.env.SHOT, jpg.length, 'bytes'); }
            else { console.log('JPEG-B64 ' + jpg.toString('base64')); }
            await browser.close();
          })().catch(e => { console.log('FATAL', String(e).slice(0, 300)); process.exit(0); });
          EOF
          node shot.js
      - name: Commit the shot
        if: ${{ inputs.save == 'true' }}
        run: |
          if [ ! -f "$SHOT" ]; then echo "no shot to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SHOT"
          git commit -m "probe shot ${{ github.run_id }}: ${{ inputs.selector }} at ${{ inputs.width }}px"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
          echo "committed $SHOT"
