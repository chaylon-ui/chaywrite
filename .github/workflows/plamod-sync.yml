name: plamod-sync
# Official photos + facts for our Gunpla, figures and blind boxes from PLAMOD,
# the distributor we buy them from (owner, 2026-09-23: "Let's do it, add all
# photos if you can", "make sure any case language isn't included"). Runs
# tools/plamod-sync.mjs: signs in to the retailer portal with the owner's
# account (Actions secrets PLAMOD_COMPANY / PLAMOD_USERNAME / PLAMOD_PASSWORD),
# looks our barcodes up and commits data/plamod.json (PLAMOD's public photo
# URLs, release date, series, brand - never prices, stock or descriptions).
# The worker's nightly sweep (src/plamod.js) adds the photos and facts to the
# products. Every 4 hours: the first pass over ~2000 products takes several
# runs; after that a run only looks at new products (a miss is retried after
# 14 days, a match re-checked after 30).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Look up and print, commit nothing
        default: "false"
      limit:
        description: Look up at most this many products (0 = all due)
        default: "0"
      barcodes:
        description: Only these barcodes (comma list)
        default: ""
  schedule:
    - cron: "25 */4 * * *"
permissions:
  contents: write
concurrency:
  group: plamod-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install puppeteer-core and sharp
        run: npm i --no-save puppeteer-core@22 sharp >/dev/null 2>&1
      - name: Look products up on PLAMOD
        env:
          PCO: ${{ secrets.PLAMOD_COMPANY }}
          PUS: ${{ secrets.PLAMOD_USERNAME }}
          PPW: ${{ secrets.PLAMOD_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          BARCODES: ${{ inputs.barcodes }}
          BUDGET_MIN: "40"
        run: |
          if [ -z "$PUS" ] || [ -z "$PPW" ]; then echo "PLAMOD secrets missing"; exit 1; fi
          node tools/plamod-sync.mjs
      - name: Commit data/plamod.json when it changed
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          set -e
          if [ ! -f data/plamod.json ] || [ -z "$(git status --porcelain data/plamod.json)" ]; then echo "no change to data/plamod.json"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plamod.json
          git commit -m "plamod: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
