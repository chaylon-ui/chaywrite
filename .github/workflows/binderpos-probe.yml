name: BinderPOS probe

# Read-only discovery of BinderPOS's public "external" API for this store.
# Round 2: does ANY variant carry non-null buy prices (cashBuyPrice /
# storeCreditBuyPrice / *Percent / priceOverride), and what method does the
# buylist/cards route take. Manual-only.

on:
  workflow_dispatch:
    inputs:
      store:
        description: "storeUrl (myshopify domain)"
        required: true
        default: "most-wanted-ca.myshopify.com"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STORE: ${{ inputs.store }}
      B: https://portal.binderpos.com/external/shopify
    steps:
      - name: Buy-field census over popular cards (retail endpoint, 100 products each)
        run: |
          census() { # $1 card title
            BODY=$(jq -nc --arg s "$STORE" --arg t "$1" '{storeUrl:$s, game:"mtg", title:$t, instockOnly:false, limit:100, offset:0}')
            curl -sS --max-time 30 -o /tmp/r.json -H 'content-type: application/json' -A 'Mozilla/5.0' \
              -H 'origin: https://exorgames.com' -X POST "$B/products/forStore" --data "$BODY" || true
            echo "=== $1 ==="
            jq -r '"products=\(.count // 0) returned=\(.products|length)"' /tmp/r.json 2>/dev/null || { echo "not json"; return; }
            jq -r '[.products[].variants[]] as $v |
              "variants=\($v|length)" +
              "  cashBuyPrice set=\([$v[]|select(.cashBuyPrice!=null)]|length)" +
              "  storeCreditBuyPrice set=\([$v[]|select(.storeCreditBuyPrice!=null)]|length)" +
              "  cashBuyPercent set=\([$v[]|select(.cashBuyPercent!=null)]|length)" +
              "  creditBuyPercent set=\([$v[]|select(.creditBuyPercent!=null)]|length)" +
              "  priceOverride set=\([$v[]|select(.priceOverride!=null)]|length)"' /tmp/r.json
            echo "-- sample variants with ANY buy field set --"
            jq -r '.products[] as $p | $p.variants[] | select(.cashBuyPrice!=null or .storeCreditBuyPrice!=null or .cashBuyPercent!=null or .creditBuyPercent!=null) |
              "\($p.name // $p.title // "?") | \(.title) | price=\(.price) cash=\(.cashBuyPrice) credit=\(.storeCreditBuyPrice) cash%=\(.cashBuyPercent) credit%=\(.creditBuyPercent) qty=\(.quantity)"' /tmp/r.json | head -12
            echo "-- product-level keys (first product) --"
            jq -r '.products[0] | keys | join(", ")' /tmp/r.json 2>/dev/null | head -3
            echo "-- product-level buy/buylist-ish fields (first 3 products) --"
            jq -r '.products[:3][] | to_entries[] | select(.key|test("buy|sell|list";"i")) | "\(.key)=\(.value)"' /tmp/r.json 2>/dev/null | sort -u | head -12
          }
          census "Sol Ring"
          census "Rhystic Study"
          census "Lightning Bolt"

      - name: buylist/cards/forStore — method + shape hunt
        run: |
          try() { # $1 label, $2 method, $3 url, $4 body(optional)
            echo "=== $1 ==="
            if [ -n "${4:-}" ]; then
              code=$(curl -sS --max-time 20 -o /tmp/r.json -w '%{http_code}' -X "$2" -H 'content-type: application/json' -H 'accept: application/json' -A 'Mozilla/5.0' -H 'origin: https://exorgames.com' "$3" --data "$4") || code=000
            else
              code=$(curl -sS --max-time 20 -o /tmp/r.json -w '%{http_code}' -X "$2" -H 'accept: application/json' -A 'Mozilla/5.0' -H 'origin: https://exorgames.com' "$3") || code=000
            fi
            echo "HTTP $code, bytes $(wc -c < /tmp/r.json 2>/dev/null || echo 0)"
            head -c 900 /tmp/r.json; printf '\n'
          }
          BODY=$(jq -nc --arg s "$STORE" '{storeUrl:$s, game:"mtg", title:"Sol Ring", limit:5, offset:0}')
          try "GET  buylist/cards/forStore?storeUrl" GET "$B/buylist/cards/forStore?storeUrl=$STORE&game=mtg&title=Sol%20Ring&limit=5&offset=0"
          try "GET  buylist/cards/forStore/{store}" GET "$B/buylist/cards/forStore/$STORE?game=mtg&title=Sol%20Ring&limit=5"
          try "POST buylist/cards/forStore/{store}" POST "$B/buylist/cards/forStore/$STORE" "$BODY"
          try "OPTIONS buylist/cards/forStore (allow header?)" OPTIONS "$B/buylist/cards/forStore"
          echo "=== OPTIONS raw headers ==="
          curl -sSI --max-time 20 -X OPTIONS -A 'Mozilla/5.0' -H 'origin: https://exorgames.com' "$B/buylist/cards/forStore" | head -20 || true
