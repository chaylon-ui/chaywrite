name: BinderPOS probe

# Round 3: the buylist/cards/forStore route exists (allow: GET,HEAD,OPTIONS)
# but 400s on guessed params. Battery likely param spellings, and try to find
# BinderPOS's hosted buylist frontend to read the real call shape. Manual-only.

on:
  workflow_dispatch:
    inputs:
      store:
        description: "storeUrl (myshopify domain)"
        required: true
        default: "most-wanted-ca.myshopify.com"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STORE: ${{ inputs.store }}
      B: https://portal.binderpos.com/external/shopify
    steps:
      - name: Param battery on GET buylist/cards/forStore
        run: |
          t() { # $1 query string
            code=$(curl -sS --max-time 15 -o /tmp/r.json -w '%{http_code}' -A 'Mozilla/5.0' -H 'accept: application/json' -H 'origin: https://exorgames.com' "$B/buylist/cards/forStore?$1") || code=000
            b=$(wc -c < /tmp/r.json 2>/dev/null || echo 0)
            echo "[$code/${b}b] ?$1"
            if [ "$code" = "200" ] && [ "$b" -gt 2 ]; then echo "  BODY: $(head -c 600 /tmp/r.json)"; fi
          }
          N="Sol%20Ring"
          t "storeUrl=$STORE&title=$N&game=mtg&limit=5&offset=0"
          t "storeUrl=$STORE&name=$N&game=mtg&limit=5&offset=0"
          t "storeUrl=$STORE&cardName=$N&game=mtg&limit=5"
          t "storeUrl=$STORE&keyword=$N&game=mtg&limit=5"
          t "storeUrl=$STORE&q=$N&game=mtg&limit=5"
          t "storeUrl=$STORE&search=$N&game=mtg&limit=5"
          t "storeUrl=$STORE&title=$N&game=mtg"
          t "storeUrl=$STORE&title=$N"
          t "storeUrl=$STORE&game=mtg&limit=5&offset=0"
          t "storeUrl=$STORE&limit=5&offset=0"
          t "storeUrl=$STORE"
          t "store=$STORE&title=$N&game=mtg&limit=5"
          t "shopUrl=$STORE&title=$N&game=mtg&limit=5"
          t "url=$STORE&title=$N&game=mtg&limit=5"

      - name: Hunt hosted buylist frontends + read their JS
        run: |
          look() { # $1 url
            echo "=== $1 ==="
            code=$(curl -sSL --max-time 20 -o /tmp/p.html -w '%{http_code}' -A 'Mozilla/5.0' "$1") || code=000
            echo "HTTP $code, bytes $(wc -c < /tmp/p.html 2>/dev/null || echo 0)"
            grep -oiE '(src|href)="[^"]+\.js[^"]*"' /tmp/p.html | head -8 || true
          }
          look "https://buylist.binderpos.com/?store=$STORE"
          look "https://portal.binderpos.com/public/buylist/$STORE"
          look "https://$STORE/apps/buylist"
          look "https://exorgames.com/apps/buylist"
          echo "=== exorgames.com/apps/buylist deeper (BinderPOS Shopify app proxy is usually /apps/*) ==="
          curl -sSL --max-time 20 -A 'Mozilla/5.0' "https://exorgames.com/apps/buylist" -o /tmp/ab.html || true
          wc -c /tmp/ab.html || true
          grep -oiE 'portal\.binderpos\.com[^"'"'"' ]*|/external/shopify/[a-z/]+' /tmp/ab.html | sort -u | head -20 || true
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/ab.html | sed -E 's/^src="//; s/"$//' | head -6); do
            case "$js" in http*) u="$js";; //*) u="https:$js";; /*) u="https://exorgames.com$js";; *) continue;; esac
            echo "--- JS: $u ---"
            curl -sS --max-time 25 -A 'Mozilla/5.0' "$u" -o /tmp/j.js || continue
            grep -oiE 'portal\.binderpos\.com[^"'"'"' ]*|/external/shopify/[a-zA-Z/{}$-]+|buylist[a-zA-Z/]*' /tmp/j.js | sort -u | head -20 || true
          done
