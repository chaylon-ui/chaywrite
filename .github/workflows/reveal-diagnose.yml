name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Similar-effects button reads as an action everywhere
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const PAGE = 'https://exorgames.com/pages/deck-builder';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1380, height: 980 });
            const errs = [];
            const tolerated = /shopifycloud|shop_events_listener|\/cdn\/wpm\//;
            page.on('pageerror', (e) => {
              const s = (e && (e.stack || e.message)) || String(e);
              if (!tolerated.test(s)) errs.push(s.split('\n').slice(0, 2).join(' | '));
            });
            await page.setRequestInterception(true);
            page.on('request', (req) => {
              const u = req.url();
              if (u.includes('/deck.json?')) req.continue({ url: u + '&notrack=1' });
              else req.continue();
            });
            await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await page.type('#xg-deck-input', '4 Polluted Delta\n1 Chain Lightning');
            await page.click('#xg-deck-go');
            await page.waitForSelector('#xg-deck-results .xg-deck__row', { timeout: 45000 });
            let any = null;
            for (let i = 0; i < 30 && !any; i++) {
              any = await page.$('.xg-deck__simbtn');
              if (!any) await new Promise((r) => setTimeout(r, 1000));
            }
            let fails = [];
            if (!any) fails.push('no similar-effects buttons appeared at all');
            const btns = await page.evaluate(() => {
              return [...document.querySelectorAll('.xg-deck__simbtn')].map((b) => {
                const cs = getComputedStyle(b);
                return {
                  text: (b.textContent || '').trim(),
                  inStrip: !!b.closest('.xg-deck__row--short'),
                  cursor: cs.cursor,
                  color: cs.color,
                  bgImage: cs.backgroundImage.slice(0, 40),
                  title: b.getAttribute('title') || '',
                };
              });
            });
            console.log('BUTTONS:', JSON.stringify(btns, null, 1));
            btns.forEach((b, i) => {
              if (!/^See \d+ similar cards? we have in stock/.test(b.text)) fails.push('btn ' + i + ' text: ' + b.text);
              if (b.cursor !== 'pointer') fails.push('btn ' + i + ' cursor ' + b.cursor);
              if (b.color !== 'rgb(255, 255, 255)') fails.push('btn ' + i + ' not white text: ' + b.color);
              if (!/linear-gradient/.test(b.bgImage)) fails.push('btn ' + i + ' no gradient bg');
              if (!b.title) fails.push('btn ' + i + ' missing tooltip');
            });
            if (btns.length && !fails.length) {
              await page.click('.xg-deck__simbtn');
              const opened = await page.waitForSelector('.xg-deck-subs .xg-deck-subs__add', { timeout: 20000 }).then(() => true).catch(() => false);
              console.log('CLICK OPENS OVERLAY:', opened);
              if (!opened) fails.push('click did not open the overlay');
            }
            console.log('hard errors:', errs.length, errs.slice(0, 2));
            await browser.close();
            if (fails.length || errs.length) { console.log('VERDICT: FAIL -', JSON.stringify(fails)); process.exit(1); }
            console.log('VERDICT: PASS - action button everywhere');
          })().catch((e) => { console.log('diagnose error:', e.message); process.exit(1); });
          EOF
