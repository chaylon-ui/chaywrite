name: reveal-diagnose
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Worker endpoints (game param + regression)
        run: |
          set -x
          curl -s 'https://exor-binder.nevski.workers.dev/instock.json?names=Sol%20Ring&max=3&game=mtg' | python3 -c "import json,sys; j=json.load(sys.stdin); print('WORKER mtg ok=%s cards=%d' % (j.get('ok'), len(j.get('cards',[]))))"
          curl -s 'https://exor-binder.nevski.workers.dev/instock.json?names=Pikachu&max=3&game=pokemon' | python3 -c "import json,sys; j=json.load(sys.stdin); print('WORKER pokemon ok=%s cards=%d' % (j.get('ok'), len(j.get('cards',[]))))"
          curl -s 'https://exor-binder.nevski.workers.dev/cards.json?nt=1' | python3 -c "import json,sys; j=json.load(sys.stdin); c=j.get('cards',[]); print('WORKER nt cards=%d withVid=%d' % (len(c), sum(1 for x in c if x.get('variantId'))))"

      - name: Compose a card-on-table photo (v3 sparse OCR path)
        run: |
          # pin the Commander 2021 printing: the DEFAULT printing is now a
          # Marvel one whose art nameplate says TONY STARK in big block
          # letters, and run 77's sparse OCR (correctly) read that instead
          curl -sL -o solring.jpg 'https://api.scryfall.com/cards/named?exact=Sol+Ring&set=c21&format=image&version=large'
          ls -la solring.jpg; file solring.jpg || true
          # the owner's failing photos have the card sitting somewhere inside a
          # larger frame - build exactly that instead of a full-frame card scan
          # (runner image no longer ships ImageMagick, so compose with Pillow)
          python3 -m pip install --quiet pillow || sudo apt-get -yq install python3-pil
          python3 - <<'PY'
          from PIL import Image
          card = Image.open('solring.jpg').convert('RGB')
          w, h = card.size
          card = card.resize((int(w * 0.7), int(h * 0.7)))
          bg = Image.new('RGB', (1600, 1200), (122, 106, 85))
          bg.paste(card, (520, 120))
          bg.save('table.jpg', quality=92)
          print('table.jpg composed', bg.size, 'card', card.size)
          PY
          ls -la table.jpg; file table.jpg

      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22

      - name: Probe preview theme (round 6)
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const T = '157462692013';
          const H = 'https://exorgames.com';
          const u = (p) => H + p + (p.includes('?') ? '&' : '?') + 'preview_theme_id=' + T;
          const TOL = /shopifycloud|shop_events_listener|\/cdn\/wpm\/|web-pixels|sezzle|hotjar|googletagmanager|snize|searchanise|wishy|cloudsearch/i;
          const fails = [];
          const v = (name, ok, detail) => { console.log((ok ? 'VERDICT PASS ' : 'VERDICT FAIL ') + name + ' :: ' + detail); if (!ok) fails.push(name); };
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 950 });
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            page.on('pageerror', e => { const s = String((e && e.stack) || e); if (!TOL.test(s)) console.log('PAGEERR', s.slice(0, 400)); });

            const gotoTheme = async (path) => {
              for (let i = 0; i < 4; i++) {
                try { await page.goto(u(path), { waitUntil: 'networkidle2', timeout: 90000 }); } catch (e) { console.log('NAV-ERR', String(e).slice(0, 140)); }
                const ok = await page.evaluate(() => !!document.querySelector('#header .site-header'));
                if (ok) return true;
                const d = await page.evaluate(() => ({ title: document.title, len: document.documentElement.outerHTML.length }));
                console.log('NAV-RETRY', path, JSON.stringify(d));
                await sleep(9000);
              }
              return false;
            };
            const clearCart = () => page.evaluate(() => fetch('/cart/clear.js', { method: 'POST' }).catch(() => null));

            // ---------- A. LIGHT homepage: layout + new bands ----------
            v('nav-home', await gotoTheme('/'), 'theme header present');
            await clearCart();
            await sleep(5000);

            const shape = await page.evaluate(() => {
              const qa = Array.from(document.querySelectorAll('.xg-qa'));
              const card0 = qa[0] ? qa[0].closest('.grid-view-item') : null;
              let vid = '';
              if (card0) {
                const dd = card0.querySelector('select[data-dropdown-id="productSelect-dropdown"]');
                const inp2 = card0.querySelector('.nm-cartmain input[name="prduct-variant"]');
                vid = (dd && !dd.disabled && dd.value) || (inp2 && inp2.value) || '';
              }
              return {
                qaTotal: qa.length,
                nt: document.querySelectorAll('#xg-newtoday .xg-nt__add').length,
                camDesk: !!document.querySelector('#_desktop_search form.search-header .xg-scan-btn'),
                vid,
                bodyBg: getComputedStyle(document.body).backgroundColor,
                togDesk: !!document.querySelector('#header .header-user-selection .xg-theme-toggle'),
                togMob: !!document.querySelector('#header .mobile-width-right .xg-theme-toggle'),
                togPressed: (document.querySelector('#header .header-user-selection .xg-theme-toggle') || { getAttribute: () => '' }).getAttribute('aria-pressed')
              };
            });
            const drawerLight = await page.evaluate(() => {
              const w = document.getElementById('mobile_top_menu_wrapper');
              return w ? getComputedStyle(w).backgroundColor : 'missing';
            });
            console.log('SHAPE', JSON.stringify(shape));
            v('light-body', shape.bodyBg === 'rgb(245, 246, 247)', shape.bodyBg);
            v('drawer-light-white', drawerLight === 'rgb(255, 255, 255)', drawerLight);
            v('qa-regression', shape.qaTotal >= 6, 'qa=' + shape.qaTotal);
            v('nt-regression', shape.nt >= 8, 'nt=' + shape.nt);
            v('cam-regression', shape.camDesk, String(shape.camDesk));
            v('toggle-desktop', shape.togDesk, String(shape.togDesk));
            v('toggle-mobile-slot', shape.togMob, String(shape.togMob));
            v('toggle-unpressed', shape.togPressed === 'false', String(shape.togPressed));

            // ---- specialproduct: modern band, vertical 2-up tiles ----
            const sp = await page.evaluate(() => {
              const heads = document.querySelectorAll('.xg-sp .xg-sp__head');
              const k = document.querySelector('.xg-sp .xg-sp__kicker');
              const t = document.querySelector('.xg-sp .xg-sp__title');
              const wrap = document.querySelector('.xg-sp .grid-view-item .grid-view-item__image-wrapper');
              const desc = document.querySelector('.xg-sp .grid-view-item .product-description');
              const blurb = document.querySelector('.xg-sp .grid-view-item .product-desc');
              const nav = document.querySelector('.xg-sp .owl-nav .owl-next');
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              // the live sports_row uses max_products_rows=1, so there are no
              // .multilevel-item pair wrappers - the side-by-side 2-up comes
              // from owl itself (992px: items 2). Count VISIBLE tiles.
              const active = Array.from(document.querySelectorAll('.xg-sp .owl-item.active .grid-view-item')).filter(el => el.offsetWidth > 0);
              return {
                heads: heads.length,
                oldRedBox: document.querySelectorAll('.xg-sp .title-left').length,
                kColor: cs(k, 'color'), kUpper: cs(k, 'textTransform'),
                tSize: parseFloat(cs(t, 'fontSize') || '0'), tUpper: cs(t, 'textTransform'),
                visTiles: active.length,
                mlCount: document.querySelectorAll('.xg-sp .multilevel-item').length,
                wrapH: wrap ? wrap.offsetHeight : -1, wrapFloat: cs(wrap, 'float'), wrapDisplay: cs(wrap, 'display'),
                descDisplay: cs(desc, 'display'), descFloat: cs(desc, 'float'),
                blurbGone: blurb ? cs(blurb, 'display') === 'none' : true,
                navW: nav ? nav.offsetWidth : -1, navRadius: cs(nav, 'borderRadius')
              };
            });
            console.log('SPECIALPRODUCT', JSON.stringify(sp));
            v('sp-heads', sp.heads >= 1, 'heads=' + sp.heads);
            v('sp-old-redbox-gone', sp.oldRedBox === 0, 'title-left count=' + sp.oldRedBox);
            v('sp-kicker', sp.kColor === 'rgb(214, 44, 40)' && sp.kUpper === 'uppercase', sp.kColor + ' / ' + sp.kUpper);
            v('sp-title', sp.tSize >= 22 && sp.tSize <= 30 && sp.tUpper === 'uppercase', sp.tSize + 'px / ' + sp.tUpper);
            v('sp-two-up', sp.visTiles >= 2, 'visible tiles=' + sp.visTiles + ' (multilevel pairs=' + sp.mlCount + ', max_rows=1 -> owl 2-up)');
            v('sp-tile-vertical', sp.wrapFloat === 'none' && sp.wrapDisplay === 'block' && sp.descFloat === 'none' && sp.descDisplay === 'flex', 'wrap=' + sp.wrapFloat + '/' + sp.wrapDisplay + ' desc=' + sp.descFloat + '/' + sp.descDisplay);
            v('sp-tile-height', sp.wrapH === 205, 'wrapH=' + sp.wrapH);
            v('sp-blurb-hidden', sp.blurbGone, String(sp.blurbGone));
            v('sp-owl-circles', sp.navW === 38 && sp.navRadius === '50%', 'w=' + sp.navW + ' r=' + sp.navRadius);

            // ---- deck-builder CTA: neon-dark card ----
            const cta = await page.evaluate(() => {
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              const card = document.querySelector('.xg-dbc__card');
              return {
                cardGrad: (cs(card, 'backgroundImage') || '').indexOf('linear-gradient') > -1,
                topBar: (card ? getComputedStyle(card, '::before').backgroundImage : '').indexOf('linear-gradient') > -1,
                kicker: cs(document.querySelector('.xg-dbc__kicker'), 'color'),
                title: cs(document.querySelector('.xg-dbc__title'), 'color'),
                sub: cs(document.querySelector('.xg-dbc__sub'), 'color'),
                selBg: cs(document.querySelector('.xg-dbc__select'), 'backgroundColor'),
                inpBg: cs(document.querySelector('.xg-dbc__input'), 'backgroundColor'),
                btnGrad: (cs(document.querySelector('.xg-dbc__btn'), 'backgroundImage') || '').indexOf('linear-gradient') > -1,
                btnRadius: cs(document.querySelector('.xg-dbc__btn'), 'borderRadius'),
                link: cs(document.querySelector('.xg-dbc__link'), 'color')
              };
            });
            console.log('CTA', JSON.stringify(cta));
            v('cta-dark-card', cta.cardGrad, 'gradient=' + cta.cardGrad);
            v('cta-top-bar', cta.topBar, 'gradient=' + cta.topBar);
            v('cta-kicker-glow', cta.kicker === 'rgb(255, 216, 77)', cta.kicker);
            v('cta-title-white', cta.title === 'rgb(255, 255, 255)', cta.title);
            v('cta-fields-light', cta.selBg === 'rgb(255, 255, 255)' && cta.inpBg === 'rgb(245, 246, 248)', cta.selBg + ' / ' + cta.inpBg);
            v('cta-btn', cta.btnGrad && cta.btnRadius === '999px', 'grad=' + cta.btnGrad + ' r=' + cta.btnRadius);

            // ---- locations strip: renamed programs stay inside their pill ----
            const loc = await page.evaluate(() => {
              const wanted = ['Lorcana: Organized Play Store', 'Riftbound: Organized Play Store', 'Upper Deck Diamond Dealer'];
              const progs = Array.from(document.querySelectorAll('.xg-loc__prog'));
              const texts = progs.map(p => p.textContent.trim());
              let overflow = 0, checked = 0;
              progs.forEach(p => {
                const card = p.closest('.xg-loc__card');
                if (!card) return;
                checked++;
                const pr = p.getBoundingClientRect(), cr2 = card.getBoundingClientRect();
                if (pr.right > cr2.right + 1 || pr.left < cr2.left - 1) overflow++;
              });
              const ws = progs[0] ? getComputedStyle(progs[0]).whiteSpace : '';
              return { count: progs.length, checked, overflow, ws, named: wanted.filter(w => texts.indexOf(w) > -1).length, texts: texts.slice(0, 9) };
            });
            console.log('LOCATIONS', JSON.stringify(loc));
            v('loc-progs-present', loc.count >= 7, 'count=' + loc.count);
            v('loc-official-names', loc.named === 3, 'renamed found=' + loc.named + ' :: ' + JSON.stringify(loc.texts));
            v('loc-pills-contained', loc.checked > 0 && loc.overflow === 0, 'checked=' + loc.checked + ' overflow=' + loc.overflow);
            v('loc-pills-wrap', loc.ws === 'normal', loc.ws);

            // ---- cart plumbing regression against mocked endpoints ----
            let mock = false, mockCount = 0;
            const MOCK_ITEM = { id: 999, key: '999:probe', title: 'Probe Card - Near Mint', product_title: 'Probe Card', variant_title: 'Near Mint', quantity: 1, discounted_price: 499, final_price: 499, price: 499, line_price: 499, url: '/products/probe', image: '', handle: 'probe' };
            const safe = (fn) => { try { const r = fn(); if (r && r.catch) r.catch(() => {}); } catch (e) {} };
            page.on('request', req => {
              if (!mock) {
                // surface the scanner's batched candidate list
                if (/\/instock\.json/.test(req.url())) console.log('INSTOCK-REQ', decodeURIComponent(req.url()).slice(0, 420));
                return;
              }
              const url = req.url();
              if (/\/cart\/add\.js/.test(url)) {
                mockCount++;
                const isJson = String(req.postData() || '').trim().startsWith('{');
                safe(() => req.respond({ status: 200, contentType: 'application/json', body: JSON.stringify(isJson ? { items: [MOCK_ITEM] } : MOCK_ITEM) }));
                return;
              }
              if (/\/cart\.js(\?|$)/.test(url)) {
                safe(() => req.respond({ status: 200, contentType: 'application/json', body: JSON.stringify({ item_count: mockCount, items: [], total_price: 499 * mockCount, currency: 'CAD' }) }));
                return;
              }
              safe(() => req.continue());
            });
            const setMock = async (on) => {
              if (on) { mockCount = 0; await page.setRequestInterception(true); mock = true; }
              else { mock = false; await page.setRequestInterception(false); }
            };

            await setMock(true);
            await page.evaluate(() => { const b = document.querySelector('.xg-qa'); b.scrollIntoView({ block: 'center' }); b.click(); });
            await sleep(2200);
            const mRes = await page.evaluate(() => ({
              peekOpen: (function () { const p = document.getElementById('xg-peek'); return !!(p && p.classList.contains('is-open') && p.offsetWidth); })(),
              peekTitle: (document.querySelector('#xg-peek .xg-peek__title') || {}).textContent || '',
              legacyAlert: !!document.querySelector('.alert[data-notify="container"]'),
              badge: (document.querySelector('.cart-qty') || {}).textContent || ''
            }));
            console.log('MOCK-ADD', JSON.stringify(mRes));
            v('qa-add-peek', mRes.peekOpen && mRes.peekTitle.indexOf('Probe Card') > -1, JSON.stringify(mRes));
            v('qa-no-legacy-banner', !mRes.legacyAlert, String(mRes.legacyAlert));
            v('qa-badge-synced', mRes.badge.trim() === '1', 'badge=' + mRes.badge.trim());
            const direct = await page.evaluate(async () => {
              window.xgCartPeek({ title: 'API smoke', qty: 2, cents: 1234 });
              await new Promise(r => setTimeout(r, 300));
              const p = document.getElementById('xg-peek');
              return { open: !!(p && p.classList.contains('is-open')), meta: p ? ((p.querySelector('.xg-peek__meta') || {}).textContent || '') : '' };
            });
            v('peek-money', direct.open && direct.meta.indexOf('2') > -1 && direct.meta.indexOf('12.34') > -1, JSON.stringify(direct));
            await setMock(false);

            // ---------- B. DARK TOGGLE: click, persist, system-follow ----------
            await page.evaluate(() => document.querySelector('#header .header-user-selection .xg-theme-toggle').click());
            await sleep(700);
            const tog1 = await page.evaluate(() => ({
              attr: document.documentElement.getAttribute('data-xg-theme'),
              ls: (function () { try { return localStorage.getItem('xgTheme'); } catch (e) { return 'ERR'; } })(),
              pressed: document.querySelector('#header .header-user-selection .xg-theme-toggle').getAttribute('aria-pressed'),
              bodyBg: getComputedStyle(document.body).backgroundColor
            }));
            console.log('TOGGLE-ON', JSON.stringify(tog1));
            v('toggle-flips-dark', tog1.attr === 'dark' && tog1.bodyBg === 'rgb(16, 20, 22)', JSON.stringify(tog1));
            v('toggle-stores-dark', tog1.ls === 'dark' && tog1.pressed === 'true', tog1.ls + ' / ' + tog1.pressed);

            await page.evaluate(() => document.querySelector('#header .header-user-selection .xg-theme-toggle').click());
            await sleep(700);
            const tog2 = await page.evaluate(() => ({
              attr: document.documentElement.getAttribute('data-xg-theme'),
              ls: (function () { try { return localStorage.getItem('xgTheme'); } catch (e) { return 'ERR'; } })(),
              bodyBg: getComputedStyle(document.body).backgroundColor
            }));
            console.log('TOGGLE-OFF', JSON.stringify(tog2));
            v('toggle-back-light', tog2.attr === null && tog2.ls === 'light' && tog2.bodyBg === 'rgb(245, 246, 247)', JSON.stringify(tog2));

            // no stored pref -> device changes flow through live
            await page.evaluate(() => { try { localStorage.removeItem('xgTheme'); } catch (e) {} });
            await page.emulateMediaFeatures([{ name: 'prefers-color-scheme', value: 'dark' }]);
            await sleep(900);
            const sys1 = await page.evaluate(() => document.documentElement.getAttribute('data-xg-theme'));
            await page.emulateMediaFeatures([{ name: 'prefers-color-scheme', value: 'light' }]);
            await sleep(900);
            const sys2 = await page.evaluate(() => document.documentElement.getAttribute('data-xg-theme'));
            console.log('SYSTEM-FOLLOW', JSON.stringify({ sys1, sys2 }));
            v('system-follow-live', sys1 === 'dark' && sys2 === null, sys1 + ' -> ' + sys2);

            // stored choice beats the device: dark attribute while media says light
            await page.evaluate(() => window.xgSetTheme('dark'));
            await sleep(700);
            const dark = await page.evaluate(() => {
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              const card = document.querySelector('.products-display .grid-view-item');
              return {
                attr: document.documentElement.getAttribute('data-xg-theme'),
                bodyBg: cs(document.body, 'backgroundColor'),
                headerBg: cs(document.querySelector('#header .site-header'), 'backgroundColor'),
                searchBg: cs(document.querySelector('#header #_desktop_search .search-info .search__input'), 'backgroundColor'),
                cardBg: cs(card, 'backgroundColor'),
                logoPlate: cs(document.querySelector('#header .header__logo img'), 'backgroundColor'),
                ntPrice: cs(document.querySelector('#xg-newtoday .xg-nt__price'), 'color'),
                ctaSelBg: cs(document.querySelector('.xg-dbc__select'), 'backgroundColor'),
                ctaTitle: cs(document.querySelector('.xg-dbc__title'), 'color'),
                colorScheme: getComputedStyle(document.documentElement).colorScheme
              };
            });
            console.log('DARK', JSON.stringify(dark));
            v('dark-attr-beats-media', dark.attr === 'dark' && dark.bodyBg === 'rgb(16, 20, 22)', dark.attr + ' / ' + dark.bodyBg + ' (media=light)');
            v('dark-header', dark.headerBg === 'rgb(22, 27, 30)', dark.headerBg);
            v('dark-search-input', dark.searchBg === 'rgb(29, 35, 39)', dark.searchBg);
            v('dark-card-surface', dark.cardBg === 'rgb(24, 29, 32)', dark.cardBg);
            v('dark-logo-plate', dark.logoPlate === 'rgb(255, 255, 255)', dark.logoPlate);
            v('dark-color-scheme', /dark/.test(dark.colorScheme), dark.colorScheme);
            if (dark.ntPrice) v('dark-nt-price', dark.ntPrice === 'rgb(255, 106, 94)', dark.ntPrice);
            v('cta-selfdark-stable', dark.ctaSelBg === 'rgb(255, 255, 255)' && dark.ctaTitle === 'rgb(255, 255, 255)', dark.ctaSelBg + ' / ' + dark.ctaTitle);

            // round 7: hamburger drawer paints dark (computed styles resolve on
            // display:none nodes) and the card-corner clip rule applies (checked
            // on a synthetic card-float fragment; product pages are
            // Cloudflare-flaky from runner IPs and the rule is static CSS).
            const r7 = await page.evaluate(() => {
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              const w = document.getElementById('mobile_top_menu_wrapper');
              const t = w ? w.querySelector('.mobile-menu-category__title .title') : null;
              const x = w ? w.querySelector('#top_menu_closer i') : null;
              const ch = w ? w.querySelector('.mobile-menu-category__dropdown i') : null;
              const frag = document.createElement('div');
              frag.className = 'card-float';
              frag.innerHTML = '<div class="product-single__photo"><img></div>';
              document.body.appendChild(frag);
              const rad = getComputedStyle(frag.querySelector('img')).borderRadius;
              frag.remove();
              return { has: !!w, bg: cs(w, 'backgroundColor'), title: cs(t, 'color'), closer: cs(x, 'color'), chev: cs(ch, 'color'), rad };
            });
            console.log('ROUND7-DARK', JSON.stringify(r7));
            v('drawer-dark-panel', r7.has && r7.bg === 'rgb(22, 27, 30)', r7.bg + ' (has=' + r7.has + ')');
            v('drawer-dark-title', r7.title === 'rgb(238, 242, 244)', r7.title);
            v('drawer-dark-closer', r7.closer === 'rgb(238, 242, 244)', r7.closer);
            if (r7.chev) v('drawer-dark-chevron', r7.chev === 'rgb(183, 194, 201)', r7.chev);
            v('card-corner-clip', /5%/.test(r7.rad) && /3\.6%/.test(r7.rad), r7.rad);

            // ---------- C. SCANNER v3: portrait chrome + sparse photo read ----------
            await page.evaluate(() => document.querySelector('.xg-scan-btn').click());
            await sleep(1500);
            const sc1 = await page.evaluate(() => {
              const o = document.getElementById('xg-scan');
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              const fi = o ? o.querySelector('input[type=file]') : null;
              return {
                open: !!(o && o.classList.contains('is-open') && o.offsetWidth),
                chips: o ? o.querySelectorAll('.xg-scan__game').length : 0,
                fileDisplay: cs(fi, 'display'),
                ctrlPos: cs(o && o.querySelector('.xg-scan__ctrl'), 'position'),
                ctrlBottom: cs(o && o.querySelector('.xg-scan__ctrl'), 'bottom'),
                statusPos: cs(o && o.querySelector('.xg-scan__status'), 'position'),
                spacer: !!(o && o.querySelector('.xg-scan__spacer'))
              };
            });
            console.log('SCAN-OPEN', JSON.stringify(sc1));
            v('scan-opens', sc1.open && sc1.chips === 5, JSON.stringify({ open: sc1.open, chips: sc1.chips }));
            v('scan-file-input-hidden', sc1.fileDisplay === 'none', 'display=' + sc1.fileDisplay + ' (bootstrap input[type=file]{display:block} beaten)');
            v('scan-ctrl-overlay', sc1.ctrlPos === 'absolute' && sc1.ctrlBottom === '0px' && sc1.spacer, sc1.ctrlPos + '/' + sc1.ctrlBottom + ' spacer=' + sc1.spacer);
            v('scan-status-overlay', sc1.statusPos === 'absolute', sc1.statusPos);

            await page.evaluate(() => { const c = document.querySelector('.xg-scan__game[data-g="mtg"]'); if (c) c.click(); });
            const fi = await page.$('#xg-scan input[type=file]');
            await fi.uploadFile('table.jpg');
            let read = '', rows = -1, waited = 0, lastStatus = '';
            while (waited < 150000) {
              await sleep(3000); waited += 3000;
              const st = await page.evaluate(() => ({
                read: (document.querySelector('#xg-scan .xg-scan__read') || {}).textContent || '',
                rows: document.querySelectorAll('#xg-scan .xg-scan__row').length,
                status: (document.querySelector('#xg-scan .xg-scan__status') || {}).textContent || '',
                hasResults: document.getElementById('xg-scan').classList.contains('has-results')
              }));
              lastStatus = st.status;
              if (st.hasResults) { read = st.read; rows = st.rows; console.log('SCAN-STATE', JSON.stringify(st)); break; }
              if (/Couldn/.test(st.status)) { console.log('SCAN-DEAD', JSON.stringify(st)); break; }
              if (waited % 15000 === 0) console.log('SCAN-WAIT', JSON.stringify(st));
            }
            v('scan-sparse-read', /sol/i.test(read), 'read=' + (read || lastStatus).slice(0, 90) + ' after ' + waited + 'ms (card-on-table photo)');
