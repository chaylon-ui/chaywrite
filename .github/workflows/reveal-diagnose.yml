                    : 'no .specialproducts.xg-sp on the page');
            v('sp-head-centered', !!spFit && spFit.headAlign === 'center',
              spFit ? 'text-align=' + spFit.headAlign : 'n/a');
            v('sp-row-fills', !!spFit && spFit.coverage >= 85 && spFit.coverage <= 105,
              spFit ? 'tiles inside the strip box span ' + spFit.coverage + '% of the row (.product-right ' + JSON.stringify(spFit.rightBox) + ') across ' + spFit.tiles + ' tiles, strip ' + JSON.stringify(spFit.stripBox) : 'n/a');
            /* Stacked AND aligned is what "beside" versus "above" actually
               means: same left edge, same width, header sitting above the row
               rather than next to it. The flex layout gave the header a
               shrink-to-fit box on the far left and the carousel a different
               width entirely, so comparing the two boxes is the direct test. */
            v('sp-row-aligned',
              !!spFit && !!spFit.headBox && !!spFit.rightBox
                && Math.abs(spFit.headBox[0] - spFit.rightBox[0]) <= 2
                && Math.abs(spFit.headBox[2] - spFit.rightBox[2]) <= 2
                && (spFit.headBox[1] + spFit.headBox[3]) <= spFit.rightBox[1] + 2,
              spFit ? 'head=' + JSON.stringify(spFit.headBox) + ' row=' + JSON.stringify(spFit.rightBox) : 'n/a');
            v('sp-band-surface', !!spFit && (spFit.secImg || (!!spFit.secBg && spFit.secBg !== 'rgba(0, 0, 0, 0)')),
              spFit ? 'bg=' + spFit.secBg + ' art=' + spFit.secImg : 'n/a');
            /* Round 21: the chevrons must exist AND move the strip. Read
               scrollLeft, click the next control, wait out the smooth
               scroll, read again - then put the strip back so nothing
               downstream measures a scrolled row. */
            const chev = await page.evaluate(() => {
              const sec = document.querySelector('.xg-sp');
              const strip = sec && sec.querySelector('.xg-sp__strip');
              const next = sec && sec.querySelector('.xg-sp__nav .xg-sp__btn[data-d="1"]');
              if (!strip || !next) return { has: !!next, strip: !!strip, before: -1, max: -1 };
              const before = strip.scrollLeft;
              next.click();
              return { has: true, strip: true, before, max: strip.scrollWidth - strip.clientWidth };
            });
            await sleep(1200);
            const chevAfter = await page.evaluate(() => {
              const strip = document.querySelector('.xg-sp .xg-sp__strip');
              const after = strip ? strip.scrollLeft : -1;
              if (strip) strip.scrollLeft = 0;
              return after;
            });
            console.log('SP-CHEVRONS', JSON.stringify(Object.assign({ after: chevAfter }, chev)));
            v('sp-strip-chevrons', chev.has && chev.strip && chevAfter > chev.before,
              'next control=' + chev.has + ' strip=' + chev.strip + ' scrollLeft ' + chev.before + ' -> ' + chevAfter + ' after click (scrollable max ' + chev.max + ')');

            /* ---- Round 17 measurements. Five owner requests, none of which
               should be designed against a screenshot. ---- */

            /* 1. IS THE LOGO ACTUALLY LEGIBLE WITHOUT ITS WHITE PLATE?
               The owner wants the plate gone in dark. CLAUDE.md says the
               asset "is only legible on white", which is why round 9 added
               it - but nobody has measured the file. Two very different
               answers: if the PNG has an OPAQUE WHITE background baked in,
               removing the CSS plate changes nothing visible and the real
               fix is a second asset; if it is transparent, what matters is
               how much of the ink is dark enough to vanish on #161b1e
               (L=0.0106). Sample the pixels and say which. */
            const sampleLogo = () => page.evaluate(() => new Promise((resolve) => {
              const el = document.querySelector('#header .header__logo img');
              if (!el || !(el.currentSrc || el.src)) return resolve({ error: 'no logo img in #header' });
              const im = new Image();
              im.crossOrigin = 'anonymous';
              im.onerror = () => resolve({ error: 'image load or CORS failed', src: (el.currentSrc || el.src).slice(-70) });
              im.onload = () => {
                try {
                  const c = document.createElement('canvas');
                  c.width = im.naturalWidth; c.height = im.naturalHeight;
                  const cx = c.getContext('2d');
                  cx.drawImage(im, 0, 0);
                  const d = cx.getImageData(0, 0, c.width, c.height).data;
                  const lum = (r, g, b) => {
                    const f = [r, g, b].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
                    return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
                  };
                  let clear = 0, solid = 0, dark = 0, sum = 0;
                  for (let i = 0; i < d.length; i += 4) {
                    if (d[i + 3] < 250) { clear++; continue; }
                    solid++;
                    const L = lum(d[i], d[i + 1], d[i + 2]);
                    sum += L;
                    if (L < 0.25) dark++;      // would sit near-invisible on #161b1e
                  }
                  const px = (x, y) => { const i = (y * c.width + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
                  resolve({
                    natural: [c.width, c.height],
                    transparentPct: Math.round((clear / (clear + solid)) * 100),
                    darkPctOfOpaque: solid ? Math.round((dark / solid) * 100) : -1,
                    meanLum: solid ? Math.round((sum / solid) * 1000) / 1000 : -1,
                    corner: px(0, 0),
                    centre: px(c.width >> 1, c.height >> 1),
                    src: (el.currentSrc || el.src).slice(-70)
                  });
                } catch (e) { resolve({ error: 'canvas: ' + String((e && e.message) || e) }); }
              };
              im.src = el.currentSrc || el.src;
            }));
            const logoAsset = await sampleLogo();
            console.log('LOGO-ASSET', JSON.stringify(logoAsset));

            /* 2. WHERE THE LOGO SITS RELATIVE TO THE SEARCH. The owner wants
               it beside the search rather than above-left of it, and 33%
               bigger. Report both boxes, their first COMMON ancestor by
               element identity (the header round already proved class names
               lie about nesting here) and that ancestor's display. */
            const hdrDesk = await page.evaluate(() => {
              const box = (el) => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];
              };
              const cn = (n) => n ? n.tagName + (n.className ? '.' + String(n.className).trim().split(/\s+/).slice(0, 3).join('.') : '') : '';
              const logo = document.querySelector('#header .header__logo img');
              const wrap = logo && logo.closest('.header-logo-section-img, .header-logo-section');
              const search = document.querySelector('#_desktop_search');
              const icons = document.querySelector('#header .header-top .header-user-selection');
              const pw = document.querySelector('#header .header-top.site-header-inner > .page-width');
              const pwr = pw ? pw.getBoundingClientRect() : null;
              const pwPad = pw ? (parseFloat(getComputedStyle(pw).paddingRight) || 0) : 0;
              let common = null;
              if (wrap && search) for (let a = wrap; a; a = a.parentElement) { if (a.contains(search)) { common = a; break; } }
              const chain = [];
              for (let a = wrap; a && chain.length < 5; a = a.parentElement) {
                chain.push({ el: cn(a), disp: getComputedStyle(a).display, box: box(a) });
              }
              return {
                logo: box(logo), wrap: box(wrap), search: box(search),
                icons: box(icons), pw: box(pw), pwPadR: pwPad, pwRight: pwr ? Math.round(pwr.right - pwPad) : -1,
                logoMaxH: logo ? getComputedStyle(logo).maxHeight : '',
                logoMaxW: logo ? getComputedStyle(logo).maxWidth : '',
                common: cn(common), commonBox: box(common),
                commonDisplay: common ? getComputedStyle(common).display : '',
                chain: chain
              };
            });
            console.log('HEADER-DESK', JSON.stringify(hdrDesk));
            /* Round 21 verdicts on the desktop header (owner: logo beside the
               search, 33% larger). Run 113 measured the logo [55,68,52,52]
               ABOVE the search [55,120,500,40] with 636px blank to its right.
               Boxes are [left, top, width, height]. */
            {
              const L = hdrDesk.logo, S = hdrDesk.search, I = hdrDesk.icons;
              const ovl = (L && S) ? Math.min(L[1] + L[3], S[1] + S[3]) - Math.max(L[1], S[1]) : -1;
              v('hdr-logo-beside-search', !!L && !!S && ovl >= 20 && S[0] > L[0] + L[2],
                'logo=' + JSON.stringify(L) + ' search=' + JSON.stringify(S) + ' share ' + ovl + 'px of row; search.left ' + (S ? S[0] : '?') + ' vs logo.right ' + (L ? L[0] + L[2] : '?') + ' (run 113: search 52px under the logo)');
              v('hdr-logo-size', !!L && L[3] >= 68 && L[3] <= 70, 'logo img h=' + (L ? L[3] : '?') + 'px w=' + (L ? L[2] : '?') + 'px (was 52; 52 x 1.33 = 69)');
              v('hdr-search-width', !!S && S[2] >= 500 && S[2] <= 640, '#_desktop_search w=' + (S ? S[2] : '?') + 'px');
              v('hdr-icons-right', !!I && hdrDesk.pwRight > 0 && Math.abs((I[0] + I[2]) - hdrDesk.pwRight) <= 40,
                '.header-user-selection right=' + (I ? I[0] + I[2] : '?') + ' vs outer .page-width content right=' + hdrDesk.pwRight + ' (box ' + JSON.stringify(hdrDesk.pw) + ' pad-r ' + hdrDesk.pwPadR + 'px)');
            }

            /* 3. THE LOCATIONS GRID. Owner: "irregular style, I would like
