name: Diagnose storefront reveal
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1
      - name: Recon ticket-page widget DOM and calendar popover
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const TICKET = 'https://exorgames.com/products/saturday-night-yu-gi-oh-ticket-15?ticket=saturday-night-yu-gi-oh-ticket-15&preview_theme_id=157462692013';
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });

            await page.goto(TICKET, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((r) => setTimeout(r, 10000));
            const tk = await page.evaluate(() => {
              const seen = {};
              const rows = [];
              const walk = (el, depth) => {
                if (!el || depth > 9 || rows.length > 220) return;
                const cls = (el.className && typeof el.className === 'string') ? el.className.trim() : '';
                if (cls && !seen[cls]) {
                  seen[cls] = 1;
                  const r = el.getBoundingClientRect();
                  const txt = (el.children.length === 0 ? (el.textContent || '').trim().slice(0, 42) : '');
                  if (r.width > 0 || r.height > 0) {
                    rows.push(el.tagName.toLowerCase() + '.' + cls.replace(/\s+/g, '.') + ' [' + Math.round(r.width) + 'x' + Math.round(r.height) + ']' + (txt ? ' "' + txt + '"' : ''));
                  }
                }
                [...el.children].forEach((c) => walk(c, depth + 1));
              };
              walk(document.querySelector('main') || document.body, 0);
              const imgs = [...document.querySelectorAll('main img')].slice(0, 10).map((i) => (i.currentSrc || i.src || '').slice(0, 130));
              const btns = [...document.querySelectorAll('main button, main a.btn, main [class*=buy]')].slice(0, 12).map((b) => ({ t: (b.textContent || '').trim().slice(0, 40), c: String(b.className).slice(0, 90) }));
              const stage = document.querySelector('.event-stage');
              return { title: document.title.slice(0, 90), rows, imgs, btns, stageH: stage ? Math.round(stage.getBoundingClientRect().height) : -1, bodyBg: getComputedStyle(document.body).backgroundColor };
            });
            console.log('TICKET_DOM:', JSON.stringify(tk, null, 1));

            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.evaluate(() => { const c = document.getElementById('binderpos-calendar'); if (c) c.scrollIntoView(); });
            await new Promise((r) => setTimeout(r, 6000));
            const cal = await page.evaluate(() => {
              const icon = document.querySelector('#binderpos-calendar .calendar-icon-container');
              if (!icon) return { icon: false };
              icon.click();
              return { icon: true };
            });
            await new Promise((r) => setTimeout(r, 1200));
            const pop = await page.evaluate(() => {
              const p = document.querySelector('#binderpos-calendar .calendar-icon-info');
              const td = document.querySelector('#binderpos-calendar td.calendar-data-block');
              return {
                open: !!p,
                html: p ? p.outerHTML.slice(0, 1600) : '',
                pos: p ? getComputedStyle(p).position : '',
                caret: td ? getComputedStyle(td).caretColor : '',
              };
            });
            console.log('CAL_ICON:', JSON.stringify(cal));
            console.log('POPOVER:', JSON.stringify(pop, null, 1));
            await browser.close();
            console.log('VERDICT: ' + (tk.rows.length ? 'PASS - recon' : 'FAIL - empty ticket DOM'));
            if (!tk.rows.length) process.exit(1);
          })().catch((e) => { console.log('diagnose error:', e.message); process.exit(1); });
          EOF
