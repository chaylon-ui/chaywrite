name: Diagnose storefront reveal
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1
      - name: New Today quick-add end to end
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            const errs = [];
            page.on('pageerror', (e) => { errs.push(String((e && e.stack) || e).slice(0, 200)); });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#xg-newtoday .xg-nt__card', { timeout: 20000 });
            await page.evaluate(() => { document.getElementById('xg-newtoday').scrollIntoView({ block: 'center' }); });
            await new Promise((r) => setTimeout(r, 800));

            const shape = await page.evaluate(() => {
              const cards = document.querySelectorAll('#xg-newtoday .xg-nt__card');
              const btns = document.querySelectorAll('#xg-newtoday .xg-nt__add');
              const b = btns[0];
              const price = document.querySelector('#xg-newtoday .xg-nt__price');
              const cs = b ? getComputedStyle(b) : null;
              return {
                cards: cards.length,
                btns: btns.length,
                vid: b ? +b.getAttribute('data-vid') : 0,
                inThumb: b ? !!b.closest('.xg-nt__thumb') : false,
                round: cs ? cs.borderRadius : '',
                bg: cs ? cs.backgroundColor : '',
                priceColor: price ? getComputedStyle(price).color : '',
              };
            });
            console.log('SHAPE:', JSON.stringify(shape));

            const count0 = await page.evaluate(async () => (await (await fetch('/cart.js')).json()).item_count);
            await page.hover('#xg-newtoday .xg-nt__add');
            await new Promise((r) => setTimeout(r, 300));
            await page.click('#xg-newtoday .xg-nt__add');
            // Catch the transient check state, then let the sync settle.
            let sawAdded = false;
            for (let i = 0; i < 8; i++) {
              await new Promise((r) => setTimeout(r, 300));
              if (await page.evaluate(() => !!document.querySelector('#xg-newtoday .xg-nt__add.is-added'))) { sawAdded = true; break; }
            }
            await new Promise((r) => setTimeout(r, 1500));
            const after = await page.evaluate(async () => {
              const cart = await (await fetch('/cart.js')).json();
              const badges = Array.from(document.querySelectorAll('.cart-qty')).map((b) => b.textContent.trim());
              const b = document.querySelector('#xg-newtoday .xg-nt__add');
              return {
                count: cart.item_count,
                firstItemVid: cart.items && cart.items[0] ? cart.items[0].variant_id : 0,
                badges,
                stillHome: location.pathname === '/',
                btnReset: b ? (!b.classList.contains('is-added') && !b.getAttribute('data-busy')) : false,
              };
            });
            console.log('AFTER:', JSON.stringify({ count0, sawAdded, after }));
            await page.evaluate(() => fetch('/cart/clear.js', { method: 'POST' }));
            const errsBad = errs.filter((e) => !/shopifycloud|shop_events_listener|\/cdn\/wpm\/|web-pixels/.test(e));
            console.log('PAGEERRORS:', JSON.stringify(errsBad));
            await browser.close();
            const ok = shape.cards > 0 && shape.btns > 0 && shape.vid > 0 && shape.inThumb &&
              /50%/.test(shape.round) && shape.bg === 'rgb(214, 44, 40)' && shape.priceColor === 'rgb(214, 44, 40)' &&
              count0 === 0 && sawAdded && after.count === 1 && after.firstItemVid === shape.vid &&
              after.badges.indexOf('1') > -1 && after.stillHome && errsBad.length === 0;
            console.log('VERDICT-QUICKADD: ' + (ok ? 'PASS' : 'FAIL'));
          })().catch((e) => { console.log('VERDICT-QUICKADD: FAIL error ' + e.message); });
          EOF
