name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Remove-all-items link clears the preview cart
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');

          const PREVIEW_CART = 'https://exorgames.com/cart?preview_theme_id=157462692013';
          const LIVE_CART = 'https://exorgames.com/cart';
          const VARIANT = 40397329203373; // Sol Ring [Kaldheim Commander] $3.00 NM, in stock

          async function flow(browser, label) {
            // Fresh context per run: each gets its own empty session cart.
            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            const r = { dialogMsg: null };

            // Empty-cart baseline: the link must NOT render without items.
            await page.goto(PREVIEW_CART, { waitUntil: 'domcontentloaded', timeout: 60000 });
            r.themeId = await page.evaluate(() => (window.Shopify && Shopify.theme && Shopify.theme.id) || null);
            r.emptyHasLink = await page.evaluate(() => !!document.querySelector('.cart__clear-all'));

            // Add one Sol Ring through the storefront cart API (session cart,
            // discarded with the context; the flow ends with the cart cleared).
            r.addStatus = await page.evaluate(async (v) => {
              const resp = await fetch('/cart/add.js', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ id: v, quantity: 1 }),
              });
              return resp.status;
            }, VARIANT);
            await page.goto(PREVIEW_CART, { waitUntil: 'domcontentloaded', timeout: 60000 });
            r.countBefore = await page.evaluate(() => fetch('/cart.js').then((x) => x.json()).then((j) => j.item_count));

            const link = await page.$('.cart__clear-all');
            r.linkPresent = !!link;
            if (link) {
              r.link = await page.evaluate((a) => ({
                text: a.textContent.trim(),
                href: a.getAttribute('href'),
                icon: !!a.querySelector('.fa-trash-o'),
                visible: a.offsetParent !== null,
              }), link);
              page.on('dialog', (d) => { r.dialogMsg = d.message(); d.accept(); });
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 60000 }),
                link.click(),
              ]);
              r.countAfter = await page.evaluate(() => fetch('/cart.js').then((x) => x.json()).then((j) => j.item_count));
              r.emptyMessageShown = await page.evaluate(() => !!document.querySelector('.cart--empty-message'));
              r.linkGoneAfterClear = await page.evaluate(() => !document.querySelector('.cart__clear-all'));
            }
            console.log(label, JSON.stringify(r));
            await ctx.close();
            return r;
          }

          function verdictOf(r) {
            const p = [];
            if (r.themeId !== 157462692013) p.push('preview load served theme ' + r.themeId);
            if (r.emptyHasLink) p.push('link rendered on an EMPTY cart');
            if (r.addStatus !== 200) p.push('cart add failed: HTTP ' + r.addStatus);
            if (!(r.countBefore >= 1)) p.push('cart not populated before clear: ' + r.countBefore);
            if (!r.linkPresent) p.push('no .cart__clear-all link on the populated cart');
            if (r.link) {
              if (!/Remove all items/.test(r.link.text)) p.push('unexpected link text: ' + JSON.stringify(r.link.text));
              if (r.link.href !== '/cart/clear') p.push('unexpected href: ' + r.link.href);
              if (!r.link.icon) p.push('trash icon missing');
              if (!r.link.visible) p.push('link not visible');
            }
            if (!/Remove all items from your cart\?/.test(r.dialogMsg || '')) p.push('confirm dialog missing/unexpected: ' + JSON.stringify(r.dialogMsg));
            if (r.countAfter !== 0) p.push('cart not empty after clear: ' + r.countAfter);
            if (!r.emptyMessageShown) p.push('empty-cart message not shown after clear');
            if (!r.linkGoneAfterClear) p.push('link still present after clear');
            return p;
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            const a = await flow(browser, 'runA:');
            const b = await flow(browser, 'runB:');
            const pa = verdictOf(a);
            const pb = verdictOf(b);

            // Negative control: LIVE cart page in its own fresh context.
            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const lp = await ctx.newPage();
            await lp.goto(LIVE_CART, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const live = await lp.evaluate(() => ({
              themeId: (window.Shopify && Shopify.theme && Shopify.theme.id) || null,
              hasLink: !!document.querySelector('.cart__clear-all'),
            }));
            console.log('live cart (fresh context):', JSON.stringify(live), '(must be live theme 157458727085 with no clear-all link)');
            const liveBad = live.hasLink || live.themeId !== 157458727085;
            await ctx.close();
            await browser.close();

            if (pa.length) console.log('runA problems:', pa);
            if (pb.length) console.log('runB problems:', pb);
            if (liveBad) console.log('PROBLEM: live cart control failed');

            if (!pa.length && !pb.length && !liveBad) {
              console.log('VERDICT: PASS - Remove-all link renders only with items, confirms, and empties the preview cart; live cart untouched');
            } else if (pa.join('|') !== pb.join('|')) {
              console.log('VERDICT: INCONSISTENT - the two runs disagree; treat as flaky, re-run before acting');
              process.exitCode = 1;
            } else {
              console.log('VERDICT: FAIL');
              process.exitCode = 1;
            }
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
