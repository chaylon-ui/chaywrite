name: reveal-diagnose
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Worker endpoints (game param + regression)
        run: |
          set -x
          curl -s 'https://exor-binder.nevski.workers.dev/instock.json?names=Sol%20Ring&max=3&game=mtg' | python3 -c "import json,sys; j=json.load(sys.stdin); print('WORKER mtg ok=%s cards=%d' % (j.get('ok'), len(j.get('cards',[]))))"
          curl -s 'https://exor-binder.nevski.workers.dev/instock.json?names=Pikachu&max=3&game=pokemon' | python3 -c "import json,sys; j=json.load(sys.stdin); print('WORKER pokemon ok=%s cards=%d' % (j.get('ok'), len(j.get('cards',[]))))"
          curl -s 'https://exor-binder.nevski.workers.dev/cards.json?nt=1' | python3 -c "import json,sys; j=json.load(sys.stdin); c=j.get('cards',[]); print('WORKER nt cards=%d withVid=%d' % (len(c), sum(1 for x in c if x.get('variantId'))))"

      - name: Compose a card-on-table photo (v3 sparse OCR path)
        run: |
          # pin the Commander 2021 printing: the DEFAULT printing is now a
          # Marvel one whose art nameplate says TONY STARK in big block
          # letters, and run 77's sparse OCR (correctly) read that instead
          curl -sL -o solring.jpg 'https://api.scryfall.com/cards/named?exact=Sol+Ring&set=c21&format=image&version=large'
          ls -la solring.jpg; file solring.jpg || true
          # the owner's failing photos have the card sitting somewhere inside a
          # larger frame - build exactly that instead of a full-frame card scan
          # (runner image no longer ships ImageMagick, so compose with Pillow)
          python3 -m pip install --quiet pillow || sudo apt-get -yq install python3-pil
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          card = Image.open('solring.jpg').convert('RGB')
          w, h = card.size
          small = card.resize((int(w * 0.7), int(h * 0.7)))
          bg = Image.new('RGB', (1600, 1200), (122, 106, 85))
          bg.paste(small, (520, 120))
          bg.save('table.jpg', quality=92)
          # the owner also photographs cards lying SIDEWAYS on the table -
          # the rotated variant exercises the scanner's rotation retries
          bg.transpose(Image.ROTATE_90).save('table-rot.jpg', quality=92)
          print('table.jpg composed', bg.size, 'card', small.size)
          # v3.5 collector-line rescue: the TITLE band blacked out, the
          # bottom collector line ("263 U" / "C21 * EN") left intact - the
          # scanner must identify the card from set+number alone
          bg2 = Image.new('RGB', (800, 1150), (96, 88, 76))
          bg2.paste(card, (64, 80))
          d = ImageDraw.Draw(bg2)
          d.rectangle([94, 112, 704, 188], fill=(8, 8, 8))
          bg2.save('noname.jpg', quality=92)
          print('noname.jpg composed', bg2.size, 'title blacked')
          PY
          ls -la table.jpg table-rot.jpg noname.jpg; file table.jpg table-rot.jpg noname.jpg

      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22

      - name: Probe preview theme (round 6)
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const T = '157462692013';
          const H = 'https://exorgames.com';
          const u = (p) => H + p + (p.includes('?') ? '&' : '?') + 'preview_theme_id=' + T;
          const TOL = /shopifycloud|shop_events_listener|\/cdn\/wpm\/|web-pixels|sezzle|hotjar|googletagmanager|snize|searchanise|wishy|cloudsearch/i;
          const fails = [];
          const v = (name, ok, detail) => { console.log((ok ? 'VERDICT PASS ' : 'VERDICT FAIL ') + name + ' :: ' + detail); if (!ok) fails.push(name); };
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 950 });
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            page.on('pageerror', e => { const s = String((e && e.stack) || e); if (!TOL.test(s)) console.log('PAGEERR', s.slice(0, 400)); });
            /* Run 99 had nt=0 (the New Today row rendered nothing) one run
               after it passed. That row is drawn by new-today.js served FROM
               the worker, so the theme cannot explain it either way - record
               what every cards.json call actually asked for and got back, so
               an empty day is distinguishable from a broken row. */
            const feedLog = [];
            page.on('response', async (res) => {
              try {
                const url = res.url();
                if (!/exor-binder[^/]*\/cards\.json/.test(url)) return;
                const j = await res.json();
                feedLog.push({ q: (url.split('/cards.json')[1] || '').slice(0, 90), n: ((j && j.cards) || []).length });
              } catch (e) { /* non-JSON, redirected, or body already gone */ }
            });

            const gotoTheme = async (path) => {
              for (let i = 0; i < 4; i++) {
                try { await page.goto(u(path), { waitUntil: 'networkidle2', timeout: 90000 }); } catch (e) { console.log('NAV-ERR', String(e).slice(0, 140)); }
                const ok = await page.evaluate(() => !!document.querySelector('#header .site-header'));
                if (ok) return true;
                const d = await page.evaluate(() => ({ title: document.title, len: document.documentElement.outerHTML.length }));
                console.log('NAV-RETRY', path, JSON.stringify(d));
                await sleep(9000);
              }
              return false;
            };
            const clearCart = () => page.evaluate(() => fetch('/cart/clear.js', { method: 'POST' }).catch(() => null));

            // ---------- A. LIGHT homepage: layout + new bands ----------
            v('nav-home', await gotoTheme('/'), 'theme header present');
            await clearCart();
            await sleep(5000);

            const shape = await page.evaluate(() => {
              const qa = Array.from(document.querySelectorAll('.xg-qa'));
              const card0 = qa[0] ? qa[0].closest('.grid-view-item') : null;
              let vid = '';
              if (card0) {
                const dd = card0.querySelector('select[data-dropdown-id="productSelect-dropdown"]');
                const inp2 = card0.querySelector('.nm-cartmain input[name="prduct-variant"]');
                vid = (dd && !dd.disabled && dd.value) || (inp2 && inp2.value) || '';
              }
              return {
                qaTotal: qa.length,
                nt: document.querySelectorAll('#xg-newtoday .xg-nt__add').length,
                /* Owner, round 12: "the camera icon should only show on
                   mobile". The button is still INJECTED on desktop (the theme
                   clones header markup to the mobile bar, so not injecting it
                   here would remove it there too) - it is hidden by width.
                   Presence is no longer the question; visibility is. */
                camDeskEl: !!document.querySelector('#_desktop_search form.search-header .xg-scan-btn'),
                camDeskShown: (function () {
                  var b = document.querySelector('#_desktop_search form.search-header .xg-scan-btn');
                  return !!(b && b.offsetWidth && getComputedStyle(b).display !== 'none');
                })(),
                vid,
                bodyBg: getComputedStyle(document.body).backgroundColor,
                togDesk: !!document.querySelector('#header .header-user-selection .xg-theme-toggle'),
                togMob: !!document.querySelector('#header .mobile-width-right .xg-theme-toggle'),
                togPressed: (document.querySelector('#header .header-user-selection .xg-theme-toggle') || { getAttribute: () => '' }).getAttribute('aria-pressed')
              };
            });
            const drawerLight = await page.evaluate(() => {
              const w = document.getElementById('mobile_top_menu_wrapper');
              return w ? getComputedStyle(w).backgroundColor : 'missing';
            });
            console.log('SHAPE', JSON.stringify(shape));
            v('light-body', shape.bodyBg === 'rgb(245, 246, 247)', shape.bodyBg);
            v('drawer-light-white', drawerLight === 'rgb(255, 255, 255)', drawerLight);
            v('qa-regression', shape.qaTotal >= 6, 'qa=' + shape.qaTotal);
            console.log('FEED-LOG', JSON.stringify(feedLog));
            v('nt-regression', shape.nt >= 8, 'nt=' + shape.nt + ' cards.json calls=' + JSON.stringify(feedLog));
            v('cam-regression', shape.camDeskEl && !shape.camDeskShown,
              'injected=' + shape.camDeskEl + ' shownOnDesktop=' + shape.camDeskShown + ' (mobile-only by owner request)');
            v('toggle-desktop', shape.togDesk, String(shape.togDesk));
            v('toggle-mobile-slot', shape.togMob, String(shape.togMob));
            v('toggle-unpressed', shape.togPressed === 'false', String(shape.togPressed));

            // ---- specialproduct: modern band, vertical 2-up tiles ----
            const sp = await page.evaluate(() => {
              const heads = document.querySelectorAll('.xg-sp .xg-sp__head');
              const k = document.querySelector('.xg-sp .xg-sp__kicker');
              const t = document.querySelector('.xg-sp .xg-sp__title');
              const wrap = document.querySelector('.xg-sp .grid-view-item .grid-view-item__image-wrapper');
              const desc = document.querySelector('.xg-sp .grid-view-item .product-description');
              const blurb = document.querySelector('.xg-sp .grid-view-item .product-desc');
              const nav = document.querySelector('.xg-sp .owl-nav .owl-next');
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              // the live sports_row uses max_products_rows=1, so there are no
              // .multilevel-item pair wrappers - the side-by-side 2-up comes
              // from owl itself (992px: items 2). Count VISIBLE tiles.
              const active = Array.from(document.querySelectorAll('.xg-sp .owl-item.active .grid-view-item')).filter(el => el.offsetWidth > 0);
              return {
                heads: heads.length,
                oldRedBox: document.querySelectorAll('.xg-sp .title-left').length,
                kColor: cs(k, 'color'), kUpper: cs(k, 'textTransform'),
                tSize: parseFloat(cs(t, 'fontSize') || '0'), tUpper: cs(t, 'textTransform'),
                visTiles: active.length,
                mlCount: document.querySelectorAll('.xg-sp .multilevel-item').length,
                wrapH: wrap ? wrap.offsetHeight : -1, wrapFloat: cs(wrap, 'float'), wrapDisplay: cs(wrap, 'display'),
                descDisplay: cs(desc, 'display'), descFloat: cs(desc, 'float'),
                blurbGone: blurb ? cs(blurb, 'display') === 'none' : true,
                navW: nav ? nav.offsetWidth : -1, navRadius: cs(nav, 'borderRadius')
              };
            });
            console.log('SPECIALPRODUCT', JSON.stringify(sp));
            v('sp-heads', sp.heads >= 1, 'heads=' + sp.heads);
            v('sp-old-redbox-gone', sp.oldRedBox === 0, 'title-left count=' + sp.oldRedBox);
            v('sp-kicker', sp.kColor === 'rgb(214, 44, 40)' && sp.kUpper === 'uppercase', sp.kColor + ' / ' + sp.kUpper);
            v('sp-title', sp.tSize >= 22 && sp.tSize <= 30 && sp.tUpper === 'uppercase', sp.tSize + 'px / ' + sp.tUpper);
            v('sp-two-up', sp.visTiles >= 2, 'visible tiles=' + sp.visTiles + ' (multilevel pairs=' + sp.mlCount + ', max_rows=1 -> owl 2-up)');
            v('sp-tile-vertical', sp.wrapFloat === 'none' && sp.wrapDisplay === 'block' && sp.descFloat === 'none' && sp.descDisplay === 'flex', 'wrap=' + sp.wrapFloat + '/' + sp.wrapDisplay + ' desc=' + sp.descFloat + '/' + sp.descDisplay);
            v('sp-tile-height', sp.wrapH === 205, 'wrapH=' + sp.wrapH);
            v('sp-blurb-hidden', sp.blurbGone, String(sp.blurbGone));
            v('sp-owl-circles', sp.navW === 38 && sp.navRadius === '50%', 'w=' + sp.navW + ' r=' + sp.navRadius);

            // ---- deck-builder CTA: neon-dark card ----
            const cta = await page.evaluate(() => {
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              const card = document.querySelector('.xg-dbc__card');
              return {
                cardGrad: (cs(card, 'backgroundImage') || '').indexOf('linear-gradient') > -1,
                topBar: (card ? getComputedStyle(card, '::before').backgroundImage : '').indexOf('linear-gradient') > -1,
                kicker: cs(document.querySelector('.xg-dbc__kicker'), 'color'),
                title: cs(document.querySelector('.xg-dbc__title'), 'color'),
                sub: cs(document.querySelector('.xg-dbc__sub'), 'color'),
                selBg: cs(document.querySelector('.xg-dbc__select'), 'backgroundColor'),
                inpBg: cs(document.querySelector('.xg-dbc__input'), 'backgroundColor'),
                btnGrad: (cs(document.querySelector('.xg-dbc__btn'), 'backgroundImage') || '').indexOf('linear-gradient') > -1,
                btnRadius: cs(document.querySelector('.xg-dbc__btn'), 'borderRadius'),
                link: cs(document.querySelector('.xg-dbc__link'), 'color')
              };
            });
            console.log('CTA', JSON.stringify(cta));
            v('cta-dark-card', cta.cardGrad, 'gradient=' + cta.cardGrad);
            v('cta-top-bar', cta.topBar, 'gradient=' + cta.topBar);
            v('cta-kicker-glow', cta.kicker === 'rgb(255, 216, 77)', cta.kicker);
            v('cta-title-white', cta.title === 'rgb(255, 255, 255)', cta.title);
            v('cta-fields-light', cta.selBg === 'rgb(255, 255, 255)' && cta.inpBg === 'rgb(245, 246, 248)', cta.selBg + ' / ' + cta.inpBg);
            v('cta-btn', cta.btnGrad && cta.btnRadius === '999px', 'grad=' + cta.btnGrad + ' r=' + cta.btnRadius);

            // round 9: the CTA's example list follows the chosen game
            const ph = await page.evaluate(() => {
              const sel = document.getElementById('xg-dbc-game');
              const ta = document.getElementById('xg-dbc-list');
              if (!sel || !ta) return null;
              const grab = () => ta.getAttribute('placeholder') || '';
              const out = { start: grab() };
              sel.value = 'pokemon';
              sel.dispatchEvent(new Event('change', { bubbles: true }));
              out.poke = grab();
              sel.value = 'mtg';
              sel.dispatchEvent(new Event('change', { bubbles: true }));
              out.back = grab();
              return out;
            });
            console.log('CTA-PH', JSON.stringify(ph));
            v('cta-ph-per-game', !!ph && /Charizard/.test(ph.poke) && /Sol Ring/.test(ph.back) && /Sol Ring/.test(ph.start), ph ? JSON.stringify({ poke: ph.poke.slice(0, 26), back: ph.back.slice(0, 22) }) : 'CTA els missing');

            // round 11: TWO ticker tapes - MTG on top, Pokemon below it at
            // 1.8x the travel time. Each tape has its OWN new-today feed
            // (new-arrivals is MTG Singles only; pokemon-singles-new-arrivals
            // is the Pokemon one), so each is feed-gated SEPARATELY: a quiet
            // day on one game reads as absent-by-design, not a FAIL.
            const tick = await page.evaluate(async () => {
              const feedOf = async (u, g) => {
                try {
                  const r = await fetch('https://exor-binder.nevski.workers.dev' + u);
                  const j = await r.json();
                  const cs = ((j && j.cards) || []).filter(c => c && c.name && c.price);
                  // `mine` is the whole point: counting CARDS passed a run where
                  // both tapes were served the same MTG feed (46 apiece).
                  return { n: cs.length, mine: cs.filter(c => c.game === g).length, top: (j && j.game) || '' };
                } catch (e) { return { n: -1, mine: -1, top: '' }; }
              };
              const feed = {
                mtg: await feedOf('/cards.json?collection=new-arrivals&nt=1', 'mtg'),
                pokemon: await feedOf('/cards.json?collection=pokemon-singles-new-arrivals&nt=1', 'pokemon')
              };
              window.scrollTo(0, 0);
              const t = document.getElementById('xg-ticker');
              if (!t) return { feed, has: false, mtg: { shown: false }, pokemon: { shown: false } };
              const rowOf = (g) => {
                const row = t.querySelector('.xg-tick__row[data-game="' + g + '"]');
                if (!row || row.hidden) return { shown: false };
                const track = row.querySelector('.xg-tick__track');
                const cs = getComputedStyle(track);
                return {
                  shown: true,
                  top: row.getBoundingClientRect().top,
                  items: row.querySelectorAll('.xg-tick__item').length,
                  halves: row.querySelectorAll('.xg-tick__half').length,
                  adds: row.querySelectorAll('.xg-tick__add').length,
                  anim: cs.animationName, state: cs.animationPlayState, dur: parseFloat(cs.animationDuration),
                  label: ((row.querySelector('.xg-tick__label') || {}).textContent || '').trim(),
                  first: ((row.querySelector('.xg-tick__name') || {}).textContent || '').trim(),
                  labelBg: getComputedStyle(row.querySelector('.xg-tick__label')).backgroundImage.slice(0, 46)
                };
              };
              const cs0 = getComputedStyle(t), r0 = t.getBoundingClientRect();
              return {
                feed, has: true,
                onBody: t.parentElement === document.body,
                pos: cs0.position, z: cs0.zIndex,
                rectTop: r0.top, rectBottom: r0.bottom, vh: window.innerHeight, h: t.offsetHeight,
                off: parseFloat(cs0.bottom) || 0,
                bodyPad: parseFloat(getComputedStyle(document.body).paddingBottom) || 0,
                hVar: (getComputedStyle(document.documentElement).getPropertyValue('--xg-tick-h') || '').trim(),
                top: r0.top,
                order: [...t.querySelectorAll('.xg-tick__row')].map(r => r.getAttribute('data-game')).join(','),
                price: t.querySelector('.xg-tick__price') ? getComputedStyle(t.querySelector('.xg-tick__price')).color : '',
                mtg: rowOf('mtg'), pokemon: rowOf('pokemon')
              };
            });
            console.log('TICKER', JSON.stringify(tick));
            /* The bug these exist for: `c=` is not the worker's collection
               param (that is `collection=`), so BOTH tapes were served the
               same MTG feed - and the old check still passed, because it only
               counted cards and got 46 either way. Identity, not volume. */
            v('ticker-feeds-per-game',
              tick.feed.mtg.top === 'mtg' && tick.feed.pokemon.top === 'pokemon'
              && tick.feed.mtg.mine >= 4 && tick.feed.pokemon.mine >= 4,
              'mtg=' + JSON.stringify(tick.feed.mtg) + ' pokemon=' + JSON.stringify(tick.feed.pokemon));
            if (tick.feed.mtg.mine >= 4) {
              v('ticker-mounts', tick.has && tick.mtg.shown && tick.mtg.halves === 2 && tick.mtg.items >= 8 && tick.mtg.adds >= 2,
                'has=' + tick.has + ' mtg items=' + (tick.mtg.items || 0) + ' adds=' + (tick.mtg.adds || 0) + ' feed=' + JSON.stringify(tick.feed.mtg));
              if (tick.has && tick.mtg.shown) {
                /* Pinned to the viewport bottom, floating over the page.
                   onBody matters: inside a transformed ancestor, fixed
                   silently degrades to absolute and the board would scroll
                   away with the content. */
                v('ticker-pinned-bottom',
                  tick.pos === 'fixed' && tick.onBody && Math.abs(tick.rectBottom - (tick.vh - tick.off)) <= 2,
                  'pos=' + tick.pos + ' onBody=' + tick.onBody + ' bottom=' + Math.round(tick.rectBottom)
                  + ' vh=' + tick.vh + ' dodged=' + Math.round(tick.off) + 'px');
                // under the mobile drawer (9998), over ordinary page content
                v('ticker-under-drawer', +tick.z > 100 && +tick.z < 9998, 'z-index=' + tick.z);
                // the page must still end ABOVE the board, or the footer's
                // last strip lives under it forever
                v('ticker-clears-footer',
                  tick.bodyPad >= tick.h + tick.off - 1 && tick.hVar === Math.round(tick.h + tick.off) + 'px',
                  'bodyPad=' + Math.round(tick.bodyPad) + ' boardH=' + tick.h + ' dodge=' + Math.round(tick.off)
                  + ' --xg-tick-h=' + tick.hVar);
                // the actual ask: it follows the scroll instead of leaving with it
                const scrolled = await page.evaluate(async () => {
                  window.scrollTo(0, Math.max(1200, document.body.scrollHeight - window.innerHeight));
                  await new Promise(r => setTimeout(r, 350));
                  const t = document.getElementById('xg-ticker');
                  const r2 = t.getBoundingClientRect();
                  return { y: window.scrollY, top: r2.top, bottom: r2.bottom, vh: window.innerHeight };
                });
                console.log('TICKER-SCROLL', JSON.stringify(scrolled));
                /* Owner: "the ticker loads there until first scroll and then
                   it snaps to bottom." The placement measured at load must
                   equal the one after scrolling - a difference IS the snap. */
                await sleep(400);
                const settled = await page.evaluate(() =>
                  Math.round(parseFloat(getComputedStyle(document.getElementById('xg-ticker')).bottom) || 0));
                v('ticker-no-snap', Math.abs(settled - tick.off) <= 2,
                  'placed at ' + Math.round(tick.off) + 'px on load, ' + settled + 'px after scrolling');
                v('ticker-follows-scroll',
                  scrolled.y > 300 && Math.abs(scrolled.bottom - (scrolled.vh - tick.off)) <= 2,
                  'scrolled to y=' + Math.round(scrolled.y) + ', board bottom still ' + Math.round(scrolled.bottom)
                  + ' (vh ' + scrolled.vh + ' less ' + Math.round(tick.off) + 'px dodge)');
                /* A third-party app iframe (#PBarNextFrame, injected at
                   runtime - it appears nowhere in the theme) owned the tuck
                   lip. The real question is how much of the BOARD it covers:
                   anything it sits on top of cannot be clicked, so if it
                   reaches the tapes then card links and + buttons are dead
                   too, and that is the shopper's problem, not just a test's. */
                const cover = await page.evaluate(() => {
                  const t = document.getElementById('xg-ticker');
                  const r = t.getBoundingClientRect();
                  const f = document.getElementById('PBarNextFrame');
                  const fr = f ? f.getBoundingClientRect() : null;
                  const fcs = f ? getComputedStyle(f) : null;
                  const pts = [];
                  [0.06, 0.5, 0.94].forEach((fx) => {
                    [0.25, 0.75].forEach((fy) => {
                      const x = Math.round(r.left + r.width * fx), y = Math.round(r.top + r.height * fy);
                      const el = document.elementFromPoint(x, y);
                      pts.push({ x, y, own: !!(el && t.contains(el)), el: el ? (el.tagName + (el.id ? '#' + el.id : '')) : null });
                    });
                  });
                  return {
                    board: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)],
                    iframe: fr ? [Math.round(fr.left), Math.round(fr.top), Math.round(fr.width), Math.round(fr.height)] : null,
                    iframeCss: fcs ? { pos: fcs.position, z: fcs.zIndex, pe: fcs.pointerEvents, vis: fcs.visibility, disp: fcs.display } : null,
                    pts
                  };
                });
                console.log('TICKER-COVER', JSON.stringify(cover));
                /* Every sample point across BOTH tapes must belong to the
                   board. 3/6 here meant the whole lower tape was swallowed by
                   the app's bottom bar - card links and + buttons included. */
                v('ticker-clickable', cover.pts.every((p) => p.own),
                  'board-owned points ' + cover.pts.filter((p) => p.own).length + '/' + cover.pts.length
                  + ' dodge=' + Math.round(tick.off) + 'px :: ' + JSON.stringify(cover));
                await page.evaluate(() => window.scrollTo(0, 0));
                await sleep(250);
                v('ticker-marquee', tick.mtg.anim === 'xgTickMove' && tick.mtg.state === 'running' && tick.mtg.dur >= 30,
                  tick.mtg.anim + '/' + tick.mtg.state + '/' + tick.mtg.dur + 's');
                v('ticker-label-mtg', /^MTG$/i.test(tick.mtg.label), JSON.stringify(tick.mtg.label));
                v('ticker-light-price', tick.price === 'rgb(214, 44, 40)', tick.price);
                // hovering ONE tape must pause that tape
                await page.hover('#xg-ticker .xg-tick__row[data-game="mtg"] .xg-tick__label');
                await sleep(400);
                const hov = await page.evaluate(() => {
                  const g = (s) => { const el = document.querySelector(s); return el ? getComputedStyle(el).animationPlayState : ''; };
                  return { mtg: g('#xg-ticker .xg-tick__row[data-game="mtg"] .xg-tick__track'),
                           pokemon: g('#xg-ticker .xg-tick__row[data-game="pokemon"] .xg-tick__track') };
                });
                console.log('TICKER-HOVER', JSON.stringify(hov));
                v('ticker-hover-pause', hov.mtg === 'paused', JSON.stringify(hov));
                await page.mouse.move(700, 620);
                await sleep(300);
              }
            } else {
