name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Hero images drift subtly on scroll (preview homepage)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');

          const PREVIEW = 'https://exorgames.com/?preview_theme_id=157462692013';
          const LIVE = 'https://exorgames.com/';

          function readState(page) {
            return page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              if (!main) return { noMain: true };
              const bg = main.querySelector('.xg-hero__slide.is-active .xg-hero__bg') || main.querySelector('.xg-hero__bg');
              const t = bg ? getComputedStyle(bg).transform : null;
              let ty = null, scale = null;
              if (t && t.startsWith('matrix(')) {
                const m = t.slice(7, -1).split(',').map(Number);
                scale = m[0];
                ty = m[5];
              }
              return {
                parallaxAttr: main.hasAttribute('data-parallax'),
                inited: main.getAttribute('data-xg-par') === '1',
                box: { w: main.offsetWidth, h: main.offsetHeight },
                transform: t,
                ty: ty,
                scale: scale,
                varPar: main.style.getPropertyValue('--xg-par') || null,
                img: bg ? { natW: bg.naturalWidth, natH: bg.naturalHeight, src: (bg.currentSrc || bg.src || '').split('?')[0].split('/').pop() } : null,
              };
            });
          }

          async function flow(browser, label, reducedMotion) {
            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            if (reducedMotion) {
              await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }]);
            }
            await page.goto(PREVIEW, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((res) => setTimeout(res, 2200));
            const r = { reducedMotion: !!reducedMotion };
            r.atTop = await readState(page);
            await page.evaluate(() => window.scrollTo({ top: 420, behavior: 'instant' }));
            await new Promise((res) => setTimeout(res, 400));
            r.scrolled = await readState(page);
            console.log(label, JSON.stringify(r));
            await ctx.close();
            return r;
          }

          function verdictOf(r) {
            const p = [];
            const a = r.atTop, b = r.scrolled;
            if (!a || a.noMain) { p.push('hero main not found'); return p; }
            if (!a.parallaxAttr) p.push('data-parallax attribute missing (setting default not applied?)');
            if (r.reducedMotion) {
              if (a.transform !== 'none') p.push('reduced motion: transform should be none, got ' + a.transform);
              if (b.transform !== 'none') p.push('reduced motion: transform after scroll should be none, got ' + b.transform);
              return p;
            }
            if (!a.inited) p.push('parallax script did not initialize');
            if (a.scale == null || Math.abs(a.scale - 1.1) > 0.01) p.push('bg scale not 1.1: ' + a.scale);
            if (b.scale == null || Math.abs(b.scale - 1.1) > 0.01) p.push('bg scale after scroll not 1.1: ' + b.scale);
            if (a.ty == null || b.ty == null) p.push('no matrix transform on bg');
            else {
              const delta = b.ty - a.ty;
              if (!(delta > 1)) p.push('image did not drift down vs page (delta ' + delta.toFixed(1) + 'px - expected a few px)');
              if (Math.abs(a.ty) > 16 * 1.1 + 1 || Math.abs(b.ty) > 16 * 1.1 + 1) p.push('drift exceeds the 14px clamp (x1.1 scale): ' + a.ty + ' -> ' + b.ty);
            }
            if (!a.box || a.box.w < 500 || a.box.h < 300) p.push('unexpected hero box: ' + JSON.stringify(a.box));
            return p;
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            const a = await flow(browser, 'runA:', false);
            const b = await flow(browser, 'runB:', false);
            const rm = await flow(browser, 'reduced:', true);
            const pa = verdictOf(a);
            const pb = verdictOf(b);
            const pr = verdictOf(rm);

            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const lp = await ctx.newPage();
            await lp.goto(LIVE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((res) => setTimeout(res, 2000));
            const live = await lp.evaluate(() => ({
              themeId: (window.Shopify && Shopify.theme && Shopify.theme.id) || null,
              hasParallax: !!document.querySelector('[data-parallax]'),
            }));
            console.log('live homepage (fresh context):', JSON.stringify(live), '(must be live theme, no data-parallax)');
            const liveBad = live.hasParallax || live.themeId !== 157458727085;
            await ctx.close();
            await browser.close();

            if (pa.length) console.log('runA problems:', pa);
            if (pb.length) console.log('runB problems:', pb);
            if (pr.length) console.log('reduced-motion problems:', pr);
            if (liveBad) console.log('PROBLEM: live control failed');

            if (!pa.length && !pb.length && !pr.length && !liveBad) {
              console.log('VERDICT: PASS - hero image drifts ' + (b.scrolled.ty - b.atTop.ty).toFixed(1) + 'px over a 420px scroll (scale 1.1 bleed), off under reduced motion, live untouched; hero box ' + a.atTop.box.w + 'x' + a.atTop.box.h);
            } else if (pa.join('|') !== pb.join('|')) {
              console.log('VERDICT: INCONSISTENT - the two runs disagree; treat as flaky, re-run before acting');
              process.exitCode = 1;
            } else {
              console.log('VERDICT: FAIL');
              process.exitCode = 1;
            }
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
