name: Reveal diagnose

# Scratch diagnostics against the LIVE site (log-only). Current probe:
# per-ROW ticks + the remainder-as-info-strip in a real headless Chrome.
# Fixture "4 Command Tower / 4 Solitude / 2 Sol Ring" (MTG): Solitude (2
# owned) must show a tinted info strip with no qty/unit/line cells; picking
# Command Tower's pricier WPN copy (1 in stock) splits the line into two
# rows, EACH with its own checkbox; unticking the spill row alone must drop
# exactly its 3 copies from the add count.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 2>&1 | tail -1
      - name: Deck Builder per-row ticks + info strip (real Chrome, live page)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const p = await b.newPage();
            await p.setViewport({ width: 1280, height: 900 });
            const errs = [];
            p.on('pageerror', e => errs.push('pageerror: ' + e.message));
            p.on('requestfailed', r => { if (r.url().indexOf('exor-binder') > -1) errs.push('reqfail: ' + r.url() + ' ' + (r.failure() || {}).errorText); });
            await p.goto('https://exorgames.com/pages/deck-builder', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await p.type('#xg-deck-input', '4 Command Tower\n4 Solitude\n2 Sol Ring');
            await p.evaluate(() => document.getElementById('xg-deck-go').click());
            await p.waitForSelector('.xg-deck__row', { timeout: 90000 });
            const read = () => p.evaluate(() => {
              const short = document.querySelector('.xg-deck__row--short');
              return {
                pickboxes: Array.from(document.querySelectorAll('.xg-deck__pickbox')).map(x => x.getAttribute('data-k') + '=' + x.checked),
                shortInfo: short ? (short.querySelector('.xg-deck__shortinfo') || {}).textContent : null,
                shortHasProductCells: short ? !!(short.querySelector('.xg-deck__unit') || short.querySelector('.xg-deck__qty') || short.querySelector('.xg-deck__cardlink')) : null,
                shortPill: short ? (short.querySelector('.xg-deck__pill') || {}).textContent : null,
                offRows: document.querySelectorAll('.xg-deck__row--off').length,
                addButton: (document.querySelector('.xg-deck__btn--add') || {}).innerText.replace(/\s+/g, ' '),
                rows: Array.from(document.querySelectorAll('.xg-deck__row')).map(el => el.innerText.replace(/\s+/g, ' ').trim().slice(0, 100))
              };
            });
            const s1 = await read();
            console.log('INITIAL: ' + JSON.stringify(s1, null, 1));
            await p.select('.xg-deck__ver[data-i="0"]', '1');
            const s2 = await read();
            console.log('AFTER WPN PICK: ' + JSON.stringify(s2, null, 1));
            await p.evaluate(() => document.querySelectorAll('.xg-deck__pickbox')[1].click());
            const s3 = await read();
            console.log('AFTER UNTICK SPILL ROW: ' + JSON.stringify(s3, null, 1));
            console.log('page errors: ' + (errs.length ? errs.join(' | ') : 'none'));
            await b.close();
            const count = t => { const m = /\((\d+)\)/.exec(String(t)); return m ? +m[1] : NaN; };
            const ok = !!(s1.pickboxes.length === 3 && s1.pickboxes.every(x => /=true$/.test(x)) &&
              s1.shortInfo && s1.shortInfo.indexOf('Solitude') === 0 && s1.shortHasProductCells === false &&
              /2 of 4 available/.test(s1.shortPill || '') &&
              s2.pickboxes.length === 4 &&
              s3.offRows === 1 && count(s3.addButton) === count(s2.addButton) - 3);
            console.log(ok ? 'VERDICT: PASS' : 'VERDICT: FAIL');
          })().catch(e => { console.log('probe error: ' + e.message); });
          EOF
