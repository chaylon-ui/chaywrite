name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Screenshot the /deckstats owner page
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const crypto = require('crypto');

          const PAGE = 'https://exor-binder.nevski.workers.dev/deckstats';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1100, height: 900, deviceScaleFactor: 1.5 });
            await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const t0 = Date.now();
            for (;;) {
              const ready = await page.evaluate(() => !!document.querySelector('#app .tiles, #app .empty, .err'));
              if (ready || Date.now() - t0 > 20000) break;
              await new Promise((r) => setTimeout(r, 400));
            }
            await new Promise((r) => setTimeout(r, 800));
            const state = await page.evaluate(() => ({
              title: document.title,
              tiles: document.querySelectorAll('#app .tile').length,
              tables: document.querySelectorAll('#app table').length,
              err: !!document.querySelector('.err'),
              text: (document.getElementById('app') || {}).textContent ? document.getElementById('app').textContent.replace(/\s+/g, ' ').slice(0, 260) : '',
            }));
            console.log('STATE:', JSON.stringify(state));

            await page.screenshot({ path: 'shot.jpg', type: 'jpeg', quality: 78, fullPage: true });
            await browser.close();

            const buf = fs.readFileSync('shot.jpg');
            console.log('SHOT_SIZE:', buf.length, 'SHOT_MD5:', crypto.createHash('md5').update(buf).digest('hex'));
            const b64 = buf.toString('base64');
            console.log('SHOT_BEGIN');
            for (let i = 0; i < b64.length; i += 6000) console.log('B64:' + b64.slice(i, i + 6000));
            console.log('SHOT_END');

            const ok = state.tiles === 4 && state.tables >= 2 && !state.err;
            console.log('VERDICT: ' + (ok ? 'PASS' : 'FAIL') + ' - ' + state.tiles + ' tiles, ' + state.tables + ' tables, err ' + state.err);
            if (!ok) process.exitCode = 1;
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
