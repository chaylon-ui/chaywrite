name: Reveal diagnose

# Scratch diagnostics against the LIVE site (log-only). Current probe: the
# uniform "Copies in stock at:" sister presentation. "99 Sol Ring" makes a
# partial line (strip must read "... in stock at: <Store> › · <Store> ›");
# "1 Atraxa, Grand Unifier" is a full local miss held by several sisters
# (row must show the label + one identical pill per store, NO prices).
# Consistency-gated against /sisterstock.json for both cards.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 2>&1 | tail -1
      - name: Deck Builder uniform sister list (real Chrome, live page)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const p = await b.newPage();
            await p.setViewport({ width: 1280, height: 900 });
            const errs = [];
            p.on('pageerror', e => errs.push('pageerror: ' + e.message));
            await p.goto('https://exorgames.com/pages/deck-builder', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await p.type('#xg-deck-input', '99 Sol Ring\n1 Atraxa, Grand Unifier');
            await p.evaluate(() => document.getElementById('xg-deck-go').click());
            await p.waitForSelector('.xg-deck__row', { timeout: 90000 });
            try { await p.waitForFunction(() => !!document.querySelector('.xg-deck__shortsister'), { timeout: 20000 }); } catch (e) {}
            const ui = await p.evaluate(() => {
              const strip = document.querySelector('.xg-deck__shortinfo');
              const sisterStat = document.querySelector('.xg-deck__stat--sister');
              return {
                stripText: strip ? strip.textContent : null,
                stripLinks: document.querySelectorAll('.xg-deck__shortsister').length,
                rowLabel: sisterStat ? (sisterStat.querySelector('.xg-deck__sisterlabel') || {}).textContent : null,
                rowPills: sisterStat ? sisterStat.querySelectorAll('.xg-deck__sisterstores a').length : 0,
                rowText: sisterStat ? sisterStat.textContent : null
              };
            });
            const ep = await p.evaluate(() =>
              fetch('https://exor-binder.nevski.workers.dev/sisterstock.json?game=mtg&names=' + encodeURIComponent('Sol Ring|Atraxa, Grand Unifier'))
                .then(r => r.ok ? r.json() : null).catch(() => null));
            console.log('UI: ' + JSON.stringify(ui, null, 1));
            console.log('ENDPOINT: ' + JSON.stringify(ep));
            console.log('page errors: ' + (errs.length ? errs.join(' | ') : 'none'));
            await b.close();
            const by = {}; ((ep && ep.results) || []).forEach(r => { by[r.q] = r.sister; });
            const sol = by['Sol Ring'], atx = by['Atraxa, Grand Unifier'];
            const stripOk = sol
              ? (ui.stripLinks === (sol.stores || []).length && /in stock at:/.test(ui.stripText || '') && !/\$/.test(ui.stripText || ''))
              : ui.stripLinks === 0;
            const rowOk = atx
              ? (ui.rowLabel === 'Copies in stock at:' && ui.rowPills === (atx.stores || []).length && !/\$/.test(ui.rowText || ''))
              : !ui.rowLabel;
            console.log('stripOk=' + stripOk + ' rowOk=' + rowOk);
            console.log(ep && stripOk && rowOk ? 'VERDICT: PASS' : 'VERDICT: FAIL');
          })().catch(e => { console.log('probe error: ' + e.message); });
          EOF
