name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Recon footer dupe, calendar popup stacking, search icon
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const PREVIEW = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 950 });
            await page.goto(PREVIEW, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((r) => setTimeout(r, 4000));
            const theme = await page.evaluate(() => window.Shopify && Shopify.theme && Shopify.theme.id);
            console.log('THEME:', theme);

            // 1. footer: how many newsletter forms/inputs are visible, where
            const footer = await page.evaluate(() => {
              const vis = (el) => { const r = el.getBoundingClientRect(); const cs = getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.display !== 'none' && cs.visibility !== 'hidden'; };
              const mn = document.getElementById('_mobile_newsletter');
              const dn = document.getElementById('_desktop_newsletter');
              const forms = [...document.querySelectorAll('.site-footer form[action*="contact"], .site-footer .newsletter form, .site-footer input[type="email"]')];
              const inputs = [...document.querySelectorAll('.site-footer input[type="email"]')];
              const rect = (el) => { const r = el.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; };
              return {
                mn: mn ? { display: getComputedStyle(mn).display, newsletters: mn.querySelectorAll('.newsletter').length, emailInputs: mn.querySelectorAll('input[type="email"]').length } : null,
                dn: dn ? { display: getComputedStyle(dn).display, newsletters: dn.querySelectorAll('.newsletter').length, emailInputs: dn.querySelectorAll('input[type="email"]').length } : null,
                visibleEmailInputs: inputs.filter(vis).map((i) => ({ r: rect(i), inMn: !!i.closest('#_mobile_newsletter'), inDn: !!i.closest('#_desktop_newsletter'), value: (i.value || '').slice(0, 30) })),
              };
            });
            console.log('FOOTER:', JSON.stringify(footer));

            // 2. search bar geometry + styles
            const search = await page.evaluate(() => {
              const input = document.querySelector('.search-header__input');
              const btn = document.querySelector('.search-header__submit');
              const logo = document.querySelector('.search-logo');
              const info = (el) => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                return { r: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)],
                  pos: cs.position, top: cs.top, right: cs.right, left: cs.left, bottom: cs.bottom,
                  transform: cs.transform, bg: cs.backgroundColor, radius: cs.borderRadius, display: cs.display };
              };
              const form = document.querySelector('form.search-header');
              return { form: info(form), input: info(input), btn: info(btn), logo: info(logo) };
            });
            console.log('SEARCH:', JSON.stringify(search));

            // 3. calendar: click an event icon, identify the popup + what
            // paints over it
            const calReady = await page.evaluate(() => !!document.querySelector('#binderpos-calendar td .calendar-icon'));
            if (!calReady) {
              await page.evaluate(() => { const c = document.getElementById('binderpos-calendar'); if (c) c.scrollIntoView(); });
              await new Promise((r) => setTimeout(r, 3000));
            }
            const cal = await page.evaluate(async () => {
              const icon = document.querySelector('#binderpos-calendar td .calendar-icon');
              if (!icon) return { err: 'no icon' };
              const before = new Set([...document.querySelectorAll('#binderpos-calendar *')]);
              icon.click();
              await new Promise((r) => setTimeout(r, 900));
              const added = [...document.querySelectorAll('#binderpos-calendar *')].filter((el) => !before.has(el));
              // also look for any element that appeared anywhere with MORE INFO
              const more = [...document.querySelectorAll('body *')].filter((el) => el.children.length === 0 && /more info/i.test(el.textContent || ''));
              const popRoot = more.length ? more[0].closest('div[class]') : (added.find((el) => el.offsetHeight > 80) || added[0]);
              const chain = [];
              for (let n = popRoot; n && chain.length < 6 && n !== document.body; n = n.parentElement) {
                const cs = getComputedStyle(n);
                chain.push({ tag: n.tagName, cls: String(n.className).slice(0, 70), pos: cs.position, z: cs.zIndex });
              }
              let coveredBy = null;
              if (popRoot) {
                const r = popRoot.getBoundingClientRect();
                const probe = document.elementFromPoint(Math.round(r.left + r.width / 2), Math.round(r.top + Math.min(60, r.height / 2)));
                if (probe && !popRoot.contains(probe)) {
                  const cs = getComputedStyle(probe);
                  coveredBy = { tag: probe.tagName, cls: String(probe.className).slice(0, 70), pos: cs.position, z: cs.zIndex, transform: cs.transform };
                }
              }
              return { addedCount: added.length, chain, coveredBy,
                iconCs: (() => { const cs = getComputedStyle(icon); return { pos: cs.position, z: cs.zIndex, transform: cs.transform }; })() };
            });
            console.log('CALENDAR:', JSON.stringify(cal));

            await browser.close();
            console.log('VERDICT: PASS - recon only');
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
