name: Reveal diagnose

# Scratch diagnostics against the LIVE site (log-only). Current probe: drive
# the live Deck Builder page in a real headless Chrome — paste a list, submit
# (the page solves its own proof-of-work), then measure the rendered results
# with getComputedStyle. This is the only test that catches theme-CSS bleed
# (.rte table/a rules) that curl and node can never see.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 2>&1 | tail -1
      - name: Deck Builder live-page restyle check (real Chrome)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const p = await b.newPage();
            await p.setViewport({ width: 1280, height: 900 });
            const errs = [];
            p.on('pageerror', e => errs.push('pageerror: ' + e.message));
            p.on('requestfailed', r => { if (r.url().indexOf('exor-binder') > -1) errs.push('reqfail: ' + r.url() + ' ' + (r.failure() || {}).errorText); });
            await p.goto('https://exorgames.com/pages/deck-builder', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('#xg-deck-input', { timeout: 30000 });
            const logo = await p.evaluate(() => new Promise((res) => {
              const img = document.querySelector('.xg-deck__logo');
              if (!img) return res({ present: false });
              const done = () => res({
                present: true, loaded: img.naturalWidth > 0,
                natural: img.naturalWidth + 'x' + img.naturalHeight,
                renderedH: Math.round(img.getBoundingClientRect().height),
                titleFontSize: getComputedStyle(document.querySelector('.xg-deck__title')).fontSize
              });
              if (img.complete) return done();
              img.addEventListener('load', done); img.addEventListener('error', done);
              setTimeout(done, 8000);
            }));
            console.log('TITLE LOGO: ' + JSON.stringify(logo));
            await p.type('#xg-deck-input', '4 Solitude\n1 Humility\n1 Zzz Not A Real Card');
            await p.evaluate(() => document.getElementById('xg-deck-go').click());
            await p.waitForSelector('.xg-deck__row', { timeout: 90000 });
            const r = await p.evaluate(() => {
              const cs = (el, prop) => el ? getComputedStyle(el).getPropertyValue(prop) : null;
              const hrow = document.querySelector('.xg-deck__hrow');
              const row = document.querySelector('.xg-deck__row');
              const name = document.querySelector('.xg-deck__row .xg-deck__name');
              const link = document.querySelector('.xg-deck__cardlink');
              const qty = document.querySelector('.xg-deck__row .xg-deck__qty');
              const pill = document.querySelector('.xg-deck__stat--ok .xg-deck__pill');
              const miss = document.querySelector('.xg-deck__stat--no a');
              return {
                headers: hrow ? hrow.innerText.replace(/\s+/g, ' ').trim() : null,
                rows: document.querySelectorAll('.xg-deck__row').length,
                legacyTablePresent: !!document.querySelector('#xg-deck table'),
                nameText: name && name.textContent,
                nameSize: cs(name, 'font-size'),
                nameWeight: cs(name, 'font-weight'),
                qtyText: qty && qty.textContent,
                qtySize: cs(qty, 'font-size'),
                linkUnderline: cs(link, 'text-decoration-line'),
                rowDisplay: cs(row, 'display'),
                rowBorderTop: cs(row, 'border-top-width') + ' / bottom ' + cs(row, 'border-bottom-width'),
                pill: pill ? pill.textContent + ' bg=' + cs(pill, 'background-color') + ' radius=' + cs(pill, 'border-radius') : null,
                missLink: miss ? miss.textContent.trim() + ' underline=' + cs(miss, 'text-decoration-line') : null,
                sisterPill: (() => { const a = document.querySelector('.xg-deck__stat--sister a');
                  return a ? a.textContent.trim() + ' bg=' + cs(a, 'background-color') + ' fg=' + cs(a, 'color') : null; })(),
                shortPill: (() => { const s = document.querySelector('.xg-deck__stat--short .xg-deck__pill');
                  return s ? s.textContent.trim() + ' bg=' + cs(s, 'background-color') + ' fg=' + cs(s, 'color') : null; })(),
                summaryHead: (document.querySelector('.xg-deck__sumhead') || {}).innerText || null,
                shortNote: (document.querySelector('.xg-deck__shortnote') || {}).textContent || null,
                addButton: (document.querySelector('.xg-deck__btn--add') || {}).innerText || null,
                rowsText: Array.from(document.querySelectorAll('.xg-deck__row')).map(el =>
                  el.innerText.replace(/\s+/g, ' ').trim().slice(0, 110))
              };
            });
            console.log('RESTYLE CHECK: ' + JSON.stringify(r, null, 1));
            // Click "Add in-stock cards to cart" and read the resulting cart:
            // it must hold EXACTLY the shelf count (2 Solitudes), even after
            // a second run against a cart that already holds them. Headless
            // session cart, discarded with the browser — no order, no reserve.
            let cartCheck = null;
            try {
              await p.evaluate(() => document.getElementById('xg-deck-add').click());
              await p.waitForFunction(() => location.pathname === '/cart', { timeout: 30000 });
              cartCheck = await p.evaluate(() =>
                fetch('/cart.js', { headers: { Accept: 'application/json' } }).then(r => r.json())
                  .then(c => c.items.map(i => i.quantity + 'x ' + i.title + ' (v' + i.variant_id + ')')));
            } catch (e) { cartCheck = ['cart check error: ' + e.message]; }
            console.log('CART AFTER ADD: ' + JSON.stringify(cartCheck));
            console.log('page errors: ' + (errs.length ? errs.join(' | ') : 'none'));
            await b.close();
            const ok = !!(r.headers && /qty/i.test(r.headers) && /availability/i.test(r.headers) &&
              parseFloat(r.nameSize) >= 15 && r.linkUnderline === 'none' &&
              r.rowDisplay === 'flex' && !r.legacyTablePresent && r.rows >= 3 &&
              logo.loaded && Math.abs(logo.renderedH - parseFloat(logo.titleFontSize)) <= 2 &&
              (!r.sisterPill || r.sisterPill.indexOf('bg=rgb(176, 117, 20)') > -1));
            console.log(ok ? 'VERDICT: PASS' : 'VERDICT: FAIL');
          })().catch(e => { console.log('probe error: ' + e.message); });
          EOF
