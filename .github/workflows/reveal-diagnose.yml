name: Reveal diagnose

# Scratch diagnostics against the LIVE site (log-only). Current probe: the
# version picker must appear ONLY when a version is left out of the fill.
# Stardust Dragon (Yu-Gi-Oh, several printings) makes it deterministic:
# "99 Stardust Dragon" consumes every copy of every version -> no picker;
# "1 Stardust Dragon" leaves alternatives -> picker with 2+ options.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 2>&1 | tail -1
      - name: Deck Builder picker-usefulness A/B (real Chrome, live page)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const p = await b.newPage();
            await p.setViewport({ width: 1280, height: 900 });
            const errs = [];
            p.on('pageerror', e => errs.push('pageerror: ' + e.message));
            await p.goto('https://exorgames.com/pages/deck-builder', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await p.select('#xg-deck-game', 'yugioh');
            const read = () => p.evaluate(() => ({
              pickers: document.querySelectorAll('.xg-deck__ver').length,
              pickerOptions: (document.querySelector('.xg-deck__ver') || { options: [] }).options.length,
              stockRows: document.querySelectorAll('.xg-deck__pickbox').length,
              shortStrip: !!document.querySelector('.xg-deck__row--short'),
              rows: Array.from(document.querySelectorAll('.xg-deck__row')).slice(0, 8).map(el => el.innerText.replace(/\s+/g, ' ').trim().slice(0, 90))
            }));
            await p.type('#xg-deck-input', '99 Stardust Dragon');
            await p.evaluate(() => document.getElementById('xg-deck-go').click());
            await p.waitForSelector('.xg-deck__row', { timeout: 90000 });
            const exhaust = await read();
            console.log('EXHAUSTED (99x): ' + JSON.stringify(exhaust, null, 1));
            await p.evaluate(() => { document.getElementById('xg-deck-results').innerHTML = ''; document.getElementById('xg-deck-input').value = '1 Stardust Dragon'; document.getElementById('xg-deck-go').click(); });
            await p.waitForSelector('.xg-deck__row', { timeout: 90000 });
            const single = await read();
            console.log('SINGLE (1x): ' + JSON.stringify(single, null, 1));
            console.log('page errors: ' + (errs.length ? errs.join(' | ') : 'none'));
            await b.close();
            const ok = !!(exhaust.stockRows >= 2 && exhaust.pickers === 0 && exhaust.shortStrip &&
              single.pickers === 1 && single.pickerOptions >= 2);
            console.log(ok ? 'VERDICT: PASS' : 'VERDICT: FAIL');
          })().catch(e => { console.log('probe error: ' + e.message); });
          EOF
