name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Hero focus plumbing renders, parallax intact
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');

          const PREVIEW = 'https://exorgames.com/?preview_theme_id=157462692013';
          const LIVE = 'https://exorgames.com/';

          async function inspect(browser, label) {
            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.goto(PREVIEW, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((res) => setTimeout(res, 2200));
            const r = await page.evaluate(() => {
              const out = { themeId: (window.Shopify && Shopify.theme && Shopify.theme.id) || null };
              const main = document.querySelector('.xg-hero__main');
              if (!main) return Object.assign(out, { noMain: true });
              const bgs = Array.from(main.querySelectorAll('.xg-hero__bg'));
              out.bgCount = bgs.length;
              out.positions = bgs.map((b) => getComputedStyle(b).objectPosition);
              out.inlineStyled = bgs.filter((b) => (b.getAttribute('style') || '').indexOf('object-position') > -1).length;
              const active = main.querySelector('.xg-hero__slide.is-active .xg-hero__bg') || bgs[0];
              const t = active ? getComputedStyle(active).transform : null;
              out.scale = t && t.startsWith('matrix(') ? parseFloat(t.slice(7)) : null;
              out.parallaxInit = main.getAttribute('data-xg-par') === '1';
              return out;
            });
            await page.evaluate(() => window.scrollTo({ top: 420, behavior: 'instant' }));
            await new Promise((res) => setTimeout(res, 400));
            r.tyAfter = await page.evaluate(() => {
              const b = document.querySelector('.xg-hero__slide.is-active .xg-hero__bg');
              const t = b ? getComputedStyle(b).transform : '';
              return t && t.startsWith('matrix(') ? parseFloat(t.slice(7, -1).split(',')[5]) : null;
            });
            console.log(label, JSON.stringify(r));
            await ctx.close();
            return r;
          }

          function verdictOf(r) {
            const p = [];
            if (r.themeId !== 157462692013) p.push('wrong theme: ' + r.themeId);
            if (r.noMain) { p.push('hero main missing'); return p; }
            if (!(r.bgCount >= 4)) p.push('expected >=4 slide images, saw ' + r.bgCount);
            const bad = (r.positions || []).filter((v) => !/^\d+(\.\d+)?% \d+(\.\d+)?%$/.test(v));
            if (bad.length) p.push('non-percent object-position values: ' + JSON.stringify(bad));
            if (r.scale == null || Math.abs(r.scale - 1.1) > 0.01) p.push('parallax scale lost: ' + r.scale);
            if (!r.parallaxInit) p.push('parallax script did not initialize');
            if (r.tyAfter == null || !(r.tyAfter > 0)) p.push('parallax drift not applied after scroll: ' + r.tyAfter);
            return p;
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const a = await inspect(browser, 'runA:');
            const b = await inspect(browser, 'runB:');
            const pa = verdictOf(a);
            const pb = verdictOf(b);

            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const lp = await ctx.newPage();
            await lp.goto(LIVE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const liveTheme = await lp.evaluate(() => (window.Shopify && Shopify.theme && Shopify.theme.id) || null);
            console.log('live homepage (fresh context): theme', liveTheme);
            const liveBad = liveTheme !== 157458727085;
            await ctx.close();
            await browser.close();

            if (pa.length) console.log('runA problems:', pa);
            if (pb.length) console.log('runB problems:', pb);
            if (liveBad) console.log('PROBLEM: live control failed');

            if (!pa.length && !pb.length && !liveBad) {
              console.log('VERDICT: PASS - hero renders with object-position ' + JSON.stringify(a.positions) + ' (' + a.inlineStyled + ' inline-styled), parallax scale 1.1 + drift intact; live untouched');
            } else if (pa.join('|') !== pb.join('|')) {
              console.log('VERDICT: INCONSISTENT - runs disagree; re-run before acting');
              process.exitCode = 1;
            } else {
              console.log('VERDICT: FAIL');
              process.exitCode = 1;
            }
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
