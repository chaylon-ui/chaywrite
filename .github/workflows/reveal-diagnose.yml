            console.log('NT-ROW', JSON.stringify(ntRow));
            /* Round 21: hover peek. Move the mouse onto the first New Today
               card image for real (the script keys on mouseover plus a 180ms
               settle, then loads a 640px rendition), expect the .xg-peek
               panel on with an <img> at least 200px wide; Escape must take
               it away. The image is scrolled into view FIRST and the scroll
               allowed to settle: the peek hides itself on any window scroll,
               and page.hover() would otherwise scroll and hover in one beat. */
            const peekTarget = await page.evaluate(() => {
              const img = document.querySelector('.xg-nt__card img');
              if (!img) return null;
              img.scrollIntoView({ block: 'center', inline: 'nearest' });
              return { hoverCapable: window.matchMedia('(hover: hover) and (pointer: fine)').matches, nativeHoverFine: window.__xgNativeHoverFine, script: !!window.xgCardPeek, thumbW: img.offsetWidth };
            });
            if (!peekTarget) {
              v('peek-shows', true, 'SKIPPED - no .xg-nt__card img on this render (New Today feed empty)');
            } else {
              await sleep(900);
              const readPeek = () => page.evaluate(() => {
                const p = document.querySelector('.xg-peek');
                const im = p ? p.querySelector('img') : null;
                const cs = p ? getComputedStyle(p) : null;
                const ir = im ? im.getBoundingClientRect() : null;
                return {
                  found: !!p,
                  on: !!p && p.classList.contains('is-on') && parseFloat(cs.opacity) > 0.5 && p.offsetWidth > 0,
                  opacity: cs ? cs.opacity : '',
                  imgW: ir ? Math.round(ir.width) : -1, imgH: ir ? Math.round(ir.height) : -1,
                  src: im ? (im.currentSrc || im.src || '').slice(-60) : ''
                };
              });
              try { await page.hover('.xg-nt__card img'); } catch (e) { console.log('PEEK-HOVER-ERR', String(e).slice(0, 140)); }
              await sleep(700);
              let peekWait = 700;
              let peek = await readPeek();
              const peekAt700 = peek.on && peek.imgW >= 200;
              while (!(peek.on && peek.imgW >= 200) && peekWait < 3000) { await sleep(300); peekWait += 300; peek = await readPeek(); }
              await page.keyboard.press('Escape');
              await sleep(300);
              const peekAfter = await readPeek();
              await page.mouse.move(5, 5);
              console.log('PEEK', JSON.stringify(Object.assign({ target: peekTarget, waitedMs: peekWait, at700: peekAt700, afterEscape: peekAfter }, peek)));
              v('peek-shows', peek.on && peek.imgW >= 200 && !peekAfter.on,
                (peek.on ? '.xg-peek on after ' + peekWait + 'ms' + (peekAt700 ? '' : ' (not yet at 700ms)') : '.xg-peek never showed in ' + peekWait + 'ms (found=' + peek.found + ')')
                  + ' img ' + peek.imgW + 'x' + peek.imgH + ' opacity=' + peek.opacity + ' src=...' + peek.src
                  + ' ; after Escape on=' + peekAfter.on + ' opacity=' + peekAfter.opacity
                  + ' (hover-capable=' + peekTarget.hoverCapable + ', native=' + peekTarget.nativeHoverFine + (peekTarget.nativeHoverFine ? '' : ' - matchMedia hover/pointer shimmed on this headless runner') + '; script=' + peekTarget.script + ' thumb w=' + peekTarget.thumbW + ')');
            }

            // ---- deck-builder CTA: neon-dark card ----
            const cta = await page.evaluate(() => {
