name: Reveal diagnose

# One-shot, log-only: reproduce exactly what the card-page reveal does in a
# shopper's browser, against the LIVE worker + storefront, so "button says
# not-buying" reports can be pinned to a layer (stale client, stale rules,
# probe response, rule matching, product data — or browser-only behavior
# like CORS and [hidden] semantics, which curl and node cannot see).

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-site-improvements-ztgdt8

      - name: Feed truth for the comparison card (runner-side)
        run: |
          B=https://portal.binderpos.com/external/shopify
          echo "== raw feed query: pokemon title 'Gengar & Mimikyu' — every variant with price + stamps =="
          BODY=$(jq -nc '{storeUrl:"most-wanted-ca.myshopify.com", game:"pokemon", title:"Gengar & Mimikyu", limit:25, offset:0, instockOnly:false}')
          curl -sS --max-time 30 -H 'content-type: application/json' -A 'Mozilla/5.0' \
            -H 'origin: https://exorgames.com' -X POST "$B/products/forStore" --data "$BODY" -o /tmp/gm.json || true
          jq -r '.products[]? | .title as $t | .variants[]? | [$t[0:60], .title, (.price//"-"), (.cashBuyPercent//"null"), (.creditBuyPercent//"null")] | @tsv' /tmp/gm.json || head -c 400 /tmp/gm.json
          echo ""
          echo "== CORS preflight of the feed endpoint (viability of a browser-side lookup) =="
          curl -sS --max-time 20 -o /dev/null -D - -X OPTIONS "$B/products/forStore" \
            -H 'origin: https://exorgames.com' \
            -H 'access-control-request-method: POST' \
            -H 'access-control-request-headers: content-type' | tr -d '\r' | grep -i -e '^HTTP' -e '^access-control' || true

      - name: Worker path for the same card
        run: |
          W=https://exor-binder.nevski.workers.dev
          echo "== /buyprice.json for the comparison card (worker-side feed lookup) =="
          curl -sS --max-time 30 "$W/buyprice.json?name=Gengar%20%26%20Mimikyu%20GX%20(165%2F181)%20%5BSun%20%26%20Moon%3A%20Team%20Up%5D&type=Pokemon%20Single" | jq '{name, available, estimate, source, offers: (.offers | length), sample: .offers[0:3]}' || true
