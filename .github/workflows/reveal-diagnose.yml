name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Recon the BinderPOS calendar event feed
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const PREVIEW = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            const hits = [];
            page.on('response', async (r) => {
              const u = r.url();
              if (/binderpos|calendar|event/i.test(u) && !/\.js$|\.css$|\.png$|\.woff|web\.app\/static/.test(u)) {
                let body = '';
                try {
                  const ct = r.headers()['content-type'] || '';
                  if (/json|text/.test(ct)) body = (await r.text()).slice(0, 900);
                } catch (e) { body = '(unreadable: ' + e.message + ')'; }
                hits.push({ url: u.slice(0, 220), status: r.status(), method: r.request().method(), body });
              }
            });
            await page.goto(PREVIEW, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.evaluate(() => { const c = document.getElementById('binderpos-calendar'); if (c) c.scrollIntoView(); });
            await new Promise((r) => setTimeout(r, 9000));
            console.log('HITS:', JSON.stringify(hits, null, 1));

            // does /pages/events exist, and where does the site's Events menu point?
            const extra = await page.evaluate(async () => {
              const res = await fetch('/pages/events', { method: 'HEAD' });
              const links = [...document.querySelectorAll('a[href*="event"]')].slice(0, 6).map((a) => a.getAttribute('href'));
              return { eventsPageStatus: res.status, eventLinks: links };
            });
            console.log('EXTRA:', JSON.stringify(extra));
            await browser.close();
            console.log('VERDICT: PASS - recon only');
          })().catch((e) => { console.log('diagnose error:', e.message); process.exit(1); });
          EOF
