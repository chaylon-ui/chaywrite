               uppercase, so the visible bar is most likely the qikify APP
               menu, whose markup is not in this repo. Name the element that
               actually paints white, and name whatever clips the logo. */
            const deskChrome = await page.evaluate(() => {
              const box = (el) => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];
              };
              const id = (el) => el.tagName
                + (el.id ? '#' + el.id : '')
                + (el.className ? '.' + (el.className || '').toString().trim().split(/\s+/).slice(0, 3).join('.') : '');
              const opaque = (c) => !!c && c !== 'transparent' && c.indexOf('rgba(0, 0, 0, 0)') === -1;

              const wanted = /^(all pre orders|trading cards|sports cards|board games)$/i;
              const link = Array.from(document.querySelectorAll('a,button,div,span'))
                .find((e) => wanted.test((e.textContent || '').trim()) && e.getBoundingClientRect().width > 0);
              const chain = [];
              if (link) {
                for (let n = link; n && n !== document.documentElement; n = n.parentElement) {
                  const cs = getComputedStyle(n);
                  chain.push({ el: id(n).slice(0, 70), bg: cs.backgroundColor, color: cs.color, box: box(n) });
                  if (chain.length >= 9) break;
                }
              }
              const painter = chain.filter((c) => opaque(c.bg))[0] || null;

              const img = Array.from(document.querySelectorAll('#header .header__logo img, #header .header-logo-section-img img'))
                .filter((i) => i.offsetWidth > 0)[0];
              let clipper = null, logo = null;
              if (img) {
                const cs = getComputedStyle(img);
                logo = {
                  natural: [img.naturalWidth, img.naturalHeight],
                  box: box(img),
                  w: cs.width, h: cs.height, maxW: cs.maxWidth, maxH: cs.maxHeight,
                  fit: cs.objectFit, shadow: (cs.boxShadow || '').slice(0, 46)
                };
                const ib = img.getBoundingClientRect();
                for (let n = img.parentElement; n && n !== document.documentElement; n = n.parentElement) {
                  const cs2 = getComputedStyle(n);
                  const nb = n.getBoundingClientRect();
                  const clips = /hidden|clip|scroll|auto/.test(cs2.overflow + cs2.overflowX + cs2.overflowY);
                  const cuts = nb.bottom < ib.bottom - 1 || nb.right < ib.right - 1
                    || nb.top > ib.top + 1 || nb.left > ib.left + 1;
                  if (clips || cuts) {
                    clipper = { el: id(n).slice(0, 70), overflow: cs2.overflow, box: box(n), cuts: cuts, clips: clips };
                    break;
                  }
                }
              }
              return { menuChain: chain, menuPainter: painter, hasTopMenu: !!document.getElementById('top-menu'), logo: logo, clipper: clipper };
            });
            /* Round 14. Three things the owner reported that the source
               cannot answer: the app menu's DROPDOWN panels (still white),
               which homepage section owns the left-hugging photo strip, and
               the deck-builder field inks. All three live on the homepage at
               desktop width, so measure them here. */
            const r14 = await (async () => {
              /* Run 105 hovered "All Pre Orders" and reported four
                 DIV.image-inner tiles as the panel - those are homepage
                 product cards sitting behind the fixed header, not menu
                 markup, so the walk stopped on a false positive and the
                 panel was never found. Identify it by CHANGE instead of by
                 appearance: stamp every tmenu element, snapshot which are
                 visible at rest, and after each hover report only the ones
                 that became visible. A product card cannot enter that set,
                 and a panel the app injects on hover arrives as a fresh
                 stamp rather than being missed. */
              const roots = await page.$$('.tmenu_item--root');
              const stamp = () => page.evaluate(() => {
                window.__xgi = window.__xgi || 0;
                const on = [];
                Array.from(document.querySelectorAll('[class*="tmenu"]')).forEach((n) => {
                  if (!n.hasAttribute('data-xgi')) n.setAttribute('data-xgi', String(++window.__xgi));
                  const r = n.getBoundingClientRect();
                  if (r.width < 40 || r.height < 18) return;
                  const cs = getComputedStyle(n);
                  if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity < 0.05) return;
                  on.push(n.getAttribute('data-xgi'));
                });
                return on;
              });
              const describe = (ids) => page.evaluate((list) => {
                const cn = (n) => n.tagName + (n.className ? '.' + String(n.className).trim().split(/\s+/).slice(0, 3).join('.') : '');
                return list.slice(0, 12).map((k) => {
                  const n = document.querySelector('[data-xgi="' + k + '"]');
                  if (!n) return null;
                  const r = n.getBoundingClientRect(), cs = getComputedStyle(n);
                  const up = [];
                  for (let a = n.parentElement; a && up.length < 3; a = a.parentElement) up.push(cn(a));
                  return {
                    el: cn(n).slice(0, 60),
                    bg: cs.backgroundColor,
                    ink: cs.color,
                    pos: cs.position,
                    box: [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)],
                    up: up.join(' < ').slice(0, 90)
                  };
                }).filter(Boolean);
              }, ids);
              let hits = [], hovered = '';
              const atRest = await stamp();
              for (let i = 0; i < roots.length && i < 9; i++) {
                try { await roots[i].hover(); } catch (e) { continue; }
                await sleep(700);
                const now = await stamp();
                const fresh = now.filter((k) => atRest.indexOf(k) === -1);
                if (fresh.length >= 3) {
                  hits = await describe(fresh);
                  hovered = await page.evaluate((n) => {
                    const el = document.querySelectorAll('.tmenu_item--root')[n];
                    return el ? (el.textContent || '').trim().slice(0, 24) : '';
                  }, i);
                  break;
                }
              }
              console.log('R14-MENU-HOVERED', hovered || 'no root item of the first 9 revealed new tmenu elements');
              console.log('R14-MENU-PANELS2', JSON.stringify(hits));
              /* The panel is the biggest absolutely-positioned thing the
                 hover revealed. Asserting on THAT rather than on "no light
                 element remains" - an empty list would also be what a panel
                 that never opened looks like, and this check exists because
                 exactly that went unnoticed for two rounds. */
              const darkish = (c) => { const m = (c || '').match(/\d+/g); return !!m && m.length >= 3 && (+m[0] + +m[1] + +m[2]) < 300; };
              const panel = hits.filter((h) => h.pos === 'absolute')
                .sort((a, b) => b.box[2] * b.box[3] - a.box[2] * a.box[3])[0];
              v('dark-menu-panel', !!panel && darkish(panel.bg),
                panel ? panel.el + ' bg=' + panel.bg + ' ink=' + panel.ink + ' box=' + JSON.stringify(panel.box)
                      : 'no absolutely-positioned tmenu panel opened on any of the first 9 root items');
              return page.evaluate(() => {
                const box = (el) => {
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];
                };
                const id = (el) => el.tagName
                  + (el.id ? '#' + el.id : '')
                  + (el.className ? '.' + (el.className || '').toString().trim().split(/\s+/).slice(0, 3).join('.') : '');
                const opaque = (c) => !!c && c !== 'transparent' && c.indexOf('rgba(0, 0, 0, 0)') === -1;

                // Every visible descendant of the menu that paints a light bg
                const panels = [];
                const nav = document.querySelector('nav.tmenu_navbar');
                if (nav) {
                  Array.from(nav.querySelectorAll('*')).forEach((n) => {
                    if (panels.length >= 6) return;
                    const r = n.getBoundingClientRect();
                    if (r.width < 150 || r.height < 80) return;
                    const bg = getComputedStyle(n).backgroundColor;
                    if (!opaque(bg)) return;
                    const m = bg.match(/\d+/g);
                    if (!m || (+m[0] + +m[1] + +m[2]) < 360) return;   // light only
                    panels.push({ el: id(n).slice(0, 64), bg: bg, box: box(n) });
                  });
                }

                // The photo strip: find the heading, then its section + the
                // row that holds the images, and compare their boxes.
                let strip = null;
                const h = Array.from(document.querySelectorAll('h1,h2,h3,h4,div,span'))
                  .filter((e) => /A PLACE TO PLAY/i.test((e.textContent || '').trim()) && e.getBoundingClientRect().width > 0)
                  .pop();
                if (h) {
                  const sec = h.closest('.shopify-section') || h.closest('section') || h.parentElement;
                  const imgs = sec ? Array.from(sec.querySelectorAll('img')).filter((i) => i.offsetWidth > 20) : [];
                  /* Run 105's class-name guess for the holder returned
                     null, so display/justify-content were both blank and
                     nothing about the layout could be read. Derive it from
                     the images instead: the nearest ancestor containing at
                     least half of them IS the row, whatever it is called. */
                  let holder = null;
                  if (imgs.length) {
                    const need = Math.max(2, Math.ceil(imgs.length / 2));
                    for (let a = imgs[0].parentElement; a && a !== document.body; a = a.parentElement) {
                      if (imgs.filter((im) => a.contains(im)).length >= need) { holder = a; break; }
                    }
                  }
                  const par = holder ? holder.parentElement : null;
                  const cst = (el, p) => el ? getComputedStyle(el)[p] : '';
                  strip = {
                    section: sec ? id(sec).slice(0, 64) : '',
                    secBox: box(sec),
                    holder: holder ? id(holder).slice(0, 64) : '',
                    holderBox: box(holder),
                    holderDisp: cst(holder, 'display'),
                    holderJustify: cst(holder, 'justifyContent'),
                    holderWrap: cst(holder, 'flexWrap'),
                    holderGap: cst(holder, 'gap'),
                    holderPad: cst(holder, 'padding'),
                    holderAlign: cst(holder, 'textAlign'),
                    holderOverflow: cst(holder, 'overflowX'),
                    parent: par ? id(par).slice(0, 48) : '',
                    parentBox: box(par),
                    parentDisp: cst(par, 'display'),
                    n: imgs.length,
                    imgs: imgs.slice(0, 8).map((im) => {
                      const b = im.getBoundingClientRect();
                      return [Math.round(b.left), Math.round(b.width)];
                    })
                  };
                }

                // Deck-builder CTA fields
                const ta = document.getElementById('xg-deck-input');
                const sel = document.getElementById('xg-deck-game');
                const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
                return {
                  panels: panels,
                  strip: strip,
                  deck: {
                    taBg: cs(ta, 'backgroundColor'), taColor: cs(ta, 'color'),
                    selBg: cs(sel, 'backgroundColor'), selColor: cs(sel, 'color')
                  }
                };
              });
            })();
            console.log('R14-MENU-PANELS', JSON.stringify(r14.panels));
            console.log('R14-PHOTO-STRIP', JSON.stringify(r14.strip));
            console.log('R14-DECK-FIELDS', JSON.stringify(r14.deck));

            /* Owner: "because of dark mode there are several parts of the site
               that need to adjust font colors like this". Chasing those one
               screenshot at a time has cost two rounds, so sweep instead:
               every visible text node on this page in DARK, its computed ink
               against the first opaque background above it, scored by the
               WCAG contrast formula. Anything under 4.5:1 (3:1 for large
               text) is reported worst-first with a selector to fix it by.
               Homepage only — product and search pages are unreachable from
               this runner, so those stay manual. */
            const contrast = await page.evaluate(() => {
              /* Alpha is real. Run 108 scored four homepage rows at 1.0-3.0:1
                 that are not defects at all: the calendar cells, the events
                 chips and the locations pills all paint
                 rgba(255,255,255,.02-.08), and reading that as OPAQUE white
                 scores light ink against white when the surface actually
                 composites to within a few points of the dark ground. Every
                 layer is composited now - the ink over its backdrop, and each
                 translucent background over the one beneath it - down to the
                 first opaque surface, or the body's own ground when there is
                 none above it.

                 A background-IMAGE is invisible to backgroundColor, so a
                 gradient chip - the ticker's gold FOIL badge - scored against
                 the card behind it and read 2.7:1 when the chip is gold on
                 gold. Those rows are excluded AND COUNTED, so the exclusion
                 shows up in the log rather than quietly shrinking the list. */
              const parse = (c) => {
                const m = (c || '').match(/[\d.]+/g);
                if (!m || m.length < 3) return null;
                return { r: +m[0], g: +m[1], b: +m[2], a: m.length > 3 ? +m[3] : 1 };
              };
              const over = (fg, bg) => ({
                r: fg.r * fg.a + bg.r * (1 - fg.a),
                g: fg.g * fg.a + bg.g * (1 - fg.a),
                b: fg.b * fg.a + bg.b * (1 - fg.a),
                a: 1
              });
              const lum = (c) => {
                const f = [c.r, c.g, c.b].map((v) => {
                  v /= 255;
                  return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
                });
                return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
              };
              const sel = (el) => el.tagName.toLowerCase()
                + (el.id ? '#' + el.id : '')
                + (el.className ? '.' + (el.className || '').toString().trim().split(/\s+/).slice(0, 2).join('.') : '');
              const bodyBg = parse(getComputedStyle(document.body).backgroundColor);
              const ground = (bodyBg && bodyBg.a === 1) ? bodyBg : { r: 255, g: 255, b: 255, a: 1 };
              const bgOf = (el) => {
                const layers = [];
                let from = null, grad = '';
                for (let n = el; n; n = n.parentElement) {
                  const cs = getComputedStyle(n);
                  if (!grad && cs.backgroundImage && cs.backgroundImage !== 'none') grad = sel(n);
                  const c = parse(cs.backgroundColor);
                  if (!c || c.a === 0) continue;
                  if (!from) from = n;
                  layers.push(c);
                  if (c.a === 1) break;
                }
                let base = (layers.length && layers[layers.length - 1].a === 1) ? layers.pop() : ground;
                for (let i = layers.length - 1; i >= 0; i--) base = over(layers[i], base);
                return { col: base, css: from ? getComputedStyle(from).backgroundColor : 'body ground', from: from, grad: grad };
              };
              const bad = [];
              let grads = 0;
              Array.from(document.querySelectorAll('body *')).forEach((el) => {
                if (bad.length >= 400) return;
                const txt = Array.from(el.childNodes)
                  .filter((n) => n.nodeType === 3 && n.textContent.trim().length > 1)
                  .map((n) => n.textContent.trim()).join(' ');
                if (!txt) return;
                const r = el.getBoundingClientRect();
                if (r.width < 8 || r.height < 6) return;
                const cs = getComputedStyle(el);
                if (cs.visibility === 'hidden' || cs.display === 'none' || +cs.opacity === 0) return;
                const inkRaw = parse(cs.color);
                if (!inkRaw) return;
                const bgi = bgOf(el);
                const fg = lum(over(inkRaw, bgi.col));
                const bg = lum(bgi.col);
                const ratio = (Math.max(fg, bg) + 0.05) / (Math.min(fg, bg) + 0.05);
                const px = parseFloat(cs.fontSize) || 16;
                const large = px >= 24 || (px >= 18.66 && +cs.fontWeight >= 700);
                if (ratio >= (large ? 3 : 4.5)) return;
                if (bgi.grad) { grads++; return; }
                bad.push({
                  s: sel(el).slice(0, 54),
                  t: txt.slice(0, 26),
                  ink: cs.color,
                  bg: bgi.css,
                  onto: 'rgb(' + [bgi.col.r, bgi.col.g, bgi.col.b].map(Math.round).join(',') + ')',
                  bgOn: bgi.from ? sel(bgi.from).slice(0, 34) : '',
                  px: Math.round(px),
                  r: Math.round(ratio * 10) / 10
                });
              });
              bad.sort((a, b) => a.r - b.r);
              // one row per selector — a repeated card class would flood this
              const seen = {}, uniq = [];
              bad.forEach((b) => { if (!seen[b.s]) { seen[b.s] = 1; uniq.push(b); } });
              return { total: bad.length, grads: grads, worst: uniq.slice(0, 18) };
            });
            console.log('DARK-CONTRAST total=' + contrast.total
              + ' gradient-backed-excluded=' + contrast.grads, JSON.stringify(contrast.worst));

            /* Round 14 acceptance: the grid card price, and the photo row the
               owner asked to be centred. Both were shipped on a reading of
               the source and neither had ever been measured. */
            const priceInk = await page.evaluate(() => {
              const el = document.querySelector('.grid-view-item__meta .is-bold');
              return el ? getComputedStyle(el).color : '(no grid price on the page)';
            });
            v('dark-grid-price-ink', priceInk === 'rgb(255, 106, 94)',
              priceInk + ' — theme.css paints this var(--brand-secondary) through a SEVEN-class selector, so the dark rule needs weight, not a longer selector');
            const strip = r14.strip;
            if (strip && strip.holderBox && strip.imgs && strip.imgs.length) {
              const gapL = strip.imgs[0][0] - strip.holderBox[0];
              const lastImg = strip.imgs[strip.imgs.length - 1];
              const gapR = (strip.holderBox[0] + strip.holderBox[2]) - (lastImg[0] + lastImg[1]);
              v('photo-strip-centered', Math.abs(gapL - gapR) <= 3,
                'left gap ' + gapL + 'px vs right ' + gapR + 'px across ' + strip.n + ' photos (justify=' + strip.holderJustify + ')');
            } else {
              v('photo-strip-centered', false, 'the reviews-band photo row was not found: ' + JSON.stringify(strip));
            }

            /* PRODUCT-PAGE RULES, PROVEN WITHOUT THE PRODUCT PAGE.
               Cloudflare challenges this runner on /products/*, so three dark
               fixes the owner reported shipped with no verification and the
               owner still reports them dark. Same trick the drawer check uses
               (run 82): build the REAL markup as an in-situ fragment on a page
               we can load, with the REAL deployed stylesheets, and read the
               computed values. That answers the only question that matters -
               does xg-dark.css actually win here - without needing the page.
               Markup copied from snippets/reassurance.liquid,
               snippets/wishlist-product.liquid and
               sections/product-tab-panel.liquid. */
            const frag = await page.evaluate(() => {
              const host = document.createElement('div');
              host.innerHTML =
                '<div class="product-single"><div class="product-single-right">' +
                  '<div class="product-single__meta">' +
                    '<div class="wishlist-chart">' +
                      '<div class="add-to-wishlist"><div class="show">' +
                        '<div class="default-wishbutton-x loading">' +
                          '<a class="add-in-wishlist-js btn" id="xgp-wish">' +
                            '<i class="fa fa-heart-o"></i>' +
                            '<span class="tooltip-label" id="xgp-wishtxt">Add To Wishlist</span>' +
                          '</a>' +
                        '</div>' +
                      '</div></div>' +
                      '<button class="btn btn-primary btn-lg size-chart" id="xgp-grade">Grading Guide</button>' +
                    '</div>' +
                  '</div>' +
                '</div></div>' +
                '<div class="reassurance-block"><div class="reassurance-content row">' +
                  '<div class="reassurance"><div class="reassurance-text">' +
                    '<div class="reassurance-title" id="xgp-rtitle">TCG SINGLES SHIP PROTECTED</div>' +
                    '<div class="reassurance-desc" id="xgp-rdesc">Every singles order ships…</div>' +
                  '</div></div>' +
                '</div></div>' +
                '<div class="page-width product-tab"><div class="tab-content"><div id="desc">' +
                  '<table><tbody><tr><td id="xgp-td">Set:</td><td>World Championship Decks 1997</td></tr></tbody></table>' +
                '</div></div></div>';
              document.body.appendChild(host);
              const cs = (id, p) => {
                const el = document.getElementById(id);
                return el ? getComputedStyle(el)[p] : 'missing';
              };
              const out = {
                rTitle: cs('xgp-rtitle', 'color'),
                rDesc: cs('xgp-rdesc', 'color'),
                rBorder: (function () {
                  const b = host.querySelector('.reassurance-block');
                  return b ? getComputedStyle(b).borderTopColor : 'missing';
                })(),
                wishLink: cs('xgp-wish', 'color'),
                wishText: cs('xgp-wishtxt', 'color'),
                grade: cs('xgp-grade', 'color'),
                tdColor: cs('xgp-td', 'color'),
                tdBorder: cs('xgp-td', 'borderTopColor'),
                tableBg: (function () {
                  const t = host.querySelector('.product-tab table');
                  return t ? getComputedStyle(t).backgroundColor : 'missing';
                })()
              };
              host.remove();
              return out;
            });
            console.log('PROD-FRAGMENT', JSON.stringify(frag));
            /* Dark inks this file sets: title #eef2f4, desc #a9b4ba,
               links/table #c3ccd1, borders #2a3236. Anything still reading
               near-black means the rule lost, and the value names the winner. */
            const light = (c) => {
              const m = (c || '').match(/\d+/g);
              return m && m.length >= 3 && (+m[0] + +m[1] + +m[2]) >= 330;
            };
            v('prod-reassurance-ink', light(frag.rTitle) && light(frag.rDesc),
              'title=' + frag.rTitle + ' desc=' + frag.rDesc + ' border=' + frag.rBorder + ' (theme.css pins #000/#666)');
            v('prod-wishlist-ink', light(frag.wishLink) && light(frag.wishText) && light(frag.grade),
              'link=' + frag.wishLink + ' label=' + frag.wishText + ' grading=' + frag.grade);
            /* This asked the WRONG QUESTION first time round: it checked the
               cell BORDER and passed, while the owner was looking at a white
               grid that is the table's own ground - theme.css carries a bare
               `table { background-color:#fff }`. Check the ground too. */
            v('prod-desc-table', !light(frag.tdBorder) && !light(frag.tableBg),
              'table bg=' + frag.tableBg + ' td border=' + frag.tdBorder + ' ink=' + frag.tdColor);

            /* Owner: "the account and shopping cart logos in dark mode
               disappear". Unlike the product page, this is the homepage
               header at desktop width - reachable, so it gets a real check
               rather than a source-derived guess. */
            const glyphs = await page.evaluate(() => {
              const f = (sel) => {
                const el = document.querySelector(sel);
                if (!el) return 'missing';
                const cs = getComputedStyle(el);
                return cs.fill && cs.fill !== 'none' ? cs.fill : cs.color;
              };
              return {
                cart: f('#_desktop_cart .cart-display .cart-title .cart-logo svg'),
                cartSpan: f('#_desktop_cart .cart-display .cart-title .cart-logo'),
                acct: f('#_desktop_user_info .userinfo-title .userinfo-toggle svg')
              };
            });
            console.log('DESK-GLYPHS', JSON.stringify(glyphs));
            const inked = (c) => {
              const m = (c || '').match(/\d+/g);
              return !!m && m.length >= 3 && (+m[0] + +m[1] + +m[2]) >= 330;
            };
            v('dark-header-glyphs', inked(glyphs.cart) && inked(glyphs.acct),
              'cart=' + glyphs.cart + ' (span ' + glyphs.cartSpan + ') account=' + glyphs.acct
                + ' — theme.css pins the account svg fill:#000; the cart is a <use> with no fill at all');

            console.log('DESK-MENU-PAINTER', JSON.stringify(deskChrome.menuPainter));
            console.log('DESK-MENU-CHAIN', JSON.stringify(deskChrome.menuChain));
            console.log('DESK-LOGO', JSON.stringify(deskChrome.logo), 'hasTopMenu=' + deskChrome.hasTopMenu);
            console.log('DESK-LOGO-CLIPPER', JSON.stringify(deskChrome.clipper));

            const measureLogo = () => page.evaluate(() => {
              window.scrollTo(0, 0);
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              const meas = () => {
                const img = Array.from(document.querySelectorAll('#header .header__logo img')).find(i => i.offsetWidth > 0);
                if (!img) return null;
                const r = img.getBoundingClientRect();
                const head = img.closest('.site-header-mobile') || img.closest('.site-header') || document.getElementById('header');
                return { w: r.width, h: r.height, top: r.top, headH: head ? head.getBoundingClientRect().height : -1, pad: cs(img, 'paddingLeft'), shadow: String(cs(img, 'boxShadow')) };
              };
              document.documentElement.setAttribute('data-xg-theme', 'dark');
              const d = meas();
              document.documentElement.removeAttribute('data-xg-theme');
              const l = meas();
              document.documentElement.setAttribute('data-xg-theme', 'dark');
              return { d, l };
            });
            await page.setViewport({ width: 390, height: 844 });
            await sleep(1500);
