              const barEl = h.querySelector('.site-header-mobile');
              const logoEl = h.querySelector('.header-logo-section-img, .header-logo-section');
              const barChain = barEl ? chain(barEl) : [];
              const logoChain = logoEl ? chain(logoEl) : [];
              /* Common ancestor = the first node of the bar's chain that also
                 appears in the logo's, compared by element identity via a
                 second walk (classes repeat, nodes do not). */
              let common = '';
              if (barEl && logoEl) {
                const seen = [];
                for (let n = logoEl; n && n !== h.parentNode; n = n.parentElement) seen.push(n);
                for (let n = barEl; n && n !== h.parentNode; n = n.parentElement) {
                  if (seen.indexOf(n) > -1) {
                    common = n.tagName + '.' + (n.className || '').toString().slice(0, 34)
                      + ' ' + JSON.stringify(box(n));
                    break;
                  }
                }
              }
              return {
                header: box(h),
                kids,
                items,
                barChain,
                logoChain,
                common,
                shFlow: sh ? getComputedStyle(sh).gridAutoFlow : '',
                shCols: sh ? getComputedStyle(sh).gridTemplateColumns : '',
