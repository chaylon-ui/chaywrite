name: Diagnose storefront reveal
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1
      - name: Popover X closes through the widget toggle and reopens
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.evaluate(() => { document.getElementById('binderpos-calendar').scrollIntoView({ block: 'center' }); });
            await new Promise((r) => setTimeout(r, 6000));

            const sel = '#binderpos-calendar td.calendar-data-block:not(.calendar-inactive-block) .calendar-icon-container';
            async function popState() {
              return page.evaluate(() => {
                const p = document.querySelector('#binderpos-calendar .calendar-icon-info');
                return { open: !!p, hasX: !!(p && p.querySelector('.xg-cal-close')) };
              });
            }

            await page.click(sel);
            await new Promise((r) => setTimeout(r, 1200));
            const open1 = await popState();

            let closed = false, open2 = { open: false, hasX: false }, closed2 = false;
            if (open1.open && open1.hasX) {
              await page.click('#binderpos-calendar .xg-cal-close');
              await new Promise((r) => setTimeout(r, 700));
              closed = !(await popState()).open;

              await page.mouse.move(5, 5);
              await new Promise((r) => setTimeout(r, 500));
              await page.click(sel);
              await new Promise((r) => setTimeout(r, 1200));
              open2 = await popState();

              if (open2.open && open2.hasX) {
                await page.click('#binderpos-calendar .xg-cal-close');
                await new Promise((r) => setTimeout(r, 700));
                closed2 = !(await popState()).open;
              }
            }
            console.log('CYCLE:', JSON.stringify({ open1, closed, open2, closed2 }));
            await browser.close();
            const ok = open1.open && open1.hasX && closed && open2.open && open2.hasX && closed2;
            console.log('VERDICT: ' + (ok ? 'PASS' : 'FAIL'));
            if (!ok) process.exit(1);
          })().catch((e) => { console.log('diagnose error:', e.message); process.exit(1); });
          EOF
