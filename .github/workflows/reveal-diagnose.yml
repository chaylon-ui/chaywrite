name: Reveal diagnose

# Scratch diagnostics against the LIVE site (log-only). Current probe: A/B
# the "Find next-cheapest versions" toggle in a real headless Chrome on the
# live Deck Builder page. 4x Stardust Dragon (Yu-Gi-Oh) is the fixture: the
# store's ladder is 3x NM Limited $2.50 + 1x LP $4.50 + deeper copies, so
# toggle ON should fill 4 across two rows while OFF (single cheapest
# version) fills 3 and shows the warm "3 of 4 available" remainder row.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 2>&1 | tail -1
      - name: Deck Builder toggle A/B (real Chrome, live page)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const p = await b.newPage();
            await p.setViewport({ width: 1280, height: 900 });
            const errs = [];
            p.on('pageerror', e => errs.push('pageerror: ' + e.message));
            p.on('requestfailed', r => { if (r.url().indexOf('exor-binder') > -1) errs.push('reqfail: ' + r.url() + ' ' + (r.failure() || {}).errorText); });
            await p.goto('https://exorgames.com/pages/deck-builder', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('#xg-deck-input', { timeout: 30000 });
            const toggle = await p.evaluate(() => {
              const t = document.getElementById('xg-deck-nextcheap');
              return t ? { present: true, checked: t.checked, label: (t.closest('label') || {}).innerText || '' } : { present: false };
            });
            console.log('TOGGLE: ' + JSON.stringify(toggle));
            async function submitAndRead(label) {
              await p.evaluate(() => document.getElementById('xg-deck-go').click());
              await p.waitForSelector('.xg-deck__row', { timeout: 90000 });
              const r = await p.evaluate(() => {
                const cs = (el, prop) => el ? getComputedStyle(el).getPropertyValue(prop) : null;
                const short = document.querySelector('.xg-deck__stat--short .xg-deck__pill');
                return {
                  rows: Array.from(document.querySelectorAll('.xg-deck__row')).map(el =>
                    el.innerText.replace(/\s+/g, ' ').trim().slice(0, 120)),
                  greenRows: document.querySelectorAll('.xg-deck__stat--ok').length,
                  shortPill: short ? short.textContent.trim() + ' bg=' + cs(short, 'background-color') + ' fg=' + cs(short, 'color') : null,
                  shortName: (document.querySelector('.xg-deck__row--short .xg-deck__name') || {}) .textContent || null,
                  shortNameColor: cs(document.querySelector('.xg-deck__row--short .xg-deck__name'), 'color'),
                  summary: (document.querySelector('.xg-deck__sumhead') || {}).innerText || null,
                  addButton: (document.querySelector('.xg-deck__btn--add') || {}).innerText || null
                };
              });
              console.log(label + ': ' + JSON.stringify(r, null, 1));
              return r;
            }
            await p.select('#xg-deck-game', 'yugioh');
            await p.type('#xg-deck-input', '4 Stardust Dragon');
            const on = await submitAndRead('TOGGLE ON');
            await p.evaluate(() => { document.getElementById('xg-deck-results').innerHTML = ''; document.getElementById('xg-deck-nextcheap').checked = false; });
            const off = await submitAndRead('TOGGLE OFF');
            console.log('page errors: ' + (errs.length ? errs.join(' | ') : 'none'));
            await b.close();
            const ok = !!(toggle.present && toggle.checked &&
              on.greenRows >= 2 && !on.shortPill &&
              off.greenRows === 1 && off.shortPill && off.shortPill.indexOf('available') > -1 &&
              off.shortPill.indexOf('bg=rgb(255, 244, 221)') > -1);
            console.log(ok ? 'VERDICT: PASS' : 'VERDICT: FAIL');
          })().catch(e => { console.log('probe error: ' + e.message); });
          EOF
