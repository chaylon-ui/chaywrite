name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: What does Shopify recommend for Sol Ring (Commander 2018)?
        run: |
          set -e
          PID=$(curl -sS --max-time 20 "https://exorgames.com/products/sol-ring-commander-2018.js" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["id"]); print(d["type"], file=sys.stderr)')
          echo "product_id: $PID"
          curl -sS --max-time 30 "https://exorgames.com/recommendations/products.json?product_id=$PID&limit=10&intent=related" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          prods = d.get("products", [])
          print("count:", len(prods))
          off = 0
          for p in prods:
              t = p.get("type", "")
              print("-", p.get("title", "")[:70], "|", t, "|", p.get("price", ""))
              if t and t != "MTG Single":
                  off += 1
          print("off-type count:", off)
          if off:
              print("VERDICT: FAIL - recommendations cross product types")
              raise SystemExit(1)
          print("VERDICT: PASS - every recommendation is an MTG Single")
          '
