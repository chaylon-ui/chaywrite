            /* Owner: "because of dark mode there are several parts of the site
               that need to adjust font colors like this". Chasing those one
               screenshot at a time has cost two rounds, so sweep instead:
               every visible text node on this page in DARK, its computed ink
               against the first opaque background above it, scored by the
               WCAG contrast formula. Anything under 4.5:1 (3:1 for large
               text) is reported worst-first with a selector to fix it by.
               Homepage only — product and search pages are unreachable from
               this runner, so those stay manual. */
            const contrast = await page.evaluate(() => {
              const lum = (c) => {
                const m = (c || '').match(/[\d.]+/g);
                if (!m || m.length < 3) return null;
                if (m.length > 3 && +m[3] === 0) return null;
                const f = [+m[0], +m[1], +m[2]].map((v) => {
                  v /= 255;
                  return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
                });
                return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
              };
              /* Report the background COLOUR, not just its luminance. Run
                 105 scored three homepage rows at 1.0-1.4:1 and there was no
                 way to tell whether the ink went wrong or the surface under
                 it never went dark - which is the whole question. */
              const bgOf = (el) => {
                for (let n = el; n; n = n.parentElement) {
                  const css = getComputedStyle(n).backgroundColor;
                  const L = lum(css);
                  if (L !== null) return { L: L, css: css, from: n };
                }
                return { L: 0, css: 'body ground', from: null };
              };
              const sel = (el) => el.tagName.toLowerCase()
                + (el.id ? '#' + el.id : '')
                + (el.className ? '.' + (el.className || '').toString().trim().split(/\s+/).slice(0, 2).join('.') : '');
              const bad = [];
              Array.from(document.querySelectorAll('body *')).forEach((el) => {
                if (bad.length >= 400) return;
                const txt = Array.from(el.childNodes)
                  .filter((n) => n.nodeType === 3 && n.textContent.trim().length > 1)
                  .map((n) => n.textContent.trim()).join(' ');
                if (!txt) return;
                const r = el.getBoundingClientRect();
                if (r.width < 8 || r.height < 6) return;
                const cs = getComputedStyle(el);
                if (cs.visibility === 'hidden' || cs.display === 'none' || +cs.opacity === 0) return;
                const fg = lum(cs.color);
                if (fg === null) return;
                const bgi = bgOf(el);
                const bg = bgi.L;
                const ratio = (Math.max(fg, bg) + 0.05) / (Math.min(fg, bg) + 0.05);
                const px = parseFloat(cs.fontSize) || 16;
                const large = px >= 24 || (px >= 18.66 && +cs.fontWeight >= 700);
                if (ratio >= (large ? 3 : 4.5)) return;
                bad.push({
                  s: sel(el).slice(0, 54),
                  t: txt.slice(0, 28),
                  ink: cs.color,
                  bg: bgi.css,
                  bgOn: bgi.from ? sel(bgi.from).slice(0, 38) : '',
                  px: Math.round(px),
                  r: Math.round(ratio * 10) / 10
                });
              });
              bad.sort((a, b) => a.r - b.r);
              // one row per selector — a repeated card class would flood this
              const seen = {}, uniq = [];
              bad.forEach((b) => { if (!seen[b.s]) { seen[b.s] = 1; uniq.push(b); } });
              return { total: bad.length, worst: uniq.slice(0, 18) };
            });
