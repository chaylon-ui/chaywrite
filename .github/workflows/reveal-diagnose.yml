name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Shopper flow with event beacons + admin login capture
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const crypto = require('crypto');

          const PAGE = 'https://exorgames.com/pages/deck-builder';
          const ADMIN = 'https://exor-binder.nevski.workers.dev/deckstats';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1380, height: 980 });
            const beacons = [];
            const errors = [];
            let phase = 'load';
            page.on('response', (r) => { if (r.url().indexOf('/deck-track') > -1) beacons.push(r.status()); });
            page.on('pageerror', (e) => errors.push({
              phase,
              m: String(e && e.message).slice(0, 120),
              s: String((e && e.stack) || '').split('\n').slice(1, 3).join(' | ').slice(0, 200),
            }));

            await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await new Promise((r) => setTimeout(r, 1200));
            await page.evaluate(() => {
              const input = document.getElementById('xg-deck-input');
              input.value = '1 Sol Ring\n1 Counterspell';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              document.getElementById('xg-deck-go').click();
            });
            const t0 = Date.now();
            for (;;) {
              const ready = await page.evaluate(() => {
                const b = document.getElementById('xg-deck-add');
                return !!(b && !b.disabled);
              });
              if (ready || Date.now() - t0 > 60000) break;
              await new Promise((r) => setTimeout(r, 700));
            }

            phase = 'controls';
            // exercise the instrumented controls: untick + retick a line,
            // swap a version, flip the next-cheapest toggle twice
            const controls = await page.evaluate(() => {
              const out = { err: null };
              try {
                const box = document.querySelector('.xg-deck__pickbox');
                box.click();
                out.afterUntick = document.getElementById('xg-deck-add').textContent.replace(/\s+/g, ' ').trim();
                document.querySelector('.xg-deck__pickbox').click();
                out.afterRetick = document.getElementById('xg-deck-add').textContent.replace(/\s+/g, ' ').trim();
                const ver = document.querySelector('select.xg-deck__ver');
                if (ver && ver.options.length > 1) {
                  ver.selectedIndex = 1;
                  ver.dispatchEvent(new Event('change', { bubbles: true }));
                  out.swapped = ver.options[1].text.slice(0, 60);
                }
                const nc = document.getElementById('xg-deck-nextcheap');
                nc.click(); nc.click();
                out.summary = (document.querySelector('.xg-deck__summary') || {}).textContent.replace(/\s+/g, ' ').slice(0, 140);
              } catch (e) { out.err = String(e.message).slice(0, 140); }
              return out;
            });
            console.log('CONTROLS:', JSON.stringify(controls));
            await new Promise((r) => setTimeout(r, 1200));

            phase = 'nav';
            const nav = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
            await page.evaluate(() => document.getElementById('xg-deck-add').click());
            await nav;
            const landed = page.url();
            await new Promise((r) => setTimeout(r, 1500));
            const cart = await page.evaluate(() => fetch('/cart.js', { headers: { Accept: 'application/json' } }).then((r) => r.json()));
            console.log('LANDED:', landed);
            console.log('CART_ATTRS:', JSON.stringify(cart.attributes || {}));
            console.log('BEACONS:', JSON.stringify(beacons));
            console.log('PAGEERRORS:', JSON.stringify(errors.slice(0, 6)));

            // capture the PIN login the owner will see on /deckstats
            const admin = await browser.newPage();
            await admin.setViewport({ width: 1100, height: 760, deviceScaleFactor: 1.5 });
            await admin.goto(ADMIN, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await admin.waitForSelector('#pin', { timeout: 15000 }).catch(() => null);
            await new Promise((r) => setTimeout(r, 600));
            const login = await admin.evaluate(() => ({
              pin: !!document.getElementById('pin'),
              text: document.body.textContent.replace(/\s+/g, ' ').slice(0, 160),
            }));
            console.log('LOGIN:', JSON.stringify(login));
            await admin.screenshot({ path: 'shot.jpg', type: 'jpeg', quality: 78 });
            await browser.close();

            const buf = fs.readFileSync('shot.jpg');
            console.log('SHOT_SIZE:', buf.length, 'SHOT_MD5:', crypto.createHash('md5').update(buf).digest('hex'));
            const b64 = buf.toString('base64');
            console.log('SHOT_BEGIN');
            for (let i = 0; i < b64.length; i += 6000) console.log('B64:' + b64.slice(i, i + 6000));
            console.log('SHOT_END');

            const tag = (cart.attributes || {})['Deck Builder'] || '';
            // nav-phase "Failed to fetch" is the navigation killing other
            // scripts' in-flight requests, not our code - gate on errors
            // raised while the instrumented controls were being driven.
            const hardErrors = errors.filter((e) => e.phase !== 'nav' || e.m.indexOf('Failed to fetch') === -1);
            const ok = !controls.err && /\(1\)/.test(controls.afterUntick || '') && /\(2\)/.test(controls.afterRetick || '') &&
              /Magic: The Gathering, \d+ cards?, \$\d/.test(tag) && landed.indexOf('/cart') > -1 &&
              beacons.length >= 2 && beacons.every((s) => s === 204) && login.pin && hardErrors.length === 0;
            console.log('VERDICT: ' + (ok ? 'PASS' : 'FAIL') + ' - tag "' + tag + '", beacons ' + beacons.length +
              ' all-204 ' + beacons.every((s) => s === 204) + ', untick "' + controls.afterUntick + '", hard errors ' + hardErrors.length + ' (nav noise ' + (errors.length - hardErrors.length) + '), login ' + login.pin);
            if (!ok) process.exitCode = 1;
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
