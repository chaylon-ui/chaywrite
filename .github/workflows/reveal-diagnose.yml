name: Diagnose storefront reveal
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1
      - name: Hero fit-text after the content-height fix
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((r) => setTimeout(r, 5000));

            // The titled (hidden) slide must NOT be floored at load anymore.
            const load = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              if (!main) return null;
              const titled = Array.from(main.querySelectorAll('.xg-hero__content'))
                .find((c) => c.querySelector('.xg-hero__title'));
              const t = titled && titled.querySelector('.xg-hero__title');
              return {
                fit: main.getAttribute('data-xg-fit'),
                titledFs: t ? parseFloat(getComputedStyle(t).fontSize) : null,
              };
            });

            // Typing sim on the ACTIVE slide: short headline keeps full size,
            // monster headline shrinks, panel height never moves.
            const short = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              const content = main.querySelector('.xg-hero__slide.is-active .xg-hero__content') || main.querySelector('.xg-hero__content');
              if (!content) return { noContent: true };
              let title = content.querySelector('.xg-hero__title');
              let injected = false;
              if (!title) {
                title = document.createElement('h2');
                title.className = 'xg-hero__title';
                content.insertBefore(title, content.firstChild);
                injected = true;
              }
              content.setAttribute('data-xgprobe', '1');
              title.textContent = 'GRAND OPENING WEEKEND';
              window.dispatchEvent(new Event('resize'));
              return { injected };
            });
            await new Promise((r) => setTimeout(r, 700));
            const s = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              const title = main.querySelector('[data-xgprobe] .xg-hero__title');
              return { h: Math.round(main.getBoundingClientRect().height), fs: parseFloat(getComputedStyle(title).fontSize) };
            });
            await page.evaluate(() => {
              const title = document.querySelector('[data-xgprobe] .xg-hero__title');
              title.textContent = 'THIS IS A DELIBERATELY VERY LONG HEADLINE TYPED TO CHECK THAT THE HERO PANEL STAYS LOCKED AT ITS HEIGHT WHILE THE TEXT SHRINKS DOWN TO FIT INSTEAD OF GROWING THE WHOLE SECTION TALLER AND TALLER AND TALLER';
              window.dispatchEvent(new Event('resize'));
            });
            await new Promise((r) => setTimeout(r, 700));
            const l = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              const content = main.querySelector('[data-xgprobe]');
              const title = content.querySelector('.xg-hero__title');
              const box = content.closest('.xg-hero__slide') || main;
              return {
                h: Math.round(main.getBoundingClientRect().height),
                fs: parseFloat(getComputedStyle(title).fontSize),
                overflow: content.offsetHeight - box.clientHeight,
              };
            });
            console.log('HERO4:', JSON.stringify({ load, short, s, l }));
            const ok = load && load.fit === '1' &&
              (load.titledFs === null || load.titledFs > 16) &&
              s.fs > 30 && l.h === s.h && l.fs < s.fs && l.overflow <= 2;
            console.log('VERDICT-HERO4: ' + (ok ? 'PASS' : 'FAIL'));
            await browser.close();
          })().catch((e) => { console.log('VERDICT-HERO4: FAIL error ' + e.message); });
          EOF
