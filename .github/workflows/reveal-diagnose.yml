                 mobLeft  [35,153, 50, 50]  the hamburger, on a row of its own
                 mobRight [35,203,355,100]  search/account/cart, another row
                 header   [ 0,  0,390,305]
               xg-features.css now flexes the mobile bar onto one line and grids
               the logo block beside it. Measure at 390 unconditionally - this is
               about the header's ROWS, not about the logo <img> the probe above
               may or may not have found. */
            await page.setViewport({ width: 390, height: 844 });
            await sleep(1200);
            const hdr = await page.evaluate(() => {
              const h = document.getElementById('header');
              if (!h) return null;
              const box = (el) => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];
              };
              const kids = Array.from(h.children).map((c) => ({
                cls: (c.className || '').toString().slice(0, 46),
                disp: getComputedStyle(c).display,
                box: box(c)
              })).filter((c) => c.disp !== 'none');
              const img = Array.from(h.querySelectorAll('.header__logo img')).find((i) => i.offsetWidth > 0);
              /* Run 99: #header has ONE child (.site-header, display:grid), so
                 the real grid items are ITS children - dump them with the
                 placement they actually resolved to. .header-top and
                 .site-header-mobile landing in different rows is the whole
                 failure, and only this says which sibling pushed them apart. */
              const sh = h.querySelector('.site-header');
              const items = sh ? Array.from(sh.children).map((c) => {
                const cs = getComputedStyle(c);
                return {
                  cls: (c.className || '').toString().slice(0, 40),
                  disp: cs.display,
                  col: cs.gridColumnStart + '/' + cs.gridColumnEnd,
                  row: cs.gridRowStart + '/' + cs.gridRowEnd,
                  box: box(c)
                };
              }).filter((c) => c.disp !== 'none') : [];
              /* Run 100: the bar is a DESCENDANT of .header-top, not a
                 sibling - header-top.liquid has a commented-out </div>, so
                 the block that looks closed never is. Walk both elements up
                 to #header and name their real common ancestor; that is the
                 only element that can put them on one row. */
              const chain = (el) => {
                const out = [];
                for (let n = el; n && n !== h.parentNode; n = n.parentElement) {
                  out.push({
                    t: n.tagName,
                    cls: (n.className || '').toString().slice(0, 34),
                    disp: getComputedStyle(n).display,
                    box: box(n)
                  });
                }
                return out;
