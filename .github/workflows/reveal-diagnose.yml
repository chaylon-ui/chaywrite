            // ---------- D. Stored dark survives a fresh load (boot script) ----------
            const prod = await page.evaluate(() => {
              const a = document.querySelector('.grid-view-item a[href*="/products/"]');
              if (a) { const m = a.getAttribute('href').match(/\/products\/([^/?#]+)/); if (m) return { handle: m[1] }; }
              return null;
