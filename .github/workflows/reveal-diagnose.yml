name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Flavor-titled rows carry the decklist name (owner's bolt repro)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const PAGE = 'https://exorgames.com/pages/deck-builder';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1380, height: 980 });
            await page.setRequestInterception(true);
            page.on('request', (req) => {
              const u = req.url();
              if (u.includes('/deck.json?')) req.continue({ url: u + '&notrack=1' });
              else req.continue();
            });
            await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await page.type('#xg-deck-input', '1 Island\n1 Lightning bolt');
            await page.click('#xg-deck-go');
            await page.waitForSelector('#xg-deck-results .xg-deck__row', { timeout: 45000 });
            await new Promise((r) => setTimeout(r, 1200));

            const rows = await page.evaluate(() => {
              const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
              return [...document.querySelectorAll('#xg-deck-results .xg-deck__row')].map((row) => ({
                name: (row.querySelector('.xg-deck__name') || {}).textContent || '',
                note: (row.querySelector('.xg-deck__matchnote') || {}).textContent || null,
                sub: !!row.querySelector('.xg-deck__subnote'),
                normName: norm((row.querySelector('.xg-deck__name') || {}).textContent),
              }));
            });
            console.log('ROWS:', JSON.stringify(rows, null, 1));
            let fails = [];
            const island = rows.find((r) => /island/i.test(r.name));
            if (!island) fails.push('no Island row');
            else if (island.note) fails.push('Island got a spurious note: ' + island.note);
            const bolt = rows.find((r) => /lightning bolt/i.test(r.name));
            if (!bolt) fails.push('no row matching Lightning Bolt at all');
            else if (bolt.normName === 'lightningbolt') {
              // a plain-titled printing is cheapest today: no note expected
              if (bolt.note) fails.push('plain-titled bolt got a note: ' + bolt.note);
              else console.log('NOTE CHECK: plain title matched, correctly unannotated');
            } else {
              if (!bolt.note) fails.push('flavor-titled bolt (' + bolt.name + ') missing the note');
              else if (!/Lightning bolt/.test(bolt.note)) fails.push('note lacks the typed name: ' + bolt.note);
              else console.log('NOTE CHECK: "' + bolt.name + '" carries: ' + bolt.note);
            }
            await browser.close();
            if (fails.length) { console.log('VERDICT: FAIL -', JSON.stringify(fails)); process.exit(1); }
            console.log('VERDICT: PASS - decklist-name note');
          })().catch((e) => { console.log('diagnose error:', e.message); process.exit(1); });
          EOF
