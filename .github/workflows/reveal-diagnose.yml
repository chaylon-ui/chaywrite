name: Diagnose storefront reveal
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1
      - name: Capture calendar feed request headers and one event shape
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const PREVIEW = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            const reqs = [];
            page.on('request', (r) => {
              if (/portal\.binderpos\.com\/api\/events/i.test(r.url())) {
                reqs.push({ url: r.url().slice(0, 200), method: r.method(), headers: r.headers() });
              }
            });
            let fullEvent = null;
            let count = 0;
            page.on('response', async (r) => {
              if (/portal\.binderpos\.com\/api\/events\/forStore/.test(r.url()) && r.request().method() === 'GET' && !fullEvent) {
                try {
                  const arr = JSON.parse(await r.text());
                  if (Array.isArray(arr) && arr.length) {
                    count = arr.length;
                    fullEvent = arr[arr.length - 1];
                  }
                } catch (e) {}
              }
            });
            await page.goto(PREVIEW, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((r) => setTimeout(r, 9000));
            console.log('REQS:', JSON.stringify(reqs, null, 1));
            if (fullEvent) {
              console.log('EVENT_COUNT:', count);
              console.log('EVENT_KEYS:', JSON.stringify(Object.keys(fullEvent)));
              if (typeof fullEvent.description === 'string') fullEvent.description = fullEvent.description.slice(0, 60) + '...';
              console.log('EVENT_SAMPLE:', JSON.stringify(fullEvent).slice(0, 2200));
            }
            await browser.close();
            console.log('VERDICT: ' + (reqs.length && fullEvent ? 'PASS' : 'FAIL - missing ' + (reqs.length ? 'event body' : 'forStore request')));
            if (!reqs.length || !fullEvent) process.exit(1);
          })().catch((e) => { console.log('diagnose error:', e.message); process.exit(1); });
          EOF
