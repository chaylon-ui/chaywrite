                navMenu: box(h.querySelector('.nav-menu')),
                mobileBar: box(h.querySelector('.site-header-mobile')),
                mobLeft: box(h.querySelector('.mobile-width-left')),
                mobRight: box(h.querySelector('.mobile-width-right'))
              };
