name: Diagnose storefront reveal
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1
      - name: Calendar second-icon open after a close (with diagnostics)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            const errs = [];
            page.on('pageerror', (e) => { errs.push(String((e && e.stack) || e).slice(0, 300)); });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.evaluate(() => { document.getElementById('binderpos-calendar').scrollIntoView({ block: 'center' }); });
            await new Promise((r) => setTimeout(r, 6000));

            const cells = await page.evaluate(() => {
              const tds = Array.from(document.querySelectorAll('#binderpos-calendar td.calendar-data-block:not(.calendar-inactive-block)'))
                .filter((td) => td.querySelector('.calendar-icon-container'));
              tds.slice(0, 2).forEach((td, i) => td.setAttribute('data-xgtest', String(i)));
              return tds.slice(0, 2).map((td) => Math.round(td.getBoundingClientRect().height));
            });
            console.log('CELLS baseline heights:', JSON.stringify(cells));

            // Diagnostics: every popover node with its owning test-cell and
            // computed display, so created-but-hidden vs never-created is
            // distinguishable in the log.
            async function state() {
              return page.evaluate(() => {
                const nodes = Array.from(document.querySelectorAll('#binderpos-calendar .calendar-icon-info')).map((p) => {
                  const cell = p.closest('td');
                  return {
                    cell: cell ? cell.getAttribute('data-xgtest') : null,
                    vis: !!(p.offsetWidth || p.offsetHeight),
                    disp: getComputedStyle(p).display,
                  };
                });
                const td0 = document.querySelector('[data-xgtest="0"]');
                const td1 = document.querySelector('[data-xgtest="1"]');
                const visNodes = nodes.filter((n) => n.vis);
                return {
                  nodes,
                  open: visNodes.length,
                  hasX: visNodes.length ? true : false,
                  h0: td0 ? Math.round(td0.getBoundingClientRect().height) : 0,
                  h1: td1 ? Math.round(td1.getBoundingClientRect().height) : 0,
                };
              });
            }
            async function clickVisibleX() {
              return page.evaluate(() => {
                const p = Array.from(document.querySelectorAll('#binderpos-calendar .calendar-icon-info'))
                  .find((x) => x.offsetWidth || x.offsetHeight);
                const b = p && p.querySelector('.xg-cal-close');
                if (b) b.click();
                return !!b;
              });
            }
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));

            await page.click('[data-xgtest="0"] .calendar-icon-container');
            await wait(1500);
            const s1 = await state();
            await clickVisibleX();
            await wait(900);
            const s2 = await state();
            await page.mouse.move(5, 5); await wait(500);
            await page.click('[data-xgtest="1"] .calendar-icon-container');
            await wait(2500);
            let s3 = await state();
            let retried = false;
            if (s3.open === 0) {
              // Distinguish a dropped click from a widget refusal: one retry.
              retried = true;
              await page.click('[data-xgtest="1"] .calendar-icon-container');
              await wait(2500);
              s3 = await state();
            }
            await page.keyboard.press('Escape');
            await wait(900);
            const s4 = await state();

            console.log('CYCLE2:', JSON.stringify({ s1, s2, s3, s4, retried }));
            const errsBad = errs.filter((e) => !/shopifycloud|shop_events_listener|\/cdn\/wpm\/|web-pixels/.test(e));
            console.log('PAGEERRORS:', JSON.stringify(errsBad));
            await browser.close();
            const heightLocked = Math.abs(s1.h0 - cells[0]) <= 8 && Math.abs(s3.h1 - cells[1]) <= 8;
            const ok = s1.open === 1 && s2.open === 0 && s3.open === 1 && s4.open === 0 && heightLocked && errsBad.length === 0;
            console.log('VERDICT-CAL2: ' + (ok ? 'PASS' : 'FAIL') + (retried ? ' (needed retry)' : ''));
          })().catch((e) => { console.log('VERDICT-CAL2: FAIL error ' + e.message); });
          EOF
      - name: Hero fit-text on a slide that actually has a headline
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((r) => setTimeout(r, 5000));

            const before = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              if (!main) return null;
              const contents = Array.from(main.querySelectorAll('.xg-hero__content'));
              let content = contents.find((c) => c.querySelector('.xg-hero__title')) || contents[0];
              if (!content) return { fit: main.getAttribute('data-xg-fit'), noContent: true };
              let title = content.querySelector('.xg-hero__title');
              let injected = false;
              if (!title) {
                // No slide has a headline today - emulate the owner typing one.
                title = document.createElement('h2');
                title.className = 'xg-hero__title';
                content.insertBefore(title, content.firstChild);
                injected = true;
              }
              content.setAttribute('data-xgprobe', '1');
              title.textContent = 'SHORT';
              const r = {
                fit: main.getAttribute('data-xg-fit'),
                slides: contents.length,
                injected,
                h: Math.round(main.getBoundingClientRect().height),
                fs: parseFloat(getComputedStyle(title).fontSize),
              };
              title.textContent = 'THIS IS A DELIBERATELY VERY LONG HEADLINE TYPED TO CHECK THAT THE HERO PANEL STAYS LOCKED AT ITS HEIGHT WHILE THE TEXT SHRINKS DOWN TO FIT INSTEAD OF GROWING THE WHOLE SECTION TALLER AND TALLER AND TALLER AND TALLER';
              window.dispatchEvent(new Event('resize'));
              return r;
            });
            await new Promise((r) => setTimeout(r, 900));
            const after = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              const content = main.querySelector('[data-xgprobe]');
              const title = content && content.querySelector('.xg-hero__title');
              const box = (content && content.closest('.xg-hero__slide')) || main;
              return {
                h: Math.round(main.getBoundingClientRect().height),
                fs: title ? parseFloat(getComputedStyle(title).fontSize) : 0,
                overflow: box.scrollHeight - box.clientHeight,
                boxH: Math.round(box.getBoundingClientRect().height),
              };
            });
            console.log('HERO2:', JSON.stringify({ before, after }));
            const ok = before && before.fit === '1' && !before.noContent &&
              Math.abs(after.h - before.h) <= 2 && after.fs < before.fs && after.overflow <= 4;
            console.log('VERDICT-HERO2: ' + (ok ? 'PASS' : 'FAIL'));
            await browser.close();
          })().catch((e) => { console.log('VERDICT-HERO2: FAIL error ' + e.message); });
          EOF
