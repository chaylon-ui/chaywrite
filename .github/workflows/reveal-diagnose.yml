name: Reveal diagnose

# Scratch diagnostics against the LIVE site (log-only). Current probe: the
# same-card group bar. "99 Sol Ring" splits into many version rows + a
# short strip: every one of those rows must carry the group class with the
# inset bar, exactly one (the strip) closes the group, and the single-row
# "1 Island" line must carry none of it.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22 2>&1 | tail -1
      - name: Deck Builder same-card group bar (real Chrome, live page)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const b = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const p = await b.newPage();
            await p.setViewport({ width: 1280, height: 900 });
            const errs = [];
            p.on('pageerror', e => errs.push('pageerror: ' + e.message));
            await p.goto('https://exorgames.com/pages/deck-builder', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await p.type('#xg-deck-input', '99 Sol Ring\n1 Island');
            await p.evaluate(() => document.getElementById('xg-deck-go').click());
            await p.waitForSelector('.xg-deck__row--short', { timeout: 90000 });
            const r = await p.evaluate(() => {
              const rows = Array.from(document.querySelectorAll('.xg-deck__row'));
              const island = rows.find(el => /Island/.test(el.innerText));
              const grp = document.querySelectorAll('.xg-deck__row--grp');
              const shadow = grp.length ? getComputedStyle(grp[0]).boxShadow : null;
              return {
                totalRows: rows.length,
                grpRows: grp.length,
                gendRows: document.querySelectorAll('.xg-deck__row--gend').length,
                stripIsGend: !!document.querySelector('.xg-deck__row--short.xg-deck__row--gend'),
                islandGrouped: island ? island.classList.contains('xg-deck__row--grp') : null,
                grpShadow: shadow
              };
            });
            console.log('GROUP CHECK: ' + JSON.stringify(r, null, 1));
            console.log('page errors: ' + (errs.length ? errs.join(' | ') : 'none'));
            await b.close();
            const ok = !!(r.grpRows >= 3 && r.gendRows === 1 && r.stripIsGend &&
              r.islandGrouped === false && /inset/.test(r.grpShadow || ''));
            console.log(ok ? 'VERDICT: PASS' : 'VERDICT: FAIL');
          })().catch(e => { console.log('probe error: ' + e.message); });
          EOF
