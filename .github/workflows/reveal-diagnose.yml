name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Same-game guard on You May Also Like (preview)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');

          const SOL = 'https://exorgames.com/products/sol-ring-commander-2018?preview_theme_id=157462692013';
          const PKM = 'https://exorgames.com/products/charizard-3-70-lets-play-eevee-3-deck-exclusives?preview_theme_id=157462692013';

          async function inspect(browser, label, url) {
            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((res) => setTimeout(res, 9000));
            const r = await page.evaluate(() => {
              const out = { themeId: (window.Shopify && Shopify.theme && Shopify.theme.id) || null };
              const rel = document.querySelector('.xg-related');
              out.relatedPresent = !!rel;
              if (rel) {
                out.pageType = rel.getAttribute('data-page-type');
                out.relatedVisible = rel.style.display !== 'none';
                const items = Array.from(rel.querySelectorAll('#relatedproduct-carousel [data-rec-type]'));
                out.itemTypes = items.map((it) => it.getAttribute('data-rec-type'));
              }
              const bet = document.getElementById('exor-betters');
              out.bettersVisible = !!bet && bet.style.display !== 'none' && bet.offsetParent !== null;
              out.bettersCount = bet ? bet.querySelectorAll('a').length : 0;
              return out;
            });
            console.log(label, JSON.stringify(r));
            await ctx.close();
            return r;
          }

          function verdictOf(r) {
            const p = [];
            if (r.themeId !== 157462692013) p.push('wrong theme: ' + r.themeId);
            if (!r.relatedPresent) p.push('related shell missing');
            const off = (r.itemTypes || []).filter((t) => t && r.pageType && t !== r.pageType);
            if (r.relatedVisible && off.length) p.push('off-type items survived the guard: ' + JSON.stringify(off));
            if (!r.relatedVisible && (r.itemTypes || []).length) p.push('items injected but section hidden - inconsistent state');
            return p;
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const a = await inspect(browser, 'solA:', SOL);
            const b = await inspect(browser, 'solB:', SOL);
            const c = await inspect(browser, 'pokemon:', PKM);
            const pa = verdictOf(a);
            const pb = verdictOf(b);
            const pc = verdictOf(c);
            // Sol Ring's engine output is currently 10/10 Pokemon, so the
            // guard should leave its block hidden while the betters strip
            // carries the page.
            if (a.relatedVisible) pa.push('Sol Ring related visible - expected the guard to filter all 10 Pokemon recs');
            if (!a.bettersVisible || a.bettersCount < 3) pa.push('Sol Ring similar-effects strip missing/thin: ' + a.bettersCount);
            await browser.close();

            if (pa.length) console.log('solA problems:', pa);
            if (pb.length) console.log('solB problems:', pb);
            if (pc.length) console.log('pokemon problems:', pc);

            if (!pa.length && !pb.length && !pc.length) {
              console.log('VERDICT: PASS - Sol Ring: junk block hidden, betters strip up (' + a.bettersCount + ' cards); Pokemon page: related ' + (c.relatedVisible ? 'visible, ' + (c.itemTypes || []).length + ' items all ' + c.pageType : 'hidden (no same-type recs)'));
            } else {
              console.log('VERDICT: FAIL');
              process.exitCode = 1;
            }
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
