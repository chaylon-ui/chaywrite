name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Recon search bar geometry on the preview
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const PREVIEW = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 950 });
            await page.goto(PREVIEW, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((r) => setTimeout(r, 4500));
            console.log('THEME:', await page.evaluate(() => window.Shopify && Shopify.theme && Shopify.theme.id));

            const recon = await page.evaluate(() => {
              const info = (el) => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                return {
                  rect: [r.left, r.top, r.width, r.height].map((n) => Math.round(n * 10) / 10),
                  pos: cs.position, top: cs.top, bottom: cs.bottom, height: cs.height,
                  padding: cs.padding, transform: cs.transform, display: cs.display,
                  lineHeight: cs.lineHeight, float: cs.cssFloat,
                };
              };
              const inputs = [...document.querySelectorAll('.search-header__input')];
              const out = { count: inputs.length, mobileMountChildren: (document.getElementById('_mobile_search') || {}).childElementCount, instances: [] };
              inputs.forEach((inp) => {
                const form = inp.closest('form');
                const btn = form ? form.querySelector('.search-header__submit') : null;
                const chain = [];
                for (let n = inp; n && n !== document.body && chain.length < 8; n = n.parentElement) {
                  chain.push(n.tagName + (n.id ? '#' + n.id : '') + '.' + String(n.className).replace(/\s+/g, '.').slice(0, 48));
                }
                out.instances.push({
                  chain,
                  inDesktopMount: !!inp.closest('#_desktop_search'),
                  inMobileMount: !!inp.closest('#_mobile_search'),
                  form: info(form),
                  input: info(inp),
                  btn: info(btn),
                  btnOffsetParent: btn && btn.offsetParent ? btn.offsetParent.tagName + '#' + (btn.offsetParent.id || '') + '.' + String(btn.offsetParent.className).replace(/\s+/g, '.').slice(0, 40) : null,
                });
              });
              return out;
            });
            console.log('SEARCH RECON:', JSON.stringify(recon, null, 1));
            await browser.close();
            console.log('VERDICT: PASS - recon only');
          })().catch((e) => { console.log('diagnose error:', e.message); process.exit(1); });
          EOF
