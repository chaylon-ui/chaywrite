name: Diagnose storefront reveal
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1
      - name: Calendar popover multi-icon cycle with cell-height lock
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            const errs = [];
            page.on('pageerror', (e) => { errs.push(String(e).slice(0, 160)); });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.evaluate(() => { document.getElementById('binderpos-calendar').scrollIntoView({ block: 'center' }); });
            await new Promise((r) => setTimeout(r, 6000));

            // Tag the first two icon-bearing day cells so we can address them.
            const cells = await page.evaluate(() => {
              const tds = Array.from(document.querySelectorAll('#binderpos-calendar td.calendar-data-block:not(.calendar-inactive-block)'))
                .filter((td) => td.querySelector('.calendar-icon-container'));
              tds.slice(0, 2).forEach((td, i) => td.setAttribute('data-xgtest', String(i)));
              return tds.slice(0, 2).map((td) => Math.round(td.getBoundingClientRect().height));
            });
            console.log('CELLS baseline heights:', JSON.stringify(cells));

            // v3: the widget HIDES popovers rather than removing them, so
            // "open" means visible, never mere node presence.
            async function state() {
              return page.evaluate(() => {
                const vis = Array.from(document.querySelectorAll('#binderpos-calendar .calendar-icon-info'))
                  .filter((p) => p.offsetWidth || p.offsetHeight);
                const td0 = document.querySelector('[data-xgtest="0"]');
                const td1 = document.querySelector('[data-xgtest="1"]');
                return {
                  open: vis.length,
                  hasX: vis.length ? !!vis[0].querySelector('.xg-cal-close') : false,
                  h0: td0 ? Math.round(td0.getBoundingClientRect().height) : 0,
                  h1: td1 ? Math.round(td1.getBoundingClientRect().height) : 0,
                };
              });
            }
            async function clickVisibleX() {
              return page.evaluate(() => {
                const p = Array.from(document.querySelectorAll('#binderpos-calendar .calendar-icon-info'))
                  .find((x) => x.offsetWidth || x.offsetHeight);
                const b = p && p.querySelector('.xg-cal-close');
                if (b) b.click();
                return !!b;
              });
            }
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));

            const base = await state();
            await page.click('[data-xgtest="0"] .calendar-icon-container');
            await wait(1200);
            const s1 = await state(); // open, X present, cell NOT ballooned
            await clickVisibleX();
            await wait(700);
            const s2 = await state(); // closed
            await page.mouse.move(5, 5); await wait(400);
            const second = cells.length > 1;
            if (second) await page.click('[data-xgtest="1"] .calendar-icon-container');
            else await page.click('[data-xgtest="0"] .calendar-icon-container');
            await wait(1200);
            const s3 = await state(); // ANOTHER icon opens after a close (owner's stuck-bug)
            await page.keyboard.press('Escape');
            await wait(700);
            const s4 = await state(); // Esc closes
            await page.click('[data-xgtest="0"] .calendar-icon-container');
            await wait(1200);
            const s5 = await state(); // first icon reopens
            await page.keyboard.press('Escape');

            console.log('CYCLE:', JSON.stringify({ base, s1, s2, s3, s4, s5, second }));
            const tol = 8;
            const heightLocked = Math.abs(s1.h0 - base.h0) <= tol && Math.abs(s5.h0 - base.h0) <= tol;
            const errsBad = errs.filter((e) => !/shopifycloud|shop_events_listener|\/cdn\/wpm\//.test(e));
            console.log('PAGEERRORS:', JSON.stringify(errsBad));
            await browser.close();
            const ok = base.open === 0 && s1.open === 1 && s1.hasX && heightLocked &&
              s2.open === 0 && s3.open === 1 && s3.hasX && s4.open === 0 && s5.open === 1 && errsBad.length === 0;
            console.log('VERDICT-CAL: ' + (ok ? 'PASS' : 'FAIL') + (second ? '' : ' (single-cell fallback)'));
          })().catch((e) => { console.log('VERDICT-CAL: FAIL error ' + e.message); });
          EOF
      - name: Hero height lock plus fit-text, events strip regression
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await new Promise((r) => setTimeout(r, 5000));

            const before = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              if (!main) return null;
              const content = main.querySelector('.xg-hero__slide.is-active .xg-hero__content') || main.querySelector('.xg-hero__content');
              const title = content && content.querySelector('.xg-hero__title');
              const r = {
                fit: main.getAttribute('data-xg-fit'),
                h: Math.round(main.getBoundingClientRect().height),
                fs: title ? parseFloat(getComputedStyle(title).fontSize) : 0,
                hadTitle: !!title,
              };
              if (title) {
                title.textContent = 'THIS IS A DELIBERATELY VERY LONG HEADLINE TYPED TO CHECK THAT THE HERO PANEL STAYS LOCKED AT ITS HEIGHT WHILE THE TEXT SHRINKS DOWN TO FIT INSTEAD OF GROWING THE WHOLE SECTION TALLER AND TALLER AND TALLER';
                window.dispatchEvent(new Event('resize'));
              }
              return r;
            });
            await new Promise((r) => setTimeout(r, 800));
            const after = await page.evaluate(() => {
              const main = document.querySelector('.xg-hero__main');
              const content = main.querySelector('.xg-hero__slide.is-active .xg-hero__content') || main.querySelector('.xg-hero__content');
              const title = content && content.querySelector('.xg-hero__title');
              const box = (title && title.closest('.xg-hero__slide')) || main;
              return {
                h: Math.round(main.getBoundingClientRect().height),
                fs: title ? parseFloat(getComputedStyle(title).fontSize) : 0,
                overflow: box.scrollHeight - box.clientHeight,
              };
            });
            console.log('HERO:', JSON.stringify({ before, after }));
            const heroOk = before && before.fit === '1' && before.hadTitle &&
              Math.abs(after.h - before.h) <= 2 && after.fs < before.fs && after.overflow <= 4;
            console.log('VERDICT-HERO: ' + (heroOk ? 'PASS' : 'FAIL'));

            const evs = await page.evaluate(() => {
              const root = document.getElementById('xg-evs');
              const grid = document.getElementById('xg-evs-grid');
              return {
                revealed: !!root && !root.hidden,
                cards: grid ? grid.querySelectorAll('.xg-evs__card').length : 0,
                bgLayer: !!document.getElementById('xg-evs-bg'),
                scrollable: grid ? grid.scrollWidth > grid.clientWidth : false,
              };
            });
            console.log('EVS:', JSON.stringify(evs));
            // No bg image is set yet, so the parallax layer must be absent and
            // the strip must look exactly as before.
            const evsOk = evs.revealed && evs.cards > 0 && !evs.bgLayer;
            console.log('VERDICT-EVS: ' + (evsOk ? 'PASS' : 'FAIL'));
            await browser.close();
          })().catch((e) => { console.log('VERDICT-HERO: FAIL error ' + e.message); });
          EOF
      - name: Cart delivery note on page and header dropdown
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');
          const HOME = 'https://exorgames.com/?preview_theme_id=157462692013';

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const ctx = await browser.createBrowserContext();
            const page = await ctx.newPage();
            await page.setViewport({ width: 1366, height: 900 });
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            await page.goto(HOME, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const vid = await page.evaluate(async () => {
              const r = await fetch('/products.json?limit=10');
              const j = await r.json();
              for (const p of j.products || []) for (const v of p.variants || []) if (v.available !== false) return v.id;
              return null;
            });
            console.log('variant for cart probe:', vid);
            let cart = { skipped: true };
            if (vid) {
              await page.evaluate(async (id) => {
                await fetch('/cart/add.js', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, quantity: 1 }) });
              }, vid);
              await page.goto('https://exorgames.com/cart?preview_theme_id=157462692013', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await new Promise((r) => setTimeout(r, 2500));
              cart = await page.evaluate(() => {
                const note = document.querySelector('.cart_content_inner .xg-delivery-note');
                const btn = document.querySelector('input[name="checkout"]');
                return {
                  noteVisible: !!note && !!(note.offsetWidth || note.offsetHeight),
                  text: note ? note.textContent.replace(/\s+/g, ' ').trim().slice(0, 130) : '',
                  aboveCheckout: !!(note && btn && (note.compareDocumentPosition(btn) & Node.DOCUMENT_POSITION_FOLLOWING)),
                  dropdownNote: !!document.querySelector('.cart-dropdown .xg-delivery-note'),
                  spine: note ? getComputedStyle(note).borderLeft : '',
                };
              });
              await page.evaluate(() => fetch('/cart/clear.js', { method: 'POST' }));
            }
            console.log('CART:', JSON.stringify(cart));
            const ok = !cart.skipped && cart.noteVisible && cart.aboveCheckout &&
              /DoorDash/.test(cart.text) && cart.dropdownNote && /rgb\(214, 44, 40\)/.test(cart.spine);
            console.log('VERDICT-CART: ' + (ok ? 'PASS' : 'FAIL'));
            await browser.close();
          })().catch((e) => { console.log('VERDICT-CART: FAIL error ' + e.message); });
          EOF
      - name: Reviews endpoint smoke (worker)
        run: |
          echo "=== /reviews.json (expect 200, CORS header, ok:false until GOOGLE_PLACES_KEY is set) ==="
          curl -sS -D /tmp/rev-h --max-time 30 "https://exor-binder.nevski.workers.dev/reviews.json" -o /tmp/rev-b || true
          head -c 300 /tmp/rev-b; echo
          echo "status line: $(head -1 /tmp/rev-h)"
          echo "cors: $(grep -ci 'access-control-allow-origin' /tmp/rev-h || true)"
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/rev-b'))
              ok = isinstance(d, dict) and 'ok' in d and 'reviews' in d
              print('VERDICT-REVIEWS: ' + ('PASS' if ok else 'FAIL'))
          except Exception as e:
              print('VERDICT-REVIEWS: FAIL parse ' + str(e))
          PY
