              };
              const cn = (n) => n ? n.tagName + (n.className ? '.' + String(n.className).trim().split(/\s+/).slice(0, 3).join('.') : '') : '';
              const cards = Array.from(root.querySelectorAll('a,li,article')).filter((e) => e.offsetWidth > 40);
              const track = cards.length ? cards[0].parentElement : null;
              const img = root.querySelector('img');
              const g = (el, p) => el ? getComputedStyle(el)[p] : '';
              return {
                rootBox: box(root),
                track: cn(track), trackBox: box(track),
                trackDisplay: g(track, 'display'), trackGap: g(track, 'gap'), trackOverflow: g(track, 'overflowX'),
                cards: cards.length, card: cn(cards[0]), cardBox: box(cards[0]),
                cardBg: g(cards[0], 'backgroundColor'), cardRadius: g(cards[0], 'borderRadius'),
                imgBox: box(img), imgFit: g(img, 'objectFit'),
                titleSize: g(root.querySelector('[class*="title"], [class*="name"]'), 'fontSize'),
                priceSize: g(root.querySelector('.xg-nt__price'), 'fontSize')
              };
