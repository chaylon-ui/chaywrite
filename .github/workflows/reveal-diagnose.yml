              && cl.mtg.set === 'c21' && cl.mtg.num === '263' && cl.mtg2.set === 'znr' && cl.mtg2.num === '263' && cl.mtg2.den === '344'
              && !cl.junk.set && !cl.junk.num, JSON.stringify(cl));

