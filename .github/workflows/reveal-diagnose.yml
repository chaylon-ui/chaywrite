name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Trust bar hidden, NT subline + tile widths, readable band tabs
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');

          const PREVIEW = 'https://exorgames.com/?preview_theme_id=157462692013';
          const LIVE = 'https://exorgames.com/';

          async function inspect(browser, label, viewport) {
            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const page = await ctx.newPage();
            await page.setViewport(viewport);
            await page.goto(PREVIEW, { waitUntil: 'domcontentloaded', timeout: 60000 });
            try { await page.waitForSelector('#xg-newtoday .xg-nt__card', { timeout: 25000 }); } catch (e) {}
            await new Promise((res) => setTimeout(res, 800));
            const r = await page.evaluate(() => {
              const out = { themeId: (window.Shopify && Shopify.theme && Shopify.theme.id) || null };
              out.trustBarInDom = !!document.querySelector('.shopify-section[id$="__trust_bar"]');
              const secs = Array.from(document.querySelectorAll('.shopify-section')).map((s) => s.id || '');
              const nt = secs.findIndex((id) => id.endsWith('__new_today'));
              out.afterNewToday = nt > -1 && nt + 1 < secs.length ? secs[nt + 1].split('__').pop() : null;
              const sub = document.querySelector('#xg-newtoday .xg-nt__sub');
              out.subText = sub ? sub.textContent.trim() : null;
              const cards = Array.from(document.querySelectorAll('#xg-newtoday .xg-nt__card'));
              out.cardCount = cards.length;
              const ws = cards.map((c) => c.offsetWidth);
              out.cardWidthMin = ws.length ? Math.min.apply(null, ws) : null;
              out.cardWidthMax = ws.length ? Math.max.apply(null, ws) : null;
              const metas = Array.from(document.querySelectorAll('#xg-newtoday .xg-nt__meta'));
              out.overflowingMetas = metas.filter((m) => m.scrollWidth > m.clientWidth + 1).length; // ellipsized is fine; we count none wider than their box visually
              const tab = document.querySelector('.product-block #products-tab .nav-item:not(.active) .nav-link');
              if (tab) {
                const cs = getComputedStyle(tab);
                out.tab = { bg: cs.backgroundColor, color: cs.color };
              }
              const title = document.querySelector('.product-block .home-title');
              out.titleShadow = title ? getComputedStyle(title).textShadow : null;
              return out;
            });
            console.log(label, JSON.stringify(r));
            await ctx.close();
            return r;
          }

          function alphaOf(bg) {
            const m = /rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/.exec(bg || '');
            if (!m) return null;
            return m[4] === undefined ? 1 : parseFloat(m[4]);
          }

          function verdictOf(r, mobile) {
            const p = [];
            if (r.themeId !== 157462692013) p.push('wrong theme served: ' + r.themeId);
            if (r.trustBarInDom) p.push('trust bar still renders');
            if (r.afterNewToday !== 'sealed_tiles') p.push('section after new_today is ' + r.afterNewToday + ', expected sealed_tiles');
            if (r.subText !== 'Fresh singles on the shelf.') p.push('NT subline wrong: ' + JSON.stringify(r.subText));
            if (!(r.cardCount >= 4)) p.push('too few NT cards: ' + r.cardCount);
            if (r.cardWidthMin !== 148 || r.cardWidthMax !== 148) p.push('NT tile widths not uniform 148: ' + r.cardWidthMin + '-' + r.cardWidthMax);
            if (!mobile) {
              if (!r.tab) p.push('no inactive singles tab found');
              else {
                const a = alphaOf(r.tab.bg);
                if (!(a !== null && a >= 0.4)) p.push('inactive tab chip too transparent: ' + r.tab.bg);
                if (r.tab.color !== 'rgb(255, 255, 255)') p.push('inactive tab text not white: ' + r.tab.color);
              }
              if (!r.titleShadow || r.titleShadow === 'none') p.push('band title has no text-shadow');
            }
            return p;
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            const desktop = { width: 1366, height: 900 };
            const a = await inspect(browser, 'runA:', desktop);
            const b = await inspect(browser, 'runB:', desktop);
            const m = await inspect(browser, 'mobile:', { width: 390, height: 800, isMobile: true, hasTouch: true });
            const pa = verdictOf(a, false);
            const pb = verdictOf(b, false);
            const pm = verdictOf(m, true);

            const mkCtx = browser.createBrowserContext || browser.createIncognitoBrowserContext;
            const ctx = await mkCtx.call(browser);
            const lp = await ctx.newPage();
            await lp.goto(LIVE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            const liveTheme = await lp.evaluate(() => (window.Shopify && Shopify.theme && Shopify.theme.id) || null);
            console.log('live homepage (fresh context): theme', liveTheme, '(must be 157458727085)');
            const liveBad = liveTheme !== 157458727085;
            await ctx.close();
            await browser.close();

            if (pa.length) console.log('runA problems:', pa);
            if (pb.length) console.log('runB problems:', pb);
            if (pm.length) console.log('mobile problems:', pm);
            if (liveBad) console.log('PROBLEM: live control failed');

            if (!pa.length && !pb.length && !pm.length && !liveBad) {
              console.log('VERDICT: PASS - trust bar hidden, NT subline "' + a.subText + '", tiles uniform 148px on desktop AND mobile, band tabs on dark chips with white text, title shadowed; live untouched');
            } else if (pa.join('|') !== pb.join('|')) {
              console.log('VERDICT: INCONSISTENT - desktop runs disagree; treat as flaky, re-run before acting');
              process.exitCode = 1;
            } else {
              console.log('VERDICT: FAIL');
              process.exitCode = 1;
            }
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
