name: reveal-diagnose
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Worker endpoints (game param + regression)
        run: |
          set -x
          curl -s 'https://exor-binder.nevski.workers.dev/instock.json?names=Sol%20Ring&max=3&game=mtg' | python3 -c "import json,sys; j=json.load(sys.stdin); print('WORKER mtg ok=%s cards=%d' % (j.get('ok'), len(j.get('cards',[]))))"
          curl -s 'https://exor-binder.nevski.workers.dev/instock.json?names=Pikachu&max=3&game=pokemon' | python3 -c "import json,sys; j=json.load(sys.stdin); print('WORKER pokemon ok=%s cards=%d' % (j.get('ok'), len(j.get('cards',[]))))"
          curl -s 'https://exor-binder.nevski.workers.dev/cards.json?nt=1' | python3 -c "import json,sys; j=json.load(sys.stdin); c=j.get('cards',[]); print('WORKER nt cards=%d withVid=%d' % (len(c), sum(1 for x in c if x.get('variantId'))))"

      - name: Compose a card-on-table photo (v3 sparse OCR path)
        run: |
          # pin the Commander 2021 printing: the DEFAULT printing is now a
          # Marvel one whose art nameplate says TONY STARK in big block
          # letters, and run 77's sparse OCR (correctly) read that instead
          curl -sL -o solring.jpg 'https://api.scryfall.com/cards/named?exact=Sol+Ring&set=c21&format=image&version=large'
          ls -la solring.jpg; file solring.jpg || true
          # the owner's failing photos have the card sitting somewhere inside a
          # larger frame - build exactly that instead of a full-frame card scan
          # (runner image no longer ships ImageMagick, so compose with Pillow)
          python3 -m pip install --quiet pillow || sudo apt-get -yq install python3-pil
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          card = Image.open('solring.jpg').convert('RGB')
          w, h = card.size
          small = card.resize((int(w * 0.7), int(h * 0.7)))
          bg = Image.new('RGB', (1600, 1200), (122, 106, 85))
          bg.paste(small, (520, 120))
          bg.save('table.jpg', quality=92)
          # the owner also photographs cards lying SIDEWAYS on the table -
          # the rotated variant exercises the scanner's rotation retries
          bg.transpose(Image.ROTATE_90).save('table-rot.jpg', quality=92)
          print('table.jpg composed', bg.size, 'card', small.size)
          # v3.5 collector-line rescue: the TITLE band blacked out, the
          # bottom collector line ("263 U" / "C21 * EN") left intact - the
          # scanner must identify the card from set+number alone
          bg2 = Image.new('RGB', (800, 1150), (96, 88, 76))
          bg2.paste(card, (64, 80))
          d = ImageDraw.Draw(bg2)
          d.rectangle([94, 112, 704, 188], fill=(8, 8, 8))
          bg2.save('noname.jpg', quality=92)
          print('noname.jpg composed', bg2.size, 'title blacked')
          PY
          ls -la table.jpg table-rot.jpg noname.jpg; file table.jpg table-rot.jpg noname.jpg

      - name: Install puppeteer-core
        run: npm i --no-save puppeteer-core@22

      - name: Probe preview theme (round 6)
        run: |
          cat > probe.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const T = '157462692013';
          const H = 'https://exorgames.com';
          const u = (p) => H + p + (p.includes('?') ? '&' : '?') + 'preview_theme_id=' + T;
          const TOL = /shopifycloud|shop_events_listener|\/cdn\/wpm\/|web-pixels|sezzle|hotjar|googletagmanager|snize|searchanise|wishy|cloudsearch/i;
          const fails = [];
          const v = (name, ok, detail) => { console.log((ok ? 'VERDICT PASS ' : 'VERDICT FAIL ') + name + ' :: ' + detail); if (!ok) fails.push(name); };
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 950 });
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36');
            await page.setCookie({ name: 'customer_posted', value: 'yes', domain: 'exorgames.com' });
            /* Round 21: xg-card-peek.js refuses to run without a hover-capable
               fine pointer, and headless Chrome on this runner reports none
               (run 114: hover-capable=false, script=false) - the right answer
               on a device with no mouse, and no way to exercise the feature.
               The probe drives a real mouse through CDP, so answer that one
               media query the way a desktop would. Only hover/pointer queries
               are touched; prefers-* keep the native answer (the toggle and
               dark probes depend on it). The native answer is recorded on
               window.__xgNativeHoverFine and printed with the PEEK line. */
            await page.evaluateOnNewDocument(() => {
              try {
                const native = window.matchMedia.bind(window);
                window.__xgNativeHoverFine = native('(hover: hover) and (pointer: fine)').matches;
                if (window.__xgNativeHoverFine) return;
                window.matchMedia = function (q) {
                  const r = native(q);
                  const s = String(q);
                  if (/\bhover\b|\bpointer\b/.test(s) && !/\bnone\b|\bcoarse\b/.test(s)) {
                    return { matches: true, media: r.media, onchange: null, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {}, dispatchEvent: function () { return false; } };
                  }
                  return r;
                };
              } catch (e) {}
            });
            page.on('pageerror', e => { const s = String((e && e.stack) || e); if (!TOL.test(s)) console.log('PAGEERR', s.slice(0, 400)); });
            /* Run 99 had nt=0 (the New Today row rendered nothing) one run
               after it passed. That row is drawn by new-today.js served FROM
               the worker, so the theme cannot explain it either way - record
               what every cards.json call actually asked for and got back, so
               an empty day is distinguishable from a broken row. */
            const feedLog = [];
            page.on('response', async (res) => {
              try {
                const url = res.url();
                if (!/exor-binder[^/]*\/cards\.json/.test(url)) return;
                const j = await res.json();
                feedLog.push({ q: (url.split('/cards.json')[1] || '').slice(0, 90), n: ((j && j.cards) || []).length });
              } catch (e) { /* non-JSON, redirected, or body already gone */ }
            });

            const gotoTheme = async (path) => {
              for (let i = 0; i < 4; i++) {
                try { await page.goto(u(path), { waitUntil: 'networkidle2', timeout: 90000 }); } catch (e) { console.log('NAV-ERR', String(e).slice(0, 140)); }
                const ok = await page.evaluate(() => !!document.querySelector('#header .site-header'));
                if (ok) return true;
                const d = await page.evaluate(() => ({ title: document.title, len: document.documentElement.outerHTML.length }));
                console.log('NAV-RETRY', path, JSON.stringify(d));
                await sleep(9000);
              }
              return false;
            };
            const clearCart = () => page.evaluate(() => fetch('/cart/clear.js', { method: 'POST' }).catch(() => null));

            // ---------- A. LIGHT homepage: layout + new bands ----------
            v('nav-home', await gotoTheme('/'), 'theme header present');
            await clearCart();
            await sleep(5000);

            const shape = await page.evaluate(() => {
              const qa = Array.from(document.querySelectorAll('.xg-qa'));
              const card0 = qa[0] ? qa[0].closest('.grid-view-item') : null;
              let vid = '';
              if (card0) {
                const dd = card0.querySelector('select[data-dropdown-id="productSelect-dropdown"]');
                const inp2 = card0.querySelector('.nm-cartmain input[name="prduct-variant"]');
                vid = (dd && !dd.disabled && dd.value) || (inp2 && inp2.value) || '';
              }
              return {
                qaTotal: qa.length,
                nt: document.querySelectorAll('#xg-newtoday .xg-nt__add').length,
                /* Owner, round 12: "the camera icon should only show on
                   mobile". The button is still INJECTED on desktop (the theme
                   clones header markup to the mobile bar, so not injecting it
                   here would remove it there too) - it is hidden by width.
                   Presence is no longer the question; visibility is. */
                camDeskEl: !!document.querySelector('#_desktop_search form.search-header .xg-scan-btn'),
                camDeskShown: (function () {
                  var b = document.querySelector('#_desktop_search form.search-header .xg-scan-btn');
                  return !!(b && b.offsetWidth && getComputedStyle(b).display !== 'none');
                })(),
                vid,
                bodyBg: getComputedStyle(document.body).backgroundColor,
                togDesk: !!document.querySelector('#header .header-user-selection .xg-theme-toggle'),
                togMob: !!document.querySelector('#header .mobile-width-right .xg-theme-toggle'),
                togPressed: (document.querySelector('#header .header-user-selection .xg-theme-toggle') || { getAttribute: () => '' }).getAttribute('aria-pressed')
              };
            });
            const drawerLight = await page.evaluate(() => {
              const w = document.getElementById('mobile_top_menu_wrapper');
              return w ? getComputedStyle(w).backgroundColor : 'missing';
            });
            console.log('SHAPE', JSON.stringify(shape));
            v('light-body', shape.bodyBg === 'rgb(245, 246, 247)', shape.bodyBg);
            v('drawer-light-white', drawerLight === 'rgb(255, 255, 255)', drawerLight);
            v('qa-regression', shape.qaTotal >= 6, 'qa=' + shape.qaTotal);
            console.log('FEED-LOG', JSON.stringify(feedLog));
            v('nt-regression', shape.nt >= 8, 'nt=' + shape.nt + ' cards.json calls=' + JSON.stringify(feedLog));
            v('cam-regression', shape.camDeskEl && !shape.camDeskShown,
              'injected=' + shape.camDeskEl + ' shownOnDesktop=' + shape.camDeskShown + ' (mobile-only by owner request)');
            v('toggle-desktop', shape.togDesk, String(shape.togDesk));
            v('toggle-mobile-slot', shape.togMob, String(shape.togMob));
            v('toggle-unpressed', shape.togPressed === 'false', String(shape.togPressed));

            // ---- specialproduct: modern band, horizontal scroll strip ----
            /* Round 21: the owl carousel is gone. Each sports row is a New
               Today style strip - display:flex, overflow-x:auto, 148px tiles
               with a 148x207 cover image and chevrons that scroll the strip -
               so every owl / 205px expectation that used to live here was
               rewritten to measure the strip. Measured PER ROW: a green
               hockey row must not hide a broken basketball row. */
            const sp = await page.evaluate(() => {
              const cs = (el, p) => el ? getComputedStyle(el)[p] : '';
              const alpha = (c) => { const m = (c || '').match(/[\d.]+/g); return !m || m.length < 3 ? -1 : (m.length > 3 ? +m[3] : 1); };
              const rows = Array.from(document.querySelectorAll('.xg-sp')).map((sec) => {
                const t = sec.querySelector('.xg-sp__title');
                const k = sec.querySelector('.xg-sp__kicker');
                const strip = sec.querySelector('.xg-sp__strip');
                const wrapEl = sec.closest('.shopify-section');
                const tiles = Array.from(sec.querySelectorAll('.grid-view-item')).filter((el) => el.offsetWidth > 0);
                const widths = tiles.map((el) => el.offsetWidth);
                const img = sec.querySelector('.grid-view-item .grid-view-item__image-wrapper');
                const imgEl = sec.querySelector('.grid-view-item .grid-view-item__image-wrapper img');
                const price = sec.querySelector('.grid-view-item .product-price__price');
                const btn = sec.querySelector('.xg-sp__nav .xg-sp__btn');
                const next = sec.querySelector('.xg-sp__nav .xg-sp__btn[data-d="1"]');
                return {
                  title: ((t && t.textContent) || '').trim(),
                  kColor: cs(k, 'color'), kUpper: cs(k, 'textTransform'),
                  tSize: parseFloat(cs(t, 'fontSize') || '0'), tUpper: cs(t, 'textTransform'),
                  bandArt: wrapEl ? cs(wrapEl, 'backgroundImage') !== 'none' : false,
                  stripFound: !!strip,
                  stripDisplay: cs(strip, 'display'), stripOverflowX: cs(strip, 'overflowX'),
                  owl: sec.querySelectorAll('[class^="owl-"], [class*=" owl-"]').length,
                  tiles: tiles.length,
                  tileMin: widths.length ? Math.min.apply(null, widths) : -1,
                  tileMax: widths.length ? Math.max.apply(null, widths) : -1,
                  tileBg: cs(tiles[0], 'backgroundColor'), tileBgA: alpha(cs(tiles[0], 'backgroundColor')),
                  imgW: img ? img.offsetWidth : -1, imgH: img ? img.offsetHeight : -1,
                  imgFit: cs(imgEl, 'objectFit'), imgElW: imgEl ? imgEl.offsetWidth : -1, imgElH: imgEl ? imgEl.offsetHeight : -1,
                  priceBg: cs(price, 'backgroundColor'), priceBgA: alpha(cs(price, 'backgroundColor')),
                  navW: btn ? btn.offsetWidth : -1, navRadius: cs(btn, 'borderRadius'), hasNext: !!next
                };
              });
              const wrap = document.querySelector('.xg-sp .grid-view-item .grid-view-item__image-wrapper');
              const desc = document.querySelector('.xg-sp .grid-view-item .product-description');
              const blurb = document.querySelector('.xg-sp .grid-view-item .product-desc');
              return {
                rows,
                heads: document.querySelectorAll('.xg-sp .xg-sp__head').length,
                oldRedBox: document.querySelectorAll('.xg-sp .title-left').length,
                wrapFloat: cs(wrap, 'float'), wrapDisplay: cs(wrap, 'display'),
                descDisplay: cs(desc, 'display'), descFloat: cs(desc, 'float'),
                blurbGone: blurb ? cs(blurb, 'display') === 'none' : true
              };
            });
            console.log('SPECIALPRODUCT', JSON.stringify(sp));
            /* Run 114: the strip measured 868px tall with scrollWidth equal
               to clientWidth - the twenty tiles wrapped into three rows and
               the chevrons had nothing to move, while sp-row-fills read 88%
               (seven whole tiles on the first of three rows) and passed.
               A grep of the repo for the rule had missed it - it only
               matched selector and property on one line, and base.css is
               not minified - so the page itself is asked: walk every
               stylesheet for a flex-wrap / flex-flow rule whose selector
               matches the strip (cross-origin sheets are listed as
               unreadable) and report the computed value, the direct
               children and the first tiles' tops. Run 115 named it:
               base.css `.grid { flex-wrap: wrap }`, which the strip's own
               rule now overrides. */
            const stripCss = await page.evaluate(() => {
              const strip = document.querySelector('.xg-sp .xg-sp__strip');
              if (!strip) return null;
              const cs = getComputedStyle(strip);
              const kids = Array.from(strip.children);
              const tops = kids.slice(0, 9).map((k) => Math.round(k.getBoundingClientRect().top));
              const rules = [];
              Array.from(document.styleSheets).forEach((sh) => {
                let list = null;
                const name = (sh.href || ('inline:' + ((sh.ownerNode && sh.ownerNode.id) || (sh.ownerNode && sh.ownerNode.parentElement && sh.ownerNode.parentElement.id) || ''))).slice(-70);
                try { list = sh.cssRules; } catch (e) { rules.push({ sheet: name, err: 'unreadable (cross-origin)' }); return; }
                if (!list) return;
                const walk = (rs, media) => {
                  Array.from(rs).forEach((r) => {
                    if (r.type !== 1 && r.cssRules && r.cssRules.length) { walk(r.cssRules, (r.media && r.media.mediaText) || media); return; }
                    if (r.type !== 1 || !r.selectorText || !r.style) return;
                    const fw = r.style.getPropertyValue('flex-wrap') || r.style.getPropertyValue('flex-flow');
                    if (!fw) return;
                    let hit = false;
                    try { hit = strip.matches(r.selectorText); } catch (e) {}
                    if (hit) rules.push({ sheet: name, sel: r.selectorText.slice(0, 90), val: fw, imp: r.style.getPropertyPriority('flex-wrap') || r.style.getPropertyPriority('flex-flow'), media: media || '' });
                  });
                };
                walk(list, '');
              });
              return {
                flexWrap: cs.flexWrap, flexDirection: cs.flexDirection, display: cs.display,
                inlineStyle: strip.getAttribute('style'),
                children: kids.length,
                kidCls: kids.slice(0, 3).map((k) => k.tagName + '.' + String(k.className || '').trim().split(/\s+/).slice(0, 2).join('.')),
                tops, scrollW: strip.scrollWidth, clientW: strip.clientWidth, h: strip.offsetHeight,
                rules
              };
            });
            console.log('SP-STRIP-CSS', JSON.stringify(stripCss));
            v('sp-strip-single-row', !!stripCss && stripCss.flexWrap === 'nowrap' && stripCss.children >= 8 && new Set(stripCss.tops).size === 1 && stripCss.scrollW > stripCss.clientW,
              stripCss ? 'flex-wrap=' + stripCss.flexWrap + ' children=' + stripCss.children + ' tops=' + JSON.stringify(stripCss.tops) + ' scrollWidth ' + stripCss.scrollW + ' vs clientWidth ' + stripCss.clientW + ' h=' + stripCss.h + ' wrap-rules=' + JSON.stringify(stripCss.rules).slice(0, 300) : 'no strip');
            const spAll = (fn) => sp.rows.length > 0 && sp.rows.every(fn);
            const spSay = (fn) => sp.rows.map((r) => '"' + r.title.slice(0, 18) + '": ' + fn(r)).join(' | ') || 'no .xg-sp rows';
            v('sp-heads', sp.heads >= 1, 'heads=' + sp.heads);
            v('sp-old-redbox-gone', sp.oldRedBox === 0, 'title-left count=' + sp.oldRedBox);
            /* Kicker: brand red on a flat row, accent yellow #ffd800 on a
               band-art row (round 19: red measured 1:1 on the artwork). */
            v('sp-kicker', spAll((r) => r.kUpper === 'uppercase' && (r.bandArt ? r.kColor === 'rgb(255, 216, 0)' : r.kColor === 'rgb(214, 44, 40)')),
              spSay((r) => r.kColor + ' / ' + r.kUpper + (r.bandArt ? ' (band art: expect accent)' : ' (flat: expect red)')));
            v('sp-title', spAll((r) => r.tSize >= 22 && r.tSize <= 30 && r.tUpper === 'uppercase'), spSay((r) => r.tSize + 'px / ' + r.tUpper));
            v('sp-strip-flex', spAll((r) => r.stripFound && r.stripDisplay === 'flex' && r.stripOverflowX === 'auto'),
              spSay((r) => (r.stripFound ? '.xg-sp__strip display=' + r.stripDisplay + ' overflow-x=' + r.stripOverflowX : 'no .xg-sp__strip')));
            v('sp-no-owl', spAll((r) => r.owl === 0), spSay((r) => 'elements with an owl-* class=' + r.owl));
            v('sp-tile-count', spAll((r) => r.tiles >= 8), spSay((r) => r.tiles + ' .grid-view-item tiles with width'));
            v('sp-tile-width', spAll((r) => r.tiles > 0 && r.tileMin >= 144 && r.tileMax <= 152), spSay((r) => '.grid-view-item widths ' + r.tileMin + '-' + r.tileMax + 'px'));
            v('sp-tile-vertical', sp.wrapFloat === 'none' && sp.wrapDisplay === 'block' && sp.descFloat === 'none' && sp.descDisplay === 'flex', 'wrap=' + sp.wrapFloat + '/' + sp.wrapDisplay + ' desc=' + sp.descFloat + '/' + sp.descDisplay);
            v('sp-tile-height', spAll((r) => r.imgH >= 200 && r.imgH <= 214 && r.imgW >= 144 && r.imgW <= 152 && r.imgFit === 'cover' && r.imgElH >= 200 && r.imgElH <= 214 && r.imgElW >= 144 && r.imgElW <= 152),
              spSay((r) => 'image box ' + r.imgW + 'x' + r.imgH + ', img ' + r.imgElW + 'x' + r.imgElH + ' object-fit=' + r.imgFit));
            v('sp-tile-transparent', spAll((r) => r.tileBgA === 0), spSay((r) => 'first .grid-view-item bg=' + r.tileBg));
            v('sp-blurb-hidden', sp.blurbGone, String(sp.blurbGone));
            v('sp-nav-circles', spAll((r) => r.navW === 36 && r.navRadius === '50%'), spSay((r) => '.xg-sp__btn w=' + r.navW + ' r=' + r.navRadius));
            {
              const art = sp.rows.filter((r) => r.bandArt);
              if (art.length) v('sp-price-pill', art.every((r) => r.priceBgA > 0.5), art.map((r) => '"' + r.title.slice(0, 18) + '": .product-price__price bg=' + r.priceBg + ' (alpha ' + r.priceBgA + ')').join(' | '));
              else v('sp-price-pill', true, 'SKIPPED - no sports row carries band art on this render :: ' + spSay((r) => 'bandArt=' + r.bandArt));
            }
            /* The sports SEALED row is gone, replaced by two singles rows.
               The owner asked for hockey and basketball singles; the old row
               pointed at `sports-cards`, whose rules are six *Sealed Product*
               types, so "sports card sealed" was exactly what it was.

               Assert both new rows are PRESENT, TITLED and actually holding
               product. An empty or mistyped collection handle still renders
               the heading and the band - it just draws nothing underneath -
               so a heading-only check would pass on a broken row. */
            const spRows = await page.evaluate(() => Array.from(document.querySelectorAll('.xg-sp')).map((r) => {
              const t = r.querySelector('.xg-sp__title');
              const tiles = Array.from(r.querySelectorAll('.grid-view-item')).filter((el) => el.offsetWidth > 0);
              return { title: ((t && t.textContent) || '').trim(), tiles: tiles.length };
            }));
            console.log('SP-ROWS', JSON.stringify(spRows));
            const spRow = (want) => spRows.filter((r) => r.title.toUpperCase().indexOf(want) > -1)[0];
            const hkRow = spRow('HOCKEY'), bkRow = spRow('BASKETBALL');
            v('sp-hockey-row', !!hkRow && hkRow.tiles > 0,
              hkRow ? '"' + hkRow.title + '" with ' + hkRow.tiles + ' visible tiles (all-hockey-card-singles)'
                    : 'no HOCKEY row on the homepage :: ' + JSON.stringify(spRows.map((r) => r.title)));
            v('sp-basketball-row', !!bkRow && bkRow.tiles > 0,
              bkRow ? '"' + bkRow.title + '" with ' + bkRow.tiles + ' visible tiles (all-basketball-singles)'
                    : 'no BASKETBALL row on the homepage :: ' + JSON.stringify(spRows.map((r) => r.title)));
            v('sp-sealed-row-gone', !spRows.some((r) => r.title.toUpperCase().indexOf('SPORTS CARD') > -1),
              JSON.stringify(spRows.map((r) => r.title)));

            /* The owner's complaint, encoded: "the sports section does not
               fit the current look of the new additions of the site". At
               desktop width the header sat pinned to the left and the
               carousel took the remaining width, leaving a dead gap straight
               across the middle - theme.css lays .specialproducts out as
               display:flex and only blocks it back under 1199px.

               COVERAGE is the check that matters. Counting tiles or reading
               the head's alignment would both have passed while the row
               still looked wrong; what a shopper sees is whether the product
               row SPANS the band or clusters at one end of it. */
            const spFit = await page.evaluate(() => {
              const sec = document.querySelector('.specialproducts.xg-sp');
              if (!sec) return null;
              const head = sec.querySelector('.xg-sp__head');
              const right = sec.querySelector('.product-right');
              const wrap = sec.closest('.shopify-section');
              /* Tiles INSIDE the strip's box only. Run 111 measured every
                 .grid-view-item and reported 485%: owl parked the rest of the
                 20 tiles in a stage that ran far past the container. The
                 strip is overflow-x:auto, so its tile rects run past its box
                 the same way - clip the span to the strip's own bounding box
                 (the partial tile at the right edge is clipped IN, so a full
                 strip reads ~97%; whole tiles only would be ~90%). */
              const strip = sec.querySelector('.xg-sp__strip');
              const sb = strip ? strip.getBoundingClientRect() : null;
              const tiles = Array.from(sec.querySelectorAll('.xg-sp__strip .grid__item'))
                .filter((el) => el.offsetWidth > 0)
                .map((el) => el.getBoundingClientRect())
                .filter((r) => sb && r.right > sb.left && r.left < sb.right);
              const box = (el) => {
                const r = el.getBoundingClientRect();
                return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];
              };
              const rb = right ? right.getBoundingClientRect() : null;
              const left = tiles.length ? Math.max(Math.min.apply(null, tiles.map((r) => r.left)), sb.left) : 0;
              const rightEdge = tiles.length ? Math.min(Math.max.apply(null, tiles.map((r) => r.right)), sb.right) : 0;
              return {
                display: getComputedStyle(sec).display,
                headBox: head ? box(head) : null,
                headAlign: head ? getComputedStyle(head).textAlign : '',
                rightBox: right ? box(right) : null,
                stripBox: strip ? box(strip) : null,
                tiles: tiles.length,
                coverage: (rb && rb.width) ? Math.round(((rightEdge - left) / rb.width) * 100) : -1,
                secBg: wrap ? getComputedStyle(wrap).backgroundColor : '',
                secImg: wrap ? getComputedStyle(wrap).backgroundImage !== 'none' : false
              };
            });
            console.log('SP-FIT', JSON.stringify(spFit));
            v('sp-stacked', !!spFit && spFit.display === 'block',
