name: Diagnose storefront reveal

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install puppeteer-core
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer-core@22 >/dev/null 2>&1

      - name: Deck Builder tracking end to end (search tally, cart tag, stats)
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer-core');

          const PAGE = 'https://exorgames.com/pages/deck-builder';
          const W = 'https://exor-binder.nevski.workers.dev';

          (async () => {
            const before = await (await fetch(W + '/deckstats.json')).json();
            console.log('STATS_BEFORE:', JSON.stringify(before.total || {}));

            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1380, height: 980 });
            await page.goto(PAGE, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#xg-deck-input', { timeout: 30000 });
            await new Promise((r) => setTimeout(r, 1200));

            // DOM-level clicks throughout: the Pop Convert popup overlays the
            // page on its own timer and would eat coordinate clicks.
            await page.evaluate(() => {
              const input = document.getElementById('xg-deck-input');
              input.value = '1 Sol Ring\n1 Counterspell';
              input.dispatchEvent(new Event('input', { bubbles: true }));
              document.getElementById('xg-deck-go').click();
            });
            const t0 = Date.now();
            for (;;) {
              const ready = await page.evaluate(() => {
                const b = document.getElementById('xg-deck-add');
                return !!(b && !b.disabled);
              });
              if (ready || Date.now() - t0 > 60000) break;
              await new Promise((r) => setTimeout(r, 700));
            }
            const sum = await page.evaluate(() => (document.querySelector('.xg-deck__summary') || {}).textContent || '');
            console.log('SUMMARY:', sum.replace(/\s+/g, ' ').slice(0, 200));

            const nav = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
            await page.evaluate(() => document.getElementById('xg-deck-add').click());
            await nav;
            const landed = page.url();
            console.log('LANDED:', landed);
            await new Promise((r) => setTimeout(r, 1500));
            const cart = await page.evaluate(() => fetch('/cart.js', { headers: { Accept: 'application/json' } }).then((r) => r.json()));
            console.log('CART_ATTRS:', JSON.stringify(cart.attributes || {}));
            console.log('CART_ITEMS:', (cart.items || []).map((i) => i.quantity + 'x ' + i.title).join(' | ').slice(0, 220));
            await browser.close();

            await new Promise((r) => setTimeout(r, 3000));
            const after = await (await fetch(W + '/deckstats.json')).json();
            console.log('STATS_AFTER:', JSON.stringify(after.total || {}));

            const tag = (cart.attributes || {})['Deck Builder'] || '';
            const sB = (((before.total || {}).search || {}).mtg || { c: 0 }).c;
            const cB = (((before.total || {}).cart || {}).mtg || { c: 0 }).c;
            const s = ((after.total || {}).search || {}).mtg || { c: 0 };
            const c = ((after.total || {}).cart || {}).mtg || { c: 0, v: 0 };
            const ok = /Magic: The Gathering, \d+ cards?, \$\d/.test(tag) &&
              landed.indexOf('/cart') > -1 && s.c > sB && c.c > cB && c.v > 0;
            console.log('VERDICT: ' + (ok ? 'PASS' : 'FAIL') + ' - tag "' + tag + '"; search mtg ' + sB + '->' + s.c + ', cart mtg ' + cB + '->' + c.c + ' (' + c.v + ' cents)');
            if (!ok) process.exitCode = 1;
          })().catch((e) => { console.log('diagnose error:', e.message); process.exitCode = 1; });
          EOF
