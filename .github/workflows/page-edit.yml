name: page-edit
# Edit ONE span of a Shopify page body without hand-copying the body. The
# worker (src/page-edit.js, /admin/page-edit.json, staff key) reads the
# page with its Admin token, finds the span between `find_start` and
# `find_end` (literal text, inclusive; exactly one match or it stops), swaps
# in the replacement (base64, so YAML quoting cannot mangle it), reports
# what was removed and inserted with fingerprints, and - unless dry - saves
# and re-reads the page to prove the stored body is what it meant to save.
# Page bodies are the owner's content: run this only for a change the owner
# asked for in so many words. The staff key is the checkout's DEFAULT_PIN
# (src/config.js on the worker branch), never printed.
on:
  workflow_dispatch:
    inputs:
      page_id:
        description: "numeric Shopify page id (e.g. 99314368685)"
        required: true
      find_start:
        description: "start of the span to replace (literal text)"
        required: true
      find_end:
        description: "end of the span (literal text, inclusive); blank = replace find_start alone"
        required: false
        default: ""
      replace_b64:
        description: "the replacement, base64-encoded (utf-8)"
        required: true
      dry:
        description: "true = show what would change, save nothing"
        required: false
        default: "true"
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-site-improvements-ztgdt8
      - name: Edit the page through the worker
        env:
          PAGE_ID: ${{ inputs.page_id }}
          FIND_START: ${{ inputs.find_start }}
          FIND_END: ${{ inputs.find_end }}
          REPLACE_B64: ${{ inputs.replace_b64 }}
          DRY: ${{ inputs.dry }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const m = fs.readFileSync('src/config.js', 'utf8').match(/DEFAULT_PIN\s*=\s*["']?([\w-]+)/);
          const K = m ? m[1] : '';
          const W = 'https://exor-binder.nevski.workers.dev';
          (async () => {
            if (!K) { console.log('no DEFAULT_PIN in src/config.js; stopped'); process.exit(1); }
            const body = { k: K, page_id: process.env.PAGE_ID, find_start: process.env.FIND_START, find_end: process.env.FIND_END || '', replace_b64: process.env.REPLACE_B64, dry: String(process.env.DRY) !== 'false' };
            const r = await fetch(W + '/admin/page-edit.json', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
            const j = await r.json().catch(() => ({ ok: false, error: 'no JSON, HTTP ' + r.status }));
            if (r.status === 403) { console.log('the staff PIN in src/config.js is not the live one (changed in /admin?) - stopped'); process.exit(1); }
            console.log('HTTP', r.status, '| ok', j.ok, '| dry', j.dry, j.error ? '| error ' + j.error : '');
            if (j.page) console.log('page:', j.page.title, '/pages/' + j.page.handle, '| updatedAt', j.page.updatedAt);
            if (j.before) console.log('body before:', j.before.length, 'chars, hash', j.before.hash, '| untouched before/after the span:', j.untouched.before, '/', j.untouched.after, 'chars');
            if (j.removed != null) { console.log('--- removed (' + j.removed.length + ' chars) ---'); console.log(j.removed); }
            if (j.inserted != null) { console.log('--- inserted (' + j.inserted.length + ' chars) ---'); console.log(j.inserted); }
            if (j.next) console.log('body after:', j.next.length, 'chars, hash', j.next.hash);
            if (j.dry) console.log('DRY RUN: nothing saved');
            else console.log('saved:', j.saved, '| verified by re-read:', j.verified, '| updatedAt', j.after && j.after.updatedAt, '| re-read hash', j.after && j.after.hash);
            if (!j.ok) process.exit(1);
          })().catch((e) => { console.log('error:', e.message); process.exit(1); });
          EOF
