name: hold-report
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of the shadow log to check"
        required: false
        default: "7"
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = midnight Atlantic, after the day's carts
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # The script and the worker's config live on the worker branch; this
      # workflow lives on main so it can be dispatched and scheduled.
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-site-improvements-ztgdt8
      - name: Check the hold-on-arrival shadow log (read-only)
        id: report
        continue-on-error: true
        env:
          DAYS: ${{ inputs.days || '1' }}
          HOLD_REPORT_PIN: ${{ secrets.HOLD_REPORT_PIN }}
        run: |
          set -o pipefail
          node tools/hold-report.mjs 2>&1 | tee report.txt
      # Owner, 2026-09-20: the daily hand check of this log stops; from now
      # on the report speaks up only when it found something. A clean run
      # ("HOLD-REPORT OK") sends nothing. A PROBLEM line, a MISSED cart, or
      # the script failing sends one push to the AUTOPRICE_NTFY topic (the
      # same one the auto-pricer digest and 9Pocket use) with the problem
      # lines and a link to this run, and the run is marked failed so it
      # also shows red in Actions.
      - name: Alert on ntfy only when the report found a problem
        if: always()
        env:
          OUTCOME: ${{ steps.report.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTOPRICE_NTFY: ${{ secrets.AUTOPRICE_NTFY }}
          AUTOPRICE_NTFY_TOKEN: ${{ secrets.AUTOPRICE_NTFY_TOKEN }}
        run: |
          if [ "$OUTCOME" = "success" ] && grep -q 'HOLD-REPORT OK' report.txt 2>/dev/null; then
            echo "clean - no alert"; exit 0
          fi
          summary="$(grep -E 'BinderPOS carts:|PROBLEM|MISSED|HOLD-REPORT|Error|error:' report.txt 2>/dev/null | head -12)"
          [ -n "$summary" ] || summary="hold-report did not finish (outcome $OUTCOME)"
          echo "ALERT:"; printf '%s\n' "$summary"
          # The secrets as the worker reads them (src/autoprice.js trims both):
          # a bare topic on ntfy.sh, or a full https://server/topic URL.
          target="$(printf '%s' "$AUTOPRICE_NTFY" | tr -d '[:space:]' | sed 's#/*$##')"
          token="$(printf '%s' "$AUTOPRICE_NTFY_TOKEN" | tr -d '[:space:]')"
          if [ -z "$target" ]; then echo "AUTOPRICE_NTFY not set - no push sent"; exit 1; fi
          case "$target" in
            http*) server="${target%/*}"; topic="${target##*/}" ;;
            *)     server="https://ntfy.sh"; topic="${target#/}" ;;
          esac
          auth=(); [ -n "$token" ] && auth=(-H "Authorization: Bearer $token")
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${auth[@]}" \
            -H 'Title: Hold report: needs a look' -H 'Priority: 4' -H 'Tags: warning' -H "Click: $RUN_URL" \
            --data-binary "$summary" "$server/$topic")
          echo "ntfy push: HTTP $code"
          exit 1
