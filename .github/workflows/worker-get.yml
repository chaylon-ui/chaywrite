# Worker GET (2026-10-01): prints one staff-gated JSON answer from the worker
# (the sandbox has no egress to workers.dev). The staff PIN comes from the
# HOLD_REPORT_PIN secret, else the worker branch's src/config.js, and is
# never printed. Read-only unless `method` is POST (used for the staff
# "sync now" / "test" routes, which carry no body). Customer fields are not
# part of the routes this is meant for; the answer is printed as-is, cut to
# `chars` characters, after an optional `pick` expression over `d`.
name: worker-get
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Worker path with query string, e.g. /discord-events/preview.json"
        required: true
      method:
        description: "GET or POST"
        required: false
        default: "GET"
      pick:
        description: "Optional JS expression over the parsed answer d"
        required: false
        default: ""
      chars:
        description: "Most characters to print"
        required: false
        default: "6000"
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-site-improvements-ztgdt8
      - name: Fetch
        env:
          PIN: ${{ secrets.HOLD_REPORT_PIN }}
          P: ${{ inputs.path }}
          M: ${{ inputs.method }}
          PICK: ${{ inputs.pick }}
          N: ${{ inputs.chars }}
        run: |
          cat > /tmp/get.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          const W = 'https://exor-binder.nevski.workers.dev';
          if (!process.env.PIN) process.env.PIN = (readFileSync('src/config.js', 'utf8').match(/DEFAULT_PIN\s*=\s*["'`]([^"'`]+)/) || [])[1] || '';
          if (!process.env.PIN) { console.log('no PIN'); process.exit(1); }
          const p = String(process.env.P || '');
          if (!p.startsWith('/')) { console.log('path must start with /'); process.exit(1); }
          const u = new URL(W + p); u.searchParams.set('k', process.env.PIN);
          const method = /^post$/i.test(process.env.M || '') ? 'POST' : 'GET';
          const t0 = Date.now();
          const r = await fetch(u, { method });
          const text = await r.text();
          console.log(method, p, '->', r.status, 'in', Date.now() - t0, 'ms,', text.length, 'chars');
          let d = null; try { d = JSON.parse(text); } catch {}
          let out = d;
          if (d && process.env.PICK) { try { out = new Function('d', 'return (' + process.env.PICK + ')')(d); } catch (e) { console.log('pick failed:', e.message); } }
          const s = d ? JSON.stringify(out, null, 1) : text;
          console.log(s.replace(new RegExp(process.env.PIN.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), '***').slice(0, Number(process.env.N) || 6000));
          JS
          node /tmp/get.mjs
