name: BinderPOS portal rules sync

# Owner directive (2026-09-14): read the buylist percentages straight from
# the BinderPOS portal with the store's STAFF LOGIN, so the card-page
# "What we pay" panel carries the real rule for every price band and game
# (the public feed only exposes rule output on cheap cards, so a $1,915
# Ultra Ball estimated 45/55 while the portal's rule is 55/70).
#
# Mechanism, no browser: the portal (portal.binderpos.com, a React SPA)
# signs staff in through Firebase Auth (project hobby-pos; the web API key
# below is the public one shipped in the portal's own bundle) and then
# calls api.binderpos.com with the Firebase ID token as a Bearer header.
# The rules page (#/buylists/rules) reads GET /api/buylist/rule/list and
# /api/buylist/rule/byId/{id}: one rule per game x price band with a
# threshold ("price" + "priceRule" >=, >, <=, <), per-CONDITION cash /
# store-credit percentages (buylistVariants[].variantName) and per-rarity
# overrides (buylistVariantRarityRules, null = inherit); set-specific
# rules carry setName (art cards, prize packs = not buying); rules named
# "test" are skipped; a rule with no price condition and no set is a
# game-wide catch-all.
#
# Converter: for every game the general rules are resolved the way the
# portal resolves them - the matching ">=" rule with the highest threshold,
# the matching "<=" rule with the lowest, the narrower band when both
# kinds match - at every cent where a rule starts or stops matching, and
# written as the per-condition tier ladder public/buy-rules.json already
# carries, each tier carrying its rarity overrides (buyprice-reveal.js
# reads the card's Rarity row; "exact": true tells it not to apply the
# evidence-based condition lift). Set rules go in "sets".
#
# Secrets: BINDERPOS_LOGIN_EMAIL + BINDERPOS_LOGIN_PASSWORD (repo Actions
# secrets). Passed only to Firebase's sign-in endpoint; the token is
# masked; nothing else is printed but the store's own rule data.
#
# Runs daily after the feed-based sync (09:23 UTC, which now stands down
# when this file is portal-sourced) so the portal's exact rules are what
# the storefront serves for the day.

on:
  schedule:
    - cron: "40 9 * * *"   # daily 09:40 UTC ~ 6:40am Atlantic
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = sign in, convert and print, but do not commit/deploy"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  portal:
    runs-on: ubuntu-latest
    env:
      API: https://api.binderpos.com
      FIREBASE_KEY: AIzaSyDYmFPRKRkVFM9SQvbtCAT8oWKh4RhBGXg
      BRANCH: claude/shopify-site-improvements-ztgdt8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-site-improvements-ztgdt8

      - name: Sign in (Firebase, staff login from secrets)
        env:
          EMAIL: ${{ secrets.BINDERPOS_LOGIN_EMAIL }}
          PASSWORD: ${{ secrets.BINDERPOS_LOGIN_PASSWORD }}
        run: |
          set +x
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then echo "::error::BINDERPOS_LOGIN_EMAIL / BINDERPOS_LOGIN_PASSWORD not set"; exit 1; fi
          jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p,returnSecureToken:true}' > /tmp/login.json
          code=$(curl -sS --max-time 30 -o /tmp/auth.json -w '%{http_code}' -H 'content-type: application/json' \
            --data @/tmp/login.json "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_KEY" || echo ERR)
          rm -f /tmp/login.json
          echo "firebase sign-in HTTP $code"
          if [ "$code" != "200" ]; then
            echo "sign-in failed:"; jq -c '{error: .error.message}' /tmp/auth.json 2>/dev/null || head -c 300 /tmp/auth.json; echo
            exit 1
          fi
          TOKEN=$(jq -r '.idToken // empty' /tmp/auth.json)
          rm -f /tmp/auth.json
          if [ -z "$TOKEN" ]; then echo "::error::no idToken in sign-in response"; exit 1; fi
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > /tmp/token
          chmod 600 /tmp/token
          echo "signed in (token length ${#TOKEN})"

      - name: Fetch every buylist rule
        run: |
          set +x
          TOKEN=$(cat /tmp/token)
          code=$(curl -sS --max-time 40 -o /tmp/rulelist.json -w '%{http_code}' -H "authorization: Bearer $TOKEN" -H 'accept: application/json' "$API/api/buylist/rule/list" || echo ERR)
          echo "rule list HTTP $code, $(wc -c < /tmp/rulelist.json) bytes"
          [ "$code" = "200" ] || { head -c 300 /tmp/rulelist.json; echo; exit 1; }
          mkdir -p /tmp/rules
          ids=$(jq -r '(.. | objects | select(has("id") and has("game")) | .id) // empty' /tmp/rulelist.json 2>/dev/null | sort -un)
          [ -n "$ids" ] || ids=$(jq -r '(.. | objects | select(has("id")) | .id) // empty' /tmp/rulelist.json 2>/dev/null | sort -un)
          n=0
          for id in $ids; do
            curl -sS --max-time 40 -o "/tmp/rules/$id.json" -H "authorization: Bearer $TOKEN" -H 'accept: application/json' "$API/api/buylist/rule/byId/$id" || true
            n=$((n+1)); sleep 0.25
          done
          rm -f /tmp/token
          echo "rules fetched: $n"

      - name: Diagnostics (list order + flags, raw rarity rows)
        run: |
          echo "== rule list: top-level type and first entry keys"
          jq -c 'if type=="array" then {n: length, keys: (.[0]|keys)} else {keys: keys, inner: ((.. | arrays | .[0] | objects | keys)? // null)} end' /tmp/rulelist.json | cut -c1-800
          echo "== rule list order as returned (id | name | any extra flags)"
          jq -c '(if type=="array" then . else (.. | arrays | select(.[0]|type=="object" and has("id"))) end) | .[] | with_entries(select(.key|test("id|name|game|price|priceRule|enabled|active|status|sync|order|priority|created|updated|deleted";"i")))' /tmp/rulelist.json 2>/dev/null | cut -c1-260 | head -80
          for id in 24688 8078 8074 21088; do
            echo "== raw byId $id: NM variant scalar fields + first 5 rarity rows"
            jq -c '.buylistVariants[]? | select(.variantName|test("near mint";"i")) | {variantName, cashPercent, storeCreditPercent, allowPurchase, quantity, overQuantityCashPercent, nRarity: (.buylistVariantRarityRules|length), rarity: (.buylistVariantRarityRules[:5] | map({rarity, cashPercent, storeCreditPercent, allowPurchase, quantity}))}' "/tmp/rules/$id.json" 2>/dev/null | cut -c1-1200
            echo "   distinct (cashPercent, allowPurchase) combos across all NM rarity rows:"
            jq -c '[.buylistVariants[]? | select(.variantName|test("near mint";"i")) | .buylistVariantRarityRules[]? | {c: .cashPercent, s: .storeCreditPercent, a: .allowPurchase, q: .quantity}] | group_by(.) | map({combo: .[0], n: length})' "/tmp/rules/$id.json" 2>/dev/null | cut -c1-600
          done

      - name: Convert to public/buy-rules.json
        run: |
          python3 - <<'PY'
          import json, glob, re, collections, datetime
          GAME = {  # portal game code -> (our key, product-type match word)
              "pokemon": ("pokemon", "pokemon"), "mtg": ("mtg", "mtg"), "yugioh": ("yugioh", "yugioh"),
              "lor": ("lorcana", "lorcana"), "swu": ("starwars", "star wars"), "one": ("onepiece", "one piece"),
              "fleshAndBlood": ("fab", "flesh"), "riftbound": ("riftbound", "riftbound"),
          }
          ORDER = ["NM", "LP", "MP", "HP", "DM"]
          def cond_of(t):
              t = (t or "").lower()
              if "near mint" in t or re.search(r'\bnm\b', t): return "NM"
              if "light" in t: return "LP"
              if "moderate" in t: return "MP"
              if "heav" in t: return "HP"
              if "damag" in t or re.search(r'\bdmg\b', t): return "DM"
              return ""
          def pcts(cash, credit, allow):
              c = float(cash or 0) / 100.0 if allow else 0.0
              s = float(credit or 0) / 100.0 if allow else 0.0
              return round(max(0.0, min(1.0, c)), 4), round(max(0.0, min(1.0, s)), 4)
          def conds_of(rule):
              conds = {}
              for v in rule.get("buylistVariants") or []:
                  c = cond_of(v.get("variantName"))
                  if not c: continue
                  foil = "foil" in (v.get("variantName") or "").lower()
                  if c in conds and not conds[c]["_foil"] and foil: continue   # plain condition beats its foil twin
                  allow = v.get("allowPurchase", True) is not False
                  cash, credit = pcts(v.get("cashPercent"), v.get("storeCreditPercent"), allow)
                  e = {"cash": cash, "credit": credit, "_foil": foil}
                  rar = {}
                  for rr in v.get("buylistVariantRarityRules") or []:
                      if rr.get("cashPercent") is None and rr.get("storeCreditPercent") is None and rr.get("allowPurchase") is not False:
                          continue   # null = inherit the condition's numbers
                      rallow = allow and rr.get("allowPurchase", True) is not False
                      rc, rs = pcts(rr.get("cashPercent") if rr.get("cashPercent") is not None else v.get("cashPercent"),
                                    rr.get("storeCreditPercent") if rr.get("storeCreditPercent") is not None else v.get("storeCreditPercent"),
                                    rallow)
                      if (rc, rs) != (cash, credit):
                          rar[str(rr.get("rarity") or "").strip().lower()] = {"cash": rc, "credit": rs}
                  if rar: e["rarities"] = rar
                  conds[c] = e
              for e in conds.values(): e.pop("_foil", None)
              return conds
          rules = []
          for f in glob.glob('/tmp/rules/*.json'):
              try:
                  r = json.load(open(f))
                  if isinstance(r, dict) and r.get("game"): rules.append(r)
              except Exception: pass
          alerts, skipped = [], []
          general = collections.defaultdict(list)
          sets = collections.defaultdict(dict)
          for r in rules:
              g = r.get("game"); name = (r.get("name") or "").strip()
              if g not in GAME:
                  skipped.append(f"{name} (game {g} not mapped)"); continue
              if re.search(r'\btest\b', name, re.I):
                  skipped.append(f"{name} (test rule)"); continue
              conds = conds_of(r)
              if r.get("cardId") or r.get("cardName"):
                  skipped.append(f"{name} (card-specific)"); continue
              if r.get("setName"):
                  sets[g][str(r["setName"]).strip().lower()] = {"name": name, "conds": conds}
                  continue
              op = r.get("priceRule") or ""
              t = float(r.get("price") or 0)
              if op not in ("greaterThanOrEqualTo", "greaterThan", "lessThanOrEqualTo", "lessThan"):
                  op, t = "greaterThanOrEqualTo", 0.0   # game-wide catch-all (no price condition)
              general[g].append({"t": t, "op": op, "name": name, "conds": conds})
          def hits(x, P):
              op, t = x["op"], x["t"]
              return P >= t - 1e-9 if op == "greaterThanOrEqualTo" else P > t + 1e-9 if op == "greaterThan" else P <= t + 1e-9 if op == "lessThanOrEqualTo" else P < t - 1e-9
          def pick(rs, P):
              ge = [x for x in rs if x["op"].startswith("greater") and hits(x, P)]
              le = [x for x in rs if x["op"].startswith("less") and hits(x, P)]
              a = max(ge, key=lambda x: x["t"]) if ge else None
              b = min(le, key=lambda x: x["t"]) if le else None
              if a and b:
                  ups = sorted(x["t"] for x in rs if x["op"].startswith("greater") and x["t"] > a["t"])
                  lows = sorted(x["t"] for x in rs if x["op"].startswith("less") and x["t"] < b["t"])
                  wa = (ups[0] if ups else 1e9) - a["t"]
                  wb = b["t"] - (lows[-1] if lows else 0.0)
                  return b if wb < wa else a
              return a or b
          def c2(x): return round(x + 1e-9, 2)
          games = []
          for g, rs in sorted(general.items()):
              key, match = GAME[g]
              # Regime starts: the cent at which a rule begins or stops matching.
              starts = {0.01}
              for x in rs:
                  if x["op"] == "greaterThanOrEqualTo": starts.add(c2(x["t"]))
                  elif x["op"] == "greaterThan": starts.add(c2(x["t"] + 0.01))
                  elif x["op"] == "lessThanOrEqualTo": starts.add(c2(x["t"] + 0.01))
                  else: starts.add(c2(x["t"]))
              starts = sorted(s for s in starts if s > 0)
              regimes = []   # (startPrice, upTo or None)
              for i, s in enumerate(starts):
                  nxt = starts[i + 1] if i + 1 < len(starts) else None
                  regimes.append((s, c2(nxt - 0.01) if nxt is not None else None))
              def rates_at(P, c):
                  x = pick(rs, P)
                  if not x: return (0.0, 0.0, {})
                  e = x["conds"].get(c)
                  if not e: return (0.0, 0.0, {})
                  return (e["cash"], e["credit"], e.get("rarities") or {})
              conds_out = {}
              for c in ORDER:
                  ladder = []
                  for (s, up) in regimes:
                      cash, credit, rar = rates_at(s, c)
                      if ladder and ladder[-1]["cash"] == cash and ladder[-1]["credit"] == credit and (ladder[-1].get("rarities") or {}) == rar:
                          ladder[-1]["upTo"] = up
                      else:
                          t = {"upTo": up, "cash": cash, "credit": credit}
                          if rar: t["rarities"] = rar
                          ladder.append(t)
                  base = ladder[-1]
                  ce = {"cash": base["cash"], "credit": base["credit"], "tiers": [t for t in ladder if t["upTo"] is not None]}
                  if base.get("rarities"): ce["rarities"] = base["rarities"]
                  conds_out[c] = ce
              nm = conds_out.get("NM") or conds_out[ORDER[0]]
              entry = {
                  "key": key, "match": match,
                  "cash": nm["cash"], "credit": nm["credit"],
                  "minSell": 0.01, "maxSell": 1000000, "buyFoils": True, "exact": True,
                  "tiers": nm["tiers"], "conds": conds_out,
                  "_source": "binderpos-portal", "_rules": [x["name"] for x in sorted(rs, key=lambda x: x["t"])],
              }
              if nm.get("rarities"): entry["rarities"] = nm["rarities"]
              if sets.get(g): entry["sets"] = sets[g]
              games.append(entry)
          for g, s in sets.items():
              if g in GAME and g not in general:
                  key, match = GAME[g]
                  games.append({"key": key, "match": match, "cash": 0, "credit": 0, "minSell": 0.01, "maxSell": 1000000,
                                "buyFoils": True, "exact": True, "tiers": [], "conds": {}, "sets": s, "_source": "binderpos-portal", "_rules": []})
          if skipped: alerts.append("skipped rules: " + "; ".join(skipped))
          out = {
              "_what": "AUTO-GENERATED daily by binderpos-portal-sync.yml from the BinderPOS portal's Buylist Rules (staff login) - do not hand-edit. One ladder per game and condition on the portal's own price bands, rarity overrides per tier; set-specific rules under sets; rules named test are skipped.",
              "_portal": True,
              "enabled": bool(games),
              "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "disclaimer": "Based on our current buylist rules and today's sell price. The final offer is confirmed when we check your cards - condition and demand can change it. Rules and prices update daily.",
              "defaults": None,
              "games": games,
              "_alerts": alerts,
          }
          with open('public/buy-rules.json', 'w') as f:
              json.dump(out, f, indent=2, ensure_ascii=False); f.write('\n')
          # Summary and spot checks against the owner's screenshots.
          def fmt(t): return f"<= {t['upTo']}: {t['cash']:.2f}/{t['credit']:.2f}" + (" *" if t.get("rarities") else "")
          for gm in games:
              print(f"== {gm['key']}  rules: {len(gm['_rules'])}  sets: {len(gm.get('sets') or {})}")
              for c in ORDER:
                  e = gm["conds"].get(c)
                  if e: print(f"   {c}: " + ", ".join(fmt(t) for t in e["tiers"]) + f", above: {e['cash']:.2f}/{e['credit']:.2f}" + (" *" if e.get("rarities") else ""))
          def rate(key, c, P, rarity=None):
              gm = next((x for x in games if x["key"] == key), None)
              if not gm: return None
              e = gm["conds"].get(c) or gm
              tier = next((t for t in e["tiers"] if P <= t["upTo"]), e)
              r = (tier.get("rarities") or {}).get(rarity) if rarity else None
              return (r["cash"], r["credit"]) if r else (tier["cash"], tier["credit"])
          print("spot check pokemon NM $1915.55 Secret Rare (portal widget said 55/70):", rate("pokemon", "NM", 1915.55, "secret rare"), "| default:", rate("pokemon", "NM", 1915.55))
          print("spot check pokemon NM $10.45 (owner's rule view said 50/70):", rate("pokemon", "NM", 10.45))
          print("spot check yugioh NM $100.00 (should be the $50.01-$100 rule):", rate("yugioh", "NM", 100.00))
          print("alerts:", alerts)
          PY

      - name: Commit when changed
        id: commit
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          if git diff --quiet public/buy-rules.json; then
            echo "buy-rules.json unchanged - nothing to commit"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "binderpos-portal-sync"
          git config user.email "actions@github.com"
          git add public/buy-rules.json
          git commit -m "buy-rules: portal sync $(date -u +%F)"
          git push origin "$BRANCH"
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Stamp build version
        if: ${{ steps.commit.outputs.changed == '1' }}
        run: |
          sed -i "s/__BUILD__/$(git rev-parse --short HEAD)/" public/tv.html
          printf '{"v":"%s"}' "$(git rev-parse --short HEAD)" > public/version.json

      - name: Deploy worker with fresh rules
        if: ${{ steps.commit.outputs.changed == '1' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify served rules
        if: ${{ steps.commit.outputs.changed == '1' }}
        run: |
          sleep 30
          V="$(git rev-parse --short HEAD)"
          curl -sS --max-time 20 "https://exor-binder.nevski.workers.dev/buy-rules.json?v=$V" | jq -c '{enabled, updated, portal: ._portal, games: [.games[]? | {key, rules: (._rules|length), NM: .conds.NM.tiers}]}' || true

      - name: Scrub
        if: always()
        run: rm -f /tmp/token
