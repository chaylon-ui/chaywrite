# Cart window peek (2026-10-01): reads the worker's /portal/carts.json for N
# days with the HOLD_REPORT_PIN secret and prints the window totals plus the
# bought lines that carry NO sell price (title, qty, paid) - the lines that
# make "bought at X% of sell price" misleading. No customer names or ids.
name: portal-carts-peek
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        required: false
        default: "7"
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shopify-site-improvements-ztgdt8
      - name: Read the cart window
        env:
          PIN: ${{ secrets.HOLD_REPORT_PIN }}
          DAYS: ${{ inputs.days }}
        run: |
          cat > /tmp/peek.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          const W = 'https://exor-binder.nevski.workers.dev';
          // the staff PIN the way tools/hold-report.mjs reads it: the secret, else the worker's config
          if (!process.env.PIN) process.env.PIN = (readFileSync('src/config.js', 'utf8').match(/DEFAULT_PIN\s*=\s*["'`]([^"'`]+)/) || [])[1] || '';
          if (!process.env.PIN) { console.log('no PIN'); process.exit(1); }
          const r = await fetch(W + '/portal/carts.json?days=' + (process.env.DAYS || 7) + '&take=200&k=' + encodeURIComponent(process.env.PIN));
          console.log('carts.json ->', r.status);
          const d = await r.json();
          console.log('totals', JSON.stringify(d.totals));
          const carts = d.rows || d.carts || [];
          console.log('carts', carts.length, 'partial', JSON.stringify(d.partial || []));
          let unpricedPaid = 0, unpricedCards = 0, pricedPaid = 0, pricedSells = 0; const big = [];
          for (const c of carts) {
            const det = await (await fetch(W + '/portal/cart.json?id=' + encodeURIComponent(c.id) + '&day=' + encodeURIComponent((c.submitted || '').slice(0, 10)) + '&k=' + encodeURIComponent(process.env.PIN))).json().catch(() => null);
            const lines = (det && det.lines) || [];
            for (const l of lines) {
              if (!l.buying) continue;
              const paid = (l.paid || 0) * l.qty;
              if (l.sell > 0) { pricedPaid += paid; pricedSells += l.sell * l.qty; }
              else { unpricedPaid += paid; unpricedCards += l.qty; big.push({ cart: c.id, when: String(c.submitted || '').slice(0, 16), kind: c.kind || '', title: String(l.title).slice(0, 70), cond: l.condition, qty: l.qty, paid: l.paid }); }
            }
          }
          console.log('priced lines: paid', pricedPaid.toFixed(2), 'sell', pricedSells.toFixed(2), 'pct', pricedSells ? Math.round(pricedPaid / pricedSells * 100) : null);
          console.log('UNPRICED lines: paid', unpricedPaid.toFixed(2), 'cards', unpricedCards);
          big.sort((a, b) => b.paid * b.qty - a.paid * a.qty);
          for (const x of big.slice(0, 25)) console.log('  cart', x.cart, x.when, x.kind, '|', x.title, '|', x.cond, '| x' + x.qty, '| paid each', x.paid);
          JS
          node /tmp/peek.mjs
