name: anilist-enrich
# Looks series up on AniList and commits data/anilist-series.json, which the
# worker reads on its nightly sweep.
#
# Split this way because neither side can do the whole job:
#   * AniList blocks Cloudflare Workers' egress (403), so the worker cannot
#     do the lookup - measured in bgg-probe run 33799658686.
#   * The Shopify Admin token is a Cloudflare worker secret, which is
#     write-only and so cannot be copied into a repo secret - this runner
#     therefore cannot talk to Shopify.
# So the worker publishes the series list, this looks them up, and the worker
# applies the file. No new credential on either side.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Look everything up and print, but commit nothing
        default: "false"
      limit_series:
        description: Only look up the first N series (0 = all)
        default: "0"
      test_series:
        description: Comma-separated names to look up instead of the worker list
        default: ""
      debug:
        description: Print the first batch's request and reply
        default: "false"
  schedule:
    # 07:20 UTC daily: after the worker's 06:00 sweep has set exor.series on
    # new stock, and before the 08:00 price run.
    - cron: "20 7 * * *"
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Look up series on AniList
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT_SERIES: ${{ inputs.limit_series }}
          TEST_SERIES: ${{ inputs.test_series }}
          DEBUG: ${{ inputs.debug }}
        run: python3 tools/anilist-enrich.py
      - name: Commit the file when it changed
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          set -e
          if [ -z "$(git status --porcelain data/anilist-series.json)" ]; then
            echo "no change to data/anilist-series.json"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anilist-series.json
          git commit -m "anilist-series: refresh $(date -u +%Y-%m-%d)"
          git push
