#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.tabs button.ic{padding:4px 10px;display:flex;align-items:center;background:#ece4d2;border-color:#cdbf9f}

<body data-mode="door">
