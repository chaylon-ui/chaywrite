<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exor Showcase — Pickup Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#101014;color:#f2f0e6;font-family:'Inter',system-ui,sans-serif;padding:1.5rem clamp(1rem,4vw,3rem)}
h1{font-family:'Bangers',cursive;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:.05em;color:#ffd75e;-webkit-text-stroke:1px #101010}
.sub{color:#9a97a5;font-size:.9rem;margin:.25rem 0 1.2rem}
.bar{display:flex;align-items:center;gap:.8rem;margin-bottom:1.1rem;flex-wrap:wrap}
.stamp{color:#67646f;font-size:.82rem}
.rbtn{font-family:'Bangers',cursive;font-size:1rem;letter-spacing:.05em;color:#16161c;background:#ffd75e;border:3px solid #101010;border-radius:12px;box-shadow:.18rem .25rem 0 rgba(0,0,0,.7);padding:.4rem 1rem;cursor:pointer}
.rbtn:active{transform:translate(1px,2px);box-shadow:.05rem .1rem 0 rgba(0,0,0,.7)}
.err{color:#e0885e;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(26rem,100%),1fr));gap:.9rem;max-width:80rem}
.card{background:#fffef4;color:#16161c;border:3px solid #101010;border-radius:14px;box-shadow:.35rem .45rem 0 rgba(0,0,0,.55);padding:.85rem 1.1rem;display:flex;flex-direction:column;gap:.3rem}
.card .top{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.card .num{font-family:'Bangers',cursive;font-size:1.8rem;color:#c9342b;-webkit-text-stroke:.5px #101010;text-decoration:none}
.card a.num{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.card .srcb{font-family:'Bangers',cursive;font-size:.82rem;letter-spacing:.06em;color:#fff;border:2px solid #101010;border-radius:8px;padding:.12rem .5rem;transform:rotate(-1.5deg);white-space:nowrap}
.card .srcb.kiosk{background:#c9342b}
.card .srcb .srci{height:1.05em;vertical-align:-0.18em;background:#fff;border-radius:3px;padding:1px}
.card .srcb.other{background:#5b5b66}
.card .total{font-weight:800;font-size:1.05rem;margin-left:auto}
.card .age{color:#71717c;font-size:.8rem}
.card .items{color:#4c4a55;font-size:.88rem;line-height:1.45}
.card .note{color:#8a8794;font-size:.78rem;font-style:italic}
.card .open{align-self:flex-start;font-weight:800;font-size:.85rem;color:#1a73e8;text-decoration:none;border:2.5px solid #1a73e8;border-radius:10px;padding:.25rem .8rem;margin-top:.2rem}
.empty{color:#67646f;font-size:.95rem;padding:2.5rem 0;text-align:center;border:2px dashed #2c2c36;border-radius:14px;max-width:46rem}
.arm{position:fixed;inset:0;z-index:9;background:rgba(10,10,14,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;text-align:center;padding:1rem}
.arm.off{display:none}
.keyin{font-family:'Inter',system-ui,sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:.3em;text-align:center;width:12rem;padding:.6rem .4rem;background:#fffef4;color:#16161c;border:4px solid #101010;border-radius:14px;box-shadow:.3rem .4rem 0 rgba(0,0,0,.7);outline:none}
.armbtn{font-family:'Bangers',cursive;font-size:1.7rem;letter-spacing:.05em;color:#16161c;background:#ffd75e;border:4px solid #101010;border-radius:18px;box-shadow:.4rem .5rem 0 rgba(0,0,0,.7);padding:.8rem 2rem;cursor:pointer}
.armwarn{color:#e0885e;font-size:.9rem;max-width:34rem;display:none}
</style>
</head>
<body>
<h1>📋 Pickup Board</h1>
<p class="sub">Every open draft order, newest first — including the kiosk ones the POS drafts list hides. Tap a number to open it in Shopify admin and collect payment. Refreshes itself every 20 seconds.</p>
<div class="bar">
  <button class="rbtn" onclick="LOAD(true)">↻ Refresh</button>
  <span class="stamp" id="stamp"></span>
  <span class="err" id="err"></span>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">No open draft orders right now — all caught up! 🎉</div>

<div class="arm" id="arm">
  <input class="keyin" id="keyin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" onkeydown="if(event.key==='Enter')ARM()">
  <button class="armbtn" onclick="ARM()">OPEN THE BOARD</button>
  <p class="armwarn" id="armwarn"></p>
</div>

<script>
/* Same staff key as the alerts page (the DEFAULT screen's admin PIN) — if
   it was entered there, this page opens without asking again. */
let KEY = '';
try { KEY = localStorage.getItem('exorStaffKey') || ''; } catch {}
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const age = (iso) => {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ' + (m % 60) + ' min ago';
};
let TIMER = null;
async function LOAD(manual){
  const err = document.getElementById('err');
  try {
    const r = await fetch('/pickups.json?k=' + encodeURIComponent(KEY), { cache: 'no-store' });
    if (r.status === 403) { document.getElementById('arm').classList.remove('off'); return; }
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || 'Could not load'; return; }
    err.textContent = '';
    render(j.orders || []);
    document.getElementById('stamp').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  } catch { err.textContent = 'Could not reach the showcase server'; }
}
const LOGOI = '<img class="srci" src="https://cdn.shopify.com/s/files/1/0467/3083/8169/files/ExorMainLogo.png?v=1727973753&width=48" alt="">';
function render(orders){
  const grid = document.getElementById('grid');
  document.getElementById('empty').style.display = orders.length ? 'none' : 'block';
  grid.innerHTML = orders.map(o => {
    const link = o.did ? 'https://admin.shopify.com/store/most-wanted-ca/draft_orders/' + esc(o.did) : '';
    const items = (o.items || []).map(i => (i.q > 1 ? i.q + '× ' : '') + esc(i.t)).join('<br>');
    return '<div class="card"><div class="top">' +
      '<span class="srcb ' + (o.kiosk ? 'kiosk' : 'other') + '">' + (o.kiosk ? LOGOI + ' KIOSK' : '📦 DRAFT') + '</span>' +
      (link ? '<a class="num" href="' + link + '" target="_blank" rel="noopener">' + esc(o.name) + '</a>'
            : '<span class="num">' + esc(o.name) + '</span>') +
      '<span class="total">$' + esc(o.total) + '</span></div>' +
      '<span class="age">' + esc(age(o.createdAt)) + '</span>' +
      (items ? '<div class="items">' + items + '</div>' : '') +
      (o.note ? '<div class="note">' + esc(o.note) + '</div>' : '') +
      (link ? '<a class="open" href="' + link + '" target="_blank" rel="noopener">OPEN IN ADMIN ↗</a>' : '') +
      '</div>';
  }).join('');
}
function warn(m){ const w = document.getElementById('armwarn'); w.textContent = m; w.style.display = 'block'; }
async function ARM(){
  const k = document.getElementById('keyin').value.trim();
  if (!k) { warn('Enter the admin PIN first.'); return; }
  const r = await fetch('/pickups.json?k=' + encodeURIComponent(k), { cache: 'no-store' }).catch(() => null);
  if (!r || r.status === 403) { warn('Wrong PIN — use the admin PIN for the main screen.'); return; }
  KEY = k;
  try { localStorage.setItem('exorStaffKey', k); } catch {}
  document.getElementById('arm').classList.add('off');
  LOAD(true);
}
(function boot(){
  if (KEY) { document.getElementById('arm').classList.add('off'); LOAD(true); }
  else document.getElementById('keyin').focus();
  TIMER = setInterval(() => LOAD(false), 20000);
})();
</script>
</body>
</html>
