# Exor Pull Sheet — the tablet pick/pack app (exor-pullsheet.nevski.workers.dev).
#
# Source confirmed identical to the live worker on 2026-09-22.
# The JOBS binding points at the KV namespace named "pullsheet-jobs"; the deploy
# workflow looks its id up by name and substitutes the placeholder below.

name = "exor-pullsheet"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Dashboard-set vars and secrets survive deploys (same convention as exor-binder).
# Secrets the worker expects (set in the dashboard, never in this file):
#   API_TOKEN, SHOP, SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET, SESSION_SECRET, ESL_KEY
keep_vars = true

[vars]
SHOPIFY_API = "2026-04"

[[kv_namespaces]]
binding = "JOBS"
id = "REPLACE_WITH_JOBS_KV_NAMESPACE_ID"
