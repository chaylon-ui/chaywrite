# Exor Pull Sheet — the tablet pick/pack app (exor-pullsheet.nevski.workers.dev).
#
# STATUS: recovered source, NOT yet wired to deploy. Before the first deploy from
# here, do both of these (see README.md):
#   1. Confirm src/index.js matches what is deployed (download the live source
#      from the Cloudflare dashboard and diff it against src/index.js).
#   2. Paste the JOBS KV namespace id below (dashboard -> Workers & Pages ->
#      KV -> the namespace bound to exor-pullsheet as JOBS).
# The deploy workflow refuses to run while the placeholder is still here.

name = "exor-pullsheet"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Dashboard-set vars and secrets survive deploys (same convention as exor-binder).
# Secrets the worker expects (set in the dashboard, never in this file):
#   API_TOKEN, SHOP, SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET, SESSION_SECRET, ESL_KEY
keep_vars = true

[vars]
SHOPIFY_API = "2026-04"

[[kv_namespaces]]
binding = "JOBS"
id = "REPLACE_WITH_JOBS_KV_NAMESPACE_ID"
