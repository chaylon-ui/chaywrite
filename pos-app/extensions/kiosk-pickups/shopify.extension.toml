# 2026-01 rather than the brand-new 2026-07: store tablets a few POS
# versions behind still render the tile.
api_version = "2026-01"

[[extensions]]
type = "ui_extension"
name = "Kiosk Pickups"
handle = "kiosk-pickups"
description = "Shows open kiosk/pickup draft orders on the POS home screen"

[[extensions.targeting]]
target = "pos.home.tile.render"
module = "./src/Tile.jsx"

[[extensions.targeting]]
target = "pos.home.modal.render"
module = "./src/Modal.jsx"
