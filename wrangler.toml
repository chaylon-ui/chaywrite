name = "exor-binder"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Dashboard-set plain-text vars (e.g. SHOPIFY_SHOP) survive deploys.
# Secrets (SHOPIFY_ADMIN_TOKEN) always persist — never redefine them here.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
# Serve files at their exact paths. The default ("auto-trailing-slash")
# 307-redirects /tv.html -> /tv, which breaks the worker's serveAsset()
# wrapper (it rebuilds headers, losing Location) — pages came back blank.
html_handling = "none"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "BinderRoom"

# BinderRoom already exists on the deployed worker, so no migration is
# needed. Only if deploying to a FRESH account/worker, uncomment:
# [[migrations]]
# tag = "v1"
# new_classes = ["BinderRoom"]

# Every 5 minutes: pre-warm the advanced-search landing bodies (one per
# supported game + page 2 for pokemon/mtg) into the binder-search-cache DO,
# so /binder/search never answers the default query from a cold BinderPOS.
# Handler: scheduled() in src/index.js -> warmBinderSearch (src/binder-search.js).
[triggers]
crons = ["*/5 * * * *"]
