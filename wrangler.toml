name = "exor-binder"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Dashboard-set plain-text vars (e.g. SHOPIFY_SHOP) survive deploys.
# Secrets (SHOPIFY_ADMIN_TOKEN) always persist — never redefine them here.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "BinderRoom"

# BinderRoom already exists on the deployed worker, so no migration is
# needed. Only if deploying to a FRESH account/worker, uncomment:
# [[migrations]]
# tag = "v1"
# new_classes = ["BinderRoom"]
